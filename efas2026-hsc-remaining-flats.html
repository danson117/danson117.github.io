<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title></title>
<style>
:root { --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a24; --muted:#5d6b63; --line:#d9d2c5; --accent:#1f6b4a; --soft:#e4f3eb; --warn:#8a4b12; --chip:#eef3ef; }
* { box-sizing:border-box; }
html { height:100%; }
body { margin:0; min-height:100%; display:flex; flex-direction:column; font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif; background:var(--bg); color:var(--ink); }
header { padding:20px 24px 12px; background:linear-gradient(180deg,#1f6b4a 0%,#245a42 100%); color:#f7fff9; flex-shrink:0; }
header h1 { margin:0 0 8px; font-size:22px; }
header p { margin:0 0 6px; font-size:13px; line-height:1.55; color:#dff3e8; }
.layout { display:grid; grid-template-columns:360px minmax(0,1fr); gap:16px; padding:16px; align-items:stretch; flex:1; min-height:0; }
.left-col { display:flex; flex-direction:column; gap:16px; width:360px; position:sticky; top:16px; align-self:start; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
main.card { display:flex; flex-direction:column; min-height:100%; min-width:0; }
main.card > .stats, main.card > .show-cols { flex-shrink:0; }
h2 { margin:0 0 10px; font-size:16px; }
.field { display:block; margin:10px 0 6px; font-size:12px; color:var(--muted); font-weight:700; }
select, input[type=number], input[type=search] { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; font:inherit; }
select[multiple] { min-height:110px; }
.checks { display:flex; flex-wrap:wrap; gap:6px; }
.checks label { display:inline-flex; align-items:center; gap:5px; background:var(--chip); border-radius:999px; padding:4px 8px; font-size:12px; }
.btns { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
button { border:0; border-radius:8px; padding:8px 12px; cursor:pointer; font:inherit; }
.primary { background:var(--accent); color:#fff; }
.ghost { background:#ece7dc; }
.stats { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
.stats strong { color:var(--accent); font-size:20px; }
.match-count { font-size:20px; font-weight:800; color:#d8ffe8; margin-top:8px; }
.match-count.big { font-size:28px; color:var(--accent); margin:0 0 10px; letter-spacing:0.02em; }
.note { font-size:12px; color:var(--muted); line-height:1.5; }
.table-wrap { flex:1; max-height:none; min-height:0; overflow:auto; border:1px solid var(--line); border-radius:10px; }
table { border-collapse:collapse; width:100%; font-size:13px; }
th, td { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top; }
th { position:sticky; top:0; background:#eef6f1; z-index:1; cursor:pointer; white-space:nowrap; user-select:none; }
th.sort-asc::after { content:" ▲"; font-size:11px; color:#1f6b4a; }
th.sort-desc::after { content:" ▼"; font-size:11px; color:#1f6b4a; }
tr:hover td { background:#f7fbf8; }
.tag { display:inline-block; background:var(--soft); color:#145338; border-radius:999px; padding:1px 7px; margin:1px 3px 1px 0; font-size:11px; }
.tag.warn { background:#f8ead8; color:var(--warn); }
.muted { color:var(--muted); }
@media (max-width:1180px) {
  .layout { grid-template-columns:1fr; align-items:start; }
  .left-col, .map-col { position:static; width:min(360px,100%); }
  main.card { min-height:0; }
  .table-wrap { flex:none; max-height:70vh; min-height:40vh; }
}

tr.viewonly td { background:#eeeae3; color:#8a867d; }
tr.viewonly:hover td { background:#e8e4dc; }
tr.picked td { background:#e7f5ec; }
tr.viewonly.picked td { background:#eeeae3; }
.badge-view { display:inline-block; background:#e8e0d4; color:#6d6558; border-radius:999px; padding:1px 7px; font-size:11px; white-space:nowrap; }
.pickbox { width:16px; height:16px; }
.pickbox:disabled { opacity:0.35; cursor:not-allowed; }
.shortlist { margin-top:10px; padding:10px; background:#f3f7f4; border:1px solid var(--line); border-radius:8px; }
.shortlist ul { margin:6px 0 0; padding-left:18px; font-size:13px; }
.countline { font-size:13px; margin-top:4px; }
.countline b { color:var(--accent); }

th.col-estate, td.col-estate { white-space:nowrap; min-width:5.6em; }
th.col-building, td.col-building { white-space:nowrap; min-width:4.4em; }
a.bldg { color:var(--accent); font-weight:700; text-decoration:underline; cursor:pointer; white-space:nowrap; }
a.bldg.active { background:#d7efe3; border-radius:4px; padding:0 3px; }
tr.viewonly a.bldg { color:#5f6b64; }
.map-col { width:100%; }
.map-panel { z-index:3; background:var(--card); margin:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; width:100%; }
.map-head { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:8px 10px; font-size:13px; }
.map-frame-wrap { position:relative; width:100%; aspect-ratio:1 / 1; background:#eef3ef; }
.map-panel iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
.map-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; padding:12px; text-align:center; }
.map-empty.hidden { display:none; }

.pdfid { font-weight:800; font-variant-numeric:tabular-nums; font-size:14px; color:#1f2a24; }
tr.viewonly td.pdfid { color:#1f2a24; font-weight:800; }
.scorebar { display:inline-flex; gap:3px; white-space:nowrap; }
.scorechip {
  width:26px; height:26px; border:1px solid var(--line);
  border-radius:6px; background:#fff; cursor:pointer;
  font:inherit; font-weight:700; padding:0; line-height:24px;
}
.scorechip:hover { border-color:var(--accent); }
.scorechip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
tr.viewonly .scorechip { background:#f7f4ee; color:#333; }
tr.viewonly .scorechip.on { background:#3d6b54; color:#fff; border-color:#3d6b54; }
tr.taken td { text-decoration:line-through; color:#8a867d; background:#f3efe8; }
tr.taken:hover td { background:#eeeae3; }
tr.taken .scorechip { opacity:0.35; cursor:not-allowed; pointer-events:none; }
.taken-status { font-size:13px; color:#8a4b12; font-weight:700; margin:6px 0 8px; }
.score-hint { font-size:11px; color:var(--muted); margin-top:4px; }

.hidden-toggle {
  width:100%; padding:16px 12px; margin:6px 0 14px;
  font-size:18px; font-weight:800; letter-spacing:0.04em;
  border-radius:12px; background:#1f6b4a; color:#fff;
  box-shadow:0 2px 0 #145338;
}
.hidden-toggle:hover { filter:brightness(1.05); }
.hidden-toggle.on { background:#8a4b12; box-shadow:0 2px 0 #5c320c; }

.score-order-btn {
  width:100%; padding:14px 12px; margin:0 0 12px;
  font-size:17px; font-weight:800;
  border-radius:12px; background:#245a8a; color:#fff;
}
.score-order-btn.on { background:#8a4b12; }
.usernote {
  width:100%; min-width:140px; padding:6px 8px;
  border:1px solid var(--line); border-radius:6px;
  font:inherit; background:#fff;
}
#estateChecks { max-height:200px; overflow:auto; }
#districtChecks { margin-bottom:4px; }
.show-cols {
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px;
  margin:0 0 10px; padding:8px 10px;
  background:#f3f7f4; border:1px solid var(--line); border-radius:8px;
  font-size:13px;
}
.show-cols b { color:var(--muted); font-size:12px; }
.show-cols label { display:inline-flex; align-items:center; gap:5px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1 id="tTitle"></h1>
  <p id="tSrc"></p>
  <p id="tYou"></p>
  <div class="match-count" id="matchCountHead"></div>
</header>
<div class="layout">

    <p class="note" id="tHint"></p>
  </aside>
  </div>
  <main class="card">

        <div class="muted" style="display:none"><strong id="count">0</strong> <span id="tUnit"></span> <b id="pickableCount">0</b></div>
        <button type="button" id="scoreOrderBtn" class="score-order-btn"></button>
        <div class="taken-status" id="takenStatus"></div>
        <div class="countline"><span id="hiddenState" class="muted"></span></div>
      </div>
      <p class="note" id="summary"></p>
    </div>
    <div class="show-cols" id="showColsPanel">
      <b id="tShowCols">顯示欄</b>
      <label><input type="checkbox" id="col_group"> <span id="tColGroup"></span></label>
      <label><input type="checkbox" id="col_lift"> <span id="tColLift"></span></label>
      <label><input type="checkbox" id="col_renovation"> <span id="tColReno"></span></label>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>

  const applyList = (name, arr) => {
    if (!Array.isArray(arr)) return;
    document.querySelectorAll(`input[name="${name}"]`).forEach(el => { el.checked = arr.includes(el.value); });
  };
  applyList("district", ui.districts);
  applyList("estate", ui.estates);
  applyList("lift", ui.lifts);
  applyList("kw", ui.kws);
}
function scoreBar(id) {
  const cur = getScore(id);
  const taken = TAKEN_IDS.has(id);
  const chips = [1,2,3,4,5].map(n => `<button type="button" class="scorechip${cur===n?" on":""}" data-id="${id}" data-score="${n}"${taken?" disabled":""}>${n}</button>`).join("");
  return `<div class="scorebar" title="${taken?"已揀走，唔可以評分":T.scoreHint}">${chips}</div>`;
}

function txt(id, key) { $(id).textContent = T[key]; }
function fillSelect(sel, items) {
  sel.innerHTML = items.map(v => `<option value="${v}">${v}</option>`).join("");
}
function checkedValues(name) {
  return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x => x.value);
}
function addChecks(boxId, name, values, allOn) {
  const box = $(boxId);
  values.forEach(v => {
    const lab = document.createElement("label");
    const on = allOn === true || (Array.isArray(allOn) && allOn.includes(v));
    lab.innerHTML = `<input type="checkbox" name="${name}" value="${v}" ${on ? "checked" : ""}> ${v}`;
    box.appendChild(lab);
  });
}
function isPreferredDistrict(d) {
  return PICKABLE_DISTRICT_ORDER.includes(d);
}
function isTungChungDistrict(d) {
  const s = String(d || "");
  return /東涌/.test(s) && !/大澳|梅窩/.test(s);
}
function isNeverShowDistrict(d) {
  const s = String(d || "");
  if (isTungChungDistrict(s)) return false;
  if (/大嶼山/.test(s) && !/東涌/.test(s)) return true;
  return NEVER_SHOW_DISTRICT_RE.test(s);
}
function unitGroup(u) {
  return (u.district === "\u6c99\u7530") ? "\u6c99\u7530" : u.group;
}
function allGroups() {
  const g = GROUPS.slice();
  if (!g.includes("\u6c99\u7530")) g.splice(1, 0, "\u6c99\u7530");
  return g;
}
function visibleGroups() {
  return showHiddenDistricts ? allGroups() : DEFAULT_GROUPS.slice();
}
function visibleDistricts() {
  return districtOptions();
}
function hasLift(u) {
  return u.lift === "有";
}
function showNoLiftOn() {
  return false;
}
function fitsTwoPerson(u) {
  return u.occMin != null && u.occMax != null && u.occMin <= 2 && u.occMax >= 2;
}
function passesHard(u) {
  if (isNeverShowDistrict(u.district)) return false;
  if (isDeathUnit(u)) return false;
  if (!fitsTwoPerson(u)) return false;
  if (!hasLift(u)) return false;
  return true;
}
function passesBase(u) {
  if (!passesHard(u)) return false;
  if (!showHiddenDistricts && !isPreferredDistrict(u.district)) return false;
  return true;
}
function visibleEstates(allowD) {
  const ds = allowD || checkedValues("district");
  const set = new Set();
  UNITS.forEach(u => {
    if (!u.estate || !passesBase(u)) return;
    if (!ds.includes(u.district)) return;
    set.add(u.estate);
  });
  return [...set].sort((a,b) => a.localeCompare(b, "zh-Hant"));
}
function districtsWithHardUnits() {
  const set = new Set();
  UNITS.forEach(u => {
    if (u.district && passesHard(u)) set.add(u.district);
  });
  return set;
}
function extraDistricts() {
  const have = districtsWithHardUnits();
  return [...have].filter(d => !isPreferredDistrict(d) && !isNeverShowDistrict(d)).sort((a,b) => a.localeCompare(b, "zh-Hant"));
}
function districtOptions() {
  const have = districtsWithHardUnits();
  const preferred = PICKABLE_DISTRICT_ORDER.filter(d => have.has(d));
  return showHiddenDistricts ? preferred.concat(extraDistricts()) : preferred;
}
function isDeathKeyword(k) {
  return DEATH_KEYWORDS.includes(k) || /身故|自殺|意外死亡|死亡事件|死咗/.test(k);
}
function visibleKeywords(allowD) {
  const ds = allowD || checkedValues("district");
  const set = new Set();
  UNITS.forEach(u => {
    if (!passesBase(u) || !ds.includes(u.district)) return;
    (u.keywords || []).forEach(k => { if (k && !isDeathKeyword(k)) set.add(k); });
  });
  const ordered = KEYWORDS.filter(k => set.has(k));
  [...set].forEach(k => { if (!ordered.includes(k)) ordered.push(k); });
  return ordered;
}
function refillChecks(boxId, name, values, checkedList, onChange) {
  const box = $(boxId);
  if (!box) return;
  box.innerHTML = "";
  addChecks(boxId, name, values, checkedList);
  box.onchange = onChange || render;
}
function updateHiddenBtn() {
  const btn = $("hiddenToggle");
  if (!btn) return;
  btn.textContent = showHiddenDistricts ? T.hideOthers : T.showHidden;
  btn.classList.toggle("on", showHiddenDistricts);
  const st = $("hiddenState");
  if (st) st.textContent = showHiddenDistricts ? T.hiddenOn : T.hiddenOff;
}
function rebuildAreaFilters(preserve) {
  const distAvail = districtOptions();
  let prevD, prevE, prevKw, prevLift;
  if (preserve) {
    prevD = checkedValues("district").filter(d => distAvail.includes(d));
    prevLift = checkedValues("lift");
    prevE = checkedValues("estate");
    prevKw = checkedValues("kw");
  } else {
    prevD = PICKABLE_DISTRICT_ORDER.slice();
    prevE = [];
    prevKw = [];
    prevLift = [T.yes];
  }
  if (!prevD.length && !preserve) prevD = PICKABLE_DISTRICT_ORDER.filter(d => distAvail.includes(d));
  refillChecks("districtChecks", "district", distAvail, prevD, () => { rebuildAreaFilters(true); render(); });
  const estAvail = visibleEstates(prevD);
  const kwAvail = visibleKeywords(prevD);
  prevE = prevE.filter(e => estAvail.includes(e));
  prevKw = prevKw.filter(k => kwAvail.includes(k));
  refillChecks("estateChecks", "estate", estAvail, prevE, render);
  const liftVals = showNoLiftOn() ? [T.yes, T.no] : [T.yes];
  let liftOn = liftVals.filter(v => prevLift.includes(v));
  if (!liftOn.length) liftOn = liftVals.slice();
  if (showNoLiftOn() && !liftOn.includes(T.no)) liftOn.push(T.no);
  refillChecks("liftChecks", "lift", liftVals, liftOn);
  if ($("tLift")) $("tLift").style.display = showNoLiftOn() ? "" : "none";
  if ($("liftChecks")) $("liftChecks").style.display = showNoLiftOn() ? "" : "none";
  refillChecks("kwChecks", "kw", kwAvail, prevKw);
  if ($("tKw")) $("tKw").style.display = kwAvail.length ? "" : "none";
  if ($("kwChecks")) $("kwChecks").style.display = kwAvail.length ? "" : "none";
}
function updateScoreOrderBtn() {
  const btn = $("scoreOrderBtn");
  if (!btn) return;
  btn.textContent = scoreOrderMode ? T.scoreOrderOff : T.scoreOrder;
  btn.classList.toggle("on", scoreOrderMode);
}
function toggleScoreOrder() {
  if (!scoreOrderMode) {
    scoreOrderMode = true;
    sortKey = "score";
    sortAsc = false;
  } else {
    scoreOrderMode = false;
    sortKey = "districtRank";
    sortAsc = true;
  }
  updateScoreOrderBtn();
  saveUi();
  render();
}
function toggleHiddenDistricts() {
  showHiddenDistricts = !showHiddenDistricts;
  rebuildAreaFilters(true);
  updateHiddenBtn();
  saveUi();
  render();
}
function init() {
  document.title = T.title;
  txt("tTitle","title"); txt("tSrc","src"); txt("tYou","you");
  txt("tFilters","filters"); txt("tSearch","search"); $("q").placeholder = T.ph;
  txt("tG","g"); txt("tE","e");
  txt("tLift","lift"); txt("tKw","kw");
  txt("tExkw","exkw"); txt("tHOnly","hOnly"); txt("tHNo","hNo");
  txt("tExDeath","exDeath"); txt("tShowNoLift","showNoLift");
  txt("tMap","map");
  $("mapEmpty").textContent = T.mapEmpty;
  $("applyBtn").textContent = T.apply;
  $("resetBtn").textContent = T.reset;
  $("csvBtn").textContent = T.csv;
  txt("tHint","hint"); txt("tResult","result"); txt("tUnit","unit");
  txt("tScoreFilter","scoreFilter"); txt("tScoreHint","scoreHint");
  if ($("tColGroup")) $("tColGroup").textContent = T.group;
  if ($("tColLift")) $("tColLift").textContent = T.lift;
  if ($("tColReno")) $("tColReno").textContent = T.reno;
  $("scoreFilter").options[0].text = T.scoreAll;
  $("scoreFilter").options[1].text = T.scored;
  $("scoreFilter").options[2].text = T.unscored;
  $("excludeDeath").checked = true;
  if ($("showNoLift")) $("showNoLift").checked = false;
  loadScores();
  loadNotes();
  const savedUi = loadUi();
  if (savedUi && savedUi.showHiddenDistricts === true) showHiddenDistricts = true;
  if (savedUi && savedUi.scoreOrderMode === true) { scoreOrderMode = true; sortKey = "score"; sortAsc = false; }
  rebuildAreaFilters(false);
  applyUi(savedUi);
  rebuildAreaFilters(true);
  updateHiddenBtn();
  updateScoreOrderBtn();
  paintThead();
  $("hiddenToggle").onclick = toggleHiddenDistricts;
  $("scoreOrderBtn").onclick = toggleScoreOrder;
  $("applyBtn").onclick = render;
  $("resetBtn").onclick = resetFilters;
  $("csvBtn").onclick = exportCsv;
  $("q").addEventListener("input", render);
  ["excludeKw","harmonyOnly","noHarmony","scoreFilter"]
    .forEach(id => { if ($(id)) $(id).addEventListener("change", render); });
  ["excludeDeath","showNoLift"].forEach(id => {
    if ($(id)) $(id).addEventListener("change", () => { rebuildAreaFilters(true); render(); });
  });
  ["col_group","col_lift","col_renovation"].forEach(id => {
    if ($(id)) $(id).addEventListener("change", () => {
      showCols.group = $("col_group") && $("col_group").checked;
      showCols.lift = $("col_lift") && $("col_lift").checked;
      showCols.renovation = $("col_renovation") && $("col_renovation").checked;
      saveUi();
      render();
    });
  });
  $("thead").addEventListener("click", (ev) => {
    const th = ev.target.closest("th[data-key]");
    if (!th) return;
    const key = th.dataset.key;
    if (sortKey === key) sortAsc = !sortAsc;
    else { sortKey = key; sortAsc = true; }
    scoreOrderMode = (sortKey === "score" && !sortAsc);
    saveUi();
    render();
  });
  $("tbody").addEventListener("input", (ev) => {
    const inp = ev.target.closest(".usernote");
    if (!inp) return;
    const key = String(inp.dataset.id);
    const v = inp.value;
    if (v) notes[key] = v; else delete notes[key];
    saveNotes();
  });
  $("tbody").addEventListener("change", (ev) => {
    const inp = ev.target.closest(".usernote");
    if (!inp) return;
    const key = String(inp.dataset.id);
    const v = inp.value;
    if (v) notes[key] = v; else delete notes[key];
    saveNotes();
  });
  $("tbody").addEventListener("click", (ev) => {
    const chip = ev.target.closest(".scorechip");
    if (chip) {
      const id = Number(chip.dataset.id);
      if (TAKEN_IDS.has(id) || chip.disabled) return;
      const n = Number(chip.dataset.score);
      const key = String(id);
      if (getScore(id) === n) delete scores[key];
      else scores[key] = n;
      saveScores();
      saveUi();
      render();
      return;
    }
    const a = ev.target.closest("a.bldg");
    if (!a) return;
    ev.preventDefault();
    showMap(a.dataset.estate, a.dataset.building);
    document.querySelectorAll("a.bldg.active").forEach(x => x.classList.remove("active"));
    a.classList.add("active");
  });
  if (lastMap) showMap(lastMap.estate, lastMap.building);
  render();
}
function resetFilters() {
  $("q").value = "";
  $("excludeKw").checked = false;
  $("harmonyOnly").checked = false;
  $("noHarmony").checked = false;
  $("excludeDeath").checked = true;
  if ($("showNoLift")) $("showNoLift").checked = false;
  rebuildAreaFilters(false);
  document.querySelectorAll("input[name=lift]").forEach(el => el.checked = true);
  document.querySelectorAll("input[name=kw]").forEach(el => el.checked = false);
  if ($("scoreFilter")) $("scoreFilter").value = "";
  showCols = { group: false, lift: false, renovation: false };
  if ($("col_group")) $("col_group").checked = false;
  if ($("col_lift")) $("col_lift").checked = false;
  if ($("col_renovation")) $("col_renovation").checked = false;
  saveUi();
  render();
}
function currentFilters() {
  return {
    q: $("q").value.trim().toLowerCase(),
    districts: checkedValues("district"),
    estates: checkedValues("estate"),
    lifts: checkedValues("lift"),
    kws: checkedValues("kw"),
    excludeKw: $("excludeKw").checked,
    harmonyOnly: $("harmonyOnly").checked,
    noHarmony: $("noHarmony").checked,
    excludeDeath: $("excludeDeath").checked,
    showNoLift: showNoLiftOn(),
    showHiddenDistricts: showHiddenDistricts,
    scoreFilter: $("scoreFilter") ? $("scoreFilter").value : ""
  };
}
function isDeathUnit(u) {
  if ((u.keywords || []).some(k => DEATH_KEYWORDS.includes(k))) return true;
  const blob = [u.notes, ...(u.keywords || [])].join("");
  return DEATH_RE.test(blob);
}
function districtRank(d) {
  const i = PICKABLE_DISTRICT_ORDER.indexOf(d);
  return i === -1 ? 100 : i;
}
function isPickable(u, f) {
  if (!passesHard(u)) return false;
  if (!showHiddenDistricts && !isPreferredDistrict(u.district)) return false;
  const districts = (f && f.districts) || [];
  if (!districts.includes(u.district)) return false;
  return true;
}
function match(u, f) {
  if (!passesHard(u)) return false;
  if (!showHiddenDistricts && !isPreferredDistrict(u.district)) return false;
  if (!(f.districts || []).includes(u.district)) return false;
  if (f.estates.length && !f.estates.includes(u.estate)) return false;
  if (f.lifts.length && !f.lifts.includes(u.lift)) return false;
  if (f.harmonyOnly && !u.harmony) return false;
  if (f.noHarmony && u.harmony) return false;
  if (f.kws.length) {
    const hit = f.kws.some(k => u.keywords.includes(k));
    if (f.excludeKw ? hit : !hit) return false;
  }
  if (f.q) {
    const blob = [String(u.id),u.estate,u.building,u.room,u.district,u.notes,u.renovation,getNote(u.id),...(u.keywords||[])].join(" ").toLowerCase();
    if (!blob.includes(f.q)) return false;
  }
  if (f.scoreFilter === "scored" && getScore(u.id) == null) return false;
  if (f.scoreFilter === "unscored" && getScore(u.id) != null) return false;
  return true;
}
function sortValue(u, key) {
  if (key === "score") return getScore(u.id);
  if (key === "userNote") return getNote(u.id);
  if (key === "group") return unitGroup(u);
  if (key === "notes") return u.notes || "";
  if (key === "occMin") return u.occMin;
  if (key === "districtRank") return districtRank(u.district);
  return u[key];
}
function cmp(a,b,f) {
  const ta = isTaken(a) ? 1 : 0, tb = isTaken(b) ? 1 : 0;
  if (ta !== tb) return ta - tb;
  const key = sortKey || "districtRank";
  if (key === "districtRank") {
    const ra = districtRank(a.district), rb = districtRank(b.district);
    if (ra !== rb) return ra - rb;
    return a.id - b.id;
  }
  const av = sortValue(a, key), bv = sortValue(b, key);
  const emptyA = av == null || av === "";
  const emptyB = bv == null || bv === "";
  if (emptyA && emptyB) return a.id - b.id;
  if (emptyA) return 1;
  if (emptyB) return -1;
  const numeric = ["id","score","area","rent","discountMonths","occMin","occMax"];
  if (numeric.includes(key) || typeof av === "number") {
    const n = sortAsc ? (Number(av) - Number(bv)) : (Number(bv) - Number(av));
    return n || (a.id - b.id);
  }
  const s = sortAsc ? String(av).localeCompare(String(bv),"zh-Hant") : String(bv).localeCompare(String(av),"zh-Hant");
  return s || (a.id - b.id);
}
function colDefs() {
  const cols = [
    ["id", T.id, u => `<td class="pdfid">${u.id ?? ""}</td>`],
    ["score", T.score, u => `<td>${scoreBar(u.id)}</td>`],
    ["userNote", T.userNote, u => `<td>${noteInput(u.id)}</td>`],
    ["district", T.dist, u => `<td>${u.district}</td>`],
    ["estate", T.est, u => `<td class="col-estate">${bldgAnchor(u.estate, u.building, u.estate)}</td>`],
    ["building", T.blk, u => `<td class="col-building">${bldgAnchor(u.estate, u.building, u.building)}</td>`],
    ["room", T.rm, u => `<td>${u.room}${u.harmony ? " *" : ""}</td>`],
    ["area", T.area, u => `<td>${u.area ?? ""}</td>`],
    ["rent", T.rent, u => `<td>${money(u.rent)}</td>`],
    ["discountMonths", T.dm, u => `<td>${u.discountMonths}</td>`],
    ["occMin", T.occ, u => `<td>${u.occMin ?? ""} ${T.to} ${u.occMax ?? ""}</td>`],
    ["notes", T.kw, u => `<td>${tags(u)}${u.notes ? `<div>${u.notes}</div>` : ""}</td>`]
  ];
  if (showCols.group) cols.push(["group", T.group, u => `<td>${unitGroup(u)}</td>`]);
  if (showCols.lift) cols.push(["lift", T.lift, u => `<td>${u.lift}</td>`]);
  if (showCols.renovation) cols.push(["renovation", T.reno, u => `<td>${u.renovation}</td>`]);
  return cols;
}
function paintThead() {
  const heads = colDefs();
  if ($("thead")) $("thead").innerHTML = heads.map(([k,l]) => `<th data-key="${k}"${k==="estate"?" class=\"col-estate\"":k==="building"?" class=\"col-building\"":""}>${l}</th>`).join("");
}
function paintSortHeaders() {
  paintThead();
  document.querySelectorAll("th[data-key]").forEach(th => {
    th.classList.toggle("sort-asc", sortKey === th.dataset.key && sortAsc);
    th.classList.toggle("sort-desc", sortKey === th.dataset.key && !sortAsc);
  });
}
function money(n) { return n==null ? "" : "$"+n.toLocaleString("en-HK"); }
function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}
function mapQuery(estate, building) {
  return ["\u9999\u6e2f", estate, building].filter(Boolean).join(" ");
}
function mapEmbedUrl(q) {
  return "https://maps.google.com/maps?q=" + encodeURIComponent(q) + "&hl=zh-TW&output=embed";
}
function mapSearchUrl(q) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}
function showMap(estate, building) {
  lastMap = {estate, building};
  saveUi();
  const q = mapQuery(estate, building);
  $("mapFrame").src = mapEmbedUrl(q);
  $("mapLabel").textContent = q;
  $("mapEmpty").classList.add("hidden");
}
function bldgAnchor(estate, building, label) {
  const q = mapQuery(estate, building);
  return `<a class="bldg" href="${mapSearchUrl(q)}" target="_blank" rel="noopener" data-estate="${esc(estate)}" data-building="${esc(building)}">${esc(label)}</a>`;
}
function tags(u) {
  const bits = [];
  if (u.harmony) bits.push(`<span class="tag warn">${T.star}</span>`);
  (u.keywords||[]).forEach(k => bits.push(`<span class="tag">${k}</span>`));
  return bits.join("");
}
function filtered() {
  const f = currentFilters();
  return UNITS.filter(u => match(u, f)).sort((a,b) => cmp(a,b,f));
}
function paintMatchCount() {
  const f = currentFilters();
  const x = UNITS.filter(u => match(u, f) && !isTaken(u)).length;
  const y = UNITS.filter(u => isPickable(u, f) && !isTaken(u)).length;
  const text = "\u7b26\u5408\u689d\u4ef6\uff1a" + x + "\uff0f" + y;
  if ($("matchCountHead")) $("matchCountHead").textContent = text;
  if ($("matchCount")) $("matchCount").textContent = text;
  if ($("count")) $("count").textContent = x;
  if ($("pickableCount")) $("pickableCount").textContent = x;
  const pref = UNITS.filter(u => PICKABLE_DISTRICT_ORDER.includes(u.district));
  const prefTaken = pref.filter(isTaken).length;
  const allTaken = UNITS.filter(isTaken).length;
  const el = $("takenStatus");
  if (el) el.textContent = "初選仍在 " + (pref.length - prefTaken) + " 個、已揀 " + prefTaken + " 個（劃線排底，唔計入符合條件）；全表仍在 " + (UNITS.length - allTaken) + " 個、已揀 " + allTaken + " 個。";
}
function render() {
  const f = currentFilters();
  const rows = filtered();
  paintMatchCount();
  updateHiddenBtn();
  updateScoreOrderBtn();
  paintSortHeaders();
  $("summary").textContent = T.sum.replace("{n}", String(UNITS.length));
  const cols = colDefs();
  $("tbody").innerHTML = rows.map(u => `<tr class="${isTaken(u)?"taken":""}">${cols.map(c => c[2](u)).join("")}</tr>`).join("");
  saveUi();
}
function exportCsv() {
  const f = currentFilters();
  const rows = filtered();
  const cols = ["id","score","userNote","group","district","estate","building","room","area","rent","discountMonths","lift","occMin","occMax","renovation","harmony","keywords","notes"];
  const lines = [cols.join(",")];
  rows.forEach(u => {
    const rec = Object.assign({}, u, {score: getScore(u.id) ?? "", userNote: getNote(u.id)});
    lines.push(cols.map(c => {
      let v = rec[c];
      if (Array.isArray(v)) v = v.join("|");
      return `"${String(v ?? "").replaceAll('"','""')}"`;
    }).join(","));
  });
  const blob = new Blob(["\ufeff"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "efas2026-filtered-flats.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}
init();
</script>
