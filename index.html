<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home</title>
    <style>
      :root {
        --ink: #1c2430;
        --muted: #5c6b7a;
        --bg: #eef2f6;
        --side: #1a2744;
        --side-ink: #e8eef8;
        --side-dim: #9aafc8;
        --pick: #fff;
        --line: rgba(255, 255, 255, 0.16);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
        color: var(--ink);
        background: var(--bg);
        display: flex;
        min-height: 100vh;
      }
      nav {
        width: 268px;
        flex-shrink: 0;
        height: 100%;
        min-height: 0;
        background: var(--side);
        color: var(--side-ink);
        padding: 16px 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow: hidden;
      }
      .nav-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        flex-shrink: 0;
      }
      nav h1 {
        font-size: 16px;
        margin: 0 0 4px;
        letter-spacing: 0.06em;
      }
      nav p {
        margin: 0;
        font-size: 12px;
        color: var(--side-dim);
        line-height: 1.45;
      }
      button.fold {
        flex-shrink: 0;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--side-ink);
        padding: 4px 8px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #topics {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding-right: 2px;
      }
      .group {
        margin: 12px 8px 4px;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--side-dim);
      }
      button.topic {
        display: block;
        width: 100%;
        text-align: left;
        border: 1px solid transparent;
        background: transparent;
        color: var(--side-ink);
        padding: 8px 10px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        border-radius: 8px;
      }
      button.topic:hover { background: rgba(255, 255, 255, 0.08); }
      button.topic.on {
        background: var(--pick);
        color: var(--side);
        font-weight: 650;
      }
      button.topic small {
        display: block;
        font-weight: 400;
        font-size: 11px;
        opacity: 0.75;
        margin-top: 2px;
      }
      .sb-usage {
        flex-shrink: 0;
        margin-top: 8px;
        padding: 8px;
        border: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.18);
        font-size: 11px;
        line-height: 1.35;
      }
      .sb-row { display: flex; justify-content: space-between; gap: 8px; }
      .sb-bar {
        height: 6px;
        margin: 3px 0 4px;
        background: rgba(255, 255, 255, 0.22);
      }
      .sb-bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: #7eb6ff;
      }
      .sb-meta { color: var(--side-dim); font-size: 10px; margin: 0 0 6px; }
      .sb-usage a { color: #c9daf5; }
      body.nav-off nav { width: 52px; padding: 12px 8px; }
      body.nav-off nav h1,
      body.nav-off nav p,
      body.nav-off #topics,
      body.nav-off .sb-usage { display: none; }
      main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 12px;
        background: #fff;
        border-bottom: 1px solid #d7dee6;
        font-size: 14px;
      }
      .bar a { color: #1a2744; font-size: 13px; }
      .bar-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .topic-ver { font-size: 12px; line-height: 1.2; opacity: 0.65; }
      iframe { flex: 1; width: 100%; border: 0; background: #fff; }
      main { padding-bottom: 26px; }
      .page-version {
        position: fixed;
        right: 10px;
        bottom: 6px;
        font: 12px/1 sans-serif;
        opacity: 0.55;
        z-index: 5;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-head">
        <div>
          <h1>Home</h1>
          <p>一次睇晒呢度嘅題目。公司內容唔喺呢個網站。</p>
        </div>
        <button type="button" class="fold" id="fold">收起</button>
      </div>
      <div id="topics"></div>
      <div class="sb-usage">
        <div class="sb-row"><b>Supabase</b><span id="sb-plan">—</span></div>
        <div class="sb-row"><span>Database</span><span id="sb-db-pct">—</span></div>
        <div class="sb-bar"><i id="sb-db-bar"></i></div>
        <div class="sb-meta" id="sb-db-meta">—</div>
        <div class="sb-meta" id="sb-file-meta">Files —</div>
        <div class="sb-row"><span>Egress</span><span id="sb-eg-pct">—</span></div>
        <div class="sb-bar"><i id="sb-eg-bar"></i></div>
        <div class="sb-meta" id="sb-eg-meta">已用 GB 同帳單完結日讀唔到就唔估</div>
        <div class="sb-meta"><a id="sb-usage-link" href="https://supabase.com/dashboard/org/buqbydyobfihnnfpxirb/usage" target="_blank" rel="noopener">Usage page</a></div>
      </div>
    </nav>
    <main>
      <div class="bar">
        <div class="bar-title">
          <span id="now">Home</span>
          <span id="topic-ver" class="topic-ver"></span>
        </div>
        <a id="solo" href="Alpha_Learn.html" target="_blank" rel="noopener">另開呢頁</a>
      </div>
      <iframe id="frame" title="Home" allow="clipboard-write"></iframe>
    </main>
    <div class="page-version" data-version="2.3">整體 v2.3</div>
    <script>
      // 右下角「整體」先係成個 Home 版本。任何題目自己嘅版本改咗，呢個整體號碼都要加。
      const TOPICS = [
        { group: "學習", id: "alpha", title: "Alpha Learn", blurb: "小五", file: "Alpha_Learn.html?v=5.6" },
        { group: "學習", id: "karson", title: "Karson Learn", blurb: "小二", file: "Karson_Learn.html?v=2.7" },
        { group: "學習", id: "verbs", title: "動詞分類", blurb: "Present / Past", file: "3下_Present_vs_Past.html" },
        { group: "學習", id: "essay", title: "作文技巧", blurb: "手法", file: "作文21手法.html" },
        { group: "生活", id: "travel", title: "行李清單", blurb: "收拾", file: "travel_list.html?v=1.4" },
        { group: "生活", id: "parents", title: "老豆阿媽", blurb: "醫療減免、眼科", file: "parents.html?v=1.1" },
        { group: "生活", id: "accident", title: "交通意外", blurb: "家人須知", file: "mo-so-fong-claim-guide.html?v=1.2" },
        { group: "生活", id: "weight", title: "成長記錄", blurb: "信唯、啟淳", file: "weight.html?v=1.3" },
        { group: "生活", id: "stuff", title: "物品清單", blurb: "家中物件", file: "物品清單.html?v=1.7" },
        { group: "生活", id: "efas", title: "特快公屋", blurb: "篩選 · 名單", file: "efas2026-hsc-remaining-flats.html?v=1.4" },
        { group: "其他", id: "life-os", title: "Life OS", blurb: "日曆、待辦", file: "https://life-os-danson117.vercel.app/", external: true }
      ];
      const box = document.getElementById("topics");
      const frame = document.getElementById("frame");
      const now = document.getElementById("now");
      const topicVer = document.getElementById("topic-ver");
      const solo = document.getElementById("solo");
      const KEY = "family:hub:topic";

      function render() {
        box.innerHTML = "";
        let group = "";
        TOPICS.forEach((t) => {
          if (t.group !== group) {
            group = t.group;
            const label = document.createElement("div");
            label.className = "group";
            label.textContent = group;
            box.appendChild(label);
          }
          const b = document.createElement("button");
          b.type = "button";
          b.className = "topic";
          b.dataset.id = t.id;
          b.innerHTML = t.title + (t.blurb ? "<small>" + t.blurb + "</small>" : "");
          b.addEventListener("click", () => show(t.id));
          box.appendChild(b);
        });
      }

      function parkTopicVersion() {
        try {
          const node = frame.contentDocument && frame.contentDocument.querySelector(".page-version");
          if (!node) {
            topicVer.textContent = "";
            return;
          }
          let text = (node.getAttribute("data-version") || node.textContent || "").trim();
          if (text && !/^v/i.test(text)) text = "v" + text;
          topicVer.textContent = text ? "呢頁 " + text : "";
          node.style.setProperty("right", "auto", "important");
          node.style.setProperty("left", "10px", "important");
          node.style.setProperty("bottom", "8px", "important");
        } catch (e) {
          topicVer.textContent = "";
        }
      }

      function show(id) {
        const listMode = id === "efas-short";
        const pick = TOPICS.find((t) => t.id === (listMode ? "efas" : id)) || TOPICS[0];
        let file = pick.file;
        if (listMode && pick.id === "efas") file += "&mode=list";
        const same = frame.getAttribute("src") === file;
        if (!same) {
          topicVer.textContent = "";
          frame.src = file;
        }
        now.textContent = pick.title;
        solo.href = file;
        solo.textContent = pick.external ? "另開 Life OS" : "另開呢頁";
        const hashId = listMode ? "efas-short" : pick.id;
        if (location.hash.replace(/^#/, "") !== hashId) location.hash = hashId;
        try { localStorage.setItem(KEY, hashId); } catch (e) {}
        box.querySelectorAll("button.topic").forEach((b) => {
          b.classList.toggle("on", b.dataset.id === pick.id);
        });
        if (same) parkTopicVersion();
      }

      frame.addEventListener("load", parkTopicVersion);
      document.getElementById("fold").addEventListener("click", () => {
        document.body.classList.toggle("nav-off");
        document.getElementById("fold").textContent = document.body.classList.contains("nav-off") ? "開" : "收起";
      });
      window.addEventListener("hashchange", () => show(location.hash.replace(/^#/, "")));
      render();
      let start = location.hash.replace(/^#/, "");
      if (start !== "efas-short" && !TOPICS.some((t) => t.id === start)) {
        try { start = localStorage.getItem(KEY) || "alpha"; } catch (e) { start = "alpha"; }
      }
      show(start);

      function pct(used, limit) {
        if (used == null || !limit) return "—";
        const p = (Number(used) / Number(limit)) * 100;
        if (!isFinite(p)) return "—";
        return (p < 10 ? p.toFixed(1) : String(Math.round(p))) + "%";
      }
      function bar(id, used, limit) {
        const el = document.getElementById(id);
        const p = used == null || !limit ? 0 : Math.max(0, Math.min(100, (Number(used) / Number(limit)) * 100));
        el.style.width = p + "%";
      }
      function loadUsage() {
        fetch("https://kcoszufshvvpxikpzlue.supabase.co/functions/v1/team-board?usage=1", { cache: "no-store" })
          .then((res) => (res.ok ? res.json() : null))
          .then((data) => {
            if (!data) return;
            const limits = data.limits || {};
            document.getElementById("sb-plan").textContent = data.plan || "—";
            document.getElementById("sb-db-pct").textContent = pct(data.databaseBytes, limits.databaseBytes);
            document.getElementById("sb-db-meta").textContent =
              data.databaseBytes == null ? "—" : Math.round(data.databaseBytes / 1048576) + " MB";
            document.getElementById("sb-file-meta").textContent =
              "Files " + pct(data.fileBytes, limits.fileBytes);
            const eg = data.egressBytes == null ? "—" : pct(data.egressBytes, limits.egressBytes);
            document.getElementById("sb-eg-pct").textContent = eg;
            bar("sb-db-bar", data.databaseBytes, limits.databaseBytes);
            bar("sb-eg-bar", data.egressBytes, limits.egressBytes);
            if (data.usagePage) document.getElementById("sb-usage-link").href = String(data.usagePage);
          })
          .catch(() => {});
      }
      loadUsage();
      setInterval(loadUsage, 15 * 60 * 1000);
    </script>
  </body>
</html>
