<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Karson_Learn</title>
  <style>
    :root {
      --menu-bg: #1f2a37;
      --menu-card: #273447;
      --accent: #3b82f6;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: #111827;
    }
    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .menu-root {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100000;
    }
    .menu-toggle {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 14px;
      background: rgba(31, 42, 55, 0.92);
      color: white;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .menu-toggle:active { transform: scale(0.96); }
    .menu-panel {
      display: none;
      position: absolute;
      top: 58px;
      left: 0;
      width: min(320px, calc(100vw - 24px));
      background: var(--menu-bg);
      color: var(--text);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .menu-panel.open { display: block; }
    .menu-title {
      font-size: 0.85em;
      color: var(--muted);
      margin: 0 0 6px 4px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .menu-note {
      font-size: 0.72em;
      color: #6ee7b7;
      margin: 0 0 12px 4px;
      line-height: 1.4;
    }
    .menu-current {
      font-size: 0.8em;
      color: #93c5fd;
      margin: -4px 0 12px 4px;
    }
    .menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      border: none;
      background: var(--menu-card);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 0.95em;
      font-weight: 700;
      line-height: 1.35;
    }
    .menu-item:last-child { margin-bottom: 0; }
    .menu-item:hover { background: #314158; }
    .menu-item.active {
      outline: 2px solid var(--accent);
      background: #1e3a5f;
    }
    .menu-icon {
      font-size: 1.2em;
      width: 1.6em;
      text-align: center;
      flex-shrink: 0;
    }
    .menu-text { flex: 1; }
    .menu-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: transparent;
    }
    .menu-backdrop.open { display: block; }
    @media (max-width: 600px) {
      .menu-root { top: 10px; left: 10px; }
      .menu-toggle { width: 44px; height: 44px; border-radius: 12px; }
    }
  </style>
</head>
<body>

          <span class="menu-text">中文 · 生字認讀</span>

          <span class="menu-icon">✖️</span>
          <span class="menu-text">數學 · 乘數表</span>
        </button>
    </div>
  </div>

  <script>
    // 全部模組已內嵌喺呢個檔（srcdoc），刪走其他 HTML 都照運作
    const PAGES = {"en-vocab": "<!DOCTYPE html>\n<html lang=\"zh-HK\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>英文 · 生字認讀</title>\n  <style>\n    :root {\n      --bg: #eef6fc;\n      --ink: #1e293b;\n      --card: #ffffff;\n      --accent: #2563eb;\n    }\n    * { box-sizing: border-box; }\n    html, body { margin: 0; padding: 0; height: 100%; }\n    body {\n      font-family: \"Segoe UI\", \"PingFang HK\", \"Microsoft JhengHei\", sans-serif;\n      background:\n        radial-gradient(ellipse at top, #dbeafe 0%, transparent 55%),\n        linear-gradient(180deg, var(--bg), #f8fafc);\n      color: var(--ink);\n    }\n    #theme-home {\n      min-height: 100%;\n      padding: 28px 20px 40px;\n      max-width: 860px;\n      margin: 0 auto;\n    }\n    .home-header {\n      text-align: center;\n      margin-bottom: 28px;\n    }\n    .home-header h1 {\n      margin: 0 0 8px;\n      font-size: 1.8em;\n      border-bottom: 3px solid var(--accent);\n      display: inline-block;\n      padding-bottom: 8px;\n    }\n    .home-header p {\n      color: #64748b;\n      margin: 12px 0 0;\n    }\n    .theme-grid {\n      display: grid;\n      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));\n      gap: 16px;\n    }\n    .theme-card {\n      text-align: left;\n      background: var(--card);\n      border: 1px solid #e2e8f0;\n      border-radius: 16px;\n      padding: 20px;\n      cursor: pointer;\n      box-shadow: 0 8px 24px rgba(37,99,235,0.08);\n      transition: transform 0.15s, box-shadow 0.15s;\n    }\n    .theme-card:hover {\n      transform: translateY(-2px);\n      box-shadow: 0 12px 28px rgba(37,99,235,0.14);\n    }\n    .theme-badge {\n      display: inline-block;\n      background: #dbeafe;\n      color: #1d4ed8;\n      font-size: 0.78em;\n      font-weight: 800;\n      padding: 3px 10px;\n      border-radius: 999px;\n      margin-bottom: 10px;\n    }\n    .theme-card h2 {\n      margin: 0 0 8px;\n      font-size: 1.2em;\n    }\n    .theme-card p {\n      margin: 0 0 14px;\n      color: #64748b;\n      font-size: 0.95em;\n      line-height: 1.5;\n    }\n    .theme-go {\n      color: var(--accent);\n      font-weight: 800;\n      font-size: 0.95em;\n    }\n    .hint {\n      text-align: center;\n      color: #94a3b8;\n      font-size: 0.88em;\n      margin-top: 24px;\n    }\n\n    #theme-reader {\n      display: none;\n      position: fixed;\n      inset: 0;\n      background: #fff;\n    }\n    #theme-reader.active { display: block; }\n    .reader-bar {\n      position: absolute;\n      top: 10px;\n      right: 12px;\n      z-index: 20;\n    }\n    .reader-bar button {\n      background: rgba(30,41,59,0.9);\n      color: white;\n      border: none;\n      border-radius: 10px;\n      padding: 10px 14px;\n      font-weight: 800;\n      cursor: pointer;\n      box-shadow: 0 6px 16px rgba(0,0,0,0.2);\n    }\n    #theme-frame {\n      width: 100%;\n      height: 100%;\n      border: 0;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"theme-home\">\n    <div class=\"home-header\">\n      <h1>英文 · 生字認讀</h1>\n      <p>揀一個主題開始學習（之後可以再加新主題）</p>\n    </div>\n    <div class=\"theme-grid\">\n      <button class=\"theme-card\" type=\"button\" data-theme=\"paul-party\">\n        <div class=\"theme-badge\">69 生字</div>\n        <h2>保羅與動物們的派對</h2>\n        <p>小二生字故事 · 短按查字、長按已學會</p>\n        <span class=\"theme-go\">開始學習 →</span>\n      </button>\n    </div>\n    <p class=\"hint\">而家有 1 個主題。新主題之後會出現喺呢度。</p>\n  </div>\n\n  <div id=\"theme-reader\">\n    <div class=\"reader-bar\">\n      <button type=\"button\" id=\"btn-back-themes\">← 返回主題目錄</button>\n    </div>\n    <iframe id=\"theme-frame\" title=\"英文主題內容\"></iframe>\n  </div>\n\n  <script>\n    const THEMES = {\"paul-party\": \"<!DOCTYPE html>\\n<html lang=\\\"zh-HK\\\">\\n<head>\\n    <meta charset=\\\"UTF-8\\\">\\n    <meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1.0\\\">\\n    <title>保羅與動物們的派對（完整故事）</title>\\n    <style>\\n        :root {\\n            --ink: #2c3e50;\\n            --accent: #3498db;\\n            --bg: #eef6fc;\\n            --paper: #fffef9;\\n        }\\n        body {\\n            font-family: \\\"Segoe UI\\\", \\\"PingFang HK\\\", \\\"Microsoft JhengHei\\\", sans-serif;\\n            line-height: 1.85;\\n            color: var(--ink);\\n            max-width: 820px;\\n            margin: 0 auto;\\n            padding: 20px;\\n            background:\\n                radial-gradient(ellipse at top, #d6eaf8 0%, transparent 55%),\\n                linear-gradient(180deg, var(--bg), #f7fbff 40%, #e8f4fc);\\n            min-height: 100vh;\\n        }\\n        h1 {\\n            text-align: center;\\n            color: var(--ink);\\n            border-bottom: 3px solid var(--accent);\\n            padding-bottom: 12px;\\n            margin-bottom: 8px;\\n            font-size: 1.7em;\\n        }\\n        .subtitle {\\n            text-align: center;\\n            color: #5d6d7e;\\n            margin-bottom: 18px;\\n            font-size: 0.98em;\\n        }\\n        .badge {\\n            display: inline-block;\\n            background: #3498db;\\n            color: white;\\n            padding: 2px 10px;\\n            border-radius: 999px;\\n            font-size: 0.85em;\\n            font-weight: 700;\\n        }\\n        .voice-info {\\n            text-align: center;\\n            font-size: 0.82em;\\n            color: #7f8c8d;\\n            margin: -8px 0 16px;\\n        }\\n\\n        .control-panel {\\n            background: rgba(255,255,255,0.95);\\n            padding: 14px 18px;\\n            border-radius: 12px;\\n            box-shadow: 0 4px 14px rgba(52,152,219,0.12);\\n            margin-bottom: 22px;\\n            display: flex;\\n            align-items: center;\\n            justify-content: center;\\n            flex-wrap: wrap;\\n            gap: 12px;\\n            position: sticky;\\n            top: 8px;\\n            z-index: 100;\\n            border: 2px solid #d6eaf8;\\n        }\\n        .control-panel label { font-weight: bold; color: var(--ink); }\\n        select {\\n            padding: 8px 12px;\\n            font-size: 1em;\\n            border-radius: 8px;\\n            border: 1px solid #bdc3c7;\\n            background: #f9f9f9;\\n            cursor: pointer;\\n        }\\n        .btn-story {\\n            background: #16a085;\\n            color: white;\\n            border: none;\\n            border-radius: 8px;\\n            padding: 10px 14px;\\n            font-weight: bold;\\n            cursor: pointer;\\n            min-height: 44px;\\n        }\\n        .btn-story.yue { background: #c0392b; }\\n        .btn-story.is-playing,\\n        .btn-eng.is-playing,\\n        .btn-yue.is-playing {\\n            background: #7f8c8d !important;\\n        }\\n        .btn-story:hover { opacity: 0.92; }\\n\\n        .story-container {\\n            background: var(--paper);\\n            padding: 28px 26px 36px;\\n            border-radius: 14px;\\n            box-shadow: 0 8px 24px rgba(44,62,80,0.08);\\n            border: 1px solid #e8eef3;\\n        }\\n        .story-para {\\n            margin-bottom: 8px;\\n            padding: 18px 8px 22px 18px;\\n            border-left: 4px solid #aed6f1;\\n            border-bottom: 1px dashed #d5e5f0;\\n        }\\n        .story-para:last-child { border-bottom: none; margin-bottom: 0; }\\n        .para-label {\\n            font-size: 0.78em;\\n            color: #7f8c8d;\\n            letter-spacing: 0.04em;\\n            margin-bottom: 6px;\\n            font-weight: 700;\\n        }\\n        .english-sentence {\\n            font-size: 1.28em;\\n            font-weight: 600;\\n            color: var(--ink);\\n            margin-bottom: 10px;\\n            letter-spacing: 0.2px;\\n        }\\n        .chinese-translation {\\n            font-size: 1.08em;\\n            color: #555;\\n            margin-bottom: 12px;\\n            cursor: pointer;\\n            min-height: 1.6em;\\n            user-select: none;\\n        }\\n        .chinese-translation.is-hidden .translation-text { display: none; }\\n        .chinese-translation .reveal-hint {\\n            display: none;\\n            color: #95a5a6;\\n            font-style: italic;\\n            font-size: 0.95em;\\n        }\\n        .chinese-translation.is-hidden .reveal-hint { display: inline; }\\n\\n        .highlight-en {\\n            background-color: #fff3cd;\\n            padding: 1px 5px;\\n            border-radius: 6px;\\n            border: 1px solid #ffe69c;\\n            display: inline;\\n            box-decoration-break: clone;\\n            -webkit-box-decoration-break: clone;\\n            margin: 0 1px;\\n            cursor: pointer;\\n            user-select: none;\\n            -webkit-user-select: none;\\n            -webkit-touch-callout: none;\\n            touch-action: manipulation;\\n            transition: background-color 0.2s, border-color 0.2s, color 0.2s;\\n        }\\n        .highlight-en:hover {\\n            background-color: #ffe8a3;\\n            border-color: #ffd666;\\n        }\\n        .highlight-en.showing-zh {\\n            background-color: #a29bfe;\\n            border-color: #8b84e8;\\n            color: white;\\n        }\\n        .highlight-en.showing-zh .syl-1,\\n        .highlight-en.showing-zh .syl-2,\\n        .highlight-en.showing-zh .syl-3,\\n        .highlight-en.showing-zh .syl-4 { color: white; }\\n\\n        .highlight-en.learned {\\n            background-color: transparent !important;\\n            border: 1.5px solid #7f8c8d;\\n            color: #2c3e50 !important;\\n            font-weight: 600;\\n        }\\n        .highlight-en.learned:hover {\\n            background-color: rgba(127, 140, 141, 0.08) !important;\\n            border-color: #5d6d7e;\\n        }\\n        .highlight-en.learned .syl-1,\\n        .highlight-en.learned .syl-2,\\n        .highlight-en.learned .syl-3,\\n        .highlight-en.learned .syl-4 { color: #2c3e50 !important; }\\n        .highlight-en.learned.showing-zh {\\n            background-color: transparent !important;\\n            border: 1.5px solid #7f8c8d;\\n            color: #2c3e50 !important;\\n        }\\n\\n        .syl-1 { color: #d35400; }\\n        .syl-2 { color: #2980b9; }\\n        .syl-3 { color: #27ae60; }\\n        .syl-4 { color: #8e44ad; }\\n\\n        .highlight-zh {\\n            background-color: #a29bfe;\\n            color: white;\\n            padding: 1px 5px;\\n            border-radius: 4px;\\n        }\\n\\n        .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }\\n        button {\\n            display: inline-flex;\\n            align-items: center;\\n            justify-content: center;\\n            gap: 4px;\\n            padding: 8px 12px;\\n            font-size: 0.92em;\\n            font-weight: bold;\\n            border: none;\\n            border-radius: 8px;\\n            cursor: pointer;\\n            transition: transform 0.1s, opacity 0.2s;\\n            color: white;\\n            min-height: 40px;\\n        }\\n        button:hover { opacity: 0.9; }\\n        button:active { transform: scale(0.97); }\\n        .btn-eng { background-color: #3498db; }\\n        .btn-yue { background-color: #e74c3c; }\\n\\n        .tips {\\n            margin-top: 18px;\\n            font-size: 0.9em;\\n            color: #7f8c8d;\\n            text-align: center;\\n        }\\n\\n        @media (max-width: 600px) {\\n            .action-buttons { flex-direction: column; }\\n            .action-buttons button { width: 100%; }\\n            .english-sentence { font-size: 1.12em; }\\n            .story-container { padding: 18px 14px 28px; }\\n        }\\n    </style>\\n</head>\\n<body>\\n\\n    <h1>保羅與動物們的派對</h1>\\n    <p class=\\\"subtitle\\\">完整故事模式 · 涵蓋 PDF 全部 <span class=\\\"badge\\\">69</span> 個生字 · 已學會 <span c \" data-vocab-zh=\\\"恐龍\\\" data-vocab-speak=\\\"恐龍\\\"><span class=\\\"syl-1\\\">di</span><span class=\\\"syl-2\\\">no</span><span class=\\\"syl-3\\\">saur</span></span>, a <span class=\\\"highlight-en\\\" data-vocab-key=\\\"spaceship\\\" data-vocab-zh=\\\"太空船\\\" data-vocab-speak=\\\"太空船\\\"><span class=\\\"syl-1\\\">space</span><span class=\\\"syl-2\\\">ship</span></span>, a <span class=\\\"highlight-en\\\" data-vocab-key=\\\"stick\\\" data-vocab-zh=\\\"棍子\\\" data-vocab-speak=\\\"棍子\\\"><span class=\\\"syl-1\\\">stick</span></span> and a <span class=\\\"highlight-en\\\" data-vocab-key=\\\"candle\\\" data-vocab-zh=\\\"蠟燭\\\" data-vocab-speak=\\\"蠟燭\\\"><span class=\\\"syl-1\\\">can</span><span class=\\\"syl-2\\\">dle</span></span>. \\\"Can the dinosaur <span class=\\\"highlight-en\\\" data-vocab-key=\\\"act\\\" data-vocab-zh=\\\"表演\\\" data-vocab-speak=\\\"表演、或者行動\\\"><span class=\\\"syl-1\\\">act</span></span> and do a <span class=\\\"highlight-en\\\" data-vocab-key=\\\"trick\\\" data-vocab-zh=\\\"把戲\\\" data-vocab-speak=\\\"把戲\\\"><span class=\\\"syl-1\\\">trick</span></span> with a <span class=\\\"highlight-en\\\" data-vocab-key=\\\"mark\\\" data-vocab-zh=\\\"記號\\\" data-vocab-speak=\\\"記號、或者分數\\\"><span class=\\\"syl-1\\\">mark</span></span>?\\\"</div>\\n            <div class=\\\"chinese-translation is-hidden\\\">\\n                <span class=\\\"reveal-hint\\\">👆 點擊顯示中文</span>\\n                <span class=\\\"translation-text\\\">一位<span class=\\\"highlight-zh\\\">警察</span>和一位<span class=\\\"highlight-zh\\\">郵差</span>來<span class=\\\"highlight-zh\\\">迎接</span>他們。一位<span class=\\\"highlight-zh\\\">家庭主婦</span>來<span class=\\\"highlight-zh\\\">賣</span>一隻<span class=\\\"highlight-zh\\\">恐龍</span>、一艘<span class=\\\"highlight-zh\\\">太空船</span>、一根<span class=\\\"highlight-zh\\\">棍子</span>和一支<span class=\\\"highlight-zh\\\">蠟燭</span>。「恐龍會<span class=\\\"highlight-zh\\\">表演</span>，用一個<span class=\\\"highlight-zh\\\">記號</span>變<span class=\\\"highlight-zh\\\">把戲</span>嗎？」</span>\\n            </div>\\n            <div class=\\\"action-buttons\\\">\\n                <button class=\\\"btn-eng\\\" type=\\\"button\\\" data-label=\\\"讀英文\\\">讀英文</button>\\n                <button class=\\\"btn-yue\\\" type=\\\"button\\\" data-label=\\\"讀廣東話\\\">讀廣東話</button>\\n            </div>\\n        </article>\\n\\n        <article class=\\\"story-para\\\" data-para=\\\"8\\\">\\n            <div class=\\\"para-label\\\">第 8 段</div>\\n            <div class=\\\"english-sentence\\\">\\\"Please do not throw <span class=\\\"highlight-en\\\" data-vocab-key=\\\"litter\\\" data-vocab-zh=\\\"垃圾\\\" data-vocab-speak=\\\"垃圾\\\"><span class=\\\"syl-1\\\">li</span><span class=\\\"syl-2\\\">tter</span></span>. We <span class=\\\"highlight-en\\\" data-vocab-key=\\\"should\\\" data-vocab-zh=\\\"應該\\\" data-vocab-speak=\\\"應該\\\"><span class=\\\"syl-1\\\">should</span></span> <span class=\\\"highlight-en\\\" data-vocab-key=\\\"care for\\\" data-vocab-zh=\\\"照顧\\\" data-vocab-speak=\\\"照顧、或者關心\\\"><span class=\\\"syl-1\\\">care for</span></span> the <span class=\\\"highlight-en\\\" data-vocab-key=\\\"earth\\\" data-vocab-zh=\\\"地球\\\" data-vocab-speak=\\\"地球、或者泥土\\\"><span class=\\\"syl-1\\\">earth</span></span> and keep it <span class=\\\"highlight-en\\\" data-vocab-key=\\\"tidy\\\" data-vocab-zh=\\\"整潔的\\\" data-vocab-speak=\\\"整潔的\\\"><span class=\\\"syl-1\\\">ti</span><span class=\\\"syl-2\\\">dy</span></span>. At <span class=\\\"highlight-en\\\" data-vocab-key=\\\"least\\\" data-vocab-zh=\\\"至少\\\" data-vocab-speak=\\\"至少\\\"><span class=\\\"syl-1\\\">least</span></span> keep the <span class=\\\"highlight-en\\\" data-vocab-key=\\\"flat\\\" data-vocab-zh=\\\"公寓\\\" data-vocab-speak=\\\"公寓、或者平坦的\\\"><span class=\\\"syl-1\\\">flat</span></span> <span class=\\\"highlight-en\\\" data-vocab-key=\\\"dry\\\" data-vocab-zh=\\\"乾的\\\" data-vocab-speak=\\\"乾的\\\"><span class=\\\"syl-1\\\">dry</span></span> — not <span class=\\\"highlight-en\\\" data-vocab-key=\\\"dirty\\\" data-vocab-zh=\\\"骯髒的\\\" data-vocab-speak=\\\"骯髒的\\\"><span class=\\\"syl-1\\\">dir</span><span class=\\\"syl-2\\\">ty</span></span>. Look at the white <span class=\\\"highlight-en\\\" data-vocab-key=\\\"cloud\\\" data-vocab-zh=\\\"雲\\\" data-vocab-speak=\\\"雲\\\"><span class=\\\"syl-1\\\">cloud</span></span>,\\\" is the <span class=\\\"highlight-en\\\" data-vocab-key=\\\"rule\\\" data-vocab-zh=\\\"規矩\\\" data-vocab-speak=\\\"規矩、或者規則\\\"><span class=\\\"syl-1\\\">rule</span></span>.</div>\\n            <div class=\\\"chinese-translation is-hidden\\\">\\n                <span class=\\\"reveal-hint\\\">👆 點擊顯示中文</span>\\n                <span class=\\\"translation-text\\\">「請不要亂拋<span class=\\\"highlight-zh\\\">垃圾</span>。我們<span class=\\\"highlight-zh\\\">應該</span><span class=\\\"highlight-zh\\\">照顧</span><span class=\\\"highlight-zh\\\">地球</span>，保持它<span class=\\\"highlight-zh\\\">整潔</span>。<span class=\\\"highlight-zh\\\">至少</span>要保持<span class=\\\"highlight-zh\\\">公寓</span><span class=\\\"highlight-zh\\\">乾爽</span>——不要<span class=\\\"highlight-zh\\\">骯髒</span>。看看白色的<span class=\\\"highlight-zh\\\">雲</span>，」這是<span class=\\\"highlight-zh\\\">規矩</span>。</span>\\n            </div>\\n            <div class=\\\"action-buttons\\\">\\n                <button class=\\\"btn-eng\\\" type=\\\"button\\\" data-label=\\\"讀英文\\\">讀英文</button>\\n                <button class=\\\"btn-yue\\\" type=\\\"button\\\" data-label=\\\"讀廣東話\\\">讀廣東話</button>\\n            </div>\\n        </article>\\n\\n        <article class=\\\"story-para\\\" data-para=\\\"9\\\">\\n            <div class=\\\"para-label\\\">第 9 段</div>\\n            <div class=\\\"english-sentence\\\">Everyone feels a bit <span class=\\\"highlight-en\\\" data-vocab-key=\\\"tired\\\" data-vocab-zh=\\\"疲倦的\\\" data-vocab-speak=\\\"疲倦的、或者累的\\\"><span class=\\\"syl-1\\\">tired</span></span> and <span class=\\\"highlight-en\\\" data-vocab-key=\\\"thirsty\\\" data-vocab-zh=\\\"口渴的\\\" data-vocab-speak=\\\"口渴的\\\"><span class=\\\"syl-1\\\">thir</span><span class=\\\"syl-2\\\">sty</span></span>. They go back to their <span class=\\\"highlight-en\\\" data-vocab-key=\\\"flat\\\" data-vocab-zh=\\\"公寓\\\" data-vocab-speak=\\\"公寓、或者平坦的\\\"><span class=\\\"syl-1\\\">flat</span></span>.</div>\\n            <div class=\\\"chinese-translation is-hidden\\\">\\n                <span class=\\\"reveal-hint\\\">👆 點擊顯示中文</span>\\n                <span class=\\\"translation-text\\\">大家都覺得有點<span class=\\\"highlight-zh\\\">疲倦</span>和<span class=\\\"highlight-zh\\\">口渴</span>。他們回到他們的<span class=\\\"highlight-zh\\\">公寓</span>。</span>\\n            </div>\\n            <div class=\\\"action-buttons\\\">\\n                <button class=\\\"btn-eng\\\" type=\\\"button\\\" data-label=\\\"讀英文\\\">讀英文</button>\\n                <button class=\\\"btn-yue\\\" type=\\\"button\\\" data-label=\\\"讀廣東話\\\">讀廣東話</button>\\n            </div>\\n        </article>\\n    </div>\\n\\n    <p class=\\\"tips\\\">提示：短按黃色生字＝顯示中文並朗讀；長按＝標記已學會（變黑字，保留外框，再長按可取消）。記錄會存喺呢部裝置，refresh 或更新 HTML 都唔會消失。朗讀掣再按一次可停止。中文語速會比設定快 0.25。</p>\\n\\n    <script>\\n        function isAppleTabletOrPhone() {\\n            const ua = navigator.userAgent || '';\\n            const iOS = /iPad|iPhone|iPod/.test(ua);\\n            const iPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;\\n            return iOS || iPadOS;\\n        }\\n\\n        function isLikelyMaleVoice(v) {\\n            const s = ((v.name || '') + ' ' + (v.voiceURI || '')).toLowerCase();\\n            return /\\\\b(aaron|daniel|fred|alex|thomas|james|david|male|rishi|arthur|gordon|lee|bruce|tom|oliver|nathan|eddy|reed|ralph|albert|bad news|good news|whisper|zarvox|trinoids|boing|bubbles|cellos|organ|bells)\\\\b/.test(s);\\n        }\\n\\n        function voiceQualityScore(v) {\\n            const s = ((v.name || '') + ' ' + (v.voiceURI || '')).toLowerCase();\\n            let score = 0;\\n            if (s.includes('super-compact')) score += 30;\\n            if (s.includes('premium') || s.includes('enhanced') || s.includes('neural')) score += 20;\\n            if (s.includes('siri')) score += 12;\\n            if (s.includes('samantha')) score += 25;\\n            if (s.includes('karen')) score += 18;\\n            if (s.includes('moira') || s.includes('tessa') || s.includes('fiona')) score += 10;\\n            if (s.includes('victoria') || s.includes('serena') || s.includes('susan') || s.includes('hazel')) score += 8;\\n            if (s.includes('zira') || s.includes('google us english')) score += 6;\\n            if (s.includes('nicky')) score += 5;\\n            if (s.includes('compact') && !s.includes('super-compact')) score -= 5;\\n            return score;\\n        }\\n\\n        function pickBestEnglishFemale(voices) {\\n            const eng = voices.filter(v => (v.lang || '').toLowerCase().startsWith('en') && !isLikelyMaleVoice(v));\\n            if (eng.length === 0) return voices.find(v => (v.lang || '').toLowerCase().startsWith('en')) || null;\\n            eng.sort((a, b) => voiceQualityScore(b) - voiceQualityScore(a));\\n            return eng[0];\\n        }\\n\\n        function pickCantoneseVoice(voices) {\\n            const yue = voices.filter(v => {\\n                const lang = (v.lang || '').toLowerCase();\\n                return lang === 'zh-hk' || lang === 'yue-hant-hk' || lang.startsWith('yue');\\n            });\\n            if (yue.length === 0) return null;\\n            const sinji = yue.find(v => /sinji/i.test(v.name + v.voiceURI));\\n            if (sinji) return sinji;\\n            yue.sort((a, b) => voiceQualityScore(b) - voiceQualityScore(a));\\n            return yue[0];\\n        }\\n\\n        document.querySelectorAll('.chinese-translation').forEach(el => {\\n            el.addEventListener('click', () => el.classList.toggle('is-hidden'));\\n        });\\n\\n        if (!('speechSynthesis' in window)) {\\n            alert(\\\"很抱歉，您的瀏覽器不支援語音合成功能。\\\");\\n        } else {\\n            let engVoice = null;\\n            let yueVoice = null;\\n            let activeSession = null;\\n            let activeButton = null;\\n\\n            function resetPlayingUI() {\\n                document.querySelectorAll('.is-playing').forEach(btn => {\\n                    btn.classList.remove('is-playing');\\n                    if (btn.dataset.label) btn.textContent = btn.dataset.label;\\n                });\\n                activeSession = null;\\n                activeButton = null;\\n            }\\n\\n            function stopSpeech() {\\n                window.speechSynthesis.cancel();\\n                resetPlayingUI();\\n            }\\n\\n            function loadVoices() {\\n                const voices = window.speechSynthesis.getVoices();\\n                if (voices.length === 0) return;\\n                engVoice = pickBestEnglishFemale(voices);\\n                yueVoice = pickCantoneseVoice(voices);\\n                const device = isAppleTabletOrPhone() ? 'iPad／iPhone' : '電腦';\\n                const engName = engVoice ? engVoice.name : '系統預設英文';\\n                const yueName = yueVoice ? yueVoice.name : '系統預設粵語';\\n                document.getElementById('voice-info').textContent =\\n                    `裝置：${device} · 英文女聲：${engName} · 粵語：${yueName}（再按朗讀掣可停止）`;\\n            }\\n            window.speechSynthesis.onvoiceschanged = loadVoices;\\n            loadVoices();\\n\\n            function makeUtterance(text, lang) {\\n                const u = new SpeechSynthesisUtterance(text);\\n                const baseRate = parseFloat(document.getElementById('speed-select').value);\\n                u.rate = lang === 'yue' ? Math.min(baseRate + 0.25, 2) : baseRate;\\n                if (lang === 'en') {\\n                    u.lang = (engVoice && engVoice.lang) ? engVoice.lang : 'en-US';\\n                    if (engVoice) u.voice = engVoice;\\n                } else {\\n                    u.lang = (yueVoice && yueVoice.lang) ? yueVoice.lang : 'zh-HK';\\n                    if (yueVoice) u.voice = yueVoice;\\n                }\\n                return u;\\n            }\\n\\n            function speakQueue(items, sessionId, button) {\\n                if (activeSession === sessionId) {\\n                    stopSpeech();\\n                    return;\\n                }\\n                stopSpeech();\\n                activeSession = sessionId;\\n                activeButton = button || null;\\n                if (button) {\\n                    button.classList.add('is-playing');\\n                    button.textContent = '停止';\\n                }\\n\\n                let index = 0;\\n                function speakNext() {\\n                    if (activeSession !== sessionId) return;\\n                    if (index >= items.length) {\\n                        resetPlayingUI();\\n                        return;\\n                    }\\n                    const item = items[index++];\\n                    const u = makeUtterance(item.text, item.lang);\\n                    u.onend = () => speakNext();\\n                    u.onerror = () => {\\n                        if (activeSession === sessionId) resetPlayingUI();\\n                    };\\n                    window.speechSynthesis.speak(u);\\n                }\\n                setTimeout(speakNext, 60);\\n            }\\n\\n            function getEngText(group) {\\n                const engEl = group.querySelector('.english-sentence').cloneNode(true);\\n                engEl.querySelectorAll('.highlight-en').forEach(node => {\\n                    if (node.dataset.enText) node.textContent = node.dataset.enText;\\n                });\\n                return engEl.innerText;\\n            }\\n\\n            const LEARNED_KEY = 'paul-party-learned-words-v1';\\n            function loadLearnedSet() {\\n                try {\\n                    const raw = localStorage.getItem(LEARNED_KEY);\\n                    if (!raw) {\\n                        const legacy = localStorage.getItem('paul-party-learned-words');\\n                        if (legacy) {\\n                            localStorage.setItem(LEARNED_KEY, legacy);\\n                            return new Set(JSON.parse(legacy));\\n                        }\\n                    }\\n                    return new Set(raw ? JSON.parse(raw) : []);\\n                } catch (e) {\\n                    return new Set();\\n                }\\n            }\\n            function saveLearnedSet(set) {\\n                try {\\n                    localStorage.setItem(LEARNED_KEY, JSON.stringify([...set]));\\n                } catch (e) {\\n                    alert('無法儲存「已學會」記錄。請檢查瀏覽器是否開啟私密模式。');\\n                }\\n            }\\n            function updateLearnedCount() {\\n                const el = document.getElementById('learned-count');\\n                if (el) el.textContent = String(learnedSet.size);\\n            }\\n            const learnedSet = loadLearnedSet();\\n            updateLearnedCount();\\n\\n            function applyLearnedVisual(el, learned) {\\n                el.classList.remove('showing-zh');\\n                el.innerHTML = el.dataset.enHtml;\\n                if (learned) {\\n                    el.classList.add('learned');\\n                    el.title = '已學會（再長按可取消標記）';\\n                } else {\\n                    el.classList.remove('learned');\\n                    el.title = '短按查字；長按標記已學會';\\n                }\\n            }\\n\\n            function setLearnedByKey(key, learned) {\\n                document.querySelectorAll('.highlight-en').forEach(node => {\\n                    const k = node.getAttribute('data-vocab-key') || node.dataset.enText || '';\\n                    if (k === key) applyLearnedVisual(node, learned);\\n                });\\n                if (learned) learnedSet.add(key);\\n                else learnedSet.delete(key);\\n                saveLearnedSet(learnedSet);\\n                updateLearnedCount();\\n            }\\n\\n            document.querySelectorAll('.highlight-en').forEach(el => {\\n                el.dataset.enHtml = el.innerHTML;\\n                el.dataset.enText = el.innerText;\\n                const key = el.getAttribute('data-vocab-key') || el.dataset.enText || '';\\n                el.title = '短按查字；長按標記已學會';\\n\\n                if (learnedSet.has(key)) applyLearnedVisual(el, true);\\n\\n                let pressTimer = null;\\n                let didLongPress = false;\\n                const LONG_MS = 550;\\n\\n                function clearPressTimer() {\\n                    if (pressTimer) {\\n                        clearTimeout(pressTimer);\\n                        pressTimer = null;\\n                    }\\n                }\\n\\n                el.addEventListener('pointerdown', (e) => {\\n                    if (e.button !== undefined && e.button !== 0) return;\\n                    didLongPress = false;\\n                    clearPressTimer();\\n                    pressTimer = setTimeout(() => {\\n                        didLongPress = true;\\n                        const nowLearned = !el.classList.contains('learned');\\n                        setLearnedByKey(key, nowLearned);\\n                        if (navigator.vibrate) navigator.vibrate(30);\\n                        if (activeSession === 'word:' + key) stopSpeech();\\n                    }, LONG_MS);\\n                });\\n                el.addEventListener('pointerup', clearPressTimer);\\n                el.addEventListener('pointerleave', clearPressTimer);\\n                el.addEventListener('pointercancel', clearPressTimer);\\n                el.addEventListener('contextmenu', (e) => e.preventDefault());\\n\\n                el.addEventListener('click', (e) => {\\n                    e.stopPropagation();\\n                    if (didLongPress) {\\n                        didLongPress = false;\\n                        return;\ eme(btn.dataset.theme));\n    });\n    document.getElementById('btn-back-themes').addEventListener('click', backToThemes);\n  <\/script>\n</body>\n</html>\n", "zh-flash": "<!DOCTYPE html>\n<html lang=\"zh-HK\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\n<title>中英閃卡 v4.6 (智能聽力特訓)</title>\n<link href=\"https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&family=Noto+Serif+HK:wght@500;700;900&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root {\n    --bg-primary: #e0f7fa;\n    --bg-secondary: #ffffff;\n    --text-primary: #37474f;\n    --text-secondary: #78909c;\n\n    --accent: #ff7043;\n    --btn-speak: #42a5f5;\n    --btn-record: #ef5350;\n    --btn-pause: #ffca28;\n    --btn-pause-text: #37474f;\n    --btn-master: #66bb6a;\n    --danger: #ef5350;\n    --import-btn: #fdd835;\n    --review-color: #ff9800;\n\n    --card-border: #b2ebf2;\n    --font-ui: 'M PLUS Rounded 1c', sans-serif;\n    --font-learn-zh: 'Kaiti TC', 'STKaiti', 'BiaoKai', 'Noto Serif HK', serif;\n    --font-learn-en: 'Nunito', sans-serif;\n\n    --progress-color: #c8e6c9;\n}\n\n* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }\n\nbody {\n    font-family: var(--font-ui);\n    background: var(--bg-primary);\n    color: var(--text-primary);\n    height: 100vh;\n    height: 100dvh;\n    overflow: hidden;\n    padding: 15px;\n    padding-top: max(15px, env(safe-area-inset-top));\n    display: flex;\n    flex-direction: column;\n}\n\n/* --- 強力隱藏文字模式 CSS --- */\nbody.hide-text-mode .word-display {\n    filter: blur(70px); opacity: 0.3;\n    transition: filter 0.3s ease;\n    user-select: none; pointer-events: none;\n    transform: scale(0.8);\n}\nbody.hide-text-mode .word-tag span,\nbody.hide-text-mode .word-tag i {\n    filter: blur(15px); opacity: 0.4; pointer-events: none;\n}\n\n/* --- 佈局系
