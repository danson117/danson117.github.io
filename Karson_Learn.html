    .menu-note { font-size: 0.72em; color: #6ee7b7; margin: 0 0 8px 4px; line-height: 1.4; }
    .menu-current { font-size: 0.8em; color: #93c5fd; margin: 0 0 8px 4px; }
    .menu-status { font-size: 0.72em; color: #86efac; margin: 0 0 12px 4px; line-height: 1.4; }
    .menu-item {
      width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
      border: none; background: var(--menu-card); color: var(--text); border-radius: 12px;
      padding: 12px; margin-bottom: 8px; cursor: pointer; font-size: 0.95em; font-weight: 700; line-height: 1.35;
    }
    .menu-item:hover { background: #314158; }
    .menu-item.active { outline: 2px solid var(--accent); background: #1e3a5f; }
    .menu-item.secondary { background: #1f2f44; font-size: 0.88em; }
    .menu-icon { font-size: 1.2em; width: 1.6em; text-align: center; flex-shrink: 0; }
    .menu-text { flex: 1; }
    .menu-divider { height: 1px; background: rgba(255,255,255,0.12); margin: 10px 0; }
    .menu-backdrop { display: none; position: fixed; inset: 0; z-index: 99999; background: transparent; }
    .menu-backdrop.open { display: block; }
    #import-file { display: none; }
    .version-badge {
      position: fixed; right: 12px; bottom: 12px; z-index: 100001;
      background: rgba(31, 42, 55, 0.92); color: #93c5fd;
      border: 1px solid rgba(147, 197, 253, 0.35); border-radius: 999px;
      padding: 6px 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em;

      "button>\\n                <button class=\"btn-yue\" type=\"button\" data-label=\"讀廣東話\">讀廣東話</button>\\n            </div>\\n        </article>\\n\\n        <article class=\"story-para\" data-para=\"8\">\\n            <div class=\"para-label\">第 8 段</div>\\n            <div class=\"english-sentence\">\"Please do not throw <span class=\"highlight-en\" data-vocab-key=\"litter\" data-vocab-zh=\"垃圾\" data-vocab-speak=\"垃圾\"><span class=\"syl-1\">li</span><span class=\"syl-2\">tter</span></span>. We <span class=\"highlight-en\" data-vocab-key=\"should\" data-vocab-zh=\"應該\" data-vocab-speak=\"應該\"><span class=\"syl-1\">should</span></span> <span class=\"highlight-en\" data-vocab-key=\"care for\" data-vocab-zh=\"照顧\" data-vocab-speak=\"照顧、或者關心\"><span class=\"syl-1\">care for</span></span> the <span class=\"highlight-en\" data-vocab-key=\"earth\" data-vocab-zh=\"地球\" data-vocab-speak=\"地球、或者泥土\"><span class=\"syl-1\">earth</span></span> and keep it <span class=\"highlight-en\" data-vocab-key=\"tidy\" data-vocab-zh=\"整潔的\" data-vocab-speak=\"整潔的\"><span class=\"syl-1\">ti</span><span class=\"syl-2\">dy</span></span>. At <span class=\"highlight-en\" data-vocab-key=\"least\" data-vocab-zh=\"至少\" data-vocab-speak=\"至少\"><span class=\"syl-1\">least</span></span> keep the <span class=\"highlight-en\" data-vocab-key=\"flat\" data-vocab-zh=\"公寓\" data-vocab-speak=\"公寓、或者平坦的\"><span class=\"syl-1\">flat</span></span> <span class=\"highlight-en\" data-vocab-key=\"dry\" data-vocab-zh=\"乾的\" data-vocab-speak=\"乾的\"><span class=\"syl-1\">dry</span></span> — not <span class=\"highlight-en\" data-vocab-key=\"dirty\" data-vocab-zh=\"骯髒的\" data-vocab-speak=\"骯髒的\"><span class=\"syl-1\">dir</span><span class=\"syl-2\">ty</span></span>. Look at the white <span class=\"highlight-en\" data-vocab-key=\"cloud\" data-vocab-zh=\"雲\" data-vocab-speak=\"雲\"><span class=\"syl-1\">cloud</span></span>,\" is the <span class=\"highlig" +
      "ht-en\" data-vocab-key=\"rule\" data-vocab-zh=\"規矩\" data-vocab-speak=\"規矩、或者規則\"><span class=\"syl-1\">rule</span></span>.</div>\\n            <div class=\"chinese-translation is-hidden\">\\n                <span class=\"reveal-hint\">👆 點擊顯示中文</span>\\n                <span class=\"translation-text\">「請不要亂拋<span class=\"highlight-zh\">垃圾</span>。我們<span class=\"highlight-zh\">應該</span><span class=\"highlight-zh\">照顧</span><span class=\"highlight-zh\">地球</span>，保持它<span class=\"highlight-zh\">整潔</span>。<span class=\"highlight-zh\">至少</span>要保持<span class=\"highlight-zh\">公寓</span><span class=\"highlight-zh\">乾爽</span>——不要<span class=\"highlight-zh\">骯髒</span>。看看白色的<span class=\"highlight-zh\">雲</span>，」這是<span class=\"highlight-zh\">規矩</span>。</span>\\n            </div>\\n            <div class=\"action-buttons\">\\n                <button class=\"btn-eng\" type=\"button\" data-label=\"讀英文\">讀英文</button>\\n                <button class=\"btn-yue\" type=\"button\" data-label=\"讀廣東話\">讀廣東話</button>\\n            </div>\\n        </article>\\n\\n        <article class=\"story-para\" data-para=\"9\">\\n            <div class=\"para-label\">第 9 段</div>\\n            <div class=\"english-sentence\">Everyone feels a bit <span class=\"highlight-en\" data-vocab-key=\"tired\" data-vocab-zh=\"疲倦的\" data-vocab-speak=\"疲倦的、或者累的\"><span class=\"syl-1\">tired</span></span> and <span class=\"highlight-en\" data-vocab-key=\"thirsty\" data-vocab-zh=\"口渴的\" data-vocab-speak=\"口渴的\"><span class=\"syl-1\">thir</span><span class=\"syl-2\">sty</span></span>. They go back to their <span class=\"highlight-en\" data-vocab-key=\"flat\" data-vocab-zh=\"公寓\" data-vocab-speak=\"公寓、或者平坦的\"><span class=\"syl-1\">flat</span></span>.</div>\\n            <div class=\"chinese-translation is-hidden\">\\n                <span class=\"reveal-hint\">👆 點擊顯示中文</span>\\n                <span class=\"translation-text\">大家都覺" +
      "得有點<span class=\"highlight-zh\">疲倦</span>和<span class=\"highlight-zh\">口渴</span>。他們回到他們的<span class=\"highlight-zh\">公寓</span>。</span>\\n            </div>\\n            <div class=\"action-buttons\">\\n                <button class=\"btn-eng\" type=\"button\" data-label=\"讀英文\">讀英文</button>\\n                <button class=\"btn-yue\" type=\"button\" data-label=\"讀廣東話\">讀廣東話</button>\\n            </div>\\n        </article>\\n    </div>\\n\\n    <p class=\"tips\">提示：短按黃色生字＝顯示中文並朗讀；長按＝標記已學會（變黑字，保留外框，再長按可取消）。記錄會存喺呢部裝置，refresh 或更新 HTML 都唔會消失。朗讀掣再按一次可停止。中文語速會比設定快 0.25。</p>\\n\\n    <script>\\n        function isAppleTabletOrPhone() {\\n            const ua = navigator.userAgent || \\'\\';\\n            const iOS = /iPad|iPhone|iPod/.test(ua);\\n            const iPadOS = navigator.platform === \\'MacIntel\\' && navigator.maxTouchPoints > 1;\\n            return iOS || iPadOS;\\n        }\\n\\n        function isLikelyMaleVoice(v) {\\n            const s = ((v.name || \\'\\') + \\' \\' + (v.voiceURI || \\'\\')).toLowerCase();\\n            return /\\\\b(aaron|daniel|fred|alex|thomas|james|david|male|rishi|arthur|gordon|lee|bruce|tom|oliver|nathan|eddy|reed|ralph|albert|bad news|good news|whisper|zarvox|trinoids|boing|bubbles|cellos|organ|bells)\\\\b/.test(s);\\n        }\\n\\n        function voiceQualityScore(v) {\\n            const s = ((v.name || \\'\\') + \\' \\' + (v.voiceURI || \\'\\')).toLowerCase();\\n            let score = 0;\\n            if (s.includes(\\'super-compact\\')) score += 30;\\n            if (s.includes(\\'premium\\') || s.includes(\\'enhanced\\') || s.includes(\\'neural\\')) score += 20;\\n            if (s.includes(\\'siri\\')) score += 12;\\n            if (s.includes(\\'samantha\\')) score += 25;\\n            if (s.includes(\\'karen\\')) score += 18;\\n            if (s.includes(\\'moira\\') || s.includes(\\'tessa\\') || s.includes(\\'" +
      "fiona\\')) score += 10;\\n            if (s.includes(\\'victoria\\') || s.includes(\\'serena\\') || s.includes(\\'susan\\') || s.includes(\\'hazel\\')) score += 8;\\n            if (s.includes(\\'zira\\') || s.includes(\\'google us english\\')) score += 6;\\n            if (s.includes(\\'nicky\\')) score += 5;\\n            if (s.includes(\\'compact\\') && !s.includes(\\'super-compact\\')) score -= 5;\\n            return score;\\n        }\\n\\n        function pickBestEnglishFemale(voices) {\\n            const eng = voices.filter(v => (v.lang || \\'\\').toLowerCase().startsWith(\\'en\\') && !isLikelyMaleVoice(v));\\n            if (eng.length === 0) return voices.find(v => (v.lang || \\'\\').toLowerCase().startsWith(\\'en\\')) || null;\\n            eng.sort((a, b) => voiceQualityScore(b) - voiceQualityScore(a));\\n            return eng[0];\\n        }\\n\\n        function pickCantoneseVoice(voices) {\\n            const yue = voices.filter(v => {\\n                const lang = (v.lang || \\'\\').toLowerCase();\\n                return lang === \\'zh-hk\\' || lang === \\'yue-hant-hk\\' || lang.startsWith(\\'yue\\');\\n            });\\n            if (yue.length === 0) return null;\\n            const sinji = yue.find(v => /sinji/i.test(v.name + v.voiceURI));\\n            if (sinji) return sinji;\\n            yue.sort((a, b) => voiceQualityScore(b) - voiceQualityScore(a));\\n            return yue[0];\\n        }\\n\\n        document.querySelectorAll(\\'.chinese-translation\\').forEach(el => {\\n            el.addEventListener(\\'click\\', () => el.classList.toggle(\\'is-hidden\\'));\\n        });\\n\\n        if (!(\\'speechSynthesis\\' in window)) {\\n            alert(\"很抱歉，您的瀏覽器不支援語音合成功能。\");\\n        } else {\\n            let engVoice = null;\\n            let yueVoice = null;\\n            let activeSession = null;\\n            let a" +
      "ctiveButton = null;\\n\\n            function resetPlayingUI() {\\n                document.querySelectorAll(\\'.is-playing\\').forEach(btn => {\\n                    btn.classList.remove(\\'is-playing\\');\\n                    if (btn.dataset.label) btn.textContent = btn.dataset.label;\\n                });\\n                activeSession = null;\\n                activeButton = null;\\n            }\\n\\n            function stopSpeech() {\\n                window.speechSynthesis.cancel();\\n                resetPlayingUI();\\n            }\\n\\n            function loadVoices() {\\n                const voices = window.speechSynthesis.getVoices();\\n                if (voices.length === 0) return;\\n                engVoice = pickBestEnglishFemale(voices);\\n                yueVoice = pickCantoneseVoice(voices);\\n                const device = isAppleTabletOrPhone() ? \\'iPad／iPhone\\' : \\'電腦\\';\\n                const engName = engVoice ? engVoice.name : \\'系統預設英文\\';\\n                const yueName = yueVoice ? yueVoice.name : \\'系統預設粵語\\';\\n                document.getElementById(\\'voice-info\\').textContent =\\n                    `裝置：${device} · 英文女聲：${engName} · 粵語：${yueName}（再按朗讀掣可停止）`;\\n            }\\n            window.speechSynthesis.onvoiceschanged = loadVoices;\\n            loadVoices();\\n\\n            function makeUtterance(text, lang) {\\n                const u = new SpeechSynthesisUtterance(text);\\n                const baseRate = parseFloat(document.getElementById(\\'speed-select\\').value);\\n                u.rate = lang === \\'yue\\' ? Math.min(baseRate + 0.25, 2) : baseRate;\\n                if (lang === \\'en\\') {\\n                    u.lang = (engVoice && engVoice.lang) ? engVoice.lang : \\'en-US\\';\\n                    if (engVoice) u.voice = engVoice;\\n                } else {\\n    " +
      "                u.lang = (yueVoice && yueVoice.lang) ? yueVoice.lang : \\'zh-HK\\';\\n                    if (yueVoice) u.voice = yueVoice;\\n                }\\n                return u;\\n            }\\n\\n            function speakQueue(items, sessionId, button) {\\n                if (activeSession === sessionId) {\\n                    stopSpeech();\\n                    return;\\n                }\\n                stopSpeech();\\n                activeSession = sessionId;\\n                activeButton = button || null;\\n                if (button) {\\n                    button.classList.add(\\'is-playing\\');\\n                    button.textContent = \\'停止\\';\\n                }\\n\\n                let index = 0;\\n                function speakNext() {\\n                    if (activeSession !== sessionId) return;\\n                    if (index >= items.length) {\\n                        resetPlayingUI();\\n                        return;\\n                    }\\n                    const item = items[index++];\\n                    const u = makeUtterance(item.text, item.lang);\\n                    u.onend = () => speakNext();\\n                    u.onerror = () => {\\n                        if (activeSession === sessionId) resetPlayingUI();\\n                    };\\n                    window.speechSynthesis.speak(u);\\n                }\\n                setTimeout(speakNext, 60);\\n            }\\n\\n            function getEngText(group) {\\n                const engEl = group.querySelector(\\'.english-sentence\\').cloneNode(true);\\n                engEl.querySelectorAll(\\'.highlight-en\\').forEach(node => {\\n                    if (node.dataset.enText) node.textContent = node.dataset.enText;\\n                });\\n                return engEl.innerText;\\n            }\\n\\n            const " +
      "LEARNED_KEY = \\'paul-party-learned-words-v1\\';\\n            function loadLearnedSet() {\\n                try {\\n                    const raw = localStorage.getItem(LEARNED_KEY);\\n                    if (!raw) {\\n                        const legacy = localStorage.getItem(\\'paul-party-learned-words\\');\\n                        if (legacy) {\\n                            localStorage.setItem(LEARNED_KEY, legacy);\\n                            return new Set(JSON.parse(legacy));\\n                        }\\n                    }\\n                    return new Set(raw ? JSON.parse(raw) : []);\\n                } catch (e) {\\n                    return new Set();\\n                }\\n            }\\n            function saveLearnedSet(set) {\\n                try {\\n                    localStorage.setItem(LEARNED_KEY, JSON.stringify([...set]));\\n                } catch (e) {\\n                    alert(\\'無法儲存「已學會」記錄。請檢查瀏覽器是否開啟私密模式。\\');\\n                }\\n            }\\n            function updateLearnedCount() {\\n                const el = document.getElementById(\\'learned-count\\');\\n                if (el) el.textContent = String(learnedSet.size);\\n            }\\n            const learnedSet = loadLearnedSet();\\n            updateLearnedCount();\\n\\n            function applyLearnedVisual(el, learned) {\\n                el.classList.remove(\\'showing-zh\\');\\n                el.innerHTML = el.dataset.enHtml;\\n                if (learned) {\\n                    el.classList.add(\\'learned\\');\\n                    el.title = \\'已學會（再長按可取消標記）\\';\\n                } else {\\n                    el.classList.remove(\\'learned\\');\\n                    el.title = \\'短按查字；長按標記已學會\\';\\n                }\\n            }\\n\\n            function setLearnedByKey(key, learned) {\\n                docume" +
      "nt.querySelectorAll(\\'.highlight-en\\').forEach(node => {\\n                    const k = node.getAttribute(\\'data-vocab-key\\') || node.dataset.enText || \\'\\';\\n                    if (k === key) applyLearnedVisual(node, learned);\\n                });\\n                if (learned) learnedSet.add(key);\\n                else learnedSet.delete(key);\\n                saveLearnedSet(learnedSet);\\n                updateLearnedCount();\\n            }\\n\\n            document.querySelectorAll(\\'.highlight-en\\').forEach(el => {\\n                el.dataset.enHtml = el.innerHTML;\\n                el.dataset.enText = el.innerText;\\n                const key = el.getAttribute(\\'data-vocab-key\\') || el.dataset.enText || \\'\\';\\n                el.title = \\'短按查字；長按標記已學會\\';\\n\\n                if (learnedSet.has(key)) applyLearnedVisual(el, true);\\n\\n                let pressTimer = null;\\n                let didLongPress = false;\\n                const LONG_MS = 550;\\n\\n                function clearPressTimer() {\\n                    if (pressTimer) {\\n                        clearTimeout(pressTimer);\\n                        pressTimer = null;\\n                    }\\n                }\\n\\n                el.addEventListener(\\'pointerdown\\', (e) => {\\n                    if (e.button !== undefined && e.button !== 0) return;\\n                    didLongPress = false;\\n                    clearPressTimer();\\n                    pressTimer = setTimeout(() => {\\n                        didLongPress = true;\\n                        const nowLearned = !el.classList.contains(\\'learned\\');\\n                        setLearnedByKey(key, nowLearned);\\n                        if (navigator.vibrate) navigator.vibrate(30);\\n                        if (activeSession === \\'word:\\' + key) stopSpeech();\\n  " +
      "                  }, LONG_MS);\\n                });\\n                el.addEventListener(\\'pointerup\\', clearPressTimer);\\n                el.addEventListener(\\'pointerleave\\', clearPressTimer);\\n                el.addEventListener(\\'pointercancel\\', clearPressTimer);\\n                el.addEventListener(\\'contextmenu\\', (e) => e.preventDefault());\\n\\n                el.addEventListener(\\'click\\', (e) => {\\n                    e.stopPropagation();\\n                    if (didLongPress) {\\n                        didLongPress = false;\\n                        return;\\n                    }\\n                    const sessionId = \\'word:\\' + key;\\n                    const showingZh = el.classList.toggle(\\'showing-zh\\');\\n                    if (showingZh) {\\n                        el.textContent = el.getAttribute(\\'data-vocab-zh\\') || \\'\\';\\n                        const enWord = el.dataset.enText || \\'\\';\\n                        const speakZh = el.getAttribute(\\'data-vocab-speak\\') || el.getAttribute(\\'data-vocab-zh\\') || \\'\\';\\n                        const items = [{ text: enWord, lang: \\'en\\' }];\\n                        if (speakZh) items.push({ text: speakZh, lang: \\'yue\\' });\\n                        speakQueue(items, sessionId, null);\\n                    } else {\\n                        if (el.classList.contains(\\'learned\\')) {\\n                            el.textContent = el.dataset.enText;\\n                        } else {\\n                            el.innerHTML = el.dataset.enHtml;\\n                        }\\n                        if (activeSession === sessionId) stopSpeech();\\n                    }\\n                });\\n            });\\n\\n            document.querySelectorAll(\\'.story-para\\').forEach(group => {\\n                const btnEng = group.que" +
      "rySelector(\\'.btn-eng\\');\\n                const btnYue = group.querySelector(\\'.btn-yue\\');\\n                const paraId = group.getAttribute(\\'data-para\\');\\n                const zhText = group.querySelector(\\'.translation-text\\').innerText;\\n\\n                btnEng.addEventListener(\\'click\\', () => {\\n                    speakQueue(\\n                        [{ text: getEngText(group), lang: \\'en\\' }],\\n                        \\'para-en-\\' + paraId,\\n                        btnEng\\n                    );\\n                });\\n                btnYue.addEventListener(\\'click\\', () => {\\n                    speakQueue(\\n                        [{ text: zhText, lang: \\'yue\\' }],\\n                        \\'para-yue-\\' + paraId,\\n                        btnYue\\n                    );\\n                });\\n            });\\n\\n            document.getElementById(\\'btn-story-en\\').addEventListener(\\'click\\', () => {\\n                const btn = document.getElementById(\\'btn-story-en\\');\\n                const items = [];\\n                document.querySelectorAll(\\'.story-para\\').forEach(group => {\\n                    items.push({ text: getEngText(group), lang: \\'en\\' });\\n                });\\n                speakQueue(items, \\'story-en\\', btn);\\n            });\\n            document.getElementById(\\'btn-story-yue\\').addEventListener(\\'click\\', () => {\\n                const btn = document.getElementById(\\'btn-story-yue\\');\\n                const items = [];\\n                document.querySelectorAll(\\'.story-para\\').forEach(group => {\\n                    items.push({ text: group.querySelector(\\'.translation-text\\').innerText, lang: \\'yue\\' });\\n                });\\n                speakQueue(items, \\'story-yue\\', btn);\\n            });\\n        }\\n    <\\/script>\\n</body>" +
      "\\n</html>\\n',\n      };\n      const home = document.getElementById(\"theme-home\");\n      const reader = document.getElementById(\"theme-reader\");\n      const frame = document.getElementById(\"theme-frame\");\n\n      function openTheme(id) {\n        const html = THEMES[id];\n        if (!html) return;\n        if (window.speechSynthesis) window.speechSynthesis.cancel();\n        frame.srcdoc = html;\n        home.style.display = \"none\";\n        reader.classList.add(\"active\");\n        try {\n          localStorage.setItem(\"en-vocab-last-theme\", id);\n        } catch (e) {}\n      }\n\n      function backToThemes() {\n        if (window.speechSynthesis) window.speechSynthesis.cancel();\n        try {\n          frame.contentWindow.speechSynthesis &&\n            frame.contentWindow.speechSynthesis.cancel();\n        } catch (e) {}\n        frame.srcdoc = \"\";\n        reader.classList.remove(\"active\");\n        home.style.display = \"block\";\n      }\n\n      document.querySelectorAll(\".theme-card\").forEach((btn) => {\n        btn.addEventListener(\"click\", () => openTheme(btn.dataset.theme));\n      });\n      document\n        .getElementById(\"btn-back-themes\")\n        .addEventListener(\"click\", backToThemes);\n\n      // 重開時還原上次主題（生字已學會標記由主題內 localStorage 自行還原）\n      try {\n        const lastTheme = localStorage.getItem(\"en-vocab-last-theme\");\n        if (lastTheme && THEMES[lastTheme]) openTheme(lastTheme);\n      } catch (e) {}\n    <\/script>\n  </body>\n</html>\n"

      "neseVoice) u.voice = cantoneseVoice;\n        u.rate = 0.9;\n        speechSynthesis.speak(u);\n      }\n      function escapeHtml(s) {\n        return String(s)\n          .replace(/&/g, \"&amp;\")\n          .replace(/</g, \"&lt;\")\n          .replace(/>/g, \"&gt;\")\n          .replace(/\"/g, \"&quot;\");\n      }\n      function highlight(text, word) {\n        const src = escapeHtml(text);\n        if (!word) return src;\n        const w = escapeHtml(word);\n        return src.split(w).join(`<span class=\"hl\">${w}</span>`);\n      }\n      function currentBand() {\n        return DATA.bands.find((b) => b.id === bandId);\n      }\n      function stateKey(word, field) {\n        return word + \"|\" + field;\n      }\n      function getFieldState(word, field) {\n        const k = stateKey(word, field);\n        if (!fieldState.has(k))\n          fieldState.set(k, { open: false, spoken: false });\n        return fieldState.get(k);\n      }\n\n      function renderBands() {\n        const row = document.getElementById(\"band-row\");\n        row.innerHTML = DATA.bands\n          .map(\n            (b) =>\n              `<button class=\"band-btn ${b.id === bandId ? \"active\" : \"\"}\" data-id=\"${b.id}\">${b.title}（${b.count}）</button>`,\n          )\n          .join(\"\");\n        row.querySelectorAll(\".band-btn\").forEach((btn) => {\n          btn.onclick = () => {\n            bandId = btn.dataset.id;\n            cat = \"全部\";\n            saveViewState();\n            renderBands();\n            fillCats();\n            renderList();\n          };\n        });\n      }\n      function fillCats() {\n        const words = currentBand().words;\n        const cats = Array.from(new Set(words.map((w) => w.cat))).sort();\n        const sel = document.getElementById(\"cat-select\");\n        sel.innerHTML =\n          `<option value=\"全部\">全部分類</option>`" +

      " \"off\");\n        document.getElementById(\"toggle-meanings\").textContent = showAllMeanings\n          ? \"全部解釋：隱藏\"\n          : \"全部解釋：顯示\";\n        document.getElementById(\"toggle-examples\").textContent = showAllExamples\n          ? \"全部例子：隱藏\"\n          : \"全部例子：顯示\";\n        const offN = offSet.size;\n        document.getElementById(\"view-off\").textContent = offN\n          ? `已學識（${offN}）`\n          : \"已學識\";\n      }\n\n      function renderList() {\n        updateViewButtons();\n        const words = filtered();\n        const totalOff = offSet.size;\n        const learnN = currentBand().words.length - totalOff;\n        document.getElementById(\"count\").textContent =\n          viewMode === \"off\"\n            ? `已學識 ${words.length} 個（全部已學 ${totalOff}）`\n            : `學習中 ${words.length} 個（剩餘約 ${learnN}）`;\n\n        const list = document.getElementById(\"list\");\n        const prevScroll = list.scrollTop;\n        if (!words.length) {\n          list.innerHTML =\n            viewMode === \"off\"\n              ? `<div class=\"empty\">暫時未有已學識的詞語。在學習中剔選右邊方格，就會移到這裏。</div>`\n              : `<div class=\"empty\">沒有符合的詞語（或者全部已學識）</div>`;\n          return;\n        }\n\n        const STEP = 90;\n        let shown = Math.min(STEP, words.length);\n\n        function paint() {\n          const slice = words.slice(0, shown);\n          list.innerHTML = slice\n            .map((item) => {\n              const isOff = offSet.has(item.w);\n              return `<article class=\"card ${isOff ? \"off\" : \"\"}\" data-word=\"${escapeHtml(item.w)}\">\n        <div class=\"title-row\">\n          <div class=\"word\" data-speak=\"${escapeHtml(item.w)}\">${item.w}</div>\n          <span class=\"meta\">${escapeHtml(item.cat)}</span>\n          <input class=\"done-box\" type=\"checkbox\" title=\"${isOff ? \"取消已學識，放回學習中\" : \"標記為已學識\"}\" ${isOff ? \"checked\" : \"\"} " +

      "round: #f87171; color: #fff; }\n        #answer-digits.is-placeholder { color: #94a3b8; letter-spacing: 0; }\n        #keypad {\n            display: grid;\n            grid-template-columns: repeat(3, 1fr);\n            gap: 0.75rem;\n            width: 100%;\n        }\n        .key-btn {\n            background: #fff;\n            color: #1e3a8a;\n            font-weight: 800;\n            font-size: 1.75rem;\n            padding: 1.1rem 0;\n            border: none;\n            border-radius: 1rem;\n            box-shadow: 0 6px 0 #94a3b8;\n            cursor: pointer;\n        }\n        .key-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #94a3b8; }\n        .key-btn:disabled { opacity: 0.55; cursor: default; }\n        .key-btn.is-back { background: #cbd5e1; color: #334155; }\n        .key-btn.is-ok { background: #f59e0b; color: #fff; box-shadow: 0 6px 0 #b45309; }\n\n        /* 錯題庫：每行 3rem（text-xl 1.75rem + padding 0.5rem*2 + border 2px*2），10 行 + 9 個 0.5rem gap */\n        .mistake-cb { width: 1.5rem; height: 1.5rem; cursor: pointer; flex-shrink: 0; }\n        .mistake-row {\n            display: flex; align-items: center; justify-content: space-between;\n            box-sizing: border-box; flex-shrink: 0;\n            gap: 0.75rem; background: rgba(255,255,255,0.1); padding: 0.5rem 1rem;\n            min-height: 3rem;\n            border-radius: 0.75rem; cursor: pointer; border: 2px solid transparent;\n        }\n        .mistake-row.is-picked { background: rgba(245,158,11,0.25); border-color: #f59e0b; }\n        #mistake-list {\n            max-height: calc((3rem * 10) + (0.5rem * 9));\n        }\n    </style>\n</head>\n<body>\n    <div id=\"view-table\">\n        <div class=\"container\">\n            <h1 class=\"header-title\">99乘法表（九九表）</h1>\n            <div class=\"controls\">\n                " +
      "<button id=\"btn-show\" type=\"button\">顯示全部</button>\n                <button id=\"btn-hide\" type=\"button\">隱藏全部</button>\n                <button id=\"btn-quiz\" type=\"button\">🚀 開始測驗</button>\n            </div>\n            <div class=\"table-wrapper\">\n                <div class=\"grid-container\" id=\"multiplication-grid\"></div>\n            </div>\n        </div>\n    </div>\n\n    <div id=\"view-quiz\">\n\n\n    <!-- 開始畫面 -->\n    <div id=\"start-screen\" class=\"w-full max-w-md bg-white/10 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-white/20 text-center flex flex-col\">\n        <h1 class=\"text-3xl font-bold mb-2 text-yellow-400\">🚀 數學太空探險 🌟</h1>\n        <p class=\"text-blue-200 mb-2 text-sm\">混合測驗：單位數乘數（2–9）＋ 雙位數加／減</p>\n        <p class=\"text-blue-300 mb-4 text-xs leading-relaxed\">每次大約各佔三分一；題目唔會重複。乘數最多 72 條（2–9 全表）。</p>\n        \n        <p class=\"text-yellow-300 font-bold mb-2 text-sm\">今次要做幾多題？</p>\n        <div class=\"grid grid-cols-2 gap-3 mb-6\">\n            <script>\n                const quizSizes = [25, 50, 75, 100];\n                for (let i = 0; i < quizSizes.length; i++) {\n                    const n = quizSizes[i];\n                    const checked = n === 50 ? 'checked' : '';\n                    document.write(`\n                        <label class=\"custom-checkbox cursor-pointer relative\">\n                            <input type=\"radio\" name=\"quiz-size\" value=\"${n}\" class=\"peer sr-only quiz-size-cb\" ${checked}>\n                            <div class=\"rounded-xl border-2 border-blue-400/50 p-3 text-xl font-bold text-white bg-blue-900/50 hover:bg-blue-800/50 transition-all\">\n                                ${n} 題\n                            </div>\n                        </label>\n                    `);\n                }\n            <\/script>\n        </div>\n\n        <button " +
      "onclick=\"startGame(false)\" class=\"w-full bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-300 hover:to-orange-400 text-white font-bold py-4 rounded-2xl text-2xl shadow-lg transform transition hover:scale-105 active:scale-95 mb-4\">\n            開始探險！ 🛸\n        </button>\n\n        <div class=\"flex gap-2\">\n            <button onclick=\"startGame(true)\" class=\"flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl shadow-lg transition\">\n                特訓錯題庫 🎯\n            </button>\n            <button onclick=\"openMistakeManager()\" class=\"flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition\">\n                管理錯題庫 📁\n            </button>\n        </div>\n        <button type=\"button\" onclick=\"showTableView()\" class=\"mt-4 w-full bg-white/15 hover:bg-white/25 text-white font-bold py-3 rounded-xl shadow-lg transition border border-white/30\">\n            📘 返回乘數表\n        </button>\n    </div>\n\n    <!-- 遊戲畫面 -->\n    <div id=\"game-screen\" class=\"w-full max-w-md hidden flex-col items-center\">\n        \n        <!-- 頂部資訊 (進度與對錯) -->\n        <div class=\"w-full flex justify-between items-center bg-white/10 backdrop-blur-sm p-4 rounded-2xl mb-4 border border-white/20\">\n            <div class=\"flex flex-col items-center\">\n                <span class=\"text-xs text-blue-200\">進度 (一回合)</span>\n                <span id=\"progress-display\" class=\"text-lg font-bold text-white\">0/0</span>\n            </div>\n            <div class=\"flex flex-col items-center\">\n                <span class=\"text-xs text-blue-200\">答啱</span>\n                <span id=\"correct-display\" class=\"text-lg font-bold text-green-400\">✅ 0</span>\n            </div>\n            <div class=\"flex flex-col items-center\">\n                <span class=\"text-xs tex" +
      "t-blue-200\">答錯</span>\n                <span id=\"wrong-display\" class=\"text-lg font-bold text-red-400\">❌ 0</span>\n            </div>\n            <div class=\"flex flex-col items-center\">\n                <span class=\"text-xs text-blue-200\">連中</span>\n                <span id=\"combo-display\" class=\"text-lg font-bold text-yellow-400\">🔥 0</span>\n            </div>\n        </div>\n\n        <!-- 鼓勵字句 -->\n        <div id=\"cheer-msg\" class=\"h-8 text-xl font-bold text-pink-400 mb-2 opacity-0 transition-opacity duration-300\">\n            好叻！\n        </div>\n\n        <!-- 題目區域 -->\n        <div id=\"question-container\" class=\"relative w-full bg-gradient-to-b from-blue-500 to-blue-700 p-6 rounded-3xl shadow-2xl border-4 border-blue-400 mb-4 text-center\">\n            <h2 id=\"question-text\" class=\"font-extrabold tracking-wider text-white drop-shadow-md\">\n                3 × 9 =\n            </h2>\n        </div>\n\n        <!-- 數字鍵盤作答 -->\n        <div id=\"keypad-wrap\" class=\"w-full\">\n            <div id=\"answer-display\">\n                <span id=\"answer-digits\" class=\"is-placeholder\">?</span>\n            </div>\n            <div id=\"keypad\">\n                <button type=\"button\" class=\"key-btn\" data-digit=\"1\">1</button>\n                <button type=\"button\" class=\"key-btn\" data-digit=\"2\">2</button>\n                <button type=\"button\" class=\"key-btn\" data-digit=\"3\">3</button>\n                <button type=\"button\" class=\"key-btn\" data-digit=\"4\">4</button>\n                <button type=\"button\" class=\"key-btn\" data-digit=\"5\">5</button>\n                <button type=\"button\" class=\"key-btn\" data-digit=\"6\">6</button>\n                <button type=\"button\" class=\"key-btn\" data-digit=\"7\">7</button>\n                <button type=\"button\" class=\"key-btn\" data-digit=\"8\">8</button>\n                <button ty" +
      "pe=\"button\" class=\"key-btn\" data-digit=\"9\">9</button>\n                <button type=\"button\" class=\"key-btn is-back\" id=\"key-back\">⌫</button>\n                <button type=\"button\" class=\"key-btn\" data-digit=\"0\">0</button>\n                <button type=\"button\" class=\"key-btn is-ok\" id=\"key-ok\">確認</button>\n            </div>\n        </div>\n        \n        <button id=\"quit-game-btn\" onclick=\"backToMenu()\" class=\"mt-8 text-blue-300 underline text-sm hover:text-white\">\n            放棄並返去主目錄\n        </button>\n\n        <!-- 全部完成畫面 -->\n        <div id=\"complete-screen\" class=\"hidden w-full flex-col items-center bg-white/10 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-white/20 mt-2\">\n            <h2 class=\"text-3xl font-bold text-yellow-400 mb-3 text-center\">🎉 全部完成！</h2>\n            <p id=\"complete-msg\" class=\"text-blue-100 text-center mb-4 text-lg leading-relaxed\"></p>\n            <div class=\"w-full flex justify-around bg-white/10 rounded-2xl p-4 mb-6\">\n                <div class=\"text-center\">\n                    <div class=\"text-xs text-blue-200 mb-1\">總題數</div>\n                    <div id=\"complete-total\" class=\"text-2xl font-bold text-white\">0</div>\n                </div>\n                <div class=\"text-center\">\n                    <div class=\"text-xs text-blue-200 mb-1\">答啱</div>\n                    <div id=\"complete-correct\" class=\"text-2xl font-bold text-green-400\">0</div>\n                </div>\n                <div class=\"text-center\">\n                    <div class=\"text-xs text-blue-200 mb-1\">答錯</div>\n                    <div id=\"complete-wrong\" class=\"text-2xl font-bold text-red-400\">0</div>\n                </div>\n            </div>\n            <button onclick=\"backToMenu()\" class=\"w-full bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-300" +
      " hover:to-orange-400 text-white font-bold py-4 rounded-2xl text-xl shadow-lg transform transition hover:scale-105 active:scale-95\">\n                返回主目錄 🏠\n            </button>\n        </div>\n    </div>\n\n    <!-- 錯題庫管理畫面 -->\n    <div id=\"mistake-screen\" class=\"w-full max-w-md hidden flex-col bg-white/10 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-white/20\">\n        <h2 class=\"text-2xl font-bold mb-2 text-yellow-400 text-center\">📁 錯題庫</h2>\n        <p class=\"text-sm text-blue-200 mb-3 text-center\">顯示題目同答案，方便溫書。剔選之後可以再測或者刪除。</p>\n\n        <button type=\"button\" id=\"btn-select-all\" onclick=\"toggleSelectAllMistakes()\" class=\"w-full bg-white/15 hover:bg-white/25 text-white font-bold py-3 rounded-xl shadow-lg transition border border-white/30 mb-3\">\n            全選\n        </button>\n        \n        <div id=\"mistake-list\" class=\"flex flex-col gap-2 overflow-y-auto mb-4 pr-2\">\n            <!-- 錯題列表由 JS 產生 -->\n        </div>\n\n        <button type=\"button\" onclick=\"startAllMistakes()\" class=\"w-full bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-300 hover:to-orange-400 text-white font-bold py-4 rounded-2xl text-xl shadow-lg transform transition hover:scale-105 active:scale-95 mb-3\">\n            ⚡ 一鍵全測\n        </button>\n        <div class=\"flex gap-2 mb-2\">\n            <button type=\"button\" onclick=\"startSelectedMistakes()\" class=\"flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl shadow-lg transition\">\n                測所選 🚀\n            </button>\n            <button type=\"button\" onclick=\"deleteSelectedMistakes()\" class=\"flex-1 bg-red-500 hover:bg-red-400 text-white font-bold py-3 rounded-xl shadow-lg transition\">\n                刪除所選 🗑️\n            </button>\n        </div>\n        <button type=\"button\" onclick=\"backToMenu()\"" +
      " class=\"w-full bg-gray-500 hover:bg-gray-400 text-white font-bold py-3 rounded-xl shadow-lg transition\">\n            返回 🔙\n        </button>\n    </div>\n\n    <script>\n        let selectedQuizSize = 50;\n        let questionPool = [];\n        let currentQuestionIndex = 0;\n        let combo = 0;\n        let correctCount = 0;\n        let wrongCount = 0;\n        let currentQuestion = null;\n        let isPracticeMode = false;\n        let typedAnswer = '';\n        let isChecking = false;\n\n        const MUL_MIN = 2;\n        const MUL_MAX = 9;\n        const MUL_OTHER_MAX = 9;\n        const ADD_POOL_SIZE = 100;\n        const SUB_POOL_SIZE = 100;\n        const QUIZ_SIZES = [25, 50, 75, 100];\n        \n        // 讀取錯題庫 (用 localStorage 保存)\n        let mistakeBank = [];\n        try {\n            const saved = localStorage.getItem('mathMistakes');\n            if (saved) mistakeBank = JSON.parse(saved);\n        } catch(e) { console.log(\"無法讀取 localStorage\"); }\n\n        function saveMistakes() {\n            try {\n                localStorage.setItem('mathMistakes', JSON.stringify(mistakeBank));\n            } catch(e) { console.log(\"無法儲存至 localStorage\"); }\n        }\n\n        function startGame(practiceMode, customPool) {\n            isPracticeMode = practiceMode;\n            \n            if (isPracticeMode) {\n                const source = customPool || mistakeBank;\n                if (!source || source.length === 0) {\n                    alert(\"錯題庫暫時冇題目喎！快啲去探險收集啦！\");\n                    return;\n                }\n                questionPool = source.map(m => {\n                    const op = m.op || '×';\n                    const fallback = op === '+' ? m.a + m.b : (op === '-' ? m.a - m.b : m.a * m.b);\n                    return {\n                        a: m.a,\n                        b: m." +
      "b,\n                        op,\n                        answer: (m.answer != null && m.answer !== '') ? m.answer : fallback,\n                        text: m.text || (op === '+' ? `${m.a} + ${m.b}` : (op === '-' ? `${m.a} − ${m.b}` : `${m.a} × ${m.b}`))\n                    };\n                });\n                shuffleArray(questionPool);\n            } else {\n                const picked = document.querySelector('.quiz-size-cb:checked');\n                selectedQuizSize = picked ? parseInt(picked.value, 10) : 50;\n                if (!QUIZ_SIZES.includes(selectedQuizSize)) selectedQuizSize = 50;\n                generateQuestionPool(selectedQuizSize);\n            }\n\n            // 重置統計\n            combo = 0;\n            correctCount = 0;\n            wrongCount = 0;\n            currentQuestionIndex = 0;\n\n            resetGameView();\n            \n            document.getElementById('start-screen').classList.add('hidden');\n            document.getElementById('mistake-screen').classList.add('hidden');\n            document.getElementById('mistake-screen').classList.remove('flex');\n            document.getElementById('game-screen').classList.remove('hidden');\n            document.getElementById('game-screen').classList.add('flex');\n\n            nextQuestion();\n        }\n\n        function questionKey(q) {\n            const op = q.op || '×';\n            return `${op}:${q.a}:${q.b}`;\n        }\n\n        function randInt(min, max) {\n            return min + Math.floor(Math.random() * (max - min + 1));\n        }\n\n        function buildMulPool() {\n            const pool = [];\n            for (let a = MUL_MIN; a <= MUL_MAX; a++) {\n                for (let b = 1; b <= MUL_OTHER_MAX; b++) {\n                    pool.push({ a, b, op: '×', answer: a * b, text: `${a} × ${b}` });\n              " +
      "  }\n            }\n            return pool;\n        }\n\n        function buildAddPool(count) {\n            const pool = [];\n            const seen = new Set();\n            let guard = 0;\n            while (pool.length < count && guard < 30000) {\n                guard++;\n                const a = randInt(10, 99);\n                const b = randInt(10, 99);\n                const key = `+:${a}:${b}`;\n                if (seen.has(key)) continue;\n                seen.add(key);\n                pool.push({ a, b, op: '+', answer: a + b, text: `${a} + ${b}` });\n            }\n            return pool;\n        }\n\n        function buildSubPool(count) {\n            const pool = [];\n            const seen = new Set();\n            let guard = 0;\n            while (pool.length < count && guard < 30000) {\n                guard++;\n                let a = randInt(10, 99);\n                let b = randInt(10, 99);\n                if (a < b) {\n                    const t = a; a = b; b = t;\n                }\n                const key = `-:${a}:${b}`;\n                if (seen.has(key)) continue;\n                seen.add(key);\n                pool.push({ a, b, op: '-', answer: a - b, text: `${a} − ${b}` });\n            }\n            return pool;\n        }\n\n        function takeUnique(pool, n) {\n            const copy = pool.slice();\n            shuffleArray(copy);\n            return copy.slice(0, Math.max(0, Math.min(n, copy.length)));\n        }\n\n        function splitQuizCounts(total, mulMax, addMax, subMax) {\n            let mul = Math.round(total / 3);\n            let add = Math.round(total / 3);\n            let sub = total - mul - add;\n\n            const fit = (want, cap) => Math.max(0, Math.min(want, cap));\n            mul = fit(mul, mulMax);\n            add = fit(add, addMax);\n            sub" +
      " = fit(sub, subMax);\n\n            let leftover = total - mul - add - sub;\n            const extras = [\n                { name: 'add', room: addMax - add },\n                { name: 'sub', room: subMax - sub },\n                { name: 'mul', room: mulMax - mul }\n            ];\n            for (const extra of extras) {\n                if (leftover <= 0) break;\n                const give = Math.min(leftover, extra.room);\n                if (extra.name === 'add') add += give;\n                if (extra.name === 'sub') sub += give;\n                if (extra.name === 'mul') mul += give;\n                leftover -= give;\n            }\n            return { mul, add, sub };\n        }\n\n        function generateQuestionPool(total) {\n            const mulPool = buildMulPool();\n            const addPool = buildAddPool(ADD_POOL_SIZE);\n            const subPool = buildSubPool(SUB_POOL_SIZE);\n            const counts = splitQuizCounts(total, mulPool.length, addPool.length, subPool.length);\n            questionPool = [\n                ...takeUnique(mulPool, counts.mul),\n                ...takeUnique(addPool, counts.add),\n                ...takeUnique(subPool, counts.sub)\n            ];\n            shuffleArray(questionPool);\n        }\n\n        function resetGameView() {\n            document.getElementById('question-container').classList.remove('hidden');\n            document.getElementById('keypad-wrap').classList.remove('hidden');\n            document.getElementById('quit-game-btn').classList.remove('hidden');\n            document.getElementById('cheer-msg').classList.remove('hidden');\n            document.getElementById('complete-screen').classList.add('hidden');\n            document.getElementById('complete-screen').classList.remove('flex');\n            resetAnswerBox();\n        }\n\n   " +
      "     function showCompletion() {\n            document.getElementById('question-container').classList.add('hidden');\n            document.getElementById('keypad-wrap').classList.add('hidden');\n            document.getElementById('quit-game-btn').classList.add('hidden');\n            document.getElementById('cheer-msg').classList.add('hidden');\n\n            const total = questionPool.length;\n            const modeLabel = isPracticeMode ? '錯題特訓' : '混合測驗';\n            document.getElementById('complete-msg').innerText =\n                `你已經完成今次${modeLabel}全部 ${total} 題啦！唔使再開新一套試卷。`;\n            document.getElementById('complete-total').innerText = String(total);\n            document.getElementById('complete-correct').innerText = String(correctCount);\n            document.getElementById('complete-wrong').innerText = String(wrongCount);\n\n            document.getElementById('progress-display').innerText = `${total} / ${total}`;\n            document.getElementById('complete-screen').classList.remove('hidden');\n            document.getElementById('complete-screen').classList.add('flex');\n            createConfetti();\n        }\n\n        function nextQuestion() {\n            if (currentQuestionIndex >= questionPool.length) {\n                showCompletion();\n                return;\n            }\n\n            currentQuestion = questionPool[currentQuestionIndex];\n            document.getElementById('question-text').innerText = currentQuestion.text + ' =';\n            resetAnswerBox();\n            updateStats();\n        }\n\n        function resetAnswerBox() {\n            typedAnswer = '';\n            isChecking = false;\n            const display = document.getElementById('answer-display');\n            display.classList.remove('is-correct', 'is-wrong', 'shake', 'pop');\n            update" +

  function flushFlashcard(timeoutMs = 1800) {
    if (currentPageId !== 'zh-flash' || !frame.contentWindow) return Promise.resolve(true);
    const requestId = `karson-flush-${Date.now()}-${Math.random()}`;
    return new Promise((resolve) => {
      const timeout = setTimeout(() => {
        window.removeEventListener('message', onMessage);
        resolve(false);
      }, timeoutMs);
      const onMessage = (event) => {
        if (
          event.source === frame.contentWindow &&
          event.data?.type === 'karson-flash-flush-complete' &&
          event.data.requestId === requestId
        ) {
          clearTimeout(timeout);
          window.removeEventListener('message', onMessage);
          resolve(Boolean(event.data.ok));
        }
      };
      window.addEventListener('message', onMessage);
      frame.contentWindow.postMessage({ type: 'karson-flash-flush', requestId }, '*');
    });
  }

  async function loadPage(pageId) {
    const requestId = ++pageLoadId;
    await flushFlashcard();
    if (requestId !== pageLoadId) return;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    const external = EXTERNAL_PAGES[pageId];
    if (external) {
      frame.removeAttribute('srcdoc');
      frame.src = external;

      const html = PAGES[pageId];
      if (!html) return;

  const FLASH_DB_NAME = 'FlashcardDB_v4.0';
  const MAX_BACKUP_DEPTH = 12;
  const MAX_BACKUP_ITEMS = 10000;
  const MAX_BLOB_BASE64_LENGTH = 80 * 1024 * 1024;

  function openExistingFlashcardDb() {
    return new Promise((resolve) => {
      let created = false;
      const request = indexedDB.open(FLASH_DB_NAME, 1);
      request.onupgradeneeded = () => {
        created = true;
        request.transaction.abort();
      };
      request.onerror = () => resolve(null);
      request.onsuccess = () => {
        const db = request.result;
        if (created || !db.objectStoreNames.contains('data')) {
          db.close();
          resolve(null);
          return;
        }
        resolve(db);
      };
    });
  }

  function bytesToBase64(bytes) {
    let binary = '';
    bytes.forEach((byte) => (binary += String.fromCharCode(byte)));
    return btoa(binary);
  }

  function base64ToBytes(base64) {
    const binary = atob(base64);
    return Uint8Array.from(binary, (char) => char.charCodeAt(0));
  }

  async function encodeBackupValue(value) {
    if (value instanceof Blob) {
      return {
        __karsonBackupType: 'Blob',
        type: value.type,
        base64: bytesToBase64(new Uint8Array(await value.arrayBuffer()))
      };
    }
    if (Array.isArray(value)) return Promise.all(value.map(encodeBackupValue));
    if (value && typeof value === 'object') {
      const result = {};
      for (const [key, item] of Object.entries(value)) result[key] = await encodeBackupValue(item);
      return result;
    }
    return value;
  }

  function isPlainObject(value) {
    return value !== null && typeof value === 'object' && !Array.isArray(value);
  }

  function isSafeBackupValue(value, depth = 0) {
    if (depth > MAX_BACKUP_DEPTH) return false;
    if (value === null || ['string', 'number', 'boolean'].includes(typeof value)) {
      return typeof value !== 'string' || value.length <= MAX_BLOB_BASE64_LENGTH;
    }
    if (Array.isArray(value)) {
      return value.length <= MAX_BACKUP_ITEMS && value.every((item) => isSafeBackupValue(item, depth + 1));
    }
    if (!isPlainObject(value)) return false;
    const entries = Object.entries(value);
    if (entries.length > 100) return false;
    if (value.__karsonBackupType === 'Blob') {
      return (
        typeof value.type === 'string' &&
        typeof value.base64 === 'string' &&
        value.base64.length <= MAX_BLOB_BASE64_LENGTH &&
        /^[A-Za-z0-9+/]*=(0, 2)$/.test(value.base64)
      );
    }
    return entries.every(
      ([key, item]) => key.length <= 120 && isSafeBackupValue(item, depth + 1)
    );
  }

  async function decodeBackupValue(value) {
    if (!isSafeBackupValue(value)) throw new Error('invalid FlashcardDB value');
    if (Array.isArray(value)) return Promise.all(value.map(decodeBackupValue));
    if (value && typeof value === 'object') {
      if (value.__karsonBackupType === 'Blob') {
        return new Blob([base64ToBytes(value.base64)], { type: value.type });
      }
      const result = {};
      for (const [key, item] of Object.entries(value)) result[key] = await decodeBackupValue(item);
      return result;
    }
    return value;
  }

  async function exportFlashcardDb() {
    const db = await openExistingFlashcardDb();
    if (!db) return null;
    try {
      const records = await new Promise((resolve, reject) => {
        const transaction = db.transaction('data', 'readonly');
        const request = transaction.objectStore('data').getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      return {
        name: FLASH_DB_NAME,
        store: 'data',
        records: await Promise.all(records.map(encodeBackupValue))
      };
    } finally {
      db.close();
    }
  }

  async function restoreFlashcardDb(snapshot) {
    if (
      !isPlainObject(snapshot) ||
      snapshot.name !== FLASH_DB_NAME ||
      snapshot.store !== 'data' ||
      !Array.isArray(snapshot.records) ||
      snapshot.records.length > MAX_BACKUP_ITEMS ||
      !snapshot.records.every(
        (record) =>
          isPlainObject(record) &&
          typeof record.id === 'string' &&
          record.id.length <= 160 &&
          isSafeBackupValue(record)
      )
    ) return false;
    const records = await Promise.all(snapshot.records.map(decodeBackupValue));
    await new Promise((resolve, reject) => {
      const request = indexedDB.open(FLASH_DB_NAME, 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains('data')) db.createObjectStore('data', { keyPath: 'id' });
      };
      request.onerror = () => reject(request.error);
      request.onsuccess = () => {
        const db = request.result;
        const transaction = db.transaction('data', 'readwrite');
        const store = transaction.objectStore('data');
        store.clear();
        records.forEach((record) => store.put(record));
        transaction.oncomplete = () => {
          db.close();
          resolve();
        };
        transaction.onerror = () => {
          db.close();
          reject(transaction.error);
        };
      };
    });
    return true;
  }

  function isValidProfiles(value) {
    if (!Array.isArray(value) || value.length > 1000) return false;
    const ids = new Set();
    return value.every((profile) => {
      if (!isPlainObject(profile)) return false;
      if (
        typeof profile.id !== 'string' ||
        !profile.id.trim() ||
        profile.id.length > 120 ||
        typeof profile.name !== 'string' ||
        !profile.name.trim() ||
        profile.name.length > 80 ||
        (profile.parentId !== null && typeof profile.parentId !== 'string') ||
        typeof profile.isFolder !== 'boolean' ||
        ids.has(profile.id)
      ) return false;
      ids.add(profile.id);
      return true;
    });
  }

  function isValidLocalValue(key, value) {
    if (typeof value !== 'string' || value.length > 2 * 1024 * 1024) return false;
    if (key === STORAGE_KEY) return META.some((page) => page.id === value);
    if (key === 'flashcard_current_profile') return value.length <= 120;
    const jsonValidators = {
      'flashcard_profiles': isValidProfiles,
      'zh-lexlist-off-v1': (parsed) => Array.isArray(parsed) && parsed.length <= MAX_BACKUP_ITEMS,
      'mathMistakes': (parsed) => Array.isArray(parsed) && parsed.length <= MAX_BACKUP_ITEMS,
      'paul-party-learned-words-v1': (parsed) => Array.isArray(parsed) && parsed.length <= MAX_BACKUP_ITEMS,
      'paul-party-learned-words': (parsed) => Array.isArray(parsed) && parsed.length <= MAX_BACKUP_ITEMS,
    };
    const validate = jsonValidators[key];
    if (!validate) return true;
    try {
      return validate(JSON.parse(value));
    } catch (e) {
      return false;
    }
  }

  function importProgress(file) {
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const obj = JSON.parse(reader.result);
        if (!isPlainObject(obj)) throw new Error('invalid backup');
        if (obj.app !== undefined && obj.app !== 'Karson_Learn') throw new Error('wrong app');
        if (obj.version !== undefined && ![1, 2].includes(obj.version)) throw new Error('unsupported version');
        const keys = isPlainObject(obj.keys) ? obj.keys : obj;
        let n = 0;
        let skipped = 0;
        Object.entries(keys).forEach(([k, value]) => {
          if (PROGRESS_KEYS.includes(k) && isValidLocalValue(k, value)) {
            localStorage.setItem(k, value);
            n += 1;
          } else skipped += 1;
        });
        const restoredFlashcardDb =
          obj.version === 2 ? await restoreFlashcardDb(obj.flashcardDb) : false;
        alert(
          '已匯入 ' + n + ' 項進度' +
          (restoredFlashcardDb ? '，包括中文閃卡詞庫及錄音' : '') +
          (skipped ? '；已略過 ' + skipped + ' 項不支援或格式錯誤資料' : '') +
          '。將重新載入上次頁面。'
        );
        const page = localStorage.getItem(STORAGE_KEY) || META[0].id;
        loadPage(page);
      } catch (e) {
        alert('匯入失敗：檔案格式唔正確');
      }
    };
    reader.readAsText(file);
  }

  document.getElementById('btn-export').addEventListener('click', exportProgress);
  document.getElementById('btn-import').addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', () => {
    if (importFile.files && importFile.files[0]) importProgress(importFile.files[0]);
    importFile.value = '';
  });

  document.querySelectorAll('.menu-item[data-page]').forEach(btn => {
    btn.addEventListener('click', () => loadPage(btn.dataset.page));
  });

  let startId = META[0].id;
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && (PAGES[saved] || EXTERNAL_PAGES[saved])) startId = saved;
    if (saved === 'en-paul') startId = 'en-vocab';
    if (saved === 'math-test') startId = 'math-table';
  } catch (e) {}
  loadPage(startId);
  </script>
</body>
</html>
