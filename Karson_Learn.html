   function confirmBatchMoveFromWordsToReview() {\n            const indices = getSelectedIndices('#wordList'); if (!indices.length) return;\n            indices.forEach(idx => { reviewWords.push(words[idx]); words.splice(idx, 1); });\n            if (currentIndex >= words.length) currentIndex = 0;\n            showToast(`已移動 ${indices.length} 個到還要練`); markDirty(); exitWordSelectMode(); updateCard();\n        }\n        function confirmBatchDeleteFromWords() {\n            const indices = getSelectedIndices('#wordList'); if (!indices.length) return;\n            if(!confirm(`確定要刪除這 ${indices.length} 個詞語嗎？`)) return;\n            indices.forEach(idx => words.splice(idx, 1));\n            if (currentIndex >= words.length) currentIndex = 0;\n            showToast(`已刪除 ${indices.length} 個詞語`); markDirty(); exitWordSelectMode(); updateCard();\n        }\n\n        function confirmBatchMoveFromReviewToWords() {\n            const indices = getSelectedIndices('#reviewList'); if (!indices.length) return;\n            indices.forEach(idx => { let w = reviewWords[idx]; w.views=0; w.hits=0; w.roundId=0; words.push(w); reviewWords.splice(idx, 1); });\n            showToast(`已退回 ${indices.length} 個到詞語表`); markDirty(); exitReviewMode(); updateCard();\n        }\n        function confirmBatchMoveFromReviewToMastered() {\n            const indices = getSelectedIndices('#reviewList'); if (!indices.length) return;\n            indices.forEach(idx => { masteredWords.push(reviewWords[idx]); reviewWords.splice(idx, 1); });\n            showToast(`已晉級 ${indices.length} 個到已學識`); markDirty(); exitReviewMode();\n        }\n        function confirmBatchDelete() {\n            const indices = getSelectedIndices('#masteredList'); if (!indices.length) return;\n            indices.forEach(idx => masteredWords.splice(idx, 1));\n            showToast(`已刪除 ${indices.length} 個詞語`); markDirty(); exitDeleteMode();\n        }\n        function confirmBatchRestore() {\n            const indices = getSelectedIndices('#masteredList'); if (!indices.length) return;\n            indices.forEach(idx => { let w = masteredWords[idx]; w.views=0; w.hits=0; w.roundId=0; words.push(w); masteredWords.splice(idx, 1); });\n            showToast(`已還原 ${indices.length} 個到詞語表`); markDirty(); exitDeleteMode(); updateCard();\n        }\n        function confirmBatchMoveFromMasteredToReview() {\n            const indices = getSelectedIndices('#masteredList'); if (!indices.length) return;\n            indices.forEach(idx => { let w = masteredWords[idx]; w.views=0; w.hits=0; reviewWords.push(w); masteredWords.splice(idx, 1); });\n            showToast(`已移動 ${indices.length} 個到還要練`); markDirty(); exitDeleteMode();\n        }\n\n        function updateCard() {\n            const display = document.getElementById('currentWord');\n            const progressFill = document.getElementById('progressFill');\n            const progressText = document.getElementById('progressText');\n            const viewCountDisplay = document.getElementById('cardViewCount');\n            const masteryDisplay = document.getElementById('cardMasteryProgress');\n            const isRandom = document.getElementById('randomOrder').checked;\n\n            if (words.length === 0) {\n                display.textContent = \"加字先！\"; display.style.fontSize = \"3rem\"; display.classList.remove('en-font');\n                document.getElementById('speakBtn').disabled = true; document.getElementById('recordBtn').disabled = true; document.getElementById('masteredBtn').disabled = true;\n                progressFill.style.width = `100%`; progressText.textContent = `全部完成！`;\n                viewCountDisplay.textContent = \"\"; masteryDisplay.textContent = \"\";\n                renderLists(); return;\n            }\n\n            if (currentIndex >= words.length) currentIndex = 0;\n            document.getElementById('speakBtn').disabled = false; document.getElementById('recordBtn').disabled = false; document.getElementById('masteredBtn').disabled = false;\n            const item = words[currentIndex];\n            if (isRandom && item.roundId !== currentRoundId) item.roundId = currentRoundId;\n            display.textContent = item.text;\n            if (isEnglish(item.text)) { display.classList.add('en-font'); display.style.fontSize = item.text.length > 8 ? \"4rem\" : \"6rem\"; }\n            else { display.classList.remove('en-font'); display.style.fontSize = item.text.length > 3 ? \"5rem\" : \"8rem\"; }\n            \n            if (isRandom) {\n                const remainingInRound = words.filter(w => w.roundId !== currentRoundId).length;\n                progressFill.style.width = '100%'; progressText.textContent = `隨機模式 (本輪剩 ${remainingInRound})`;\n            } else {\n                const pct = ((currentIndex + 1) / words.length) * 100;\n                progressFill.style.width = `${pct}%`; progressText.textContent = `${currentIndex + 1} / ${words.length}`;\n            }\n            viewCountDisplay.textContent = `👂 ${item.views}`; masteryDisplay.textContent = `🎯 ${item.hits}/${settings.masteryThreshold}`;\n            renderLists();\n        }\n\n        function handleMasteryClick(e) {\n            if (words.length === 0) return;\n            stopEverything();\n\n            const item = words[currentIndex]; item.hits++;\n            if (item.hits >= settings.masteryThreshold) {\n                words.splice(currentIndex, 1);\n                if (item.views > settings.masteryViewLimit) {\n                    reviewWords.push(item); showToast(`👍 識咗，但要多練下「${item.text}」`);\n                } else {\n                    masteredWords.push(item); showToast(`🎉 太棒了！輕鬆學識「${item.text}」`);\n                    triggerConfetti(null, null, 1.0);\n                }\n                if (currentIndex >= words.length) currentIndex = 0;\n                markDirty(); renderLists();\n                if (words.length > 0) {\n                    if (document.getElementById('randomOrder').checked) currentIndex = pickNextIndexRandom(true);\n                    updateCard(); \n                    startAutoIfEnabled();\n                } else updateCard();\n            } else {\n                const rect = e.target.getBoundingClientRect();\n                triggerConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2, 0.4);\n                markDirty(); renderLists(); updateCard(); \n                manualNext();\n            }\n        }\n\n        // --- Game Mode Logic (v4.6 Updated) ---\n        async function openGameMode() {\n            stopEverything();\n            await unlockAudioAndSpeech();\n            const totalCards = words.length + reviewWords.length + masteredWords.length;\n            if (totalCards === 0) { showToast(\"請先加入一些生字！\"); return; }\n            \n            // 初始化遊戲 Session\n            isGameActive = true;\n            \n            // 優先使用「還要練」列表\n            if (reviewWords.length > 0) {\n                gameSessionQueue = [...reviewWords];\n                gameTotalReviewCount = reviewWords.length;\n            } else {\n                gameSessionQueue = [...words];\n                gameTotalReviewCount = words.length;\n            }\n            \n            updateGameScoreUI();\n            document.getElementById('gameOverlay').style.display = 'flex';\n            generateGameRound();\n        }\n\n        function updateGameScoreUI() {\n            const el = document.getElementById('gameProgressText');\n            if (reviewWords.length > 0) {\n                el.textContent = `還要練剩餘: ${gameSessionQueue.length} / ${gameTotalReviewCount}`;\n            } else {\n                el.textContent = `詞語表剩餘: ${gameSessionQueue.length} / ${gameTotalReviewCount}`;\n            }\n        }\n\n        function closeGameMode() {\n            isGameActive = false;\n            document.getElementById('gameOverlay').style.display = 'none';\n            stopEverything();\n        }\n\n        function generateGameRound() {\n            const grid = document.getElementById('gameGrid');\n            grid.innerHTML = '';\n            \n            // 1. Pick Target from Session Queue\n            if (gameSessionQueue.length === 0) {\n                // 如果隊列空了，重新填充 (無限練習模式)\n                if (reviewWords.length > 0) gameSessionQueue = [...reviewWords];\n                else gameSessionQueue = [...words];\n                if (gameSessionQueue.length === 0) gameSessionQueue = [...masteredWords]; // Fallback\n                showToast(\"一輪完成！再來一次！\");\n            }\n            \n            const targetIndex = Math.floor(Math.random() * gameSessionQueue.length);\n            gameTarget = gameSessionQueue[targetIndex];\n            const targetLen = getLength(gameTarget.text);\n\n            // 2. Pick Distractors (8 items) - Smart Selection\n            // 優先找同字數的\n            let allAvailable = [...reviewWords, ...words, ...masteredWords].filter(w => w !== gameTarget);\n            let sameLenDistractors = allAvailable.filter(w => getLength(w.text) === targetLen);\n            \n            // Shuffle sameLenDistractors\n            for (let i = sameLenDistractors.length - 1; i > 0; i--) {\n                const j = Math.floor(Math.random() * (i + 1));\n                [sameLenDistractors[i], sameLenDistractors[j]] = [sameLenDistractors[j], sameLenDistractors[i]];\n            }\n\n            let distractors = sameLenDistractors.slice(0, 8);\n\n            // 如果不夠8個，從隱藏詞庫補\n            if (distractors.length < 8 && !isEnglish(gameTarget.text)) {\n                let needed = 8 - distractors.length;\n                let fallbackPool = (FALLBACK_DB[targetLen] || []).filter(w => w !== gameTarget.text);\n                \n                // Shuffle fallback\n                for (let i = fallbackPool.length - 1; i > 0; i--) {\n                    const j = Math.floor(Math.random() * (i + 1));\n                    [fallbackPool[i], fallbackPool[j]] = [fallbackPool[j], fallbackPool[i]];\n                }\n                \n                for(let i=0; i<needed; i++) {\n                    if (i < fallbackPool.length) {\n                        distractors.push({ text: fallbackPool[i], isFallback: true });\n                    }\n                }\n            }\n\n            // 如果還是不夠 (例如英文或超長字)，隨機補\n            if (distractors.length < 8) {\n                let needed = 8 - distractors.length;\n                let randomPool = allAvailable.filter(w => !distractors.includes(w));\n                for(let i=0; i<needed; i++) {\n                    if (i < randomPool.length) distractors.push(randomPool[i]);\n                }\n            }\n\n            // 3. Combine and Shuffle (Total 9)\n            gameItems = [gameTarget, ...distractors];\n            for (let i = gameItems.length - 1; i > 0; i--) {\n                const j = Math.floor(Math.random() * (i + 1));\n                [gameItems[i], gameItems[j]] = [gameItems[j], gameItems[i]];\n            }\n\n            // 4. Render Grid\n            gameItems.forEach(item => {\n                const card = document.createElement('div');\n                card.className = 'game-card';\n                if (isEnglish(item.text)) card.classList.add('is-english');\n                card.textContent = item.text;\n                card.onclick = () => handleGameCardClick(card, item);\n                grid.appendChild(card);\n            });\n\n            // 5. Play Audio\n            setTimeout(() => playGameAudio(), 500);\n        }\n\n        function playGameAudio() {\n            if (!isGameActive || !gameTarget) return;\n            playItemAudio(gameTarget);\n        }\n\n        function handleGameCardClick(cardElement, item) {\n            if (cardElement.classList.contains('correct')) return; \n\n            if (item === gameTarget) {\n                // Correct!\n                cardElement.classList.add('correct');\n                triggerConfetti(null, null, 0.6);\n                \n                // 從本次 Session 隊列中移除 (讓計數器減少)\n                const idx = gameSessionQueue.indexOf(gameTarget);\n                if (idx > -1) gameSessionQueue.splice(idx, 1);\n                updateGameScoreUI();\n\n                // 這裡不移動原本列表的分類 (純練習)\n                showToast(\"答啱咗！\");\n\n                // Next round after delay\n                setTimeout(() => {\n                    if (isGameActive) generateGameRound();\n                }, 1500);\n\n            } else {\n                // Wrong!\n                cardElement.classList.add('shake');\n                setTimeout(() => cardElement.classList.remove('shake'), 500);\n                playItemAudio(item);\n            }\n        }\n\n        function openSettingsModal() {\n            document.getElementById('settingAutoDelay').value = settings.autoDelay;\n            document.getElementById('settingRepeatDelay').value = settings.repeatDelay;\n            document.getElementById('settingMasteryThreshold').value = settings.masteryThreshold;\n            document.getElementById('settingMasteryViewLimit').value = settings.masteryViewLimit;\n            document.getElementById('settingsModal').style.display = 'flex';\n        }\n\n        function autoSaveSettings() {\n            settings.autoDelay = parseInt(document.getElementById('settingAutoDelay').value) || 4;\n            settings.repeatDelay = parseInt(document.getElementById('settingRepeatDelay').value) || 3;\n            settings.masteryThreshold = parseInt(document.getElementById('settingMasteryThreshold').value) || 2;\n            settings.masteryViewLimit = parseInt(document.getElementById('settingMasteryViewLimit').value) || 1;\n            settings.readImmediately = document.getElementById('readImmediatelyToggle').checked;\n            markDirty(); updateCard(); showToast(\"設定已更新\");\n        }\n\n        let pendingAction = null;\n        function confirmAction(actionType) {\n            pendingAction = actionType;\n            const msgEl = document.getElementById('confirmMessage');\n            const btnEl = document.getElementById('confirmBtn');\n            document.getElementById('confirmModal').style.display = 'flex';\n            if (actionType === 'resetStats') { msgEl.textContent = \"確定要將所有詞語的聽讀次數和熟練度歸零嗎？\"; btnEl.className = \"modal-btn btn-save\"; btnEl.style.background = \"#5c6bc0\"; }\n            else if (actionType === 'resetSettings') { msgEl.textContent = \"確定要還原設定到初始值嗎？\"; btnEl.className = \"modal-btn btn-save\"; btnEl.style.background = \"#78909c\"; }\n            else if (actionType === 'clearAudio') { msgEl.textContent = \"確定要清除所有自製錄音嗎？文字會保留。\"; btnEl.className = \"modal-btn btn-save\"; btnEl.style.background = \"#ff9800\"; }\n            else if (actionType === 'clearAll') { msgEl.textContent = \"⚠️ 警告：這將刪除所有詞語、錄音和進度，無法還原！\"; btnEl.className = \"modal-btn btn-danger\"; btnEl.style.background = \"#ef5350\"; }\n        }\n\n        document.getElementById('confirmBtn').onclick = async () => {\n            if (!pendingAction) return;\n            if (pendingAction === 'resetStats') {\n                [words, reviewWords, masteredWords].forEach(list => list.forEach(w => { w.views = 0; w.hits = 0; }));\n                markDirty(); renderLists(); updateCard(); showToast(\"統計已重置\");\n            } else if (pendingAction === 'resetSettings') {\n                settings = { autoDelay: 4, repeatDelay: 3, masteryThreshold: 2, masteryViewLimit: 1, readImmediately: false };\n                openSettingsModal(); markDirty(); showToast(\"設定已還原\");\n            } else if (pendingAction === 'clearAudio') {\n                let count = 0; [words, reviewWords, masteredWords].forEach(list => list.forEach(w => { if(w.audioBlob) { w.audioBlob = null; count++; } }));\n                markDirty(); renderLists(); updateCard(); showToast(`已清除 ${count} 個錄音`);\n            } else if (pendingAction === 'clearAll') {\n                words = []; reviewWords = []; masteredWords = [];\n                settings = { autoDelay: 4, repeatDelay: 3, masteryThreshold: 2, masteryViewLimit: 1, readImmediately: false };\n                // 只清閃卡自身資料，唔好 clear 成個 localStorage（避免洗走字詞表等其他進度）\n                try {\n                    localStorage.removeItem('flashcard_profiles');\n                    localStorage.removeItem('flashcard_current_profile');\n                } catch (e) {}\n                if(db) {\n                    const transaction = db.transaction(['data'], 'readwrite');\n                    const store = transaction.objectStore('data');\n                    store.clear();\n                }\n                setTimeout(() => { window.location.reload(); }, 1000);\n                showToast(\"已清空閃卡資料，正在重啟...\");\n            }\n            closeModal('confirmModal'); pendingAction = null;\n        };\n\n        function openEditModal() {\n            const text = `【詞語表】\\n${words.map(w=>w.text).join('\\n')}\\n\\n【還要練】\\n${reviewWords.map(w=>w.text).join('\\n')}\\n\\n【已學識】\\n${masteredWords.map(w=>w.text).join('\\n')}`;\n            document.getElementById('importTextarea').value = text;\n            document.getElementById('importModal').style.display = 'flex';\n        }\n\n        function selectAllImportText() { document.getElementById('importTextarea').select(); showToast(\"已全選，請直接貼上\"); }\n\n        function saveEdit() {\n            const raw = document.getElementById('importTextarea').value;\n            if (!raw.trim()) { closeModal('importModal'); return; }\n            let currentSection = 'words';\n            const newWords = [], newReview = [], newMastered = [];\n            raw.split('\\n').forEach(line => {\n                line = line.trim(); if (!line) return;\n                if (line.includes('【詞語表】')) { currentSection = 'words'; return; }\n                if (line.includes('【還要練】')) { currentSection = 'review'; return; }\n                if (line.includes('【已學識】')) { currentSection = 'mastered'; return; }\n                line.split(/[,，]+/).map(w => w.trim()).filter(w => w).forEach(w => {\n                    const obj = { text: w, views: 0, hits: 0, audioBlob: null, roundId: 0 };\n                    if (currentSection === 'words') newWords.push(obj);\n                    else if (currentSection === 'review') newReview.push(obj);\n                    else newMastered.push(obj);\n                });\n            });\n            words = newWords; reviewWords = newReview; masteredWords = newMastered;\n            currentRoundId = 1; currentIndex = 0;\n            markDirty(); renderLists(); updateCard();\n            closeModal('importModal'); showToast(\"已更新列表\");\n        }\n\n        function exportData() {\n            const text = `【詞語表】\\n${words.map(w=>w.text).join('\\n')}\\n\\n【還要練】\\n${reviewWords.map(w=>w.text).join('\\n')}\\n\\n【已學識】\\n${masteredWords.map(w=>w.text).join('\\n')}`;\n            navigator.clipboard.writeText(text).then(() => showToast(\"已複製文字！\")).catch(() => showToast(\"複製失敗\"));\n        }\n\n        function closeModal(id) { document.getElementById(id).style.display = 'none'; }\n        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 2500); }\n\n        function triggerConfetti(originX, originY, intensity) {\n            const canvas = document.getElementById('confetti-canvas'); const ctx = canvas.getContext('2d');\n            canvas.width = window.innerWidth; canvas.height = window.innerHeight;\n            let particles = []; const colors = ['#f44336', '#2196f3', '#ffeb3b', '#4caf50', '#9c27b0', '#ff9800'];\n            for (let i = 0; i < Math.floor(150 * intensity); i++) {\n                const isBurst = originX != null;\n                particles.push({\n                    x: isBurst ? originX : Math.random() * canvas.width, y: isBurst ? originY : Math.random() * canvas.height - canvas.height,\n                    w: Math.random() * 10 + 5, h: Math.random() * 5 + 5, color: colors[Math.floor(Math.random() * colors.length)],\n                    vy: isBurst ? (Math.random() * -15 - 5) : (Math.random() * 3 + 2), vx: isBurst ? (Math.random() * 10 - 5) : (Math.random() * 2 - 1),\n                    gravity: isBurst ? 0.5 : 0, r: Math.random() * 360, vr: Math.random() * 10 - 5\n                });\n            }\n            function animate() {\n                ctx.clearRect(0, 0, canvas.width, canvas.height); let active = false;\n                particles.forEach(p => {\n                    p.vy += p.gravity; p.y += p.vy; p.x += p.vx; p.r += p.vr;\n                    if (p.y < canvas.height) {\n                        active = true; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r * Math.PI / 180);\n                        ctx.fillStyle = p.color; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();\n                    }\n                });\n                if (active) requestAnimationFrame(animate);\n            }\n            animate();\n        }\n\n        window.onload = init;\n    <\/script>\n</body>\n</html>\n",
    "zh-lexlist": "<!DOCTYPE html>\n<html lang=\"zh-HK\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<title>中文 · 低小詞語</title>\n<style>\n:root { --bg:#f0f7f4; --ink:#1f2937; --card:#fff; --accent:#0f766e; --accent2:#115e59; --muted:#6b7280; --line:#d1fae5; --hl:#c2410c; --off:#b45309; }\n* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }\nhtml,body { margin:0; padding:0; height:100%; }\nbody { font-family:\"PingFang HK\",\"Microsoft JhengHei\",\"Noto Sans TC\",sans-serif; color:var(--ink);\n  background:radial-gradient(ellipse at top left,#d1fae5 0%,transparent 45%),linear-gradient(180deg,var(--bg),#f8fafc); }\n.app { height:100%; display:grid; grid-template-rows:auto auto 1fr; max-width:1100px; margin:0 auto; }\n.header { padding:14px 16px 6px; }\n.header h1 { margin:0; font-size:1.3rem; color:var(--accent2); }\n.header p { margin:6px 0 0; color:var(--muted); font-size:.84rem; line-height:1.45; }\n.toolbar { padding:8px 16px 10px; display:flex; flex-direction:column; gap:8px; }\n.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }\n.band-btn, .tool-btn { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:.86rem; }\n.band-btn.active, .tool-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }\n.tool-btn.off-mode.active { background:var(--off); border-color:var(--off); }\nselect,input[type=\"search\"] { border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:#fff; }\ninput[type=\"search\"] { flex:1; min-width:140px; }\n.count { color:var(--muted); font-size:.82rem; margin-left:auto; }\n.list { overflow:auto; padding:0 16px 24px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; align-content:start; }\n.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; box-shadow:0 8px 20px rgba(15,118,110,.06); min-width:0; }\n.card.off { border-color:#fde68a; background:#fffbeb; }\n.title-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; min-width:0; }\n.word { font-size:1.55rem; font-weight:900; cursor:pointer; font-family:\"Kaiti TC\",\"STKaiti\",\"Noto Serif HK\",serif; flex:1; min-width:0; line-height:1.2; }\n.meta { flex-shrink:0; background:#ecfdf5; color:#065f46; border-radius:999px; padding:2px 8px; font-size:.68rem; font-weight:700; white-space:nowrap; }\n.done-box { flex-shrink:0; width:1.15rem; height:1.15rem; accent-color:var(--accent); cursor:pointer; }\n.block { border-radius:10px; padding:8px 10px; margin-top:4px; cursor:pointer; border:1px dashed transparent; user-select:none; }\n.block:hover { background:#f0fdfa; }\n.block.hidden-text { background:#f8fafc; border-color:#e5e7eb; }\n.block.hidden-text .text { color:var(--muted); font-size:.84rem; }\n.block .text { font-size:.92rem; line-height:1.55; }\n.block.ex { border-top:1px dashed #d1d5db; margin-top:6px; padding-top:10px; border-radius:0 0 10px 10px; }\n.block.ex.hidden-text { border-top:1px dashed #d1d5db; }\n.hl { color:var(--hl); font-weight:800; }\n.empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:40px 10px; }\n.more { grid-column:1/-1; justify-self:center; }\n@media (max-width:900px) { .list { grid-template-columns:repeat(2,minmax(0,1fr)); } }\n@media (max-width:560px) {\n  .list { grid-template-columns:1fr; }\n  .word { font-size:1.35rem; }\n  .meta { font-size:.62rem; max-width:42%; overflow:hidden; text-overflow:ellipsis; }\n}\n</style>\n</head>\n<body>\n<div class=\"app\">\n  <div class=\"header\">\n    <h1>中文 · 低小詞語</h1>\n    <p>詞語一直顯示。解釋／例句預設隱藏：點一下顯示 → 再點朗讀 → 再點隱藏。右邊剔選＝已學識（移去「已學識」）。</p>\n  </div>\n  <div class=\"toolbar\">\n    <div class=\"row\" id=\"band-row\"></div>\n    <div class=\"row\">\n      <button type=\"button\" class=\"tool-btn active\" id=\"view-learn\" data-view=\"learn\">學習中</button>\n      <button type=\"button\" class=\"tool-btn off-mode\" id=\"view-off\" data-view=\"off\">已學識</button>\n      <button type=\"button\" class=\"tool-btn\" id=\"toggle-meanings\">全部解釋：顯示</button>\n      <button type=\"button\" class=\"tool-btn\" id=\"toggle-examples\">全部例子：顯示</button>\n    </div>\n    <div class=\"row\">\n      <select id=\"cat-select\"></select>\n      <input id=\"q\" type=\"search\" placeholder=\"搜尋詞語…\" />\n      <span class=\"count\" id=\"count\"></span>\n    </div>\n  </div>\n  <div class=\"list\" id=\"list\"></div>\n</div>\n<script>\nconst DATA = {\"bands\":[{\"id\":\"lowpri\",\"title\":\"低小詞語\",\"note\":\"常用低小詞語共 337 個 · 低班用字解釋與例句 · 含交通／食物等擴充\",\"count\":337,\"words\":[{\"w\":\"他們\",\"cat\":\"人物稱呼\",\"m\":\"指自己以外的兩個人或以上（別人那一群）。\",\"e\":\"下課後，他們在操場上跑步比賽。\"},{\"w\":\"你們\",\"cat\":\"人物稱呼\",\"m\":\"指正在聽我說話的兩個人或以上。\",\"e\":\"老師溫柔地說：「你們要安靜坐好。」\"},{\"w\":\"叔叔\",\"cat\":\"人物稱呼\",\"m\":\"爸爸的弟弟；也可以禮貌地稱呼年紀較大的男士。\",\"e\":\"生日那天，叔叔送了我一輛玩具車。\"},{\"w\":\"同學\",\"cat\":\"人物稱呼\",\"m\":\"和自己一起上課、一起讀書的小朋友。\",\"e\":\"小明是我的同學，我們常常一起做功課。\"},{\"w\":\"哥哥\",\"cat\":\"人物稱呼\",\"m\":\"比自己年紀大的男孩子，通常指家裏的男兄長。\",\"e\":\"哥哥耐心地教我綁鞋帶。\"},{\"w\":\"奶奶\",\"cat\":\"人物稱呼\",\"m\":\"爸爸的媽媽，也就是自己的祖母。\",\"e\":\"奶奶坐在牀邊，給我講從前的故事。\"},{\"w\":\"妹妹\",\"cat\":\"人物稱呼\",\"m\":\"比自己年紀小的女孩子，通常指家裏的小妹妹。\",\"e\":\"妹妹抱着洋娃娃，坐在沙發上。\"},{\"w\":\"姐姐\",\"cat\":\"人物稱呼\",\"m\":\"比自己年紀大的女孩子，通常指家裏的女兄長。\",\"e\":\"姐姐幫我梳頭髮，還替我紮辮子。\"},{\"w\":\"媽媽\",\"cat\":\"人物稱呼\",\"m\":\"生養自己、照顧自己的女性長輩，也就是母親。\",\"e\":\"媽媽在廚房煮飯，香氣飄到客廳。\"},{\"w\":\"小朋友\",\"cat\":\"人物稱呼\",\"m\":\"年紀還小的孩子，常用來稱呼兒童。\",\"e\":\"公園的滑梯旁，有很多小朋友在排隊。\"},{\"w\":\"弟弟\",\"cat\":\"人物稱呼\",\"m\":\"比自己年紀小的男孩子，通常指家裏的小弟弟。\",\"e\":\"弟弟還不會走路，常常在地上爬。\"},{\"w\":\"我們\",\"cat\":\"人物稱呼\",\"m\":\"指包括自己在內的一群人。\",\"e\":\"放學後，我們一起步行去圖書館。\"},{\"w\":\"朋友\",\"cat\":\"人物稱呼\",\"m\":\"常常一起玩、互相幫忙、互相關心的人。\",\"e\":\"下雨天，我和朋友在家中一起畫畫。\"},{\"w\":\"校長\",\"cat\":\"人物稱呼\",\"m\":\"負責管理整間學校的人，是學校裏最高負責人。\",\"e\":\"早上在校門，校長笑着跟我們打招呼。\"},{\"w\":\"爸爸\",\"cat\":\"人物稱呼\",\"m\":\"生養自己、照顧自己的男性長輩，也就是父親。\",\"e\":\"爸爸每天早上送我去學校。\"},{\"w\":\"爺爺\",\"cat\":\"人物稱呼\",\"m\":\"爸爸的爸爸，也就是自己的祖父。\",\"e\":\"爺爺吃完早餐，到公園慢慢散步。\"},{\"w\":\"老師\",\"cat\":\"人物稱呼\",\"m\":\"在學校裏教我們讀書、寫字和做人道理的人。\",\"e\":\"老師一步一步教我們寫生字。\"},{\"w\":\"警察\",\"cat\":\"人物稱呼\",\"m\":\"維持秩序、保護市民安全、幫助有需要的人。\",\"e\":\"警察叔叔幫助迷路的小朋友找到媽媽。\"},{\"w\":\"醫生\",\"cat\":\"人物稱呼\",\"m\":\"在醫院或診所替病人檢查身體、治病的人。\",\"e\":\"醫生叫我張開嘴巴，看看喉嚨紅不紅。\"},{\"w\":\"阿姨\",\"cat\":\"人物稱呼\",\"m\":\"媽媽的姐妹；也可以禮貌地稱呼年紀較大的女士。\",\"e\":\"星期天，阿姨帶我去公園放風箏。\"},{\"w\":\"公園\",\"cat\":\"地方家居\",\"m\":\"給大家散步、玩耍、放風箏的公共地方，通常有草地和遊樂設施。\",\"e\":\"星期天早上，我們全家去公園放風箏。\"},{\"w\":\"圖書館\",\"cat\":\"地方家居\",\"m\":\"收藏很多書、可以安靜看書和借書回家的地方。\",\"e\":\"我在圖書館借了一本有趣的故事書。\"},{\"w\":\"學校\",\"cat\":\"地方家居\",\"m\":\"小朋友每天去上課、學習知識的地方。\",\"e\":\"我每天早上大約八時到達學校。\"},{\"w\":\"客廳\",\"cat\":\"地方家居\",\"m\":\"家裏給大家坐着聊天、看電視、接待客人的房間。\",\"e\":\"晚飯後，我們坐在客廳一起看電視。\"},{\"w\":\"家\",\"cat\":\"地方家居\",\"m\":\"和家人一起住、讓人感到安心的地方。\",\"e\":\"放學後，我立刻回家做功課。\"},{\"w\":\"家中\",\"cat\":\"地方家居\",\"m\":\"指自己住的家裏，不是外面。\",\"e\":\"下雨天出不去，我就留在家中安靜看書。\"},{\"w\":\"市場\",\"cat\":\"地方家居\",\"m\":\"主要賣新鮮蔬菜、肉類和魚的地方，通常一大早就營業。\",\"e\":\"奶奶清早去市場，買回青菜和魚。\"},{\"w\":\"廚房\",\"cat\":\"地方家居\",\"m\":\"家裏專門煮飯、炒菜、洗菜的地方。\",\"e\":\"媽媽在廚房切菜，叫我不要亂跑。\"},{\"w\":\"書房\",\"cat\":\"地方家居\",\"m\":\"家裏用來讀書、寫字或工作的房間。\",\"e\":\"爸爸在書房用電腦工作，我們輕輕走路。\"},{\"w\":\"沙發\",\"cat\":\"地方家居\",\"m\":\"客廳裏柔軟、可以坐或靠的長椅子。\",\"e\":\"爺爺戴着眼鏡，坐在沙發上看報紙。\"},{\"w\":\"洗手間\",\"cat\":\"地方家居\",\"m\":\"家裏洗手、刷牙、洗澡和上廁所的地方。\",\"e\":\"吃飯以前，一定要先去洗手間洗手。\"},{\"w\":\"牀單\",\"cat\":\"地方家居\",\"m\":\"鋪在牀墊上面、貼着身體睡的那層布。\",\"e\":\"媽媽把乾淨的牀單換好，牀變得很清爽。\"},{\"w\":\"睡房\",\"cat\":\"地方家居\",\"m\":\"家裏專門用來睡覺休息的房間。\",\"e\":\"弟弟洗完澡，就回睡房睡覺了。\"},{\"w\":\"窗戶\",\"cat\":\"地方家居\",\"m\":\"牆上可以打開或關上的窗，用來透光、透氣和看出去。\",\"e\":\"天氣熱了，媽媽把窗戶打開透氣。\"},{\"w\":\"街\",\"cat\":\"地方家居\",\"m\":\"兩旁常有店舖的道路，人們在街上走路和逛街。\",\"e\":\"這條街上有很多蛋糕店，香氣撲鼻。\"},{\"w\":\"課室\",\"cat\":\"地方家居\",\"m\":\"學校裏同學坐在一起聽老師上課的房間。\",\"e\":\"上課鈴一響，大家立刻走進課室坐好。\"},{\"w\":\"超市\",\"cat\":\"地方家居\",\"m\":\"賣日常用品、零食和食物的大型商店，可以推着購物車選購。\",\"e\":\"媽媽帶我去超市，買了一盒牛奶和麵包。\"},{\"w\":\"醫院\",\"cat\":\"地方家居\",\"m\":\"生病或受傷時，去找醫生檢查和治療的地方。\",\"e\":\"弟弟發燒了，媽媽立刻帶他去醫院。\"},{\"w\":\"馬路\",\"cat\":\"地方家居\",\"m\":\"給汽車、巴士行駛的寬闊道路；過馬路要特別小心。\",\"e\":\"過馬路前，要先左右看清楚，再跟着大人走。\"},{\"w\":\"上課\",\"cat\":\"學校生活\",\"m\":\"鈴響以後開始學習，跟着老師聽課和練習。\",\"e\":\"鈴響了，我們安靜坐好，準備上課。\"},{\"w\":\"下課\",\"cat\":\"學校生活\",\"m\":\"這一節課已經完結，可以休息或換下一節。\",\"e\":\"下課後，大家先去洗手間，再回課室。\"},{\"w\":\"做功課\",\"cat\":\"學校生活\",\"m\":\"完成老師安排的習作或練習，把學過的內容再練一次。\",\"e\":\"放學後，我先做功課，做完才可以玩。\"},{\"w\":\"功課\",\"cat\":\"學校生活\",\"m\":\"老師給我們在課後完成的習作或練習。\",\"e\":\"今天的功課只有兩頁，不算太多。\"},{\"w\":\"回答\",\"cat\":\"學校生活\",\"m\":\"別人問問題時，說出自己的答案或想法。\",\"e\":\"老師提問時，我先舉手，再清楚地回答。\"},{\"w\":\"安排\",\"cat\":\"學校生活\",\"m\":\"事先想好步驟和時間，決定怎樣做一件事。\",\"e\":\"老師安排我們分成小組，討論這個故事。\"},{\"w\":\"排隊\",\"cat\":\"學校生活\",\"m\":\"一個跟着一個站好或坐好，排成直線輪流做事。\",\"e\":\"買午餐時，大家要安靜排隊，不可推撞。\"},{\"w\":\"放學後\",\"cat\":\"學校生活\",\"m\":\"學校下課、離開學校之後的那段時間。\",\"e\":\"放學後，媽媽在校門外等着接我。\"},{\"w\":\"書包\",\"cat\":\"學校生活\",\"m\":\"用來裝書本、鉛筆盒和用具、背在肩上的袋子。\",\"e\":\"他把書包掛在椅背上，然後坐下上課。\"},{\"w\":\"書本\",\"cat\":\"學校生活\",\"m\":\"用來學習的書，裏面有課文、練習或故事。\",\"e\":\"課桌上整齊地放着幾本書本和鉛筆盒。\"},{\"w\":\"橡皮\",\"cat\":\"學校生活\",\"m\":\"用來擦掉鉛筆字跡的小用具。\",\"e\":\"寫錯了一個字，就用橡皮擦掉再重寫。\"},{\"w\":\"為甚麼\",\"cat\":\"學校生活\",\"m\":\"用來問原因的詞，想知道事情發生的理由。\",\"e\":\"媽媽問：「你為甚麼今天遲到了？」\"},{\"w\":\"用功\",\"cat\":\"學校生活\",\"m\":\"學習時很認真、肯花時間練習，不馬虎。\",\"e\":\"他每天用功溫習，考試進步了很多。\"},{\"w\":\"考試\",\"cat\":\"學校生活\",\"m\":\"用試卷或測驗，檢查大家學過的知識記得多少。\",\"e\":\"明天有中文考試，今晚我要認真溫習。\"},{\"w\":\"舉手\",\"cat\":\"學校生活\",\"m\":\"把手舉高，表示想發言、想回答或需要幫忙。\",\"e\":\"想發言時先舉手，等老師叫到你再說話。\"},{\"w\":\"鉛筆\",\"cat\":\"學校生活\",\"m\":\"用木頭包着筆芯、專門用來寫字和畫畫的筆，寫錯可以擦掉。\",\"e\":\"寫生字時，我用鉛筆一筆一畫慢慢寫。\"},{\"w\":\"一齊\",\"cat\":\"時間次序\",\"m\":\"大家在同一時間一起做同一件事。\",\"e\":\"老師一揮手，我們一齊拍手唱歌。\"},{\"w\":\"下午\",\"cat\":\"時間次序\",\"m\":\"中午過後到傍晚之前的那段時間。\",\"e\":\"下午我們有體育課，要帶運動鞋回校。\"},{\"w\":\"中午\",\"cat\":\"時間次序\",\"m\":\"一天中間的時候，大約是吃午飯的那段時間。\",\"e\":\"中午十二時，我們在學校飯堂吃飯。\"},{\"w\":\"今天\",\"cat\":\"時間次序\",\"m\":\"說話時所在的這一天，不是昨天也不是明天。\",\"e\":\"今天天氣很好，我們可以到公園散步。\"},{\"w\":\"冬天\",\"cat\":\"時間次序\",\"m\":\"一年裏天氣最冷、有時要穿厚衣服的季節。\",\"e\":\"冬天很冷，出門要穿厚外套和手套。\"},{\"w\":\"夏天\",\"cat\":\"時間次序\",\"m\":\"一年裏天氣最熱、白天很長的季節。\",\"e\":\"夏天很熱，我最喜歡吃雪糕降溫。\"},{\"w\":\"天天\",\"cat\":\"時間次序\",\"m\":\"每一天都這樣做，沒有間斷。\",\"e\":\"他天天練習彈琴，所以進步很快。\"},{\"w\":\"早上\",\"cat\":\"時間次序\",\"m\":\"一天剛開始不久的時候，通常指起床到中午之前。\",\"e\":\"我早上七時起床，刷牙洗臉後吃早餐。\"},{\"w\":\"明天\",\"cat\":\"時間次序\",\"m\":\"今天過後的下一天。\",\"e\":\"明天學校組織旅行，我今晚先收拾背包。\"},{\"w\":\"星期天\",\"cat\":\"時間次序\",\"m\":\"一星期裏通常不用上課、可以休息的日子。\",\"e\":\"星期天我們不用上學，全家一起去公園。\"},{\"w\":\"春天\",\"cat\":\"時間次序\",\"m\":\"一年裏天氣轉暖、花草重新生長的季節。\",\"e\":\"春天來了，樹上長出嫩綠的新葉。\"},{\"w\":\"昨天\",\"cat\":\"時間次序\",\"m\":\"今天之前的那一天，已經過去了。\",\"e\":\"昨天我學會騎單車，差點摔倒又站起來。\"},{\"w\":\"晚上\",\"cat\":\"時間次序\",\"m\":\"天色變暗以後的時間，通常在回家之後。\",\"e\":\"晚上吃過飯，我跟爸爸一起讀故事書。\"},{\"w\":\"漸漸\",\"cat\":\"時間次序\",\"m\":\"不是忽然改變，而是一點一點、慢慢地變化。\",\"e\":\"太陽下山後，天色漸漸暗下來。\"},{\"w\":\"現在\",\"cat\":\"時間次序\",\"m\":\"說話的這一刻，指眼前正在發生的時間。\",\"e\":\"現在是閱讀時間，請大家打開故事書。\"},{\"w\":\"秋天\",\"cat\":\"時間次序\",\"m\":\"天氣漸漸轉涼、樹葉變黃掉落的季節。\",\"e\":\"秋天風爽，最適合一家人去郊遊。\"},{\"w\":\"立刻\",\"cat\":\"時間次序\",\"m\":\"一點也不拖延，聽到或看到就馬上行動。\",\"e\":\"聽到有人呼叫，他立刻跑過去幫忙。\"},{\"w\":\"終於\",\"cat\":\"時間次序\",\"m\":\"等了很久、試了很多次之後，最後做到了。\",\"e\":\"練習了很多次，我終於學會騎單車了。\"},{\"w\":\"連忙\",\"cat\":\"時間次序\",\"m\":\"事情忽然發生時，趕緊、趕快去做。\",\"e\":\"水杯倒了，他連忙用布把水抹乾。\"},{\"w\":\"除夕\",\"cat\":\"時間次序\",\"m\":\"過年前最後一晚，家人常一起吃團年飯。\",\"e\":\"除夕夜，全家圍坐一桌，一起吃晚飯。\"},{\"w\":\"馬上\",\"cat\":\"時間次序\",\"m\":\"很快就會發生或立刻去做，不用再等很久。\",\"e\":\"上課鈴響了，同學們馬上走進課室坐好。\"},{\"w\":\"一面\",\"cat\":\"動作行為\",\"m\":\"表示同一時間做兩件事：一邊做這件，一邊做另一件。\",\"e\":\"他一面慢慢走路，一面吃着手裏的蘋果。\"},{\"w\":\"吃飯\",\"cat\":\"動作行為\",\"m\":\"把一日三餐的飯菜吃進肚子，補充體力。\",\"e\":\"到了中午，我們一家人坐下來一起吃飯。\"},{\"w\":\"哭\",\"cat\":\"動作行為\",\"m\":\"難過、痛或害怕時，眼睛流淚，有時會出聲。\",\"e\":\"小弟弟跌倒擦傷膝蓋，坐在地上哭了起來。\"},{\"w\":\"喝水\",\"cat\":\"動作行為\",\"m\":\"把水喝進嘴裏再吞下去，補充身體需要的水分。\",\"e\":\"運動出汗以後，要多喝水，不要只喝汽水。\"},{\"w\":\"坐\",\"cat\":\"動作行為\",\"m\":\"把臀部放在椅子、凳子或地上，身體不用站着。\",\"e\":\"上課鈴響了，大家立刻回座位坐好。\"},{\"w\":\"寫\",\"cat\":\"動作行為\",\"m\":\"用手握筆，在紙上寫出文字或畫出筆畫。\",\"e\":\"我坐端正，認真寫生字，每一筆都寫清楚。\"},{\"w\":\"希望\",\"cat\":\"動作行為\",\"m\":\"心裏很想某件事會發生，或想得到某個結果。\",\"e\":\"看着陰天，我希望明天會出太陽。\"},{\"w\":\"幫忙\",\"cat\":\"動作行為\",\"m\":\"伸出援手，替別人做一部分事情，令對方輕鬆一點。\",\"e\":\"我幫忙媽媽抹桌子，還把椅子排整齊。\"},{\"w\":\"張開\",\"cat\":\"動作行為\",\"m\":\"把合着的東西打開或伸開，例如嘴巴、翅膀、雙手。\",\"e\":\"小鳥張開翅膀，從樹枝上飛了起來。\"},{\"w\":\"打掃\",\"cat\":\"動作行為\",\"m\":\"把房間或地方的灰塵、垃圾清理乾淨，令環境整潔。\",\"e\":\"大掃除那天，全家一起打掃客廳和睡房。\"},{\"w\":\"抓住\",\"cat\":\"動作行為\",\"m\":\"用手用力握緊，不讓東西或人滑走、掉下。\",\"e\":\"他及時抓住欄杆，才沒有從樓梯上摔倒。\"},{\"w\":\"抺窗\",\"cat\":\"動作行為\",\"m\":\"用濕布或清潔工具，把窗戶玻璃擦得乾淨明亮。\",\"e\":\"姐姐站在椅子上小心抺窗，把灰塵擦走。\"},{\"w\":\"掃地\",\"cat\":\"動作行為\",\"m\":\"用掃把把地上的灰塵、紙屑掃走，令地方乾淨。\",\"e\":\"吃完早餐，我幫忙掃地，把廚房地板掃乾淨。\"},{\"w\":\"收拾\",\"cat\":\"動作行為\",\"m\":\"把用過或弄亂的東西放回原位，整理得整齊。\",\"e\":\"玩完玩具以後，要把積木和車子收拾好。\"},{\"w\":\"放開\",\"cat\":\"動作行為\",\"m\":\"把手鬆開，不再握住，讓東西或人離開。\",\"e\":\"他輕輕放開手，小鳥便拍翼飛走了。\"},{\"w\":\"洗手\",\"cat\":\"動作行為\",\"m\":\"用水和肥皂把雙手洗乾淨，洗走細菌和髒東西。\",\"e\":\"吃飯以前一定要洗手，才不會吃進細菌。\"},{\"w\":\"洗澡\",\"cat\":\"動作行為\",\"m\":\"用水把全身沖洗乾淨，洗走汗味和髒東西。\",\"e\":\"睡覺以前，我先洗澡，再換上乾淨睡衣。\"},{\"w\":\"洗碗\",\"cat\":\"動作行為\",\"m\":\"用水和清潔劑，把吃過飯的碗碟洗乾淨。\",\"e\":\"晚飯後，哥哥自願洗碗，把碗碟抹乾放好。\"},{\"w\":\"洗衣服\",\"cat\":\"動作行為\",\"m\":\"用水把穿過的衣服洗乾淨，再晾乾或烘干。\",\"e\":\"媽媽在洗手間洗衣服，把髒衣服洗得乾乾淨淨。\"},{\"w\":\"燃燒\",\"cat\":\"動作行為\",\"m\":\"東西着了火，發出光和熱，慢慢燒起來。\",\"e\":\"營火晚會上，木柴在火堆裏靜靜燃燒。\"},{\"w\":\"玩\",\"cat\":\"動作行為\",\"m\":\"做遊戲或做開心的活動，讓自己快樂放鬆。\",\"e\":\"下課鈴響後，我們一起到操場玩捉迷藏。\"},{\"w\":\"看\",\"cat\":\"動作行為\",\"m\":\"用眼睛注意某樣東西，去觀察或閱讀。\",\"e\":\"晚飯後，我安靜地坐着看故事書。\"},{\"w\":\"看報紙\",\"cat\":\"動作行為\",\"m\":\"閱讀報紙上的新聞和文章，了解外面發生的事。\",\"e\":\"爺爺戴着老花眼鏡，坐在沙發上慢慢看報紙。\"},{\"w\":\"睡覺\",\"cat\":\"動作行為\",\"m\":\"閉上眼睛，身體放鬆休息，讓大腦和身體恢復精神。\",\"e\":\"小朋友晚上要早點睡覺，第二天才有精神上課。\"},{\"w\":\"祝福\",\"cat\":\"動作行為\",\"m\":\"對別人說出美好的願望，希望對方順利、開心。\",\"e\":\"婚禮上，大家祝福新郎新娘永遠開心。\"},{\"w\":\"站\",\"cat\":\"動作行為\",\"m\":\"雙腳踏穩地面，身體直立，沒有坐下。\",\"e\":\"巴士到站開門，車廂裏的乘客站起來準備下車。\"},{\"w\":\"笑\",\"cat\":\"動作行為\",\"m\":\"開心或覺得有趣時，臉上露出笑容，有時會發出聲音。\",\"e\":\"聽到好笑的笑話，大家都笑得合不攏嘴。\"},{\"w\":\"聽\",\"cat\":\"動作行為\",\"m\":\"用耳朵接收聲音，去明白別人說甚麼或欣賞音樂。\",\"e\":\"上課時要安靜聽老師說話，不要嘈吵。\"},{\"w\":\"聽音樂\",\"cat\":\"動作行為\",\"m\":\"用耳朵欣賞歌曲或樂曲，讓自己放鬆或開心。\",\"e\":\"做完功課，我喜歡聽音樂休息一會兒。\"},{\"w\":\"說\",\"cat\":\"動作行為\",\"m\":\"用嘴巴講出話語，把想法告訴別人。\",\"e\":\"他笑着說今天很高興，因為考到好成績。\"},{\"w\":\"讀\",\"cat\":\"動作行為\",\"m\":\"看着文字，用嘴巴唸出來，或用心去明白意思。\",\"e\":\"媽媽指着課文，慢慢教我讀每一句。\"},{\"w\":\"變化\",\"cat\":\"動作行為\",\"m\":\"變得和原來不一樣，樣子、天氣或情況有了不同。\",\"e\":\"天氣忽然有變化，剛才還出太陽，現在却下起雨來。\"},{\"w\":\"走\",\"cat\":\"動作行為\",\"m\":\"用雙腳一步一步移動，速度比跑慢、較平穩。\",\"e\":\"天橋修好了，我們可以慢慢走回家。\"},{\"w\":\"走進\",\"cat\":\"動作行為\",\"m\":\"用腳步行，從外面進入某個地方裏面。\",\"e\":\"客人輕輕敲過門，然後走進客廳坐下。\"},{\"w\":\"跑\",\"cat\":\"動作行為\",\"m\":\"雙腳很快地交換踏地向前移動，比走路快得多。\",\"e\":\"體育課時，他在操場上跑得又快又穩。\"},{\"w\":\"跟着\",\"cat\":\"動作行為\",\"m\":\"跟在別人或別的東西後面，一起走或照着做。\",\"e\":\"小鴨排成一隊，跟着鴨媽媽小心過馬路。\"},{\"w\":\"跳\",\"cat\":\"動作行為\",\"m\":\"雙腳用力蹬地，讓身體暫時離地向上或向前。\",\"e\":\"下課後，小朋友在操場喜歡跳繩和跳飛機。\"},{\"w\":\"送給\",\"cat\":\"動作行為\",\"m\":\"把東西交到別人手裏，讓對方收下，表示心意。\",\"e\":\"我畫了一張心意卡，送給老師謝謝她。\"},{\"w\":\"遊玩\",\"cat\":\"動作行為\",\"m\":\"到某個地方輕鬆地玩樂、逛逛或欣賞風景，比「玩」更常指外出活動。\",\"e\":\"週末天氣好，我們全家到海邊遊玩，撿貝殼和踏浪。\"},{\"w\":\"郊遊\",\"cat\":\"動作行為\",\"m\":\"離開市區，到郊外或郊外公園去活動、玩耍和看看風景。\",\"e\":\"秋天風爽，學校帶我們去郊外郊遊，沿途拍照留念。\"},{\"w\":\"長滿\",\"cat\":\"動作行為\",\"m\":\"植物或東西生長得很多，幾乎佔滿整個地方。\",\"e\":\"春天一到，樹上長滿了嫩綠的新葉。\"},{\"w\":\"鼓起\",\"cat\":\"動作行為\",\"m\":\"鼓着勇氣、打起精神，強迫自己勇敢去做。\",\"e\":\"雖然有點緊張，他仍鼓起勇氣走上講台。\"},{\"w\":\"嘴巴\",\"cat\":\"身體部位\",\"m\":\"臉上用來吃東西、喝水和說話的部分。\",\"e\":\"看醫生時，醫生叫我張開嘴巴檢查喉嚨。\"},{\"w\":\"尾\",\"cat\":\"身體部位\",\"m\":\"動物身體最後面、可以搖擺的那一段。\",\"e\":\"小狗一見主人回家，就高興得不停搖尾。\"},{\"w\":\"手\",\"cat\":\"身體部位\",\"m\":\"手臂前端有手指的部分，用來拿東西、寫字和做事。\",\"e\":\"想發言時，請安靜舉起你的手。\"},{\"w\":\"眼睛\",\"cat\":\"身體部位\",\"m\":\"臉上用來看見顏色、形狀和光線的器官。\",\"e\":\"她有一雙明亮的眼睛，看東西很清楚。\"},{\"w\":\"耳朵\",\"cat\":\"身體部位\",\"m\":\"頭兩側用來聽見聲音的器官。\",\"e\":\"我們用耳朵聽音樂，也用耳朵聽別人說話。\"},{\"w\":\"腳\",\"cat\":\"身體部位\",\"m\":\"身體最下面用來站立和走路的部分。\",\"e\":\"他在操場跑了好幾圈，腳都跑累了。\"},{\"w\":\"頭\",\"cat\":\"身體部位\",\"m\":\"身體最上面、長着眼睛嘴巴的部分；數牛豬時也可用「一頭」。\",\"e\":\"老師問他同不同意，他輕輕點點頭。\"},{\"w\":\"頭髮\",\"cat\":\"身體部位\",\"m\":\"頭皮上長出來的毛髮，有長有短、有黑有黃。\",\"e\":\"姐姐的頭髮又長又黑，綁起來很整齊。\"},{\"w\":\"鼻子\",\"cat\":\"身體部位\",\"m\":\"臉中央用來呼吸空氣和聞氣味的器官。\",\"e\":\"花很香，他湊近用鼻子輕輕聞了聞。\"},{\"w\":\"健康\",\"cat\":\"外貌性格\",\"m\":\"身體狀況良好，有力氣、少生病。\",\"e\":\"多吃蔬菜、早睡早起，有助保持身體健康。\"},{\"w\":\"兇猛\",\"cat\":\"外貌性格\",\"m\":\"性情或樣子很厲害，令人害怕，不敢隨便靠近。\",\"e\":\"動物園裏的獅子是很兇猛的動物，不要伸手逗弄。\"},{\"w\":\"勇敢\",\"cat\":\"外貌性格\",\"m\":\"面對困難或害怕的事時，仍然敢去做、敢承擔。\",\"e\":\"雖然水有點深，他仍勇敢地跳下去學游泳。\"},{\"w\":\"勤力\",\"cat\":\"外貌性格\",\"m\":\"肯花時間努力做事和讀書，不偷懶、不半途而廢。\",\"e\":\"勤力的孩子每天溫習一點，進步自然快。\"},{\"w\":\"友善\",\"cat\":\"外貌性格\",\"m\":\"對人態度友好，願意打招呼、分享和幫助別人。\",\"e\":\"新來的同學很友善，第一天就主動跟大家做朋友。\"},{\"w\":\"可怕\",\"cat\":\"外貌性格\",\"m\":\"令人感到害怕，不敢靠近或不敢再想。\",\"e\":\"半夜忽然打雷，那聲音有點可怕。\"},{\"w\":\"可愛\",\"cat\":\"外貌性格\",\"m\":\"樣子或舉動討人喜歡，令人想親近、想保護。\",\"e\":\"那隻小貓圓圓的眼睛，看起來很可愛。\"},{\"w\":\"和藹\",\"cat\":\"外貌性格\",\"m\":\"對人說話溫柔、面帶笑容，令人覺得親切不怕。\",\"e\":\"校長待人十分和藹，同學都喜歡跟他聊天。\"},{\"w\":\"善良\",\"cat\":\"外貌性格\",\"m\":\"心地好，肯關心別人、幫助有需要的人。\",\"e\":\"她是一個善良的女孩，會把座位讓給老人家。\"},{\"w\":\"好動\",\"cat\":\"外貌性格\",\"m\":\"不喜歡安靜坐着，總喜歡跑跑跳跳、動來動去。\",\"e\":\"弟弟很好動，坐下不到一分鐘又站起來。\"},{\"w\":\"孝順\",\"cat\":\"外貌性格\",\"m\":\"敬愛父母長輩，聽他們的話，願意照顧他們。\",\"e\":\"他很孝順，放學後常幫媽媽做家務。\"},{\"w\":\"安靜\",\"cat\":\"外貌性格\",\"m\":\"沒有大聲喧嘩，環境或人保持靜悄悄。\",\"e\":\"在圖書館裏要安靜，不可以大聲說話。\"},{\"w\":\"專心\",\"cat\":\"外貌性格\",\"m\":\"把精神集中在正在做的那一件事上，不被別的事分心。\",\"e\":\"上課時要專心聽講，不要玩鉛筆或望窗外。\"},{\"w\":\"小心翼翼\",\"cat\":\"外貌性格\",\"m\":\"做事時非常小心謹慎，生怕弄壞或弄錯。\",\"e\":\"他小心翼翼地捧着生日蛋糕，一步一步走進客廳。\"},{\"w\":\"年幼\",\"cat\":\"外貌性格\",\"m\":\"年紀還很小，很多事情仍需要大人照顧。\",\"e\":\"年幼的弟弟還不會自己穿衣，需要人幫忙。\"},{\"w\":\"年老\",\"cat\":\"外貌性格\",\"m\":\"年紀已經很大，走了很長的人生路。\",\"e\":\"我們要尊敬年老的長輩，過馬路時扶他們一把。\"},{\"w\":\"強壯\",\"cat\":\"外貌性格\",\"m\":\"身體結實有力，力氣大，不容易生病。\",\"e\":\"他常常做運動，身體越來越強壯。\"},{\"w\":\"愛美\",\"cat\":\"外貌性格\",\"m\":\"很在意自己的外表，喜歡打扮得整齊好看。\",\"e\":\"姐姐有點愛美，出門前一定會照一照鏡子。\"},{\"w\":\"懶惰\",\"cat\":\"外貌性格\",\"m\":\"不願意動手做事，總想偷懶、拖延。\",\"e\":\"懶惰的人不肯練習，就永遠學不會新本領。\"},{\"w\":\"敏捷\",\"cat\":\"外貌性格\",\"m\":\"動作又快又靈活，反應迅速，不拖泥帶水。\",\"e\":\"貓聽見聲響，一下子跳上櫃子，動作十分敏捷。\"},{\"w\":\"有禮貌\",\"cat\":\"外貌性格\",\"m\":\"懂得打招呼、說謝謝和對不起，對待人客氣尊重。\",\"e\":\"進門先向長輩問好，這樣做很有禮貌。\"},{\"w\":\"活潑\",\"cat\":\"外貌性格\",\"m\":\"性情開朗、愛動、充滿生氣，不怕生。\",\"e\":\"她是個活潑的小朋友，一到操場就笑着跑來跑去。\"},{\"w\":\"狡猾\",\"cat\":\"外貌性格\",\"m\":\"愛用小計謀騙人，不老實，讓人難以相信。\",\"e\":\"故事裏的狐狸十分狡猾，總想騙走別人的東西。\"},{\"w\":\"瘦小\",\"cat\":\"外貌性格\",\"m\":\"身子又瘦又小，看起來不夠高大。\",\"e\":\"那隻剛出生的小雞長得很瘦小，要細心餵養。\"},{\"w\":\"粗心大意\",\"cat\":\"外貌性格\",\"m\":\"做事不細心，容易漏看、漏寫，出錯也不察覺。\",\"e\":\"他太粗心大意，測驗卷連名字也漏寫了。\"},{\"w\":\"聰明\",\"cat\":\"外貌性格\",\"m\":\"學東西快，遇事想得通，懂得用方法解決問題。\",\"e\":\"這隻小狗很聰明，教兩次就會坐下握手。\"},{\"w\":\"肥胖\",\"cat\":\"外貌性格\",\"m\":\"身子比較圓、比較胖，皮下脂肪較多。\",\"e\":\"故事裏的小豬吃得圓滾滾，看起來有點肥胖。\"},{\"w\":\"膽小\",\"cat\":\"外貌性格\",\"m\":\"容易害怕，遇到陌生或黑暗的地方就不敢前進。\",\"e\":\"他有點膽小，晚上不敢一個人走進黑暗的房間。\"},{\"w\":\"誠實\",\"cat\":\"外貌性格\",\"m\":\"說實話、不騙人、不隱瞞過錯，讓人可以信任。\",\"e\":\"寫錯了就承認，不抄答案，才是誠實的孩子。\"},{\"w\":\"調皮\",\"cat\":\"外貌性格\",\"m\":\"愛搗蛋、愛惡作劇，不一定壞，但常惹小麻煩。\",\"e\":\"那隻調皮的小狗把襪子叼走，藏到沙發下面。\"},{\"w\":\"驕傲\",\"cat\":\"外貌性格\",\"m\":\"覺得自己很了不起，看不起別人，不肯虛心學習。\",\"e\":\"考到好成績值得開心，但也不應太驕傲。\"},{\"w\":\"高大\",\"cat\":\"外貌性格\",\"m\":\"個子又高又大，站起來很顯眼。\",\"e\":\"籃球隊的隊員長得很高大，投籃很有力。\"},{\"w\":\"傷心\",\"cat\":\"感覺心情\",\"m\":\"心裏難過、想哭，因為失去東西或遇到不如意的事。\",\"e\":\"心愛的玩具摔壞了，怎麼修也好不了，他很傷心。\"},{\"w\":\"勇氣\",\"cat\":\"感覺心情\",\"m\":\"敢於面對害怕或困難事情的那股力量。\",\"e\":\"第一次上台演講很緊張，需要鼓起勇氣。\"},{\"w\":\"害怕\",\"cat\":\"感覺心情\",\"m\":\"心裏覺得怕，想躲開，不敢面對某些事物。\",\"e\":\"他害怕獨自走夜路，所以總等爸爸一起回家。\"},{\"w\":\"快樂\",\"cat\":\"感覺心情\",\"m\":\"心裏感到滿足和喜悅，整個人輕鬆開心。\",\"e\":\"生日那天收到禮物，又有家人陪伴，我很快樂。\"},{\"w\":\"感激\",\"cat\":\"感覺心情\",\"m\":\"別人幫助或照顧自己之後，心裏真心感謝。\",\"e\":\"老師耐心地教我很多遍，我很感激她。\"},{\"w\":\"樂呵呵\",\"cat\":\"感覺心情\",\"m\":\"臉上常帶笑容，看起來整天都很快樂的樣子。\",\"e\":\"爺爺退休後每天去公園下棋，整天樂呵呵的。\"},{\"w\":\"歡快\",\"cat\":\"感覺心情\",\"m\":\"又開心又輕鬆，動作或氣氛都帶着歡樂。\",\"e\":\"音樂一響，小朋友歡快地跟着節拍跳起舞來。\"},{\"w\":\"生氣\",\"cat\":\"感覺心情\",\"m\":\"心裏不滿、覺得不公平，面上或語氣變得嚴厲。\",\"e\":\"弟弟故意弄濕地板，媽媽有點生氣，叫他立刻抹乾。\"},{\"w\":\"興奮\",\"cat\":\"感覺心情\",\"m\":\"特別高興，心裏像跳起來一樣，靜不下來。\",\"e\":\"明天一早去旅行，我興奮得晚上睡不着。\"},{\"w\":\"舒服\",\"cat\":\"感覺心情\",\"m\":\"身體或心裏感到輕鬆安穩，沒有疼痛或不自在。\",\"e\":\"洗完熱水澡，換上乾淨衣服，覺得很舒服。\"},{\"w\":\"辛苦\",\"cat\":\"感覺心情\",\"m\":\"做事很累、花很多力氣和時間，並不容易。\",\"e\":\"媽媽工作一整天回家，看起來很辛苦，我替她倒杯水。\"},{\"w\":\"開心\",\"cat\":\"感覺心情\",\"m\":\"心裏覺得歡喜愉快，想笑、想分享。\",\"e\":\"拆開禮物看見新圖書，他開心得跳起來。\"},{\"w\":\"高興\",\"cat\":\"感覺心情\",\"m\":\"遇到好事或好消息時，心裏歡喜、面上帶笑。\",\"e\":\"聽到旅行成行的好消息，大家都很高興。\"},{\"w\":\"乾淨\",\"cat\":\"事物樣子\",\"m\":\"沒有污漬、灰塵和垃圾，看起來清爽。\",\"e\":\"他把桌子擦了一遍又一遍，擦得很乾淨。\"},{\"w\":\"光明\",\"cat\":\"事物樣子\",\"m\":\"有充足的光線，明亮而不黑暗；也比喻有希望。\",\"e\":\"太陽升起，為大地帶來光明和温暖。\"},{\"w\":\"冷\",\"cat\":\"事物樣子\",\"m\":\"溫度低，摸起來冰涼，令人想添衣服。\",\"e\":\"雪糕剛拿出口袋，摸起來就很冷。\"},{\"w\":\"冷清\",\"cat\":\"事物樣子\",\"m\":\"人少、不夠熱鬧，氣氛靜悄悄，甚至有點寂寞。\",\"e\":\"放學以後的走廊空蕩蕩，感覺有點冷清。\"},{\"w\":\"動聽\",\"cat\":\"事物樣子\",\"m\":\"聲音好聽，令人想繼續聽下去。\",\"e\":\"她唱歌的聲音十分動聽，全班都安靜聆聽。\"},{\"w\":\"可口\",\"cat\":\"事物樣子\",\"m\":\"食物味道好，咬下去覺得好吃、合口味。\",\"e\":\"這碗鮮蝦雲吞湯十分可口，大家吃得津津有味。\"},{\"w\":\"堅硬\",\"cat\":\"事物樣子\",\"m\":\"質地又硬又結實，不容易弄彎、弄斷或壓扁。\",\"e\":\"河邊的石頭摸起來很堅硬，不可以用來丟來丟去。\"},{\"w\":\"多\",\"cat\":\"事物樣子\",\"m\":\"數量不少，超過「一點點」或「幾個」。\",\"e\":\"書桌上整齊地放着很多故事書。\"},{\"w\":\"大\",\"cat\":\"事物樣子\",\"m\":\"體積、面積、年紀或程度比一般更大。\",\"e\":\"爸爸買回來的這只西瓜很大，要兩隻手才抱得穩。\"},{\"w\":\"容易\",\"cat\":\"事物樣子\",\"m\":\"做起來不困難，不用花太多力氣或時間就能完成。\",\"e\":\"這道數學題目步驟清楚，其實很容易。\"},{\"w\":\"寒冷\",\"cat\":\"事物樣子\",\"m\":\"天氣冷得厲害，需要穿厚衣服才暖和。\",\"e\":\"北方的冬天非常寒冷，戶外呵氣都變成白霧。\"},{\"w\":\"小\",\"cat\":\"事物樣子\",\"m\":\"體積、面積或程度不大，比一般細。\",\"e\":\"盒子裏悄悄躺着一顆小種子，等着發芽。\"},{\"w\":\"少\",\"cat\":\"事物樣子\",\"m\":\"數量不多，只有一點點或幾個。\",\"e\":\"今天老師給的功課很少，半小時就做完了。\"},{\"w\":\"平滑\",\"cat\":\"事物樣子\",\"m\":\"表面平坦而且滑溜，沒有粗糙的凸起。\",\"e\":\"結了冰的湖面平滑得可以小心滑冰。\"},{\"w\":\"快\",\"cat\":\"事物樣子\",\"m\":\"速度高，用很短時間就能完成或到達。\",\"e\":\"他在五十米賽跑裏跑得很快，得了第一名。\"},{\"w\":\"悶熱\",\"cat\":\"事物樣子\",\"m\":\"又熱又不通風，空氣像卡住一樣，令人不舒服。\",\"e\":\"沒開窗戶也沒開風扇的課室，顯得特別悶熱。\"},{\"w\":\"慢\",\"cat\":\"事物樣子\",\"m\":\"速度低，移動或做事用不急、較費時。\",\"e\":\"烏龜雖然走得很慢，卻一步一步堅持到底。\"},{\"w\":\"整潔\",\"cat\":\"事物樣子\",\"m\":\"東西擺放整齊，同時又乾淨，看起來有條理。\",\"e\":\"她的書桌永遠很整潔，書本和文具都各有位置。\"},{\"w\":\"整齊\",\"cat\":\"事物樣子\",\"m\":\"排列有秩序、方向一致，看起來不亂。\",\"e\":\"同學們把椅子排成兩行，排得很整齊。\"},{\"w\":\"新\",\"cat\":\"事物樣子\",\"m\":\"剛得到、剛做好或剛開始用，還沒用舊。\",\"e\":\"開學第一天，我背着新書包高高興興上學。\"},{\"w\":\"新鮮\",\"cat\":\"事物樣子\",\"m\":\"剛買回來、剛摘下或剛做好，還沒變壞變舊。\",\"e\":\"市場剛送到的菜葉翠綠，摸起來很新鮮。\"},{\"w\":\"方便\",\"cat\":\"事物樣子\",\"m\":\"做起來省時省力，位置或方法都令人容易做到。\",\"e\":\"住在車站附近，每天上學都很方便。\"},{\"w\":\"明亮\",\"cat\":\"事物樣子\",\"m\":\"光線充足，室內或地方不陰暗，看得清楚。\",\"e\":\"這間課室窗子大，白天又寬敞又明亮。\"},{\"w\":\"有趣\",\"cat\":\"事物樣子\",\"m\":\"內容或事情好玩、吸引人，令人想繼續看或參與。\",\"e\":\"這本故事書情節很有趣，我一口氣讀了好幾頁。\"},{\"w\":\"清新\",\"cat\":\"事物樣子\",\"m\":\"空氣乾淨、沒有臭味或悶氣，令人吸了覺得很舒服。\",\"e\":\"一場大雨過後，打開窗，空氣特別清新。\"},{\"w\":\"清涼\",\"cat\":\"事物樣子\",\"m\":\"感覺又清爽又涼快，能消除炎熱和不適。\",\"e\":\"大熱天喝一口凍檸檬水，立刻覺得清涼很多。\"},{\"w\":\"清潔\",\"cat\":\"事物樣子\",\"m\":\"沒有灰塵、污垢和細菌，乾淨衛生。\",\"e\":\"吃飯前先洗手，保持雙手清潔，才不容易生病。\"},{\"w\":\"清香\",\"cat\":\"事物樣子\",\"m\":\"淡淡的、好聞的氣味，不濃烈但令人舒服。\",\"e\":\"走近花園，就聞到花瓣傳來的清香。\"},{\"w\":\"温暖\",\"cat\":\"事物樣子\",\"m\":\"溫度暖和舒適；也比喻待人親切，令人心裏暖。\",\"e\":\"冬天晒着太陽坐在窗邊，身子覺得很温暖。\"},{\"w\":\"漂亮\",\"cat\":\"事物樣子\",\"m\":\"外表好看，讓人看了喜歡。\",\"e\":\"姐姐今天穿了新裙子，看起來特別漂亮。\"},{\"w\":\"漆黑\",\"cat\":\"事物樣子\",\"m\":\"黑得幾乎甚麼也看不見，像被墨汁塗滿一樣。\",\"e\":\"忽然停電，整層樓變得漆黑，大家只好開手機燈。\"},{\"w\":\"潔白\",\"cat\":\"事物樣子\",\"m\":\"顏色又白又乾淨，沒有污點。\",\"e\":\"剛洗好曬乾的床單疊起來，看起來很潔白。\"},{\"w\":\"炎熱\",\"cat\":\"事物樣子\",\"m\":\"天氣熱得厲害，太陽猛、人容易出汗。\",\"e\":\"夏天中午十分炎熱，最好留在陰涼的地方。\"},{\"w\":\"烏黑\",\"cat\":\"事物樣子\",\"m\":\"顏色很深、很黑，常形容頭髮或眼睛。\",\"e\":\"她有一頭烏黑的長髮，在陽光下也亮亮的。\"},{\"w\":\"熱\",\"cat\":\"事物樣子\",\"m\":\"溫度高，摸起來燙或令人出汗。\",\"e\":\"湯還很熱，要先吹一吹，小心燙嘴。\"},{\"w\":\"爽脆\",\"cat\":\"事物樣子\",\"m\":\"咬下去會發出清脆聲音，口感爽口不軟爛。\",\"e\":\"這條剛切的青瓜吃起來很爽脆，又清新。\"},{\"w\":\"特別\",\"cat\":\"事物樣子\",\"m\":\"跟平常或其他東西不一樣；也表示格外、更加。\",\"e\":\"這件親手做的禮物對我特別重要，我會好好珍惜。\"},{\"w\":\"甜\",\"cat\":\"事物樣子\",\"m\":\"像糖或成熟水果那樣的味道，吃了覺得喜歡。\",\"e\":\"這顆橙子多汁又很甜，吃完還想再吃一瓣。\"},{\"w\":\"短\",\"cat\":\"事物樣子\",\"m\":\"從一端到另一端的距離小；時間不長也可以說短。\",\"e\":\"夏天很熱，適合穿短袖，又涼快又方便。\"},{\"w\":\"矮\",\"cat\":\"事物樣子\",\"m\":\"高度不大，比一般低。\",\"e\":\"這張桌子有點矮，哥哥坐着要彎腰才寫得舒服。\"},{\"w\":\"破舊\",\"cat\":\"事物樣子\",\"m\":\"東西已經破了、舊了，外表有損壞或磨損。\",\"e\":\"他穿着一雙破舊的運動鞋，鞋頭都磨出了洞。\"},{\"w\":\"硬\",\"cat\":\"事物樣子\",\"m\":\"質地結實，不容易彎曲、壓扁或咬斷。\",\"e\":\"這塊石頭很硬，用小樹枝怎麼戳也戳不破。\"},{\"w\":\"粗壯\",\"cat\":\"事物樣子\",\"m\":\"又粗又結實有力，常形容樹幹、手臂或身軀。\",\"e\":\"這棵大樹的樹幹十分粗壯，兩三個人也抱不攏。\"},{\"w\":\"精彩\",\"cat\":\"事物樣子\",\"m\":\"內容出色、好看或動人，令人看得投入、想拍手。\",\"e\":\"今晚的魔術表演十分精彩，全場不停鼓掌。\"},{\"w\":\"美味\",\"cat\":\"事物樣子\",\"m\":\"食物很好吃，味道令人口水直流、想再吃。\",\"e\":\"奶奶煲的老火湯十分美味，全家都讚不絕口。\"},{\"w\":\"美麗\",\"cat\":\"事物樣子\",\"m\":\"樣子很好看、很動人，常用來形容風景、花朵或事物。\",\"e\":\"日落時分，天空又紅又橙，景色非常美麗。\"},{\"w\":\"舊\",\"cat\":\"事物樣子\",\"m\":\"已經用過很久，外表或感覺不再嶄新。\",\"e\":\"這件舊衣服雖然穿了兩年，洗乾淨後還很整齊。\"},{\"w\":\"軟\",\"cat\":\"事物樣子\",\"m\":\"一按就會下陷或變形，不像石頭那樣硬。\",\"e\":\"新買的牀墊很軟，躺下去整個人都放鬆了。\"},{\"w\":\"長\",\"cat\":\"事物樣子\",\"m\":\"從一端到另一端的距離大。\",\"e\":\"這條跳繩很長，兩個人拉着剛好夠用。\"},{\"w\":\"香\",\"cat\":\"事物樣子\",\"m\":\"氣味好聞，令人口水直流或覺得舒服。\",\"e\":\"剛烤好的麵包很香，一出爐全屋都聞到。\"},{\"w\":\"香甜\",\"cat\":\"事物樣子\",\"m\":\"既有香味，又有甜味，令人想多吃一口。\",\"e\":\"剛出爐的麵包又香甜又軟，家裏頓時充滿香味。\"},{\"w\":\"骯髒\",\"cat\":\"事物樣子\",\"m\":\"沾滿污泥、灰塵或污漬，很不乾淨。\",\"e\":\"皮球滾進泥地，表面立刻變得很骯髒。\"},{\"w\":\"高\",\"cat\":\"事物樣子\",\"m\":\"從下面到上面的距離大；也可以指成績或程度高。\",\"e\":\"那座山很高，爬到半山已經氣喘吁吁。\"},{\"w\":\"一串串\",\"cat\":\"疊詞聲貌\",\"m\":\"連成一串又一串，像葡萄或珠子那樣掛着。\",\"e\":\"架子上掛着一串串紫葡萄，看起來很甜蜜。\"},{\"w\":\"一籮籮\",\"cat\":\"疊詞聲貌\",\"m\":\"形容數量非常多，像裝滿了很多籮筐那樣。\",\"e\":\"一早的市場裏，攤檔擺着一籮籮新鮮蔬菜。\"},{\"w\":\"冷冰冰\",\"cat\":\"疊詞聲貌\",\"m\":\"溫度低得像冰一樣，摸起來很涼。\",\"e\":\"剛從雪櫃取出的雪糕盒，摸起來冷冰冰的。\"},{\"w\":\"呱呱\",\"cat\":\"疊詞聲貌\",\"m\":\"模擬青蛙叫聲，或形容初生嬰兒大聲哭的聲音。\",\"e\":\"夏天晚上，池塘裏的青蛙呱呱地叫個不停。\"},{\"w\":\"嗡嗡嗡\",\"cat\":\"疊詞聲貌\",\"m\":\"模擬蜜蜂、蚊子等昆蟲飛來飛去時發出的聲音。\",\"e\":\"花園裏，蜜蜂在花叢中嗡嗡嗡地飛來飛去。\"},{\"w\":\"圓圓\",\"cat\":\"疊詞聲貌\",\"m\":\"強調形狀很圓、沒有尖角的樣子。\",\"e\":\"寶寶有一張圓圓的小臉，笑起來兩個酒窩。\"},{\"w\":\"小小\",\"cat\":\"疊詞聲貌\",\"m\":\"強調東西細小、可愛的樣子。\",\"e\":\"盒子角落裏藏着一顆小小的種子。\"},{\"w\":\"尖尖\",\"cat\":\"疊詞聲貌\",\"m\":\"末端又尖又細，摸起來或看起來銳利。\",\"e\":\"把鉛筆削得尖尖的，寫起字來才清楚。\"},{\"w\":\"幼幼\",\"cat\":\"疊詞聲貌\",\"m\":\"又細又嫩、剛長出來不久的樣子。\",\"e\":\"春天的樹枝上，長出幼幼的綠色嫩芽。\"},{\"w\":\"彎彎\",\"cat\":\"疊詞聲貌\",\"m\":\"形容東西彎曲、不直，像月牙或弓那樣的樣子。\",\"e\":\"中秋夜，天上掛着一輪彎彎的月亮。\"},{\"w\":\"快快\",\"cat\":\"疊詞聲貌\",\"m\":\"催促對方加快速度，快一點完成。\",\"e\":\"上課鈴快響了，快快把書包裏的書拿出來。\"},{\"w\":\"悄悄\",\"cat\":\"疊詞聲貌\",\"m\":\"不出聲、不張揚，偷偷地或輕輕地做。\",\"e\":\"他悄悄地把生日禮物藏在沙發後面，不想被發現。\"},{\"w\":\"慢吞吞\",\"cat\":\"疊詞聲貌\",\"m\":\"動作很慢，一點也不着急的樣子。\",\"e\":\"烏龜過馬路時走得慢吞吞的，我們都耐心等它走過去。\"},{\"w\":\"慢慢\",\"cat\":\"疊詞聲貌\",\"m\":\"不着急，用較慢的速度去做或移動。\",\"e\":\"過馬路沒有綠燈時不要衝，要跟着大人慢慢走。\"},{\"w\":\"扁扁\",\"cat\":\"疊詞聲貌\",\"m\":\"被壓得變平、不夠圓潤的樣子。\",\"e\":\"皮球被踩了一腳，變得扁扁的，滾不動了。\"},{\"w\":\"暖洋洋\",\"cat\":\"疊詞聲貌\",\"m\":\"温暖得令人舒服，像被陽光慢慢包着。\",\"e\":\"春天的陽光灑在身上，感覺暖洋洋的。\"},{\"w\":\"甜甜\",\"cat\":\"疊詞聲貌\",\"m\":\"帶着甜味，或形容笑容、說話溫柔可愛的感覺。\",\"e\":\"妹妹看見媽媽回家，立刻露出甜甜的笑容。\"},{\"w\":\"白白\",\"cat\":\"疊詞聲貌\",\"m\":\"強調白色很明顯、很乾淨的樣子。\",\"e\":\"放晴的天空上，飄着幾朵白白的雲。\"},{\"w\":\"粗粗\",\"cat\":\"疊詞聲貌\",\"m\":\"比一般更粗，握起來較穩或看起來厚實。\",\"e\":\"這支蠟筆粗粗的，小手握着剛剛好。\"},{\"w\":\"紅紅\",\"cat\":\"疊詞聲貌\",\"m\":\"強調紅色明顯，常形容臉頰、眼睛或果實。\",\"e\":\"他在操場跑完步，臉蛋紅紅的，直喘氣。\"},{\"w\":\"紅豔豔\",\"cat\":\"疊詞聲貌\",\"m\":\"紅得非常鮮艷奪目，像要發光一樣。\",\"e\":\"園子裏紅豔豔的花開得滿滿的，誰見了都想拍照。\"},{\"w\":\"紅通通\",\"cat\":\"疊詞聲貌\",\"m\":\"紅得發亮，常形容臉、鼻子被凍紅或熱紅。\",\"e\":\"寒風一吹，他的鼻子凍得紅通通的。\"},{\"w\":\"綠油油\",\"cat\":\"疊詞聲貌\",\"m\":\"綠色又濃又有光澤，看起來水潤健康。\",\"e\":\"一場雨後，草地變得綠油油的，像鋪了地毯。\"},{\"w\":\"緊緊\",\"cat\":\"疊詞聲貌\",\"m\":\"握得或拉得很牢，不會輕易鬆開。\",\"e\":\"過馬路時，弟弟緊緊拉着媽媽的手，一步也不肯放。\"},{\"w\":\"萬紫千紅\",\"cat\":\"疊詞聲貌\",\"m\":\"各種各樣鮮艷的花色都有，形容花開得很盛。\",\"e\":\"春天的公園裏百花齊放，真是萬紫千紅。\"},{\"w\":\"藍藍\",\"cat\":\"疊詞聲貌\",\"m\":\"強調藍色很清楚、很乾淨的樣子。\",\"e\":\"放晴以後，藍藍的天空連一朵雲也沒有。\"},{\"w\":\"軟綿綿\",\"cat\":\"疊詞聲貌\",\"m\":\"又軟又鬆，按下去會陷下去，很舒服。\",\"e\":\"牀上鋪着軟綿綿的棉被，一躺下去就不想起來。\"},{\"w\":\"輕輕\",\"cat\":\"疊詞聲貌\",\"m\":\"用力很少、動作溫柔，避免發出大聲或弄痛別人。\",\"e\":\"夜深了，弟弟輕輕關門，怕吵醒正在睡覺的妹妹。\"},{\"w\":\"追追逐逐\",\"cat\":\"疊詞聲貌\",\"m\":\"大家互相追來追去，邊跑邊玩的樣子。\",\"e\":\"下課後，小朋友在操場上追追逐逐，笑聲不斷。\"},{\"w\":\"遠遠\",\"cat\":\"疊詞聲貌\",\"m\":\"距離自己所在的位置很遠。\",\"e\":\"遠遠看去，那座山的輪廓像一條臥着的龍。\"},{\"w\":\"遠遠近近\",\"cat\":\"疊詞聲貌\",\"m\":\"遠處和近處都包括在內，到處都有。\",\"e\":\"過年時，遠遠近近的街道都掛起了紅燈籠。\"},{\"w\":\"酸溜溜\",\"cat\":\"疊詞聲貌\",\"m\":\"酸味很明顯，吃進嘴裏會感到酸。\",\"e\":\"這顆還沒熟透的青芒吃起來酸溜溜的。\"},{\"w\":\"重甸甸\",\"cat\":\"疊詞聲貌\",\"m\":\"拿在手裏或背在肩上覺得沉甸甸、很有分量。\",\"e\":\"測驗後他提着重甸甸的書包，裏面裝滿了書。\"},{\"w\":\"長長\",\"cat\":\"疊詞聲貌\",\"m\":\"強調長度很長的樣子。\",\"e\":\"河邊有一條長長的小路，兩旁種滿柳樹。\"},{\"w\":\"閃閃\",\"cat\":\"疊詞聲貌\",\"m\":\"光芒一下一下發亮，像在眨眼一樣。\",\"e\":\"晴朗的夜空中，星星閃閃發光。\"},{\"w\":\"靜靜\",\"cat\":\"疊詞聲貌\",\"m\":\"不出聲、不吵鬧，保持安靜的狀態。\",\"e\":\"寶寶吃飽後靜靜地睡着了，大家都放輕腳步。\"},{\"w\":\"香噴噴\",\"cat\":\"疊詞聲貌\",\"m\":\"香氣一陣一陣強烈地飄過來，令人想吃。\",\"e\":\"一打開門，廚房就飄來香噴噴的炒飯味。\"},{\"w\":\"香香\",\"cat\":\"疊詞聲貌\",\"m\":\"強調好聞、香氣明顯的感覺。\",\"e\":\"媽媽剛焗好的蛋糕香香的，大家圍着廚房聞個不停。\"},{\"w\":\"高高\",\"cat\":\"疊詞聲貌\",\"m\":\"強調位置或高度很高的樣子。\",\"e\":\"風一吹，風箏就飛得高高的，幾乎碰到雲。\"},{\"w\":\"黑黑\",\"cat\":\"疊詞聲貌\",\"m\":\"強調黑色很明顯的樣子。\",\"e\":\"他的眼睛又大又黑黑的，笑起來特別有神。\"},{\"w\":\"點點\",\"cat\":\"疊詞聲貌\",\"m\":\"一點一點分散開的小斑點或小水珠。\",\"e\":\"清早的草葉上，掛着點點閃亮的露水。\"},{\"w\":\"件\",\"cat\":\"量詞\",\"m\":\"用來計算衣服，也可以計算事情或事情的件數。\",\"e\":\"天氣轉涼，媽媽給我買了一件厚外套。\"},{\"w\":\"位\",\"cat\":\"量詞\",\"m\":\"計算人時較有禮貌的量詞，常用于稱呼別人。\",\"e\":\"這位新來的老師說話很和藹，同學都喜歡她。\"},{\"w\":\"個\",\"cat\":\"量詞\",\"m\":\"最常用的量詞，用來計算人或很多普通物件。\",\"e\":\"開學了，我有一個嶄新的書包。\"},{\"w\":\"匹\",\"cat\":\"量詞\",\"m\":\"專門用來計算馬的量詞。\",\"e\":\"草原上慢慢走來一匹雪白的馬。\"},{\"w\":\"塊\",\"cat\":\"量詞\",\"m\":\"用來計算塊狀、不成條的東西，例如石頭、肥皂、草地。\",\"e\":\"河邊地上露出一塊圓滑的小石頭。\"},{\"w\":\"幅\",\"cat\":\"量詞\",\"m\":\"用來計算字畫、圖畫或布簾一類平面作品。\",\"e\":\"客廳牆上掛着一幅色彩豐富的油畫。\"},{\"w\":\"張\",\"cat\":\"量詞\",\"m\":\"用來計算薄而平的東西，例如紙、桌子、嘴、牀。\",\"e\":\"美術課上，老師發給每人一張白紙畫畫。\"},{\"w\":\"本\",\"cat\":\"量詞\",\"m\":\"專門用來計算書本、簿的數量。\",\"e\":\"這個星期六，我在圖書館借了兩本書。\"},{\"w\":\"朵\",\"cat\":\"量詞\",\"m\":\"用來計算花，也可以計算雲。\",\"e\":\"花瓶裏插着一朵剛摘下的鮮花。\"},{\"w\":\"束\",\"cat\":\"量詞\",\"m\":\"用來計算捆成一紮的花或其他長條物。\",\"e\":\"教師節那天，他送老師一束鮮花。\"},{\"w\":\"杯\",\"cat\":\"量詞\",\"m\":\"用來計算用杯子盛着的飲料或液體。\",\"e\":\"早餐時我想喝一杯温熱的牛奶。\"},{\"w\":\"枝\",\"cat\":\"量詞\",\"m\":\"用來計算細長的東西，例如鉛筆、花枝。\",\"e\":\"我的筆袋裏整齊放着三枝削尖的鉛筆。\"},{\"w\":\"架\",\"cat\":\"量詞\",\"m\":\"用來計算飛機、鋼琴等較大型機器或樂器。\",\"e\":\"抬頭一看，天上正飛過一架白色飛機。\"},{\"w\":\"根\",\"cat\":\"量詞\",\"m\":\"用來計算長條形的東西，例如香蕉、繩子、頭髮。\",\"e\":\"小食課後，他高興地吃了一根香蕉。\"},{\"w\":\"條\",\"cat\":\"量詞\",\"m\":\"用來計算長條形的東西，例如魚、路、褲子、繩子。\",\"e\":\"媽媽清蒸了一條新鮮的魚作晚餐。\"},{\"w\":\"棵\",\"cat\":\"量詞\",\"m\":\"專門用來計算樹木或較大的植物。\",\"e\":\"校園角落種了兩棵桃花樹，春天開滿花。\"},{\"w\":\"片\",\"cat\":\"量詞\",\"m\":\"用來計算薄片狀的東西，例如麵包片、樹葉、藥。\",\"e\":\"早餐時我塗上花生醬，吃了一片麵包。\"},{\"w\":\"盒\",\"cat\":\"量詞\",\"m\":\"用來計算用盒子装着的東西。\",\"e\":\"美術課需要顏色筆，桌上放着一盒二十四色筆。\"},{\"w\":\"碗\",\"cat\":\"量詞\",\"m\":\"用來計算用碗盛着的飯、湯或粉麵。\",\"e\":\"午餐我吃了一碗熱騰騰的白飯配青菜。\"},{\"w\":\"袋\",\"cat\":\"量詞\",\"m\":\"用來計算用袋子装着的東西。\",\"e\":\"過年備貨，媽媽買了一袋香米回家。\"},{\"w\":\"輛\",\"cat\":\"量詞\",\"m\":\"專門用來計算陸地上的車子。\",\"e\":\"門口整齊地停着一輛紅色的汽車。\"},{\"w\":\"間\",\"cat\":\"量詞\",\"m\":\"用來計算房間、課室、店舖等有空間的地方。\",\"e\":\"這是一間又明亮又寬敞的課室。\"},{\"w\":\"隻\",\"cat\":\"量詞\",\"m\":\"用來計算鳥、獸、船等大多數動物（和部分物件）。\",\"e\":\"窗外的樹上停着一隻正在唱歌的小鳥。\"},{\"w\":\"雙\",\"cat\":\"量詞\",\"m\":\"用來計算成對出現的東西，例如鞋、襪、筷子、手。\",\"e\":\"媽媽給我買了一雙合腳的新鞋子。\"},{\"w\":\"首\",\"cat\":\"量詞\",\"m\":\"專門用來計算詩歌或歌曲的數量。\",\"e\":\"今天老師教我們背一首描寫春天的詩。\"},{\"w\":\"天氣\",\"cat\":\"自然事物\",\"m\":\"某一天是冷是熱、有沒有太陽、會不會下雨的整體情況。\",\"e\":\"今天天氣很好，又出太陽又沒有風沙。\"},{\"w\":\"太陽\",\"cat\":\"自然事物\",\"m\":\"白天天空中發光發熱的恆星，帶給大地光明和温暖。\",\"e\":\"太陽從東邊出來了，天氣慢慢變暖。\"},{\"w\":\"山\",\"cat\":\"自然事物\",\"m\":\"高出周圍平地很多的大土石堆，爬上去要花力氣。\",\"e\":\"星期天我們一家人慢慢爬上了那座山。\"},{\"w\":\"星星\",\"cat\":\"自然事物\",\"m\":\"夜晚天空中一閃一閃的小光點，其實是很遠的天體。\",\"e\":\"沒有雲的晚上，可以看見很多閃亮的星星。\"},{\"w\":\"月亮\",\"cat\":\"自然事物\",\"m\":\"夜晚出現在天空、會反射太陽光而發亮的天體，形狀有時圓有時彎。\",\"e\":\"中秋節晚上，我們一家人在屋企賞月亮、吃月餅。\"},{\"w\":\"棉花糖\",\"cat\":\"自然事物\",\"m\":\"又軟又甜、蓬鬆得像棉花一樣的糖，常在遊樂場見到。\",\"e\":\"遊樂場門口有人轉着竹簽賣棉花糖。\"},{\"w\":\"樹\",\"cat\":\"自然事物\",\"m\":\"有堅硬樹幹和樹枝、長得較高的木本植物。\",\"e\":\"大樹底下很陰涼，夏天適合坐着休息。\"},{\"w\":\"水\",\"cat\":\"自然事物\",\"m\":\"無色透明的液體，人畜都需要喝，也可以洗東西。\",\"e\":\"口渴的時候要多喝水，不要只喝甜飲料。\"},{\"w\":\"海\",\"cat\":\"自然事物\",\"m\":\"連接陸地、面積非常廣闊的大水域，有波浪和海風。\",\"e\":\"暑假我們坐車去看海，還在沙灘上堆沙堡。\"},{\"w\":\"火\",\"cat\":\"自然事物\",\"m\":\"東西燃燒時發出的光和熱；危險，小朋友不可亂玩。\",\"e\":\"看見火苗要立刻告訴大人，自己不要走近。\"},{\"w\":\"火球\",\"cat\":\"自然事物\",\"m\":\"像球一樣燃燒的火團；也常比喻又圓又熱的太陽。\",\"e\":\"大熱天中午，夏天的太陽就像一個大火球。\"},{\"w\":\"石頭\",\"cat\":\"自然事物\",\"m\":\"地上或河裏堅硬的小石塊，摸起來硬邦邦。\",\"e\":\"清澈的小溪裏，躺着許多圓滑的石頭。\"},{\"w\":\"羽毛\",\"cat\":\"自然事物\",\"m\":\"長在鳥類身上、又輕又可以幫助飛行的毛。\",\"e\":\"孔雀開屏時，展開一片五顏六色的羽毛。\"},{\"w\":\"花\",\"cat\":\"自然事物\",\"m\":\"植物開出來的花朵，有不同顏色和香味。\",\"e\":\"春天的花園裏開滿了五顏六色的花。\"},{\"w\":\"花生\",\"cat\":\"自然事物\",\"m\":\"一種長在地下的豆子，炒熟後又香又可當零食。\",\"e\":\"過年待客時，我們常端出一碟炒花生。\"},{\"w\":\"草\",\"cat\":\"自然事物\",\"m\":\"長在地上、通常又矮又綠的植物，常鋪成草地。\",\"e\":\"小狗高興地在草地上滾來滾去。\"},{\"w\":\"雨\",\"cat\":\"自然事物\",\"m\":\"雲層裏的小水點落到地面，就是下雨。\",\"e\":\"忽然下雨了，大家趕快拿出雨傘擋雨。\"},{\"w\":\"雲\",\"cat\":\"自然事物\",\"m\":\"飄在天空中、由小水點組成的白色或灰色團塊。\",\"e\":\"午後的天空飄着幾朵白白的雲，慢慢移動。\"},{\"w\":\"風\",\"cat\":\"自然事物\",\"m\":\"空氣流動時形成的氣流，有時輕輕吹，有時很大力。\",\"e\":\"一陣風吹過，樹葉沙沙作響，風箏也飛得更高。\"},{\"w\":\"鮮紅\",\"cat\":\"自然事物\",\"m\":\"非常鮮艷、明亮的紅色，像成熟果皮那樣。\",\"e\":\"樹上成熟的蘋果皮色鮮紅，看得人口水直流。\"},{\"w\":\"鮮花\",\"cat\":\"自然事物\",\"m\":\"剛剛開放、還很新鮮的花朵，不是乾花或假花。\",\"e\":\"客廳花瓶裏插着幾朵剛買回來的鮮花。\"},{\"w\":\"果汁\",\"cat\":\"食物飲品\",\"m\":\"用水果搾出或攪拌成的飲料，有甜有酸。\",\"e\":\"大熱天喝一杯凍橙果汁，覺得很清涼。\"},{\"w\":\"牛奶\",\"cat\":\"食物飲品\",\"m\":\"從乳牛身上擠出的奶，含豐富營養，常冷藏飲用。\",\"e\":\"每天早上上學前，我都會喝一杯牛奶。\"},{\"w\":\"米飯\",\"cat\":\"食物飲品\",\"m\":\"用米加水煮熟後的主食，一粒一粒，配菜吃。\",\"e\":\"午餐我吃了一碗熱騰騰的米飯，配青菜和雞蛋。\"},{\"w\":\"糖\",\"cat\":\"食物飲品\",\"m\":\"味道很甜的食品，吃多了容易蛀牙，要有節制。\",\"e\":\"飯後吃太多糖對牙齒不好，要記得刷牙。\"},{\"w\":\"蘋果\",\"cat\":\"食物飲品\",\"m\":\"一種常見的圓形水果，外皮多是紅色或青色，咬起來爽脆。\",\"e\":\"老師說一天吃一個蘋果，對身體有益。\"},{\"w\":\"蛋糕\",\"cat\":\"食物飲品\",\"m\":\"用蛋、粉、糖烤成的甜點，生日或下午茶常會吃。\",\"e\":\"生日那天，大家圍着桌子一起切蛋糕、唱生日歌。\"},{\"w\":\"雞蛋\",\"cat\":\"食物飲品\",\"m\":\"母雞生下來的蛋，可以蒸、炒、煮來吃，營養豐富。\",\"e\":\"媽媽在平底鍋裏煎了一隻香噴噴的雞蛋。\"},{\"w\":\"雪糕\",\"cat\":\"食物飲品\",\"m\":\"冰凍的甜品，吃起來又凍又甜，熱天特別受歡迎。\",\"e\":\"天氣炎熱時，我最想吃一支雪糕降溫。\"},{\"w\":\"香蕉\",\"cat\":\"食物飲品\",\"m\":\"長形、外皮黃色的水果，剝開後肉質軟甜。\",\"e\":\"動物園裏的猴子最喜歡吃香蕉。\"},{\"w\":\"麵包\",\"cat\":\"食物飲品\",\"m\":\"用麵粉發酵後烤成的食品，常作早餐。\",\"e\":\"早餐我吃全麥麵包，再配一杯牛奶。\"},{\"w\":\"單車\",\"cat\":\"交通工具\",\"m\":\"有兩個輪子、用雙腳踩踏板前進的車。\",\"e\":\"假日裏，公園單車徑上很多人踩單車。\"},{\"w\":\"地鐵\",\"cat\":\"交通工具\",\"m\":\"多在地底隧道行駛、靠電力推動、按站停車的列車。\",\"e\":\"下雨天我們改坐地鐵去圖書館，又快又乾爽。\"},{\"w\":\"小船\",\"cat\":\"交通工具\",\"m\":\"體積細小、可在湖面或河面行駛的船。\",\"e\":\"平靜的湖面上，漂着一隻載着兩個人的小船。\"},{\"w\":\"巴士\",\"cat\":\"交通工具\",\"m\":\"車廂大、有很多座位、按站停靠載客的公共汽車。\",\"e\":\"放學後，我們在車站排隊坐巴士回家。\"},{\"w\":\"救護車\",\"cat\":\"交通工具\",\"m\":\"專門運送傷病者去醫院急救的車，會響警號。\",\"e\":\"救護車鳴着響號從馬路中央快速駛過。\"},{\"w\":\"校巴\",\"cat\":\"交通工具\",\"m\":\"學校安排、專門接送學生上下學的巴士。\",\"e\":\"每天早上，我在屋邨門口搭校巴上學。\"},{\"w\":\"汽車\",\"cat\":\"交通工具\",\"m\":\"有四個輪、在馬路上行駛、靠引擎推動的車子。\",\"e\":\"繁忙時間，馬路上來來往往有很多汽車。\"},{\"w\":\"消防車\",\"cat\":\"交通工具\",\"m\":\"專門用來救火的車，車上有水管、梯子等器材。\",\"e\":\"火警鐘一響，消防車很快就趕到現場。\"},{\"w\":\"火車\",\"cat\":\"交通工具\",\"m\":\"在鐵軌上行駛、車廂一節接一節的長列車。\",\"e\":\"放假時我們坐火車去外地旅行，沿途風景很美。\"},{\"w\":\"的士\",\"cat\":\"交通工具\",\"m\":\"可以電話或路邊舉手召來、按路程收費載客的出租汽車。\",\"e\":\"忽然下大雨，媽媽在路邊召了一架的士。\"},{\"w\":\"船\",\"cat\":\"交通工具\",\"m\":\"在水面行駛、載人或載貨的交通工具。\",\"e\":\"要過海島時，我們坐船穿過海面。\"},{\"w\":\"貨車\",\"cat\":\"交通工具\",\"m\":\"車斗較大、專門用來運載貨物的汽車。\",\"e\":\"一輛裝滿紙箱的貨車慢慢停在倉庫門口。\"},{\"w\":\"電單車\",\"cat\":\"交通工具\",\"m\":\"有兩個輪、靠引擎推動、比單車快的摩托車（香港叫電單車）。\",\"e\":\"叔叔戴好頭盔，騎着電單車出門上班。\"},{\"w\":\"電車\",\"cat\":\"交通工具\",\"m\":\"靠架空電纜取電行駛的車，在香港街上很常見，走得較慢。\",\"e\":\"電車叮叮響着，慢慢駛過彌敦道的馬路。\"},{\"w\":\"飛機\",\"cat\":\"交通工具\",\"m\":\"有機翼、能在天空飛行、載人到很遠地方的交通工具。\",\"e\":\"飛機加速滑行一段路，就從地面飛了起來。\"}]}]};\nlet bandId = DATA.bands[0].id, cat = \"全部\", q = \"\", cantoneseVoice = null;\nlet viewMode = \"learn\"; // learn | off\nlet showAllMeanings = false, showAllExamples = false;\nconst STORE_KEY = \"zh-lexlist-off-v1\";\nconst VIEW_KEY = \"zh-lexlist-view-v1\";\nconst fieldState = new Map(); // key: word|m|e -> { open, spoken }\nconst forceHide = new Set(); // word|field — 即使「全部顯示」也強制隱藏\n\nfunction loadOffSet() {\n  try {\n    const raw = localStorage.getItem(STORE_KEY);\n    const arr = raw ? JSON.parse(raw) : [];\n    return new Set(Array.isArray(arr) ? arr : []);\n  } catch (_) { return new Set(); }\n}\nlet offSet = loadOffSet();\nfunction saveOffSet() {\n  localStorage.setItem(STORE_KEY, JSON.stringify(Array.from(offSet)));\n  saveViewState();\n}\nfunction loadViewState() {\n  try {\n    const raw = localStorage.getItem(VIEW_KEY);\n    return raw ? JSON.parse(raw) : null;\n  } catch (_) { return null; }\n}\nfunction saveViewState() {\n  try {\n    localStorage.setItem(VIEW_KEY, JSON.stringify({\n      bandId, cat, q, viewMode, showAllMeanings, showAllExamples\n    }));\n  } catch (_) {}\n}\nconst _vs = loadViewState();\nif (_vs) {\n  if (_vs.bandId) bandId = _vs.bandId;\n  if (_vs.cat) cat = _vs.cat;\n  if (typeof _vs.q === \"string\") q = _vs.q;\n  if (_vs.viewMode === \"learn\" || _vs.viewMode === \"off\") viewMode = _vs.viewMode;\n  if (typeof _vs.showAllMeanings === \"boolean\") showAllMeanings = _vs.showAllMeanings;\n  if (typeof _vs.showAllExamples === \"boolean\") showAllExamples = _vs.showAllExamples;\n}\n\nfunction loadVoices() {\n  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];\n  cantoneseVoice =\n    voices.find(v => v.lang === \"zh-HK\" && /Google/i.test(v.name)) ||\n    voices.find(v => v.lang === \"zh-HK\") ||\n    voices.find(v => /Hong Kong|Yue|Cantonese|粵/i.test(v.name + v.lang)) ||\n    null;\n}\nif (\"speechSynthesis\" in window) {\n  loadVoices();\n  speechSynthesis.onvoiceschanged = loadVoices;\n}\nfunction speak(text) {\n  if (!(\"speechSynthesis\" in window) || !text) return;\n  speechSynthesis.cancel();\n  const u = new SpeechSynthesisUtterance(text);\n  u.lang = \"zh-HK\";\n  if (cantoneseVoice) u.voice = cantoneseVoice;\n  u.rate = 0.9;\n  speechSynthesis.speak(u);\n}\nfunction escapeHtml(s) {\n  return String(s).replace(/&/g, \"&amp;\").replace(/</g, \"&lt;\").replace(/>/g, \"&gt;\").replace(/\"/g, \"&quot;\");\n}\nfunction highlight(text, word) {\n  const src = escapeHtml(text);\n  if (!word) return src;\n  const w = escapeHtml(word);\n  return src.split(w).join(`<span class=\"hl\">${w}</span>`);\n}\nfunction currentBand() { return DATA.bands.find(b => b.id === bandId); }\nfunction stateKey(word, field) { return word + \"|\" + field; }\nfunction getFieldState(word, field) {\n  const k = stateKey(word, field);\n  if (!fieldState.has(k)) fieldState.set(k, { open: false, spoken: false });\n  return fieldState.get(k);\n}\n\nfunction renderBands() {\n  const row = document.getElementById(\"band-row\");\n  row.innerHTML = DATA.bands.map(b =>\n    `<button class=\"band-btn ${b.id === bandId ? \"active\" : \"\"}\" data-id=\"${b.id}\">${b.title}（${b.count}）</button>`\n  ).join(\"\");\n  row.querySelectorAll(\".band-btn\").forEach(btn => {\n    btn.onclick = () => {\n      bandId = btn.dataset.id;\n      cat = \"全部\";\n      saveViewState();\n      renderBands();\n      fillCats();\n      renderList();\n    };\n  });\n}\nfunction fillCats() {\n  const words = currentBand().words;\n  const cats = Array.from(new Set(words.map(w => w.cat))).sort();\n  const sel = document.getElementById(\"cat-select\");\n  sel.innerHTML = `<option value=\"全部\">全部分類</option>` + cats.map(c => `<option value=\"${c}\">${c}</option>`).join(\"\");\n  sel.value = cat;\n}\nfunction filtered() {\n  let words = currentBand().words;\n  if (viewMode === \"off\") words = words.filter(w => offSet.has(w.w));\n  else words = words.filter(w => !offSet.has(w.w));\n  if (cat !== \"全部\") words = words.filter(w => w.cat === cat);\n  if (q.trim()) {\n    const s = q.trim();\n    words = words.filter(w => w.w.includes(s) || w.m.includes(s) || w.e.includes(s));\n  }\n  return words;\n}\n\nfunction isOpen(word, field) {\n  const k = stateKey(word, field);\n  if (forceHide.has(k)) return false;\n  if (field === \"m\" && showAllMeanings) return true;\n  if (field === \"e\" && showAllExamples) return true;\n  return getFieldState(word, field).open;\n}\n\nfunction blockHtml(item, field, label) {\n  const text = field === \"m\" ? item.m : item.e;\n  const open = isOpen(item.w, field);\n  const exClass = field === \"e\" ? \" ex\" : \"\";\n  if (!open) {\n    return `<div class=\"block hidden-text${exClass}\" data-field=\"${field}\" data-word=\"${escapeHtml(item.w)}\" data-speak=\"${escapeHtml(text)}\">\n      <div class=\"text\">點擊看${label}</div>\n    </div>`;\n  }\n  return `<div class=\"block${exClass}\" data-field=\"${field}\" data-word=\"${escapeHtml(item.w)}\" data-speak=\"${escapeHtml(text)}\">\n    <div class=\"text\">${highlight(text, item.w)}</div>\n  </div>`;\n}\n\nfunction updateViewButtons() {\n  document.getElementById(\"view-learn\").classList.toggle(\"active\", viewMode === \"learn\");\n  document.getElementById(\"view-off\").classList.toggle(\"active\", viewMode === \"off\");\n  document.getElementById(\"toggle-meanings\").textContent = showAllMeanings ? \"全部解釋：隱藏\" : \"全部解釋：顯示\";\n  document.getElementById(\"toggle-examples\").textContent = showAllExamples ? \"全部例子：隱藏\" : \"全部例子：顯示\";\n  const offN = offSet.size;\n  document.getElementById(\"view-off\").textContent = offN ? `已學識（${offN}）` : \"已學識\";\n}\n\nfunction renderList() {\n  updateViewButtons();\n  const words = filtered();\n  const totalOff = offSet.size;\n  const learnN = currentBand().words.length - totalOff;\n  document.getElementById(\"count\").textContent =\n    viewMode === \"off\"\n      ? `已學識 ${words.length} 個（全部已學 ${totalOff}）`\n      : `學習中 ${words.length} 個（剩餘約 ${learnN}）`;\n\n  const list = document.getElementById(\"list\");\n  const prevScroll = list.scrollTop;\n  if (!words.length) {\n    list.innerHTML = viewMode === \"off\"\n      ? `<div class=\"empty\">暫時未有已學識的詞語。在學習中剔選右邊方格，就會移到這裏。</div>`\n      : `<div class=\"empty\">沒有符合的詞語（或者全部已學識）</div>`;\n    return;\n  }\n\n  const STEP = 90;\n  let shown = Math.min(STEP, words.length);\n\n  function paint() {\n    const slice = words.slice(0, shown);\n    list.innerHTML = slice.map(item => {\n      const isOff = offSet.has(item.w);\n      return `<article class=\"card ${isOff ? \"off\" : \"\"}\" data-word=\"${escapeHtml(item.w)}\">\n        <div class=\"title-row\">\n          <div class=\"word\" data-speak=\"${escapeHtml(item.w)}\">${item.w}</div>\n          <span class=\"meta\">${escapeHtml(item.cat)}</span>\n          <input class=\"done-box\" type=\"checkbox\" title=\"${isOff ? \"取消已學識，放回學習中\" : \"標記為已學識\"}\" ${isOff ? \"checked\" : \"\"} data-word=\"${escapeHtml(item.w)}\" />\n        </div>\n        ${blockHtml(item, \"m\", \"解釋\")}\n        ${blockHtml(item, \"e\", \"例子\")}\n      </article>`;\n    }).join(\"\");\n\n    if (shown < words.length) {\n      list.innerHTML += `<button class=\"band-btn more\" id=\"more-btn\">再顯示多 ${Math.min(STEP, words.length - shown)} 個</button>`;\n      document.getElementById(\"more-btn\").onclick = () => {\n        shown = Math.min(shown + STEP, words.length);\n        paint();\n      };\n    }\n\n    list.querySelectorAll(\".word\").forEach(el => {\n      el.addEventListener(\"click\", () => speak(el.getAttribute(\"data-speak\")));\n    });\n\n    list.querySelectorAll(\".done-box\").forEach(box => {\n      box.addEventListener(\"click\", ev => ev.stopPropagation());\n      box.addEventListener(\"change\", () => {\n        const w = box.getAttribute(\"data-word\");\n        if (box.checked) offSet.add(w);\n        else offSet.delete(w);\n        saveOffSet();\n        renderList();\n      });\n    });\n\n    list.querySelectorAll(\".block\").forEach(el => {\n      el.addEventListener(\"click\", () => {\n        const word = el.getAttribute(\"data-word\");\n        const field = el.getAttribute(\"data-field\");\n        const text = el.getAttribute(\"data-speak\");\n        const st = getFieldState(word, field);\n        const k = stateKey(word, field);\n\n        if (!isOpen(word, field)) {\n          forceHide.delete(k);\n          st.open = true;\n          st.spoken = false;\n          renderList();\n          return;\n        }\n        if (!st.spoken) {\n          st.spoken = true;\n          speak(text);\n          return;\n        }\n        st.open = false;\n        st.spoken = false;\n        forceHide.add(k);\n        renderList();\n      });\n    });\n    list.scrollTop = prevScroll;\n  }\n  paint();\n}\n\ndocument.getElementById(\"cat-select\").onchange = e => { cat = e.target.value; saveViewState(); renderList(); };\ndocument.getElementById(\"q\").oninput = e => { q = e.target.value; saveViewState(); renderList(); };\ndocument.getElementById(\"view-learn\").onclick = () => { viewMode = \"learn\"; saveViewState(); renderList(); };\ndocument.getElementById(\"view-off\").onclick = () => { viewMode = \"off\"; saveViewState(); renderList(); };\ndocument.getElementById(\"toggle-meanings\").onclick = () => {\n  showAllMeanings = !showAllMeanings;\n  currentBand().words.forEach(w => {\n    const st = getFieldState(w.w, \"m\");\n    const k = stateKey(w.w, \"m\");\n    forceHide.delete(k);\n    st.open = showAllMeanings;\n    st.spoken = false;\n  });\n  saveViewState();\n  renderList();\n};\ndocument.getElementById(\"toggle-examples\").onclick = () => {\n  showAllExamples = !showAllExamples;\n  currentBand().words.forEach(w => {\n    const st = getFieldState(w.w, \"e\");\n    const k = stateKey(w.w, \"e\");\n    forceHide.delete(k);\n    st.open = showAllExamples;\n    st.spoken = false;\n  });\n  saveViewState();\n  renderList();\n};\n\nif (q) document.getElementById(\"q\").value = q;\nrenderBands();\nfillCats();\nrenderList();\n<\/script>\n</body>\n</html>\n",
    "math-table": "<!DOCTYPE html>\n<html lang=\"zh-HK\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>數學 · 乘數表</title>\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <style>\n        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap');\n        html, body { margin: 0; padding: 0; }\n\n        #view-table {\n            font-family: \"Helvetica Neue\", Helvetica, Arial, \"Microsoft JhengHei\", sans-serif;\n            margin: 0; padding: 20px; background-color: #f9f9f9; min-height: 100vh;\n            display: flex; flex-direction: column; align-items: center;\n        }\n        #view-table.is-hidden { display: none; }\n        #view-table .container {\n            max-width: 1100px; width: 100%; background: white; padding: 20px;\n            border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);\n        }\n        #view-table .header-title {\n            color: #cc4b25; border-left: 5px solid #cc4b25; padding-left: 10px;\n            font-size: 24px; font-weight: bold; margin-top: 0; margin-bottom: 20px;\n        }\n        #view-table .controls {\n            display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap;\n        }\n        #view-table button {\n            padding: 10px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px;\n            cursor: pointer; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.2);\n        }\n        #view-table button:active { transform: scale(0.95); }\n        #view-table #btn-show { background-color: #4CAF50; }\n        #view-table #btn-hide { background-color: #f44336; }\n        #view-table #btn-quiz { background-color: #2563eb; }\n        #view-table .table-wrapper { width: 100%; overflow-x: auto; }\n        #view-table .grid-container {\n            display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; min-width: 900px; background: #fff;\n        }\n        #view-table .col-header {\n            color: white; font-size: 20px; font-weight: bold; text-align: center;\n            padding: 10px 0; cursor: pointer; user-select: none;\n        }\n        #view-table .header-green { background-color: #71b212; }\n        #view-table .header-orange { background-color: #f0810f; }\n        #view-table .cell {\n            background-color: #fffde6; text-align: center; padding: 12px 5px; font-size: 18px;\n            font-weight: bold; color: #000; cursor: pointer; user-select: none;\n            display: flex; justify-content: center; align-items: center;\n        }\n        #view-table .equation { display: inline-block; text-align: right; }\n        #view-table .answer {\n            display: inline-block; width: 35px; text-align: left; opacity: 0;\n            font-size: 24px; font-weight: 900; margin-left: 12px;\n        }\n        #view-table .answer-red { color: #b30000; }\n        #view-table .answer-green { color: #008000; }\n        #view-table .cell.revealed .answer { opacity: 1; }\n\n        #view-quiz {\n            display: none;\n            font-family: 'Nunito', 'Microsoft JhengHei', sans-serif;\n            background: linear-gradient(135deg, #1a2a6c, #112240, #2a0845);\n            color: white; min-height: 100vh; overflow-x: hidden; user-select: none;\n            align-items: center; justify-content: center; padding: 1rem;\n        }\n        #view-quiz.is-active { display: flex; }\n        800&display=swap');\n\n        #view-quiz {\n            font-family: 'Nunito', 'Microsoft JhengHei', sans-serif;\n            background: linear-gradient(135deg, #1a2a6c, #112240, #2a0845);\n            color: white;\n            min-height: 100vh;\n            overflow-x: hidden;\n            user-select: none;\n        }\n\n        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }\n        @keyframes shake {\n            10%, 90% { transform: translate3d(-2px, 0, 0); }\n            20%, 80% { transform: translate3d(4px, 0, 0); }\n            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }\n            40%, 60% { transform: translate3d(6px, 0, 0); }\n        }\n\n        .pop { animation: pop 0.3s ease-out forwards; }\n        @keyframes pop {\n            0% { transform: scale(1); }\n            50% { transform: scale(1.1); }\n            100% { transform: scale(1); }\n        }\n\n        .confetti {\n            position: fixed; top: -10px; width: 12px; height: 12px;\n            z-index: 9999; animation: fall linear forwards; border-radius: 2px;\n        }\n        @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }\n\n        .floating-star {\n            position: absolute; font-size: 2rem; pointer-events: none;\n            animation: floatUp 1s ease-out forwards; z-index: 50;\n        }\n        @keyframes floatUp {\n            0% { opacity: 1; transform: translateY(0) scale(1); }\n            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }\n        }\n\n        .custom-checkbox input:checked + div {\n            background-color: #f59e0b; border-color: #f59e0b; transform: scale(1.05);\n        }\n        .option-btn { transition: all 0.2s; }\n        .option-btn:active { transform: scale(0.95); }\n        \n        /* 錯題庫 Checkbox */\n        .mistake-cb { width: 1.5rem; height: 1.5rem; cursor: pointer; }\n    </style>\n</head>\n<body>\n    <div id=\"view-table\">\n        <div class=\"container\">\n            <h1 class=\"header-title\">99乘法表（九九表）</h1>\n            <div class=\"controls\">\n                <button id=\"btn-show\" type=\"button\">顯示全部</button>\n                <button id=\"btn-hide\" type=\"button\">隱藏全部</button>\n                <button id=\"btn-quiz\" type=\"button\">🚀 開始測驗</button>\n            </div>\n            <div class=\"table-wrapper\">\n                <div class=\"grid-container\" id=\"multiplication-grid\"></div>\n            </div>\n        </div>\n    </div>\n\n    <div id=\"view-quiz\">\n\n\n    <!-- 開始畫面 -->\n    <div id=\"start-screen\" class=\"w-full max-w-md bg-white/10 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-white/20 text-center flex flex-col\">\n        <h1 class=\"text-3xl font-bold mb-2 text-yellow-400\">🚀 九因歌太空探險 🌟</h1>\n        <p class=\"text-blue-200 mb-6 text-sm\">揀你想挑戰嘅乘數表啦！</p>\n        \n        <div class=\"grid grid-cols-3 gap-3 mb-6\">\n            <script>\n                for(let i=1; i<=9; i++) {\n                    let checked = i <= 5 ? 'checked' : '';\n                    document.write(`\n                        <label class=\"custom-checkbox cursor-pointer relative\">\n                            <input type=\"checkbox\" value=\"${i}\" class=\"peer sr-only table-cb\" ${checked}>\n                            <div class=\"rounded-xl border-2 border-blue-400/50 p-3 text-xl font-bold text-white bg-blue-900/50 hover:bg-blue-800/50 transition-all\">\n                                ${i}\n                            </div>\n                        </label>\n                    `);\n                }\n            <\/script>\n        </div>\n\n        <button onclick=\"startGame(false)\" class=\"w-full bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-300 hover:to-orange-400 text-white font-bold py-4 rounded-2xl text-2xl shadow-lg transform transition hover:scale-105 active:scale-95 mb-4\">\n            開始探險！ 🛸\n        </button>\n\n        <div class=\"flex gap-2\">\n            <button onclick=\"startGame(true)\" class=\"flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl shadow-lg transition\">\n                特訓錯題庫 🎯\n            </button>\n            <button onclick=\"openMistakeManager()\" class=\"flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition\">\n                管理錯題庫 📁\n            </button>\n        </div>\n        <button type=\"button\" onclick=\"showTableView()\" class=\"mt-4 w-full bg-white/15 hover:bg-white/25 text-white font-bold py-3 rounded-xl shadow-lg transition border border-white/30\">\n            📘 返回乘數表\n        </button>\n    </div>\n\n    <!-- 遊戲畫面 -->\n    <div id=\"game-screen\" class=\"w-full max-w-md hidden flex-col items-center\">\n        \n        <!-- 頂部資訊 (進度與對錯) -->\n        <div class=\"w-full flex justify-between items-center bg-white/10 backdrop-blur-sm p-4 rounded-2xl mb-4 border border-white/20\">\n            <div class=\"flex flex-col items-center\">\n                <span class=\"text-xs text-blue-200\">進度 (一回合)</span>\n                <span id=\"progress-display\" class=\"text-lg font-bold text-white\">0/0</span>\n            </div>\n            <div class=\"flex flex-col items-center\">\n                <span class=\"text-xs text-blue-200\">答啱</span>\n                <span id=\"correct-display\" class=\"text-lg font-bold text-green-400\">✅ 0</span>\n            </div>\n            <div class=\"flex flex-col items-center\">\n                <span class=\"text-xs text-blue-200\">答錯</span>\n                <span id=\"wrong-display\" class=\"text-lg font-bold text-red-400\">❌ 0</span>\n            </div>\n            <div class=\"flex flex-col items-center\">\n                <span class=\"text-xs text-blue-200\">連中</span>\n                <span id=\"combo-display\" class=\"text-lg font-bold text-yellow-400\">🔥 0</span>\n            </div>\n        </div>\n\n        <!-- 鼓勵字句 -->\n        <div id=\"cheer-msg\" class=\"h-8 text-xl font-bold text-pink-400 mb-2 opacity-0 transition-opacity duration-300\">\n            好叻！\n        </div>\n\n        <!-- 題目區域 -->\n        <div id=\"question-container\" class=\"relative w-full bg-gradient-to-b from-blue-500 to-blue-700 p-8 rounded-3xl shadow-2xl border-4 border-blue-400 mb-8 text-center\">\n            <h2 id=\"question-text\" class=\"text-6xl font-extrabold tracking-wider text-white drop-shadow-md\">\n                3 × 9 = ?\n            </h2>\n        </div>\n\n        <!-- 選擇按鈕 -->\n        <div id=\"options-container\" class=\"grid grid-cols-2 gap-4 w-full\"></div>\n        \n        <button onclick=\"backToMenu()\" class=\"mt-8 text-blue-300 underline text-sm hover:text-white\">\n            放棄並返去主目錄\n        </button>\n    </div>\n\n    <!-- 錯題庫管理畫面 -->\n    <div id=\"mistake-screen\" class=\"w-full max-w-md hidden flex-col bg-white/10 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-white/20\">\n        <h2 class=\"text-2xl font-bold mb-4 text-yellow-400 text-center\">📁 錯題庫管理</h2>\n        <p class=\"text-sm text-blue-200 mb-4 text-center\">剔選你已經識嘅題目，然後刪除佢哋。</p>\n        \n        <div id=\"mistake-list\" class=\"flex flex-col gap-2 max-h-64 overflow-y-auto mb-6 pr-2\">\n            <!-- 錯題列表由 JS 產生 -->\n        </div>\n\n        <div class=\"flex gap-2\">\n            <button onclick=\"deleteSelectedMistakes()\" class=\"flex-1 bg-red-500 hover:bg-red-400 text-white font-bold py-3 rounded-xl shadow-lg transition\">\n                刪除所選 🗑️\n            </button>\n            <button onclick=\"backToMenu()\" class=\"flex-1 bg-gray-500 hover:bg-gray-400 text-white font-bold py-3 rounded-xl shadow-lg transition\">\n                返回 🔙\n            </button>\n        </div>\n    </div>\n\n    <script>\n        let selectedTables = [];\n        let questionPool = [];\n        let currentQuestionIndex = 0;\n        let combo = 0;\n        let correctCount = 0;\n        let wrongCount = 0;\n        let currentQuestion = null;\n        let isPracticeMode = false;\n        \n        // 讀取錯題庫 (用 localStorage 保存)\n        let mistakeBank = [];\n        try {\n            const saved = localStorage.getItem('mathMistakes');\n            if (saved) mistakeBank = JSON.parse(saved);\n        } catch(e) { console.log(\"無法讀取 localStorage\"); }\n\n        function saveMistakes() {\n            try {\n                localStorage.setItem('mathMistakes', JSON.stringify(mistakeBank));\n            } catch(e) { co
