nsole.log(\"無法儲存至 localStorage\"); }\n        }\n\n        function startGame(practiceMode) {\n            isPracticeMode = practiceMode;\n            \n            if (isPracticeMode) {\n                if (mistakeBank.length === 0) {\n                    alert(\"錯題庫暫時冇題目喎！快啲去探險收集啦！\");\n                    return;\n                }\n                questionPool = [...mistakeBank];\n                shuffleArray(questionPool);\n            } else {\n                const checkboxes = document.querySelectorAll('.table-cb:checked');\n                selectedTables = Array.from(checkboxes).map(cb => parseInt(cb.value));\n                if (selectedTables.length === 0) {\n                    alert(\"請至少揀一個數字呀！\");\n                    return;\n                }\n                generateQuestionPool();\n            }\n\n            // 重置統計\n            combo = 0;\n            correctCount = 0;\n            wrongCount = 0;\n            currentQuestionIndex = 0;\n            \n            document.getElementById('start-screen').classList.add('hidden');\n            document.getElementById('game-screen').classList.remove('hidden');\n            document.getElementById('game-screen').classList.add('flex');\n\n            nextQuestion();\n        }\n\n        function generateQuestionPool() {\n            questionPool = [];\n            for (let num of selectedTables) {\n                for (let i = 1; i <= 9; i++) {\n                    questionPool.push({ a: num, b: i, answer: num * i, text: `${num} × ${i}` });\n                }\n            }\n            shuffleArray(questionPool);\n        }\n\n        function nextQuestion() {\n            if (currentQuestionIndex >= questionPool.length) {\n                // 一回合完成，重新洗牌\n                shuffleArray(questionPool);\n                currentQuestionIndex = 0;\n                correctCount = 0;\n                wrongCount = 0;\n            }\n\n            currentQuestion = questionPool[currentQuestionIndex];\n            document.getElementById('question-text').innerText = currentQuestion.text;\n            \n            updateStats();\n            generateOptions(currentQuestion);\n        }\n\n        function generateOptions(q) {\n            let options = new Set();\n            options.add(q.answer);\n\n            while(options.size < 4) {\n                let strategy = Math.random();\n                let wrongAns;\n                if (strategy < 0.33) {\n                    let offset = Math.random() > 0.5 ? 1 : -1;\n                    let fakeB = q.b + offset;\n                    if (fakeB < 1) fakeB = 2;\n                    if (fakeB > 9) fakeB = 8;\n                    wrongAns = q.a * fakeB;\n                } else if (strategy < 0.66) {\n                    let offset = Math.floor(Math.random() * 5) + 1;\n                    wrongAns = Math.random() > 0.5 ? q.answer + offset : q.answer - offset;\n                } else {\n                    wrongAns = Math.floor(Math.random() * (q.a * 9)) + 1;\n                }\n                \n                if (wrongAns > 0 && wrongAns !== q.answer) {\n                    options.add(wrongAns);\n                }\n            }\n\n            let optionsArray = Array.from(options);\n            shuffleArray(optionsArray);\n\n            const container = document.getElementById('options-container');\n            container.innerHTML = '';\n            \n            optionsArray.forEach(opt => {\n                let btn = document.createElement('button');\n                btn.className = 'option-btn bg-white text-blue-900 font-bold text-3xl py-6 rounded-2xl shadow-[0_6px_0_#94a3b8] hover:bg-blue-50 active:shadow-[0_0px_0_#94a3b8] active:translate-y-[6px]';\n                btn.innerText = opt;\n                btn.onclick = (e) => checkAnswer(opt, btn, e);\n                container.appendChild(btn);\n            });\n        }\n\n        function checkAnswer(selected, btn, event) {\n            const allBtns = document.querySelectorAll('.option-btn');\n            allBtns.forEach(b => b.disabled = true);\n\n            if (selected === currentQuestion.answer) {\n                btn.classList.replace('bg-white', 'bg-green-400');\n                btn.classList.replace('text-blue-900', 'text-white');\n                btn.classList.add('pop');\n                \n                combo++;\n                correctCount++;\n                currentQuestionIndex++;\n                \n                showFloatingStar(event.clientX, event.clientY);\n                createConfetti();\n                showCheerMessage();\n                updateStats();\n\n                setTimeout(() => { nextQuestion(); }, 1000);\n            } else {\n                btn.classList.replace('bg-white', 'bg-red-400');\n                btn.classList.replace('text-blue-900', 'text-white');\n                btn.classList.add('shake');\n                \n                combo = 0;\n                wrongCount++;\n                \n                // 加入錯題庫 (檢查是否已存在)\n                let exists = mistakeBank.some(m => m.a === currentQuestion.a && m.b === currentQuestion.b);\n                if (!exists) {\n                    mistakeBank.push(currentQuestion);\n                    saveMistakes();\n                }\n\n                currentQuestionIndex++;\n                updateStats();\n\n                allBtns.forEach(b => {\n                    if(parseInt(b.innerText) === currentQuestion.answer) {\n                        b.classList.replace('bg-white', 'bg-green-300');\n                    }\n                });\n\n                setTimeout(() => { nextQuestion(); }, 1500);\n            }\n        }\n\n        function updateStats() {\n            // 顯示進度: 目前第幾題 / 總題數\n            let currentDisplayNum = currentQuestionIndex + 1;\n            if (currentDisplayNum > questionPool.length) currentDisplayNum = questionPool.length;\n            \n            document.getElementById('progress-display').innerText = `${currentDisplayNum} / ${questionPool.length}`;\n            document.getElementById('correct-display').innerText = `✅ ${correctCount}`;\n            document.getElementById('wrong-display').innerText = `❌ ${wrongCount}`;\n            document.getElementById('combo-display').innerText = `🔥 ${combo}`;\n        }\n\n        function showCheerMessage() {\n            if (combo < 2) return;\n            const cheers = [\"好叻！🌟\", \"太勁啦！🚀\", \"完美！✨\", \"繼續保持！🔥\", \"天才！👑\"];\n            const msgDiv = document.getElementById('cheer-msg');\n            msgDiv.innerText = cheers[Math.floor(Math.random() * cheers.length)];\n            msgDiv.style.opacity = 1;\n            msgDiv.classList.add('pop');\n            setTimeout(() => {\n                msgDiv.style.opacity = 0;\n                msgDiv.classList.remove('pop');\n            }, 1000);\n        }\n\n        function showFloatingStar(x, y) {\n            const star = document.createElement('div');\n            star.innerText = '⭐';\n            star.className = 'floating-star';\n            star.style.left = (x - 20) + 'px';\n            star.style.top = (y - 20) + 'px';\n            document.body.appendChild(star);\n            setTimeout(() => star.remove(), 1000);\n        }\n\n        function createConfetti() {\n            const colors = ['#f59e0b', '#3b82f6', '#ec4899', '#10b981', '#a855f7'];\n            for(let i = 0; i < 30; i++) {\n                let conf = document.createElement('div');\n                conf.className = 'confetti';\n                conf.style.left = Math.random() * 100 + 'vw';\n                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];\n                conf.style.animationDuration = (Math.random() * 1.5 + 1) + 's';\n                document.body.appendChild(conf);\n                setTimeout(() => conf.remove(), 2500);\n            }\n        }\n\n        function shuffleArray(array) {\n            for (let i = array.length - 1; i > 0; i--) {\n                const j = Math.floor(Math.random() * (i + 1));\n                [array[i], array[j]] = [array[j], array[i]];\n            }\n        }\n\n        // --- 錯題庫管理功能 ---\n        function openMistakeManager() {\n            document.getElementById('start-screen').classList.add('hidden');\n            document.getElementById('mistake-screen').classList.remove('hidden');\n            document.getElementById('mistake-screen').classList.add('flex');\n            renderMistakeList();\n        }\n\n        function renderMistakeList() {\n            const list = document.getElementById('mistake-list');\n            list.innerHTML = '';\n            \n            if (mistakeBank.length === 0) {\n                list.innerHTML = '<p class=\"text-center text-green-300 py-4\">太棒啦！暫時冇錯題！🎉</p>';\n                return;\n            }\n\n            mistakeBank.forEach((m, index) => {\n                const div = document.createElement('div');\n                div.className = 'flex items-center justify-between bg-white/10 p-3 rounded-lg';\n                div.innerHTML = `\n                    <span class=\"text-xl font-bold text-white\">${m.text} = ${m.answer}</span>\n                    <input type=\"checkbox\" class=\"mistake-cb\" data-index=\"${index}\">\n                `;\n                list.appendChild(div);\n            });\n        }\n\n        function deleteSelectedMistakes() {\n            const checkboxes = document.querySelectorAll('.mistake-cb:checked');\n            if (checkboxes.length === 0) {\n                alert(\"請先剔選想刪除嘅題目！\");\n                return;\n            }\n            \n            // 收集要刪除嘅 index (由大至小排，避免刪除時 index 走位)\n            let indexesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-index'))).sort((a, b) => b - a);\n            \n            indexesToDelete.forEach(idx => {\n                mistakeBank.splice(idx, 1);\n            });\n            \n            saveMistakes();\n            renderMistakeList();\n        }\n\n        function backToMenu() {\n            document.getElementById('game-screen').classList.add('hidden');\n            document.getElementById('game-screen').classList.remove('flex');\n            document.getElementById('mistake-screen').classList.add('hidden');\n            document.getElementById('mistake-screen').classList.remove('flex');\n            document.getElementById('start-screen').classList.remove('hidden');\n            document.getElementById('start-screen').classList.add('flex');\n        }\n    <\/script>\n\n    </div>\n\n<script>\n    function showQuizView() {\n        document.getElementById('view-table').classList.add('is-hidden');\n        document.getElementById('view-quiz').classList.add('is-active');\n        if (typeof backToMenu === 'function') backToMenu();\n    }\n    function showTableView() {\n        document.getElementById('view-quiz').classList.remove('is-active');\n        document.getElementById('view-table').classList.remove('is-hidden');\n    }\n\n    document.addEventListener(\"DOMContentLoaded\", () => {\n        document.getElementById('btn-quiz').addEventListener('click', showQuizView);\n        const gridContainer = document.getElementById('multiplication-grid');\n        for (let col = 1; col <= 9; col++) {\n            const header = document.createElement('div');\n            header.className = `col-header ${col % 2 !== 0 ? 'header-green' : 'header-orange'}`;\n            header.textContent = col;\n            header.addEventListener('click', () => {\n                const columnCells = document.querySelectorAll(`#view-table .cell[data-col=\"${col}\"]`);\n                let allRevealed = true;\n                columnCells.forEach(cell => { if (!cell.classList.contains('revealed')) allRevealed = false; });\n                columnCells.forEach(cell => {\n                    if (allRevealed) cell.classList.remove('revealed');\n                    else cell.classList.add('revealed');\n                });\n            });\n            gridContainer.appendChild(header);\n        }\n        for (let row = 1; row <= 9; row++) {\n            for (let col = 1; col <= 9; col++) {\n                const cell = document.createElement('div');\n                cell.className = 'cell';\n                cell.setAttribute('data-col', col);\n                const equation = document.createElement('span');\n                equation.className = 'equation';\n                equation.textContent = `${col}x${row}=`;\n                const answer = document.createElement('span');\n                answer.className = 'answer';\n                answer.classList.add(row % 2 !== 0 ? 'answer-red' : 'answer-green');\n                answer.textContent = col * row;\n                cell.appendChild(equation);\n                cell.appendChild(answer);\n                cell.addEventListener('click', () => cell.classList.toggle('revealed'));\n                gridContainer.appendChild(cell);\n            }\n        }\n        const allCells = document.querySelectorAll('#view-table .cell');\n        document.getElementById('btn-show').addEventListener('click', () => allCells.forEach(c => c.classList.add('revealed')));\n        document.getElementById('btn-hide').addEventListener('click', () => allCells.forEach(c => c.classList.remove('revealed')));\n    });\n<\/script>\n</body>\n</html>\n"
  };
  const META = [{"id": "en-vocab", "label": "英文 · 生字認讀", "short": "英文生字", "icon": "📖"}, {"id": "zh-flash", "label": "中文 · 生字認讀", "short": "中文生字", "icon": "🀄"}, {"id": "zh-lexlist", "label": "中文 · 低小詞語", "short": "低小詞語", "icon": "📚"}, {"id": "math-table", "label": "數學 · 乘數表", "short": "乘數表", "icon": "✖️"}];
  const STORAGE_KEY = 'karson-hub-last-page';
  const PROGRESS_KEYS = ["karson-hub-last-page", "zh-lexlist-off-v1", "zh-lexlist-view-v1", "flashcard_profiles", "flashcard_current_profile", "mathMistakes", "en-vocab-last-theme", "paul-party-learned-words-v1", "paul-party-learned-words"];

  const frame = document.getElementById('app-frame');
  const toggle = document.getElementById('menu-toggle');
  const panel = document.getElementById('menu-panel');
  const backdrop = document.getElementById('menu-backdrop');
  const currentLabel = document.getElementById('menu-current');
  const statusEl = document.getElementById('menu-status');
  const importFile = document.getElementById('import-file');

  function closeMenu() {
    panel.classList.remove('open');
    backdrop.classList.remove('open');
  }
  function openMenu() {
    panel.classList.add('open');
    backdrop.classList.add('open');
    refreshStatus();
  }

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (panel.classList.contains('open')) closeMenu();
    else openMenu();
  });
  backdrop.addEventListener('click', closeMenu);

  function setActiveButton(pageId) {
    document.querySelectorAll('.menu-item[data-page]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.page === pageId);
    });
  }

  const EXTERNAL_PAGES = {};

  function loadPage(pageId) {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    const external = EXTERNAL_PAGES[pageId];
    if (external) {
      frame.removeAttribute('srcdoc');
      frame.src = external;
    } else {
      const html = PAGES[pageId];
      if (!html) return;
      frame.removeAttribute('src');
      frame.srcdoc = html;
    }
    try { localStorage.setItem(STORAGE_KEY, pageId); } catch (e) {}
    const meta = META.find(m => m.id === pageId);
    currentLabel.textContent = '而家：' + (meta ? meta.label : pageId);
    setActiveButton(pageId);
    closeMenu();
    document.title = (meta ? meta.short : '學習') + ' · Karson_Learn';
    refreshStatus();
  }

  function refreshStatus() {
    try {
      let bits = [];
      const off = localStorage.getItem('zh-lexlist-off-v1');
      if (off) {
        const arr = JSON.parse(off);
        bits.push('字詞已學 ' + (Array.isArray(arr) ? arr.length : 0));
      }
      const learned = localStorage.getItem('paul-party-learned-words-v1') || localStorage.getItem('paul-party-learned-words');
      if (learned) {
        const arr = JSON.parse(learned);
        bits.push('英文已學 ' + (Array.isArray(arr) ? arr.length : 0));
      }
      const last = localStorage.getItem(STORAGE_KEY);
      if (last) bits.push('上次頁：' + last);
      statusEl.textContent = bits.length ? bits.join(' · ') : '尚未有練習進度（一做就會自動記）';
    } catch (e) {
      statusEl.textContent = '進度摘要讀取失敗';
    }
  }

  function collectProgress() {
    const data = {};
    PROGRESS_KEYS.forEach(k => {
      const v = localStorage.getItem(k);
      if (v !== null) data[k] = v;
    });
    return {
      app: 'Karson_Learn',
      version: 1,
      exportedAt: new Date().toISOString(),
      keys: data
    };
  }

  function exportProgress() {
    const blob = new Blob([JSON.stringify(collectProgress(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    a.href = URL.createObjectURL(blob);
    a.download = 'Karson_Learn_progress_' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    alert('已匯出進度備份（含低小詞語已學標記）。請存去 Files。');
  }

  function importProgress(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        const keys = obj.keys || obj;
        let n = 0;
        Object.keys(keys).forEach(k => {
          if (PROGRESS_KEYS.includes(k) || k.startsWith('karson-') || k.startsWith('zh-lexlist') || k.startsWith('flashcard_') || k.startsWith('paul-party') || k === 'mathMistakes' || k === 'en-vocab-last-theme') {
            localStorage.setItem(k, keys[k]);
            n += 1;
          }
        });
        alert('已匯入 ' + n + ' 項進度。將重新載入上次頁面。');
        const page = localStorage.getItem(STORAGE_KEY) || META[0].id;
        loadPage(page);
      } catch (e) {
        alert('匯入失敗：檔案格式唔正確');
      }
    };
    reader.readAsText(file);
  }

  document.getElementById('btn-export').addEventListener('click', exportProgress);
  document.getElementById('btn-import').addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', () => {
    if (importFile.files && importFile.files[0]) importProgress(importFile.files[0]);
    importFile.value = '';
  });

  document.querySelectorAll('.menu-item[data-page]').forEach(btn => {
    btn.addEventListener('click', () => loadPage(btn.dataset.page));
  });

  let startId = META[0].id;
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && (PAGES[saved] || EXTERNAL_PAGES[saved])) startId = saved;
    if (saved === 'en-paul') startId = 'en-vocab';
    if (saved === 'math-test') startId = 'math-table';
  } catch (e) {}
  loadPage(startId);
  </script>
</body>
</html>
