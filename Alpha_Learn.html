: 0 2px;\n                    \"\n                    >__（升華句）__</span\n                  >。\n                </p>\n                <p class=\"fill-tip text-xs mt-2\" style=\"color: #9d174d\">\n                  💡\n                  填好藍色空格後，再按各段字數（約50／80–90字）擴寫成完整段落。\n                </p>\n              </div>\n            </details>\n            <!-- fill-template:lyrical /-->\n            <div class=\"mb-4 flex-grow\">\n              <h3\n                class=\"font-semibold text-gray-700 bg-gray-100 inline-block px-2 py-1 rounded mb-2\"\n              >\n                🎯 常見題目雜錦\n              </h3>\n              <ul class=\"list-none text-gray-700 text-sm space-y-3 ml-1\">\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《媽媽的白髮》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換寫對象（如爺爺的皺紋、畢業禮物），結合具體事例抒情。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□借物抒情 □感情真摯\n                      □結尾升华</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-pink-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-pink-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第一段·開頭</span\n                        >有一天，我無意中發現媽媽的鬢角長出了幾根白髮。<mark\n                          class=\"kw-highlight\"\n                          >那一刻</mark\n                        >，我的心猛然一揪，才驚覺歲月已在媽媽身上悄悄留下痕跡。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >回想小時候，媽媽總是精神飽滿，烏黑的長髮紮成馬尾，忙前忙後地照顧家庭。無論多麼辛勞，她從不在我面前訴苦，永遠帶着溫柔的笑容。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第三段·敘事</span\n                        >上個月我發高燒，媽媽徹夜守在床邊，不斷為我換毛巾、餵藥。天亮時，我看見她疲憊的雙眼和凌亂的頭髮，才知道那些白髮是為我操心而長出的。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第四段·抒情</span\n                        >我輕輕握住媽媽的手，<mark class=\"kw-highlight\"\n                          >心裏</mark\n                        >湧起無盡的<mark class=\"kw-highlight\">感激</mark\n                        >與愧疚。我為自己曾經的任性和疏忽感到慚愧，也<mark\n                          class=\"kw-highlight\"\n                          >終於</mark\n                        >明白，媽媽的每一根白髮，都承載着對我無私的愛。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第五段·總結</span\n                        ><mark class=\"kw-highlight\">從此</mark\n                        >，我學會主動分擔家務，用功讀書，不讓媽媽再為我過度憂心。但願時光能對她溫柔一些，因為她是我生命中最重要的人。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《一份珍貴的禮物》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換寫對象（如爺爺的皺紋、畢業禮物），結合具體事例抒情。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□借物抒情 □感情真摯\n                      □結尾升华</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-pink-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-pink-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第一段·開頭</span\n                        >在我抽屜裏，珍藏着一份看似普通的禮物——爸爸親手為我製作的書籤。它<mark\n                          class=\"kw-highlight\"\n                          >雖然</mark\n                        >不值錢，卻是我收過最珍貴的禮物。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >去年生日前夕，我無意中說想要一個特別的書籤。爸爸平日工作繁忙，我並不寄望他會記在心上。沒想到生日當天，他遞給我一個精緻的小盒子。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第三段·敘事</span\n                        >打開盒子，一枚木製書籤呈現眼前。上面刻着我的名字，還有一行字：「努力讀書，追求夢想。」爸爸說，這是他利用晚間休息時間，一筆一劃親手刻製的。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第四段·抒情</span\n                        >我接過書籤，眼眶不禁濕潤。爸爸不擅言詞，卻用行動表達關愛。這份禮物承載的不只是心意，更是父親對我殷切的期望和無聲的支持。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第五段·總結</span\n                        >每當讀書時，我總會用上這枚書籤。它時刻提醒我要珍惜父愛，努力向上。禮物的價值不在貴賤，而在於那份真摯的情意。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《感恩有你》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換寫對象（如爺爺的皺紋、畢業禮物），結合具體事例抒情。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□借物抒情 □感情真摯\n                      □結尾升华</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-pink-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-pink-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第一段·開頭</span\n                        >成長路上，有許多人默默陪伴和扶持。每當回想，我心底總會湧起一股暖流，想對他們說一聲：<mark\n                          class=\"kw-highlight\"\n                          >感恩</mark\n                        >有你。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >感謝父母，無論風雨，他們總是為我撐起一片天。生病時的悉心照料，考試失敗時的鼓勵，都是我最堅實的後盾，讓我勇敢面對每一次挑戰。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第三段·敘事</span\n                        >感謝老師，用耐心和愛心教導我們。記得陳老師為了幫我改善作文，放學後仍留下來逐句批改，直到我領悟為止。她的認真，深深影響了我。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第四段·抒情</span\n                        >也感謝同學和朋友，在我失落時給予陪伴，在我成功時真誠祝賀。正是這些溫暖的關懷，讓我的童年充滿色彩，不再感到孤單。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第五段·總結</span\n                        ><mark class=\"kw-highlight\">感恩</mark\n                        >不是一句空話，而是要用行動回報。我願意以努力學習和真誠待人，答謝每一個曾經幫助過我的人。感恩有你，讓我的生命更加豐盛。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《我最捨不得的……》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換寫對象（如爺爺的皺紋、畢業禮物），結合具體事例抒情。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□借物抒情 □感情真摯\n                      □結尾升华</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-pink-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-pink-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第一段·開頭</span\n                        >小學畢業的日子漸漸逼近，我最捨不得的，是這間陪伴我六年的母校，以及這裏的一草一木。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >還記得一年級第一天，我緊握媽媽的手，戰戰兢兢地走進校門。是班主任溫柔的招呼，讓我漸漸放鬆。<mark\n                          class=\"kw-highlight\"\n                          >從此</mark\n                        >，這裏成為我學習和玩耍的第二個家。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第三段·敘事</span\n                        >操場上，我們曾為班際比賽拼盡全力；圖書館裏，我們安靜地沉浸在書海中；課室裏，同學們一起歡笑，也一起為考試<mark\n                          class=\"kw-highlight\"\n                          >緊張</mark\n                        >。每一個角落，都留下難忘的回憶。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第四段·抒情</span\n                        >想到即將離別，<mark class=\"kw-highlight\">心裏</mark\n                        >便湧起不捨。捨不得熟悉的鐘聲，捨不得同窗的情誼，更捨不得曾教導我的每一位老師。母校給予我的，遠不止知識。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第五段·總結</span\n                        ><mark class=\"kw-highlight\">雖然</mark\n                        >要告別，但我會帶着母校的教誨繼續前行。但願日後有機會回來，再看一看這片承載着童年歡笑的土地，向它說聲謝謝。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《那一次，我感動了》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換寫對象（如爺爺的皺紋、畢業禮物），結合具體事例抒情。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□借物抒情 □感情真摯\n                      □結尾升华</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-pink-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-pink-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第一段·開頭</span\n                        >有些瞬間，會深深觸動我們的心靈。上個月的班際接力賽，便讓我體會到了團隊精神帶來的<mark\n                          class=\"kw-highlight\"\n                          >感動</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >比賽當天，我們班被安排在第四組。輪到我接棒時，因為<mark\n                          class=\"kw-highlight\"\n                          >緊張</mark\n                        >，起跑稍慢，眼看我們落後其他班組，<mark\n                          class=\"kw-highlight\"\n                          >心裏</mark\n                        >十分焦急。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第三段·敘事</span\n                        >就在這時，同學們在跑道兩旁大聲呐喊，為我加油。聽着整齊的口號聲，我渾身充滿力量，拼盡全力衝刺，<mark\n                          class=\"kw-highlight\"\n                          >終於</mark\n                        >把棒交給下一位同學，慢慢縮短了差距。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第四段·抒情</span\n                        >最後一棒，我們班<mark class=\"kw-highlight\"\n                          >逆轉勝出</mark\n                        >。同學們互相擁抱，<mark class=\"kw-highlight\"\n                          >歡呼雀躍</mark\n                        >。<mark class=\"kw-highlight\">那一刻</mark\n                        >，我眼眶濕潤——不是因為勝利，而是被全班同學<mark\n                          class=\"kw-highlight\"\n                          >齊心協力</mark\n                        >的精神深深感動。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第五段·總結</span\n                        >這次經歷讓我明白：一個人的力量有限，但團隊<mark\n                          class=\"kw-highlight\"\n                          >合作</mark\n                        >可以創造奇蹟。<mark class=\"kw-highlight\">感動</mark\n                        >來自真誠的付出，我會永遠記住這份同窗的情誼。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《童年的回憶》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換寫對象（如爺爺的皺紋、畢業禮物），結合具體事例抒情。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□借物抒情 □感情真摯\n                      □結尾升华</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-pink-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-pink-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第一段·開頭</span\n                        >童年像一幅色彩斑斕的畫，每一筆都記錄着歡笑與淚水。閉上眼睛，許多片段仍清晰地在腦海中浮現。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >還記得童年時，我最喜歡與鄰居同齡的同學在樓下嬉戲。我們跳繩、踢毽子、捉迷藏，常常玩到日落西山，才在父母的呼喚聲中依依不捨地回家。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第三段·敘事</span\n                        >暑假裏，爺爺常帶我到海邊游泳。沙灘上，我們堆砌沙堡，追逐浪花。爺爺總是笑呵呵地看着我，偶爾遞上一支冰凍的汽水，清涼甘甜，至今難忘。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第四段·抒情</span\n                        >那些<mark class=\"kw-highlight\">無憂無慮</mark\n                        >的日子，<mark class=\"kw-highlight\">雖然</mark\n                        >簡單，卻充滿溫暖。如今長大了，功課和壓力漸增，但每當感到疲累，我便回想童年，<mark\n                          class=\"kw-highlight\"\n                          >心裏</mark\n                        >便會湧起一股力量。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第五段·總結</span\n                        >童年不可重來，但回憶可以永存。我會珍惜當下，也好好保存這份純真的記憶，讓它成為我成長路上最溫柔的慰藉。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《我愛我的家》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換寫對象（如爺爺的皺紋、畢業禮物），結合具體事例抒情。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□借物抒情 □感情真摯\n                      □結尾升华</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-pink-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-pink-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >開頭</span\n                        >家，是每個人最溫暖的港灣。無論走到哪裏，我心底最牽掛的，永遠是我的家。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >每天放學，推開家門，便聞到飯菜的香氣。媽媽在廚房忙碌，爸爸閱讀報章，弟弟分享學校的趣事，這些平凡的畫面，構成了我最熟悉的風景。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >週末，我們常一起到郊外遠足，或在家看電影、聊天。<mark\n                          class=\"kw-highlight\"\n                          >雖然</mark\n                        >沒有豪華的享受，但一家人團聚，談笑風生，已感到無比幸福。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第四段·抒情</span\n                        >我深深<mark class=\"kw-highlight\">感激</mark\n                        >父母為家庭無私的付出。他們用愛與耐心，為我們營造安穩的生活，讓我在成長路上從不感到孤單。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >總結</span\n                        >我愛我的家，不僅因為血脈相連，更因為這裏有無條件的愛。我會努力成為家人的<mark\n                          class=\"kw-highlight\"\n                          >驕傲</mark\n                        >，也將這份溫暖傳遞下去。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《難忘的老師》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換寫對象（如爺爺的皺紋、畢業禮物），結合具體事例抒情。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□借物抒情 □感情真摯\n                      □結尾升华</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-pink-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-pink-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >開頭</span\n                        >人生路上，總有一些老師的教誨，長留心底。陳老師，便是我最難忘的一位。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >她教中文，上課時總能把枯燥的語文知識講得生動有趣。她鼓勵我們多閱讀，還在課室設立圖書角，讓同學自由借閱。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >我作文曾經寫得平淡，陳老師逐篇批改，指出優點和不足，並推薦範文讓我學習。在她的指導下，我的寫作漸有進步。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第四段·抒情</span\n                        >畢業前夕，她對我們說：「讀萬卷書，行萬里路。」這句話像一盞明燈，照亮我前行的方向，我對她充滿<mark\n                          class=\"kw-highlight\"\n                          >感激</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >總結</span\n                        ><mark class=\"kw-highlight\">雖然</mark\n                        >已升讀中學，我仍會記住陳老師的教誨。她讓我明白：良師的影響，可以跨越歲月，成為一生的財富。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong>《畢業感言》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換寫對象（如爺爺的皺紋、畢業禮物），結合具體事例抒情。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□借物抒情 □感情真摯\n                      □結尾升华</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-pink-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-pink-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >開頭</span\n                        >六年的小學生活，轉眼即將畫上句號。站在畢業的門檻，百感交集，有不舍，也有期待。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >還記得第一天戴上校徽，<mark class=\"kw-highlight\"\n                          >緊張</mark\n                        >地踏進校園。六年間，我們在這裏讀書、運動、參加活動，從稚嫩的孩子，漸漸長成少年。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >感謝每一位老師的教導，感謝同學的陪伴。那些一起溫習、一起歡笑、甚至一起爭執的日子，都將成為我心底最珍貴的寶藏。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第四段·抒情</span\n                        >母校給予我的，不只是知識，更有<mark\n                          class=\"kw-highlight\"\n                          >誠信</mark\n                        >、<mark class=\"kw-highlight\">堅毅</mark>和<mark\n                          class=\"kw-highlight\"\n                          >合作</mark\n                        >的價值觀。這些無形的禮物，將伴隨我走向更遠的路。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >總結</span\n                        >再見了，母校！我會帶着您的祝福，勇敢迎接中學的新挑戰，並且常回來，看看這片承載着童年回憶的土地。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《故鄉的情意》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換寫對象（如爺爺的皺紋、畢業禮物），結合具體事例抒情。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□借物抒情 □感情真摯\n                      □結尾升华</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-pink-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-pink-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >開頭</span\n                        >每逢佳節，我隨父母回鄉探親。<mark class=\"kw-highlight\"\n                          >雖然</mark\n                        >在都市長大，我對這片祖先的土地仍懷有深厚的感情。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >鄉下的小徑兩旁，是綠油油的稻田和樸實的村屋。爺爺總是站在門口迎接，臉上堆滿笑容，緊緊握住我們的手。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第二段·敘事</span\n                        >晚飯時，親戚圍坐一桌，分享近況。話語夾雜鄉音，卻格外親切。飯後，我們在庭院乘涼，看星星點點，聽蟲鳴蛙叫。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >第四段·抒情</span\n                        >短暫的相聚，讓我感受到血濃於水的親情。無論城市如何繁華，故鄉永遠是我心靈的歸宿，根之所在。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-pink-100 text-pink-700\"\n                          >總結</span\n                        >我願意記住這份樸實的情意，將來無論身在何處，都不忘本，珍惜與親人的每一次團聚。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n              </ul>\n            </div>\n            <div\n              class=\"bg-pink-50 border-l-4 border-pink-400 p-3 rounded mt-auto\"\n            >\n              <p class=\"text-xs text-pink-800\">\n                <strong>💡 寫作小貼士：</strong>\n                情感必須建基於具體事件上。例如寫《媽媽的白髮》，可先記述生病時媽媽徹夜照顧自己的細節，再自然地抒發內心的感激與愧疚。\n              </p>\n            </div>\n          </div>\n        </div>\n\n        <!-- 4. 說明文 -->\n        <div\n          id=\"cat-expository\"\n          class=\"bg-white rounded-xl shadow-md overflow-hidden border-t-4 border-purple-500 hover:shadow-lg transition-shadow duration-300\"\n        >\n          <div class=\"p-6 h-full flex flex-col\">\n            <h2\n              class=\"text-2xl font-bold text-purple-700 mb-3 flex items-center\"\n            >\n              <span class=\"mr-2\">🔍</span> 說明文\n            </h2>\n            <div class=\"mb-4\">\n              <h3\n                class=\"font-semibold text-gray-700 bg-purple-50 inline-block px-2 py-1 rounded mb-2\"\n              >\n                📌 教育局要求重點\n              </h3>\n              <p class=\"text-gray-600 text-sm leading-relaxed\">\n                【小五至小六】辨識題眼、中心句及標示語（首先、其次等）；運用舉例、分類、數字說明；採用「總—分—總」結構（TSA小六短文常考說明文）。\n                <br /><span\n                  class=\"grade-cat-note grade-legend block text-xs text-gray-600 mt-2\"\n                  >【小五】說明事物、分點列述｜【小六】社會文化議題說明（「智能手機」「非遺文化」標<strong>小六</strong>，其餘標<strong>小五</strong>）</span\n                >\n              </p>\n            </div>\n\n            <p class=\"structure-tag\">\n              結構：總說明 ➔ 分點一 ➔ 分點二 ➔ 總結呼籲\n            </p>\n            <!-- fill-template:expository -->\n            <details class=\"fill-template fill-purple mb-4\">\n              <summary class=\"fill-summary\" style=\"color: #5b21b6\">\n                <span>📝 萬能填充思考區（說明文）</span>\n                <span class=\"fill-hint text-xs font-normal text-gray-500\"\n                  >動筆前先填好各段重點</span\n                >\n              </summary>\n              <div\n                class=\"fill-body\"\n                style=\"background: #f5f3ff; border-color: #c4b5fd\"\n              >\n                <p class=\"fill-line\">\n                  <strong>第一段（總述）：</strong\n                  ><span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（說明對象）__</span\n                  >與我們的生活<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（關係）__</span\n                  >。了解<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（對象）__</span\n                  >，有助<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（好處）__</span\n                  >。本文將說明<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（要點一）__</span\n                  >和<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（要點二）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第二段（分點一）：</strong>首先，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（第一個特點／方法）__</span\n                  >。例如，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（具體例子）__</span\n                  >。這樣可以<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（效果）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第三段（分點二）：</strong>其次，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（第二個特點／方法）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（補充說明）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（數字／分類／比較）__</span\n                  >，可見<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（小結）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第四段（分點三）：</strong>此外，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（第三個特點／注意事項）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（舉例或說明）__</span\n                  >。因此，我們應<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（建議）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第五段（總結）：</strong>綜上所述，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（重申中心）__</span\n                  >。只要我們<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（呼籲行動）__</span\n                  >，便能<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（預期效果）__</span\n                  >。讓我們一起<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #7c3aed;\n                      border-bottom: 1px dashed #7c3aed;\n                      padding: 0 2px;\n                    \"\n                    >__（具體行動）__</span\n                  >。\n                </p>\n                <p class=\"fill-tip text-xs mt-2\" style=\"color: #5b21b6\">\n                  💡\n                  填好藍色空格後，再按各段字數（約50／80–90字）擴寫成完整段落。\n                </p>\n              </div>\n            </details>\n            <!-- fill-template:expository /-->\n            <div class=\"mb-4 flex-grow\">\n              <h3\n                class=\"font-semibold text-gray-700 bg-gray-100 inline-block px-2 py-1 rounded mb-2\"\n              >\n                🎯 常見題目雜錦\n              </h3>\n              <ul class=\"list-none text-gray-700 text-sm space-y-3 ml-1\">\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《如何保護我們的地球》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：選同類題目，用「總—分—總」；每段一個分點。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□分點清楚 □有例子 □結尾呼籲</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-purple-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-purple-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第一段·總述</span\n                        >地球是我們賴以生存的家園，但污染和浪費正威脅着它的健康。保護地球，是每個人不可推卸的<mark\n                          class=\"kw-highlight\"\n                          >責任</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第二段·分點一</span\n                        ><mark class=\"kw-highlight\">首先</mark\n                        >，我們應該節約用水和用電。隨手關掉不使用的電燈和電器，縮短淋浴時間，這些看似微小的舉動，長遠下來可以減少大量資源消耗。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第三段·分點二</span\n                        ><mark class=\"kw-highlight\">其次</mark\n                        >，要實踐垃圾分類和減少使用膠袋。把紙張、膠樽和廚餘分開回收，購物時自備<mark\n                          class=\"kw-highlight\"\n                          >環保</mark\n                        >袋，可以減少堆填區的壓力，也有助資源循環再用。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第四段·分點三</span\n                        ><mark class=\"kw-highlight\">此外</mark\n                        >，多乘搭公共交通工具，少開私家車，可以減低碳排放，改善空氣質素。我們也可以多種植綠色植物，為城市增添一抹生機。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第五段·總結</span\n                        >保護地球不能只靠口號，必須從日常生活做起。只要人人出一分力，積少成多，定能讓我們的家園更加美好，留給下一代一個健康的環境。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《介紹香港的一種地道美食》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：選同類題目，用「總—分—總」；每段一個分點。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□分點清楚 □有例子 □結尾呼籲</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-purple-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-purple-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第一段·總述</span\n                        >香港被譽為「美食天堂」，其中魚蛋粉麵是最具代表性的地道小吃之一，深受本地人和遊客喜愛。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第二段·分點一</span\n                        >魚蛋粉麵的主要材料包括彈牙的魚蛋、幼滑的河粉或麵條，以及以魚骨和蝦殼熬製的濃郁湯底。湯頭鮮甜而不膩，是這道小吃的靈魂所在。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第三段·分點二</span\n                        >製作時，師傅先把河粉或麵條燙熟，放入碗中，再加入數顆魚蛋和蔥花。部分食肆還會提供魚片、牛丸等配料，讓食客按喜好選擇。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第四段·分點三</span\n                        >魚蛋粉麵價格相宜，一般只需數十元，<mark\n                          class=\"kw-highlight\"\n                          >因此</mark\n                        >成為街坊日常的選擇。無論在茶餐廳還是街邊小店，都可以品嚐到這道充滿港式風味的美食。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第五段·總結</span\n                        >魚蛋粉麵不僅是果腹的食物，更承載了香港人的集體回憶。它簡單而美味，是這座城市獨特飲食文化的縮影。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong>《智能手機的利與弊》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：選同類題目，用「總—分—總」；每段一個分點。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□分點清楚 □有例子 □結尾呼籲</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-purple-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-purple-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第一段·總述</span\n                        >智能手機已成為現代人生活不可或缺的工具，它帶來便利之餘，也產生一些問題，值得我們客觀分析。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第二段·分點一</span\n                        >智能手機的優點十分明顯。它可以隨時查閱資料，方便學習；也能透過通訊軟件與親友聯繫，縮短距離。遇到緊急情況，更可迅速求助。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第三段·分點二</span\n                        ><mark class=\"kw-highlight\">然而</mark\n                        >，過度使用也帶來弊端。長時間低頭看屏幕，容易損害視力和頸椎；沉迷網絡遊戲和社交媒體，會影響學業和睡眠，甚至疏遠現實中的人際關係。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第四段·分點三</span\n                        ><mark class=\"kw-highlight\">此外</mark\n                        >，網上資訊真假難辨，若缺乏判斷力，容易被誤導。部分學生更會在上課時偷看手機，分散注意力，影響學習效果。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第五段·總結</span\n                        >智能手機本身並無過錯，關鍵在於如何正確使用。我們應該合理安排時間，把它當作輔助工具，而非生活的全部，才能趨利避害。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《水的重要性》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：選同類題目，用「總—分—總」；每段一個分點。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□分點清楚 □有例子 □結尾呼籲</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-purple-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-purple-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第一段·總述</span\n                        >水是生命之源，沒有水，地球上的一切生物都無法生存。了解水的重要性，有助我們更加珍惜這份寶貴的資源。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第二段·分點一</span\n                        >對人體而言，水佔體重約七成，參與新陳代謝、調節體溫和運送養分。成人每天需要飲用約八杯水，才能維持身體正常運作，缺水會導致頭暈和疲勞。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第三段·分點二</span\n                        >在農業方面，水是灌溉農作物的必需品。沒有充足的水源，農田會乾涸，糧食產量下降，直接影響人類的糧食供應和生存。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第四段·分點三</span\n                        >在工業和日常生活中，水也用途廣泛，包括發電、清潔和製造等。<mark\n                          class=\"kw-highlight\"\n                          >然而</mark\n                        >，全球淡水資源有限，許多地區正面臨缺水危機，節約用水<mark\n                          class=\"kw-highlight\"\n                          >刻不容緩</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第五段·總結</span\n                        >水看似平常，卻是維持生命和社會運轉的關鍵。我們應該從小事做起，節約每一滴水，共同守護這份無價的自然恩賜。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《介紹一本好書》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：選同類題目，用「總—分—總」；每段一個分點。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□分點清楚 □有例子 □結尾呼籲</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-purple-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-purple-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第一段·總述</span\n                        >閱讀可以開拓視野，豐富心靈。今天，我想介紹一本對我影響至深的好書——《西遊記》。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第二段·分點一</span\n                        >《西遊記》是明代吳承恩所著的古典小說，講述唐僧師徒四人西天取經的故事。全書情節曲折離奇，充滿想像力，讀來趣味盎然。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第三段·分點二</span\n                        >書中人物個性鮮明：孫悟空機智勇敢，豬八戒憨厚可愛，沙僧忠厚老實。他們歷經九九八十一難，始終堅持不放棄，展現了團隊<mark\n                          class=\"kw-highlight\"\n                          >合作</mark\n                        >和<mark class=\"kw-highlight\">堅毅</mark>的精神。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第四段·分點三</span\n                        >這本書不僅是娛樂讀物，也蘊含深刻道理。它教導我們面對困難要勇敢克服，對待同伴要真誠互助，對目標要持之以恆。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第五段·總結</span\n                        >《西遊記》<mark class=\"kw-highlight\">歷久不衰</mark\n                        >，適合不同年齡的讀者。我誠意推薦這本書，相信每位讀者都能從中獲得啟發，享受閱讀的樂趣。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《我的家鄉》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換寫對象（如爺爺的皺紋、畢業禮物），結合具體事例抒情。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□借物抒情 □感情真摯\n                      □結尾升华</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-purple-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-purple-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第一段·總述</span\n                        >我的家鄉是香港，這是一座充滿活力與魅力的城市。<mark\n                          class=\"kw-highlight\"\n                          >雖然</mark\n                        >面積不大，卻融合了東西方文化，獨樹一幟。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第二段·分點一</span\n                        >香港地理位置優越，是國際金融和貿易中心。維多利亞港的夜景<mark\n                          class=\"kw-highlight\"\n                          >舉世聞名</mark\n                        >，兩岸高樓大廈燈火輝煌，與海水<mark\n                          class=\"kw-highlight\"\n                          >交相輝映</mark\n                        >，被譽為「<mark class=\"kw-highlight\">東方之珠</mark\n                        >」。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第三段·分點二</span\n                        >除了現代化的都市面貌，香港也保留不少自然風光。從市區出發，不久便可到達郊野公園，登山遠足，親近綠色大自然，平衡都市生活的節奏。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第四段·分點三</span\n                        >在飲食方面，香港匯聚中西美食，從點心到街頭小食，應有盡有。<mark\n                          class=\"kw-highlight\"\n                          >此外</mark\n                        >，這裏重視教育，設有完善的學校和公共設施，為居民提供良好的生活環境。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >第五段·總結</span\n                        >我為生於香港、長於香港而感到<mark class=\"kw-highlight\"\n                          >驕傲</mark\n                        >。這座城市見證了我的成長，我願意將來為它的發展出一分力，讓家鄉變得更加美好。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《愛護眼睛》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：選同類題目，用「總—分—總」；每段一個分點。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□分點清楚 □有例子 □結尾呼籲</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-purple-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-purple-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >總述</span\n                        >眼睛是心靈的窗戶，讓我們看見繽紛的世界。<mark\n                          class=\"kw-highlight\"\n                          >然而</mark\n                        >，不少同學因不良習慣損害視力，<mark\n                          class=\"kw-highlight\"\n                          >因此</mark\n                        >愛護眼睛至關重要。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >分點一</span\n                        ><mark class=\"kw-highlight\">首先</mark\n                        >，應保持正確的閱讀姿勢，與書本保持約三十厘米距離，光線要充足，避免在車上或暗處看書，減少眼睛疲勞。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >分點二</span\n                        ><mark class=\"kw-highlight\">其次</mark\n                        >，要控制使用電子屏幕的時間。每使用三十分鐘，應休息十分鐘，望望遠處，讓眼睛得以放鬆，防止近視加深。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >分點三</span\n                        ><mark class=\"kw-highlight\">此外</mark\n                        >，多做戶外活動，讓眼睛接觸自然光，有助預防近視。飲食上也要均衡，多攝取含維生素A的蔬果，如紅蘿蔔和深綠色蔬菜。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >總結</span\n                        ><mark class=\"kw-highlight\">總括而言</mark\n                        >，愛護眼睛要從日常做起。只有養成良好習慣，才能擁有明亮的雙眼，看清前路，享受精彩人生。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《介紹我的寵物》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：選同類題目，用「總—分—總」；每段一個分點。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□分點清楚 □有例子 □結尾呼籲</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-purple-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-purple-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >總述</span\n                        >我養了一隻名叫「豆豆」的倉鼠，牠是我家的一員，帶給我們不少歡樂。以下為大家介紹這個小可愛。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >分點一</span\n                        >豆豆體型小巧，毛色金黃，一對黑亮的眼珠轉動靈活。牠的前爪細小，捧住食物時的模樣，總是逗得家人發笑。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >分點二</span\n                        >在習性方面，倉鼠主要在夜間活動，白天大多睡覺。牠喜歡在滾輪上奔跑，也愛把食物儲存在頰囊，十分有趣。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >分點三</span\n                        >飼養時，需保持籠舍清潔，提供乾淨的食水和專用飼料。也要給予適量陪伴，但不宜頻繁驚擾，以免牠受驚。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >總結</span\n                        >總之，飼養寵物需要<mark class=\"kw-highlight\">責任</mark\n                        >和耐心。豆豆教會我關愛生命，也讓我學會按時照顧他人，是一個很好的生命教育。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《閱讀的好處》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：選同類題目，用「總—分—總」；每段一個分點。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□分點清楚 □有例子 □結尾呼籲</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-purple-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-purple-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >總述</span\n                        >閱讀是開啟智慧之門的鑰匙。對小學生而言，養成閱讀習慣，對學習和成長都有深遠的好處。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >分點一</span\n                        ><mark class=\"kw-highlight\">首先</mark\n                        >，閱讀可以增長見聞。透過書本，我們可以認識不同地方的文化、歷史和科學知識，拓闊視野，彌補課堂以外的不足。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >分點二</span\n                        ><mark class=\"kw-highlight\">其次</mark\n                        >，閱讀能豐富詞彙，提升寫作和表達能力。書中優美的文句和精準的用詞，潛移默化地影響我們，寫作時自然運用自如。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >分點三</span\n                        ><mark class=\"kw-highlight\">此外</mark\n                        >，閱讀有助培養專注力和想像力。沉浸於故事之中，我們需要集中精神，也會在腦海中構建畫面，對思維發展大有裨益。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >總結</span\n                        ><mark class=\"kw-highlight\">總括而言</mark\n                        >，開卷有益，但須選擇好書。讓我們每天抽出時間閱讀，在書海中暢游，為未來儲備實力。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong>《香港的非遺文化》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：選同類題目，用「總—分—總」；每段一個分點。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□分點清楚 □有例子 □結尾呼籲</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-purple-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-purple-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >總述</span\n                        >香港雖是國際都市，卻保存不少珍貴的非物質文化遺產。認識非遺，有助我們了解本土傳統，傳承文化。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >分點一</span\n                        ><mark class=\"kw-highlight\">首先</mark\n                        >，舞獅和舞龍是常見的非遺項目。每逢節日，鑼鼓喧天，獅子騰躍，展現民間技藝和團隊配合，是社區凝聚力的象徵。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >分點二</span\n                        ><mark class=\"kw-highlight\">其次</mark\n                        >，粵劇也是重要非遺。它結合唱、做、念、打，服飾華麗，唱腔優美，承載了嶺南文化的精髓，值得我們欣賞和保護。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >分點三</span\n                        ><mark class=\"kw-highlight\">此外</mark\n                        >，如大坑舞火龍、長洲太平清醮等習俗，都有悠久歷史，反映香港人的信仰和生活方式，是活態的文化寶藏。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-purple-100 text-purple-700\"\n                          >總結</span\n                        ><mark class=\"kw-highlight\">總括而言</mark\n                        >，非遺是城市的文化根脈。我們應多參與、多了解，讓這些傳統在新時代繼續傳承，發揚光大。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n              </ul>\n            </div>\n            <div\n              class=\"bg-purple-50 border-l-4 border-purple-400 p-3 rounded mt-auto\"\n            >\n              <p class=\"text-xs text-purple-800\">\n                <strong>💡 寫作小貼士：</strong>\n                用詞要準確、客觀，避免加入太多個人主觀情緒。段落分明非常重要，可教導孩子使用「首先」、「其次」、「最後」等關聯詞來組織內容。\n              </p>\n            </div>\n          </div>\n        </div>\n\n        <!-- 5. 實用文 -->\n        <div\n          id=\"cat-practical\"\n          class=\"bg-white rounded-xl shadow-md overflow-hidden border-t-4 border-orange-500 hover:shadow-lg transition-shadow duration-300\"\n        >\n          <div class=\"p-6 h-full flex flex-col\">\n            <h2\n              class=\"text-2xl font-bold text-orange-700 mb-3 flex items-center\"\n            >\n              <span class=\"mr-2\">✉️</span> 實用文\n            </h2>\n            <div class=\"mb-4\">\n              <h3\n                class=\"font-semibold text-gray-700 bg-orange-50 inline-block px-2 py-1 rounded mb-2\"\n              >\n                📌 教育局要求重點\n              </h3>\n              <p class=\"text-gray-600 text-sm leading-relaxed\">\n                【小五至小六】掌握格式及語境：便條、日記、周記（小五）、書信、公函/建議書、通告、啟事、演講辭、報告（小六TSA必考：便條+日記）。\n                <br /><span\n                  class=\"grade-cat-note grade-legend block text-xs text-gray-600 mt-2\"\n                  >【小五】便條、日記、私函、書信｜【小六】公函/建議書、演講辭、通告、啟事、報告、閱讀報告（標<strong>小六</strong>）</span\n                >\n              </p>\n            </div>\n\n            <p class=\"structure-tag\">\n              結構：格式要素齊全（上款／正文／祝頌／下款／日期）\n            </p>\n            <!-- fill-template:practical -->\n            <details class=\"fill-template fill-orange mb-4\">\n              <summary class=\"fill-summary\" style=\"color: #9a3412\">\n                <span>📝 萬能填充思考區（實用文）</span>\n                <span class=\"fill-hint text-xs font-normal text-gray-500\"\n                  >動筆前先填好各段重點</span\n                >\n              </summary>\n              <div\n                class=\"fill-body\"\n                style=\"background: #fff7ed; border-color: #fdba74\"\n              >\n                <p class=\"fill-line\">\n                  <strong>格式提示：</strong\n                  >實用文須依類型填寫：<strong>上款</strong>（稱呼）→\n                  <strong>正文</strong>（目的＋內容）→\n                  <strong>祝頌</strong>（書信）→ <strong>下款＋日期</strong>。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>上款：</strong>致：<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #ea580c;\n                      border-bottom: 1px dashed #ea580c;\n                      padding: 0 2px;\n                    \"\n                    >__（對象，如：訓練組／同學／校長）__</span\n                  >\n                </p>\n                <p class=\"fill-line\">\n                  <strong>正文（開首）：</strong>本人因<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #ea580c;\n                      border-bottom: 1px dashed #ea580c;\n                      padding: 0 2px;\n                    \"\n                    >__（原因）__</span\n                  >，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #ea580c;\n                      border-bottom: 1px dashed #ea580c;\n                      padding: 0 2px;\n                    \"\n                    >__（目的，如：未能出席／欲提出建議）__</span\n                  >，特此<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #ea580c;\n                      border-bottom: 1px dashed #ea580c;\n                      padding: 0 2px;\n                    \"\n                    >__（通知／申請／建議）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>正文（內容）：</strong\n                  ><span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #ea580c;\n                      border-bottom: 1px dashed #ea580c;\n                      padding: 0 2px;\n                    \"\n                    >__（具體說明：時間、地點、事項）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #ea580c;\n                      border-bottom: 1px dashed #ea580c;\n                      padding: 0 2px;\n                    \"\n                    >__（補充細節或請求）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #ea580c;\n                      border-bottom: 1px dashed #ea580c;\n                      padding: 0 2px;\n                    \"\n                    >__（道謝／期待回覆）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>下款＋日期：</strong\n                  ><span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #ea580c;\n                      border-bottom: 1px dashed #ea580c;\n                      padding: 0 2px;\n                    \"\n                    >__（班別姓名，如：六年乙班 陳小文）__</span\n                  >　<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #ea580c;\n                      border-bottom: 1px dashed #ea580c;\n                      padding: 0 2px;\n                    \"\n                    >__（年）__</span\n                  >年<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #ea580c;\n                      border-bottom: 1px dashed #ea580c;\n                      padding: 0 2px;\n                    \"\n                    >__（月）__</span\n                  >月<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #ea580c;\n                      border-bottom: 1px dashed #ea580c;\n                      padding: 0 2px;\n                    \"\n                    >__（日）__</span\n                  >日\n                </p>\n                <p class=\"fill-tip text-xs mt-2\" style=\"color: #9a3412\">\n                  💡\n                  填好藍色空格後，再按各段字數（約50／80–90字）擴寫成完整段落。\n                </p>\n              </div>\n            </details>\n            <!-- fill-template:practical /-->\n            <div class=\"mb-4 flex-grow\">\n              <h3\n                class=\"font-semibold text-gray-700 bg-gray-100 inline-block px-2 py-1 rounded mb-2\"\n              >\n                🎯 常見題目雜錦\n              </h3>\n              <ul class=\"list-none text-gray-700 text-sm space-y-3 ml-1\">\n                <!-- 實用文格式範本（TSA必考） -->\n                <div\n                  id=\"hub-practical-formats\"\n                  class=\"mb-5 p-4 bg-orange-50 border border-orange-200 rounded-xl\"\n                >\n                  <h3 class=\"font-bold text-orange-800 mb-3\">\n                    📋 實用文格式範本（TSA小六必考）\n                  </h3>\n                  <p class=\"text-xs text-orange-700 mb-3\">\n                    以下為<strong>格式示範</strong>（非五段式長文）；考試時須依類型填寫齊全元素。\n                  </p>\n                  <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\n                    <div>\n                      <h4 class=\"font-semibold text-orange-700 text-sm mb-2\">\n                        便條\n                      </h4>\n                      <div class=\"format-box text-gray-800\">\n                        <span class=\"label\">上款</span><br />\n                        致：合唱團訓練組<br /><br />\n                        <span class=\"label\">正文</span><br />\n                        本人因身體不適，未能出席今天下午四時的合唱團訓練，特此通知。請代為向老師請假，謝謝。<br /><br />\n                        <span class=\"label\">下款＋日期</span><br />\n                        六年乙班 陳小文<br />\n                        2026年7月5日\n                      </div>\n                    </div>\n                    <div>\n                      <h4 class=\"font-semibold text-orange-700 text-sm mb-2\">\n                        通告\n                      </h4>\n                      <div class=\"format-box text-gray-800 text-center\">\n                        <strong style=\"font-size: 1.1em\">校運會通告</strong\n                        ><br /><br />\n                        <div class=\"text-left\">\n                          <span class=\"label\">對象</span> 全体師生：<br /><br />\n                          <span class=\"label\">正文</span>\n                          本校校運會訂於2026年11月20日（星期四）舉行。當天請穿運動服回校，並於上午八時正在本校操場集合。如有疑問，請向體育組查詢。<br /><br />\n                          <span class=\"label\">署名＋日期</span><br />\n                          培正小學 校務處<br />\n                          2026年7月5日\n                        </div>\n                      </div>\n                    </div>\n                    <div>\n                      <h4 class=\"font-semibold text-orange-700 text-sm mb-2\">\n                        書信（私函）\n                      </h4>\n                      <div class=\"format-box text-gray-800\">\n                        <span class=\"label\">稱呼</span> 親愛的XX：<br /><br />\n                        <span class=\"label\">問候</span> 你好！<br /><br />\n                        <span class=\"label\">正文</span>\n                        （分段書寫事由）<br /><br />\n                        <span class=\"label\">祝頌</span> 祝學業進步！<br /><br />\n                        <span class=\"label\">署名＋日期</span>\n                        你的XXX　2026年X月X日\n                      </div>\n                    </div>\n                    <div>\n                      <h4 class=\"font-semibold text-orange-700 text-sm mb-2\">\n                        日記\n                      </h4>\n                      <div class=\"format-box text-gray-800\">\n                        <span class=\"label\">首行</span>\n                        2026年7月5日　星期六　晴<br /><br />\n                        <span class=\"label\">正文</span>\n                        今天發生了一件難忘的事……（分段記述，結尾寫感受）<br /><br />\n                        <span class=\"label\">注意</span>\n                        第一人稱「我」；可寫天氣、心情；語氣可較抒情。\n                      </div>\n                    </div>\n                  </div>\n                </div>\n\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《給十年後自己的一封信》（私函）</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：依格式範本，換一個真實情境自行填寫（如給媽媽的便條）。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□格式齊全 □語氣恰當\n                      □事由清楚</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-orange-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-orange-100 text-gray-800\"\n                    >\n                      <p\n                        class=\"text-right text-xs text-gray-500 mb-2\"\n                        style=\"text-indent: 0\"\n                      >\n                        親愛的十年後的我：\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第一段·問候</span\n                        >你好！寫信時，我剛升讀小學六年級，對未來既期待又忐忑。不知十年後的你，過得怎樣？是否仍記得現在的夢想？\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第二段·現況</span\n                        >現在的我，正努力溫習，希望升讀理想的中學。我喜歡閱讀和寫作，也參加學校的朗誦比賽。<mark\n                          class=\"kw-highlight\"\n                          >雖然</mark\n                        >有時會因為功課感到壓力，但我仍然堅持每天進步一點點。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第三段·期望</span\n                        >我希望十年後的你，已經找到了喜歡的方向，無論是繼續升學還是追求其他理想，都能<mark\n                          class=\"kw-highlight\"\n                          >全力以赴</mark\n                        >。請不要忘記，現在的你曾經許下過要成為對社會有用的人的願望。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第四段·叮嚀</span\n                        >若路上遇到挫折，請不要氣餒。記得爸爸常說：「失敗乃成功之母。」也請繼續關心家人和朋友，因為他們是最值得珍惜的人。無論多忙，都要保留閱讀的習慣。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第五段·祝頌</span\n                        >最後，但願你已實現當年的目標，成為更成熟、更自信的人。期待與你在未來相遇，到時再回顧這段努力拚搏的日子。祝一切順利！\n                      </p>\n                      <p\n                        class=\"text-right text-xs text-gray-500 mt-2\"\n                        style=\"text-indent: 0\"\n                      >\n                        六年級的小明<br />2026年7月5日\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong\n                    >《寫給校長的一封信——建議改善圖書館設施》（公函/建議書）</strong\n                  >\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：以公函格式寫「致校長的一封信——建議增設雨具放置區」，含現況、兩項建議及結語。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□敬啟者 □語氣恭敬 □建議具體\n                      □署名日期</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-orange-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-orange-100 text-gray-800\"\n                    >\n                      <p\n                        class=\"text-xs text-gray-500 mb-2\"\n                        style=\"text-indent: 0\"\n                      >\n                        敬啟者：\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第一段·目的</span\n                        >我是六年甲班的陳小文。寫信旨在就改善圖書館設施提出建議，希望校方能考慮採納，讓同學有更舒適的閱讀環境。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第二段·現況</span\n                        >圖書館是同學喜愛流連的地方，但現有設施已使用多年。部分書架老舊，閱讀枱椅也有損壞；光線在陰雨天顯得不足，影響閱讀體驗。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第三段·建議一</span\n                        ><mark class=\"kw-highlight\">首先</mark\n                        >，建議更新書架和桌椅，增加符合人體工學的座椅，讓同學長時間閱讀也不易疲勞。<mark\n                          class=\"kw-highlight\"\n                          >其次</mark\n                        >，增設護眼燈具，改善照明，保護同學的視力。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第四段·建議二</span\n                        ><mark class=\"kw-highlight\">此外</mark\n                        >，建議增設電子閱讀區，提供電子書查閱服務，配合現代學習需要。也可定期舉辦閱讀分享會，鼓勵同學交流讀書心得，營造書香校園。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第五段·結語</span\n                        >以上為敝人的淺見，懇請校長審閱。感謝校方一直以來對同學的關懷，期待圖書館能<mark\n                          class=\"kw-highlight\"\n                          >煥然一新</mark\n                        >。此致<br />敬禮！\n                      </p>\n                      <p\n                        class=\"text-right text-xs text-gray-500 mt-2\"\n                        style=\"text-indent: 0\"\n                      >\n                        六年甲班 陳小文<br />2026年7月5日\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong>《小學畢業典禮演講辭》（演講辭）</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換寫對象（如爺爺的皺紋、畢業禮物），結合具體事例抒情。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□借物抒情 □感情真摯\n                      □結尾升华</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-orange-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-orange-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第一段·開場</span\n                        >尊敬的王校長、各位老師、親愛的同學們：大家好！我是六年甲班的代表。今天，我們懷着<mark\n                          class=\"kw-highlight\"\n                          >感恩</mark\n                        >與不捨，站在畢業典禮的舞台上。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第二段·回顧</span\n                        >六年前，我們帶着<mark class=\"kw-highlight\">緊張</mark\n                        >和期待踏進校門。六年間，老師悉心教導，同學互相扶持。操場上的歡笑、課室裏的爭論、考試前的緊張，都成為最珍貴的回憶。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第三段·感恩</span\n                        >在此，我代表全級同學，向各位老師致以最誠摯的謝意。感謝您們用愛心和耐心，把我們從懵懂的孩子，培育成能獨立思考的少年。您的教誨，我們將銘記於心。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第四段·展望</span\n                        >畢業不是終點，而是新的起點。我們即將升讀中學，面對新的挑戰。但無論走到哪裏，我們都會帶着母校的精神：<mark\n                          class=\"kw-highlight\"\n                          >誠信</mark\n                        >、勤學、<mark class=\"kw-highlight\">合作</mark\n                        >，勇敢追尋夢想。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第五段·結語</span\n                        >最後，但願各位同學前程似錦，各位老師身體健康。讓我們一起說：再見了，母校！謝謝您！謝謝大家！\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n
