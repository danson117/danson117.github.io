               ><strong>《一次難忘的經歷》（日記/週記）</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：依格式範本，以自身情境重新撰寫。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□格式 □語氣 □完整</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-orange-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-orange-100 text-gray-800\"\n                    >\n                      <p\n                        class=\"text-xs text-gray-500 mb-2\"\n                        style=\"text-indent: 0\"\n                      >\n                        7月5日　星期六　晴\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第一段·開頭</span\n                        >今天，我參加了學校舉辦的義工活動，到老人院探訪長者。這是一次難忘的經歷，讓我獲益良多。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第二段·經過</span\n                        >上午九時，我們到達老人院。院舍環境整潔，長者們坐在大廳裏聊天。我們先獻上親手製作的賀卡，再為他們表演朗誦和唱歌，氣氛十分溫馨。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第三段·深入</span\n                        >我與一位姓李的婆婆交談。她告訴我，年輕時曾是一名教師，最喜歡看學生成長。她握着我的手，鼓勵我要用功讀書，將來回饋社會。聽罷，我深受<mark\n                          class=\"kw-highlight\"\n                          >感動</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第四段·感受</span\n                        >活動結束時，幾位長者依依不捨地送別我們。回程路上，同學們都說，原以為是自己去關懷長者，沒想到反而從他們身上學到人生智慧，<mark\n                          class=\"kw-highlight\"\n                          >心裏</mark\n                        >暖暖的。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第五段·總結</span\n                        >這次義工活動讓我明白：關愛長者，就是關愛我們的未來。我決定以後多參加這類活動，把溫暖和關懷傳遞給更多需要幫助的人。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong>《參觀歷史博物館》（考察報告）</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：改寫為「記一次STEM工作坊」，加入所見所聞和學習收穫。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□有場景描寫 □有具體細節\n                      □結尾有啟發</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-orange-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-orange-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第一段·總述</span\n                        >本週三，我們班到歷史博物館進行考察，了解香港從開埠至回歸的發展歷程。現將所見所聞整理如下。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第二段·觀察一</span\n                        >博物館一樓展示早期香港的生活面貌，包括傳統店舖、街景模型和舊式交通工具。透過實物與圖片，我們了解到百年前香港已是一個繁忙的港口。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第三段·觀察二</span\n                        >二樓則介紹香港在戰後的經濟起飛，以及各項基建的發展。展覽運用多媒體互動裝置，讓參觀者可以「親歷」歷史，加深對過去的認識。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第四段·觀察三</span\n                        >導賞員詳細講解1997年回歸的歷史意義，並展示當年的珍貴照片和物件。同學們專心聆聽，踴躍提問，氣氛十分熱烈。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第五段·總結</span\n                        >是次考察讓我們從書本走進歷史，體會香港一路走來的艱辛與成就。我們應該珍惜當下的生活，並以實際行動建設更美好的未來。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《便條——缺席合唱團訓練》（便條）</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：依格式範本，換一個真實情境自行填寫（如給媽媽的便條）。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□格式齊全 □語氣恰當\n                      □事由清楚</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-orange-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-orange-100 text-gray-800\"\n                    >\n                      <p\n                        class=\"text-xs text-gray-500 mb-2\"\n                        style=\"text-indent: 0\"\n                      >\n                        （情境：放學後未能參加合唱團訓練，需告知老師。）\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第一段·目的</span\n                        >李老師：您好！今天放學後，我因需陪同祖母往醫院覆診，未能參加合唱團訓練，特此告知。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第二段·正文</span\n                        >對於缺席訓練，我深感抱歉。我會向同學了解練習內容，並在家中自行練習，以免跟不上進度。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第三段·正文</span\n                        >覆診後我會盡快完成欠交的工作，並於明天回校向您請教。再次為造成不便致歉，謝謝您的理解。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第四段·正文</span\n                        >此致<br />敬禮！\n                      </p>\n                      <p\n                        class=\"text-right text-xs text-gray-500 mt-2\"\n                        style=\"text-indent: 0\"\n                      >\n                        六年乙班 張小華<br />2026年7月5日\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong>《活動通告——校運會》（通告）</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：寫「記一次班際接力賽」，詳寫最緊張的一棒。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□場面描寫 □氣氛渲染\n                      □團隊精神</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-orange-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-orange-100 text-gray-800\"\n                    >\n                      <p\n                        class=\"text-xs text-gray-500 mb-2\"\n                        style=\"text-indent: 0\"\n                      >\n                        致：全校師生\n                      </p>\n                      <p\n                        class=\"text-xs text-gray-500 mb-2\"\n                        style=\"text-indent: 0\"\n                      >\n                        （校方發出通告，通知全校師生校運會安排。）\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第一段·目的</span\n                        >本校定於2026年10月15日（星期四）舉行陸運會，現將詳情通告如下：\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第二段·內容</span\n                        >一、當日上午八時正，全校師生於大操場集合，按班別列隊。二、同學須穿著運動服及運動鞋，並攜備水壺和雨具。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第三段·內容</span\n                        >三、未參與比賽的同學，須留在指定區域觀賽，遵守秩序，為參賽同學加油。四、若因身體不適不宜參賽，請家長致函告假。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >內容三</span\n                        >請各同學做好準備，積極參與，發揮體育精神。特此通告。\n                      </p>\n                      <p\n                        class=\"text-right text-xs text-gray-500 mt-2\"\n                        style=\"text-indent: 0\"\n                      >\n                        軒尼詩道官立小學<br />2026年9月20日\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong>《尋物啟事》（啟事）</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：依格式範本，換一個真實情境自行填寫（如給媽媽的便條）。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□格式齊全 □語氣恰當\n                      □事由清楚</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-orange-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-orange-100 text-gray-800\"\n                    >\n                      <p\n                        class=\"text-xs text-gray-500 mb-2\"\n                        style=\"text-indent: 0\"\n                      >\n                        （在學校遺失物品，需刊登啟事尋找。）\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第一段·目的</span\n                        >本人於7月3日（星期四）放學後，在操場遺失一個藍色水樽，現懸賞尋回，懇請拾獲者交還。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第二段·描述</span\n                        >水樽為深藍色，容量約500毫升，樽身貼有「六年甲班」的姓名標籤，樽蓋略有刮痕，為本人心愛之物。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >經過</span\n                        >當日我在操場練習籃球，可能遺留在看枱附近。若有同學或工友拾獲，請交至校務處或直接交還本人。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第四段·聯絡</span\n                        >尋回後，本人將致送小禮物以表謝意。聯絡方式：六年甲班陳小文，或致電學校校務處。謝謝！\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《感謝信——致救護車司機》（書信）</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：依格式範本，換一個真實情境自行填寫（如給媽媽的便條）。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□格式齊全 □語氣恰當\n                      □事由清楚</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-orange-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-orange-100 text-gray-800\"\n                    >\n                      <p\n                        class=\"text-xs text-gray-500 mb-2\"\n                        style=\"text-indent: 0\"\n                      >\n                        （受助者寫信感謝曾伸出援手的陌生人。）\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第一段·問候</span\n                        >尊敬的先生／女士：您好！我是六月在彌敦道意外中受傷的小學生。事隔多時，仍想當面致謝，故執筆寫信。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >敘事</span\n                        >當日我被單車撞倒，您立即停車查看，幫我按傷口止血，並協助聯絡我的家人和救護車。您還在旁安慰我不必害怕，令我安心不少。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >抒情</span\n                        >若沒有您的及時幫助，後果難以想像。您的善舉，讓我深深體會到社會的溫暖，也明白助人為樂的可貴。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第四段·承諾</span\n                        >我會以您為榜樣，將來也主動幫助有需要的人。再次衷心感謝！祝您身體健康，生活愉快！\n                      </p>\n                      <p\n                        class=\"text-right text-xs text-gray-500 mt-2\"\n                        style=\"text-indent: 0\"\n                      >\n                        受助者：李小明<br />2026年7月5日\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong>《讀書報告——《西遊記》》（閱讀報告）</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：依格式範本，換一個真實情境自行填寫（如給媽媽的便條）。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□格式齊全 □語氣恰當\n                      □事由清楚</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-orange-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-orange-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >總述</span\n                        >書名：《西遊記》；作者：吳承恩；類別：古典小說。以下為閱讀報告。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第二段·內容</span\n                        >內容大意：唐僧師徒四人西天取經，歷經九九八十一難。孫悟空機智勇敢，豬八戒和沙僧各有性格，四人合力克服妖魔鬼怪，最終取得真經。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第三段·內容</span\n                        >人物評價：孫悟空是我最欣賞的角色。他<mark\n                          class=\"kw-highlight\"\n                          >雖然</mark\n                        >曾經桀驁不馴，但護師心切，面對困難從不退縮，展現了忠誠和<mark\n                          class=\"kw-highlight\"\n                          >堅毅</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >第四段·感想</span\n                        >讀後感想：這本書讓我明白，成功需要團隊<mark\n                          class=\"kw-highlight\"\n                          >合作</mark\n                        >和堅持。取經路上荊棘滿布，但師徒四人從不放棄，這種精神值得我學習。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-orange-100 text-orange-700\"\n                          >總結</span\n                        >總結：我推薦這本書給喜歡冒險故事的同學。閱讀經典，既能享受樂趣，也能從中汲取人生智慧。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n              </ul>\n            </div>\n            <div\n              class=\"bg-orange-50 border-l-4 border-orange-400 p-3 rounded mt-auto\"\n            >\n              <p class=\"text-xs text-orange-800\">\n                <strong>💡 寫作小貼士：</strong>\n                實用文的「格式」是得分關鍵！上款、正文、祝頌語、下款、日期等必須齊全且位置正確。語氣要符合寫作對象的身份（如對長輩要用敬語）。\n              </p>\n            </div>\n          </div>\n        </div>\n\n        <!-- 6. 議論文 -->\n        <div\n          id=\"cat-argument\"\n          class=\"bg-white rounded-xl shadow-md overflow-hidden border-t-4 border-teal-500 hover:shadow-lg transition-shadow duration-300\"\n        >\n          <div class=\"p-6 h-full flex flex-col\">\n            <h2 class=\"text-2xl font-bold text-teal-700 mb-3 flex items-center\">\n              <span class=\"mr-2\">⚖️</span> 議論文 (小六重點)\n            </h2>\n            <div class=\"mb-4\">\n              <h3\n                class=\"font-semibold text-gray-700 bg-teal-50 inline-block px-2 py-1 rounded mb-2\"\n              >\n                📌 教育局要求重點\n              </h3>\n              <p class=\"text-gray-600 text-sm leading-relaxed\">\n                【小六重點】掌握論點、論據、論證；立場鮮明，以生活例子、時事或名言支持觀點；論事、論理、論人，避免模稜兩可。\n                <br /><span\n                  class=\"grade-cat-note grade-legend block text-xs text-gray-600 mt-2\"\n                  >【小六】議論文為高小新增重點：論點、論據、論證、正反立場（本類全部標<strong>小六</strong>）</span\n                >\n              </p>\n            </div>\n\n            <p class=\"structure-tag\">\n              結構：論點 ➔ 論據一 ➔ 論據二 ➔ 論證反駁 ➔ 結論\n            </p>\n            <!-- fill-template:argument -->\n            <details class=\"fill-template fill-teal mb-4\">\n              <summary class=\"fill-summary\" style=\"color: #115e59\">\n                <span>📝 萬能填充思考區（議論文）</span>\n                <span class=\"fill-hint text-xs font-normal text-gray-500\"\n                  >動筆前先填好各段重點</span\n                >\n              </summary>\n              <div\n                class=\"fill-body\"\n                style=\"background: #f0fdfa; border-color: #5eead4\"\n              >\n                <p class=\"fill-line\">\n                  <strong>第一段（論點）：</strong\n                  ><span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（引入話題）__</span\n                  >。我認為，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（明確立場／論點）__</span\n                  >，這對<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（對象）__</span\n                  >至為重要。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第二段（論據一）：</strong>首先，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（第一個理由）__</span\n                  >。例如，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（生活例子）__</span\n                  >。由此可見，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（回扣論點）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第三段（論據二）：</strong>其次，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（第二個理由）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（事實／個人經歷）__</span\n                  >，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（說明影響）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第四段（反駁）：</strong>有人認為<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（相反意見）__</span\n                  >。然而，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（反駁理由）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（讓步或補充）__</span\n                  >，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（重申立場）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第五段（結論）：</strong>綜上所述，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（重申論點）__</span\n                  >。因此，我們應該<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（呼籲行動）__</span\n                  >，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #0d9488;\n                      border-bottom: 1px dashed #0d9488;\n                      padding: 0 2px;\n                    \"\n                    >__（預期效果）__</span\n                  >。\n                </p>\n                <p class=\"fill-tip text-xs mt-2\" style=\"color: #115e59\">\n                  💡\n                  填好藍色空格後，再按各段字數（約50／80–90字）擴寫成完整段落。\n                </p>\n              </div>\n            </details>\n            <!-- fill-template:argument /-->\n            <div class=\"mb-4 flex-grow\">\n              <h3\n                class=\"font-semibold text-gray-700 bg-gray-100 inline-block px-2 py-1 rounded mb-2\"\n              >\n                🎯 常見題目雜錦\n              </h3>\n\n              <!-- 三要素說明 + 顏色 Legend -->\n              <div\n                class=\"mb-5 p-4 bg-teal-50 border border-teal-200 rounded-xl text-sm text-gray-700 space-y-3\"\n              >\n                <div>\n                  <h4 class=\"font-bold text-teal-800 mb-2\">\n                    📖 議論文三要素說明（附簡單例子）\n                  </h4>\n                  <ul class=\"space-y-2 ml-1 list-none\">\n                    <li>\n                      <span class=\"hl-ld px-1 rounded\">論點</span>\n                      <strong>＝ 作者的立場</strong\n                      >，清楚表明贊成或反對甚麼。<br />\n                      <span class=\"text-gray-500 text-xs\"\n                        >例：「我認為，小學生<strong>不應</strong>帶手提電話回校。」</span\n                      >\n                    </li>\n                    <li>\n                      <span class=\"hl-lj px-1 rounded\">論據</span>\n                      <strong>＝ 支持論點的理由</strong\n                      >，可以是事實、例子或個人經歷。<br />\n                      <span class=\"text-gray-500 text-xs\"\n                        >例：「上課時偷看訊息，會<strong>分散注意力</strong>，影響學習。」</span\n                      >\n                    </li>\n                    <li>\n                      <span class=\"hl-lz px-1 rounded\">論證</span>\n                      <strong>＝ 如何推理</strong\n                      >，把論據與論點聯繫起來；也可反駁對方觀點。<br />\n                      <span class=\"text-gray-500 text-xs\"\n                        >例：「<strong>有人認為</strong>方便聯絡家長，<strong>然而</strong>學校可以代為通知，因此不必帶電話回校。」</span\n                      >\n                    </li>\n                  </ul>\n                </div>\n                <div class=\"pt-3 border-t border-teal-200\">\n                  <h4 class=\"font-bold text-teal-800 mb-2\">\n                    🎨 範文顏色對照（Legend）\n                  </h4>\n                  <div class=\"flex flex-wrap gap-x-4 gap-y-2 items-center\">\n                    <span class=\"inline-flex items-center gap-1\"\n                      ><span class=\"hl-ld px-2 py-0.5 rounded\">藍底</span>\n                      論點（立場）</span\n                    >\n                    <span class=\"inline-flex items-center gap-1\"\n                      ><span class=\"hl-lj px-2 py-0.5 rounded\">綠底</span>\n                      論據（理由／例子）</span\n                    >\n                    <span class=\"inline-flex items-center gap-1\"\n                      ><span class=\"hl-lz px-2 py-0.5 rounded\">紫底</span>\n                      論證（推理／反駁）</span\n                    >\n                  </div>\n                  <p class=\"text-xs text-teal-700 mt-2\">\n                    ※\n                    每個題目均提供<strong>正反兩方</strong>範文，以便比較不同立場的寫法。議論文不使用黃底標示，以免與其他文體混淆。\n                  </p>\n                </div>\n              </div>\n              <ul class=\"list-none text-gray-700 text-sm space-y-3 ml-1\">\n                <li class=\"border-b border-gray-100 pb-4 mb-2\">\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong class=\"text-base\"\n                    >《小學生應否帶手提電話回校？》</strong\n                  >\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：就同一題目，寫<strong>相反立場</strong>的五段式議論文；首段表態，末段重申。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□立場明確 □兩個論據 □有反駁</span\n                    >\n                  </p>\n                  <p class=\"text-xs font-semibold text-teal-700 mt-2 mb-1\">\n                    反方｜不應帶回校\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >近年，不少小學生擁有手提電話。<mark class=\"hl-ld\"\n                          >我認為，小學生不應帶手提電話回校，理由如下。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >首先，<mark class=\"hl-lj\"\n                          >手提電話容易分散學習注意力</mark\n                        >。上課時若有同學偷看訊息或玩遊戲，不但影響自己，也會干擾他人。<mark\n                          class=\"hl-lj\"\n                          >專心聽講是學習的基本，不應被電子產品破壞。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >其次，<mark class=\"hl-lj\"\n                          >過早使用手提電話可能損害視力和身心健康</mark\n                        >。長時間使用會損害視力，也可能使同學沉迷網絡，<mark\n                          class=\"hl-lj\"\n                          >減少戶外活動，不利身心發展</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        ><mark class=\"hl-lz\"\n                          >有人認為帶電話方便聯絡家長，但</mark\n                        >學校設有校務處，遇有緊急情況可透過老師聯絡。<mark\n                          class=\"hl-lz\"\n                          >放學後才使用電話，已足夠應付日常需要，無須在課室內使用。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\"\n                          >綜上所述，小學生不應帶手提電話回校。</mark\n                        >我們應專注課業，遠離誘惑，才能健康成長。\n                      </p>\n                    </div>\n                  </details>\n                  <p class=\"text-xs font-semibold text-orange-700 mt-2 mb-1\">\n                    正方｜可以帶回校\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >在資訊發達的年代，手提電話已十分普及。<mark\n                          class=\"hl-ld\"\n                          >我認為，小學生在適當規管下，可以帶手提電話回校。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >首先，<mark class=\"hl-lj\"\n                          >遇有突發事情，電話可讓家長與子女直接聯絡</mark\n                        >。例如放學後活動改期、身體不適需提早離校，<mark\n                          class=\"hl-lj\"\n                          >能及時報平安，讓家人放心</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >其次，<mark class=\"hl-lj\">電話也可作學習工具</mark\n                        >。同學可查字典、搜尋資料、使用學習應用程式，<mark\n                          class=\"hl-lj\"\n                          >在老師指導下善用科技，有助提升學習效率</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        ><mark class=\"hl-lz\"\n                          >有人擔心同學上課時偷用電話，但</mark\n                        >學校可訂立明確規則：<mark class=\"hl-lz\"\n                          >上課時統一存放，放學後才取回，並教導正確使用，問題便可避免</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\"\n                          >總括而言，帶電話回校並非完全不可行。</mark\n                        >關鍵在於家校合作，教導同學自律，發揮其便利而避免濫用。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li class=\"border-b border-gray-100 pb-4 mb-2\">\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong class=\"text-base\">《開卷必定有益嗎？》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：就同一題目，寫<strong>相反立場</strong>的五段式議論文；首段表態，末段重申。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□立場明確 □兩個論據 □有反駁</span\n                    >\n                  </p>\n                  <p class=\"text-xs font-semibold text-teal-700 mt-2 mb-1\">\n                    反方｜未必一定有益\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >俗語說：「開卷有益。」然而，<mark class=\"hl-ld\"\n                          >我認為開卷未必一定有益，關鍵在於讀甚麼書，以及如何閱讀。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        ><mark class=\"hl-lj\">好的書籍能增長見聞、陶冶性情</mark\n                        >。經典文學、科普讀物可以拓闊視野。<mark class=\"hl-lj\"\n                          >這說明優質閱讀確實有價值。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >然而，<mark class=\"hl-lj\">並非所有書籍都有益</mark\n                        >。一些內容暴力、低俗或失實的讀物，可能誤導讀者，<mark\n                          class=\"hl-lj\"\n                          >尤其對小學生，影響更為深遠</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        >因此，<mark class=\"hl-lz\"\n                          >我們應該有選擇地閱讀，並養成思考習慣</mark\n                        >。<mark class=\"hl-lz\"\n                          >家長和老師也應給予指引，幫助同學分辨好書與壞書</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\"\n                          >總括而言，開卷是否有益，取決於書的質素和讀者的態度。</mark\n                        >選擇好書、用心閱讀，才能真正獲益。\n                      </p>\n                    </div>\n                  </details>\n                  <p class=\"text-xs font-semibold text-orange-700 mt-2 mb-1\">\n                    正方｜開卷有益\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >「開卷有益」是古人留傳下來的智慧。<mark class=\"hl-ld\"\n                          >我認為，只要選擇合適的讀物，閱讀對小學生益處良多。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >首先，<mark class=\"hl-lj\">閱讀可以增長見聞</mark\n                        >。透過書本，我們認識不同文化、歷史和科學知識，<mark\n                          class=\"hl-lj\"\n                          >拓闊視野，彌補課堂以外的不足</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >其次，<mark class=\"hl-lj\"\n                          >閱讀能豐富詞彙，提升寫作和表達能力</mark\n                        >。書中優美的文句潛移默化地影響我們，<mark class=\"hl-lj\"\n                          >對學習中文幫助很大</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        ><mark class=\"hl-lz\">有人說電子產品取代書本，但</mark\n                        >紙本閱讀有助培養專注力，<mark class=\"hl-lz\"\n                          >這是單純瀏覽電子屏幕難以取代的</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\">因此，我鼓勵同學多閱讀。</mark\n                        >開卷得當，必能為我們打開知識之門，帶來長遠好處。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li class=\"border-b border-gray-100 pb-4 mb-2\">\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong class=\"text-base\">《談合作精神》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：就同一題目，寫<strong>相反立場</strong>的五段式議論文；首段表態，末段重申。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□立場明確 □兩個論據 □有反駁</span\n                    >\n                  </p>\n                  <p class=\"text-xs font-semibold text-teal-700 mt-2 mb-1\">\n                    正方｜合作精神重要\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        ><mark class=\"hl-ld\"\n                          >合作精神是現代社會不可或缺的品德。</mark\n                        >無論在學校還是將來的工作，<mark class=\"hl-ld\"\n                          >懂得與人合作，才能取得更大的成就。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >在學校裏，<mark class=\"hl-lj\"\n                          >小組討論和班際比賽都需要同學互相配合</mark\n                        >，各展所長，<mark class=\"hl-lj\">效果遠勝單打獨鬥</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        ><mark class=\"hl-lj\">合作也能培養良好的人際關係</mark\n                        >。我們學會聆聽和包容，<mark class=\"hl-lj\"\n                          >即使出現分歧，也能透過溝通解決</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        >相反，<mark class=\"hl-lz\"\n                          >若只顧個人表現，往往事倍功半</mark\n                        >。球隊若缺乏合作，<mark class=\"hl-lz\"\n                          >即使個別球員技術出眾，也難以贏得比賽</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        >因此，<mark class=\"hl-ld\">我們應從小培養合作精神</mark\n                        >，在集體中發揮所長，也支援他人。\n                      </p>\n                    </div>\n                  </details>\n                  <p class=\"text-xs font-semibold text-orange-700 mt-2 mb-1\">\n                    反方｜個人努力同樣重要\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >合作固然重要，但<mark class=\"hl-ld\"\n                          >我認為，個人努力和獨立思考同樣不可忽略，兩者需取得平衡。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >首先，<mark class=\"hl-lj\">有些工作必須靠個人完成</mark\n                        >，如考試、默書和個人專題，<mark class=\"hl-lj\"\n                          >無法依賴他人代勞，自律和自學能力至關重要</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >其次，<mark class=\"hl-lj\"\n                          >過度依賴合作，可能養成「搭便車」的習慣</mark\n                        >。部分同學少出力，<mark class=\"hl-lj\"\n                          >卻分享成果，對認真者並不公平</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        ><mark class=\"hl-lz\">有人說團隊必勝，但</mark\n                        >若每人未先做好自己本分，<mark class=\"hl-lz\"\n                          >合作只是空談，個人能力才是基礎</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\"\n                          >總括而言，我們既要懂合作，也要能獨當一面。</mark\n                        >先充實自己，再與人協作，才能相輔相成。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li class=\"border-b border-gray-100 pb-4 mb-2\">\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong class=\"text-base\">《失敗乃成功之母》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：就同一題目，寫<strong>相反立場</strong>的五段式議論文；首段表態，末段重申。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□立場明確 □兩個論據 □有反駁</span\n                    >\n                  </p>\n                  <p class=\"text-xs font-semibold text-teal-700 mt-2 mb-1\">\n                    正方｜失敗能帶來成功\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >「失敗乃成功之母」這句名言，<mark class=\"hl-ld\"\n                          >我深為認同：只有從失敗中學習，才能邁向成功。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        ><mark class=\"hl-lj\"\n                          >愛迪生發明電燈泡，曾失敗數千次，但每次檢討原因，最終取得成功</mark\n                        >。<mark class=\"hl-lj\"\n                          >這說明失敗是通往成功的必經之路</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >在學習上，<mark class=\"hl-lj\"\n                          >我曾在數學比賽中落敗，後來分析錯題、加強練習，下次便取得進步</mark\n                        >。<mark class=\"hl-lj\">失敗讓我找到改進方向</mark>。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        >當然，<mark class=\"hl-lz\"\n                          >失敗並不可怕，可怕的是自暴自棄</mark\n                        >。<mark class=\"hl-lz\"\n                          >我們應把失敗視為經驗，而非終點</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\">總而言之，失敗是成功之師。</mark\n                        >只要堅毅不屈，終能品嚐成功的喜悅。\n                      </p>\n                    </div>\n                  </details>\n                  <p class=\"text-xs font-semibold text-orange-700 mt-2 mb-1\">\n                    反方｜失敗未必帶來成功\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >「失敗乃成功之母」雖然有道理，但<mark class=\"hl-ld\"\n                          >我認為並非每次失敗都會帶來成功，關鍵在於能否正確面對和及時調整。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >首先，<mark class=\"hl-lj\"\n                          >若一再在同樣地方失敗，卻不檢討方法，只會浪費時間</mark\n                        >。<mark class=\"hl-lj\"\n                          >例如溫習策略錯誤，越努力可能越挫敗</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >其次，<mark class=\"hl-lj\"\n                          >連續失敗可能嚴重打擊信心</mark\n                        >，使人害怕嘗試，<mark class=\"hl-lj\"\n                          >甚至放棄，這對成長更為不利</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        ><mark class=\"hl-lz\">有人說只要堅持必成功，但</mark\n                        >若方向錯誤，<mark class=\"hl-lz\"\n                          >堅持也可能走冤枉路，需要師長指引及適時轉換方法</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\"\n                          >總括而言，失敗可以是教材，也可以是警號。</mark\n                        >我們要從失敗學習，也要懂得尋求協助，才能真實進步。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li class=\"border-b border-gray-100 pb-4 mb-2\">\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong class=\"text-base\">《小學生應否有零用錢？》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：就同一題目，寫<strong>相反立場</strong>的五段式議論文；首段表態，末段重申。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□立場明確 □兩個論據 □有反駁</span\n                    >\n                  </p>\n                  <p class=\"text-xs font-semibold text-teal-700 mt-2 mb-1\">\n                    正方｜可以有零用錢\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >關於小學生是否應該有零用錢，<mark class=\"hl-ld\"\n                          >我認為可以給，但必須在合理範圍內，並配合理財教育。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        ><mark class=\"hl-lj\">適量的零用錢能培養理財能力</mark\n                        >。同學學會計劃開支、儲蓄和取捨，<mark class=\"hl-lj\"\n                          >建立正確的金錢觀</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        ><mark class=\"hl-lj\"\n                          >零用錢也可讓同學購買小禮物表達心意</mark\n                        >，或買學習用品，<mark class=\"hl-lj\"\n                          >增加自主性和責任感</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        >然而，<mark class=\"hl-lz\"\n                          >零用錢不宜過多，否則可能養成浪費習慣</mark\n                        >。<mark class=\"hl-lz\"\n                          >家長應教導記帳，讓孩子明白需要與想要的分別</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\"\n                          >總括來說，小學生可以有零用錢，但家長引導至關重要。</mark\n                        >\n                      </p>\n                    </div>\n                  </details>\n                  <p class=\"text-xs font-semibold text-orange-700 mt-2 mb-1\">\n                    反方｜不宜給零用錢\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >不少家長會給子女零用錢。<mark class=\"hl-ld\"\n                          >我認為，小學生階段不宜給零用錢，或應極其慎重。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >首先，<mark class=\"hl-lj\"\n                          >小學生判斷力未成熟，容易衝動消費</mark\n                        >，<mark class=\"hl-lj\"\n                          >可能把錢花在零食、玩具等不必要的物品上</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >其次，<mark class=\"hl-lj\"\n                          >同學之間可能互相比較，引發攀比心態</mark\n                        >，<mark class=\"hl-lj\"\n                          >影響單純的友誼，也增加家長壓力</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        ><mark class=\"hl-lz\">有人說可借此教理財，但</mark\n                        >所需物品可由家長代購，<mark class=\"hl-lz\"\n                          >待孩子較成熟才給零用錢，效果可能更好</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\"\n                          >綜上所述，小學生不宜過早擁有零用錢。</mark\n                        >應先建立正確價值觀，再學習管理金錢。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li class=\"border-b border-gray-100 pb-4 mb-2\">\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong class=\"text-base\">《環保是每個人的責任》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：就同一題目，寫<strong>相反立場</strong>的五段式議論文；首段表態，末段重申。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□立場明確 □兩個論據 □有反駁</span\n                    >\n                  </p>\n                  <p class=\"text-xs font-semibold text-teal-700 mt-2 mb-1\">\n                    正方｜人人有責\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >全球暖化問題日益嚴重，<mark class=\"hl-ld\"\n                          >環保已不再是遙遠的口號，而是每個人都應身體力行的責任。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        ><mark class=\"hl-lj\">環境問題影響每個人的生活</mark\n                        >。空氣變差損害健康，<mark class=\"hl-lj\"\n                          >若不及時行動，下一代將承受更嚴峻後果</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        ><mark class=\"hl-lj\">環保從日常生活做起</mark\n                        >：節約用水、減用膠袋、乘搭公共交通，<mark class=\"hl-lj\"\n                          >積少成多，力量不容小覷</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        ><mark class=\"hl-lz\">有人認為環保是政府的事，但</mark\n                        >若每個人都推諉，<mark class=\"hl-lz\"\n                          >問題只會惡化，故個人亦須出一分力</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        >地球只有一個，<mark class=\"hl-ld\"\n                          >保護環境人人有責。</mark\n                        >讓我們以實際行動守護家園。\n                      </p>\n                    </div>\n                  </details>\n                  <p class=\"text-xs font-semibold text-orange-700 mt-2 mb-1\">\n                    反方｜企業及政府應負主要責任\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >環保當然重要，但<mark class=\"hl-ld\"\n                          >我認為，污染主要由大型企業和政府的政策造成，他們應負主要責任，不能只要求普通市民。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >首先，<mark class=\"hl-lj\"\n                          >工廠排放、大型車隊和過度包裝，才是污染的主要來源</mark\n                        >，<mark class=\"hl-lj\">個人節約一兩張紙，難以抵消</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >其次，<mark class=\"hl-lj\"\n                          >若政府不立法、不執法，市民再努力也效果有限</mark\n                        >。<mark class=\"hl-lj\"\n                          >例如堆填區飽和，需從源頭減廢</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        ><mark class=\"hl-lz\">有人說「人人有責」，但</mark\n                        >把責任全推給市民，<mark class=\"hl-lz\"\n                          >可能讓真正應負責的一方逃避，並不公平</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\"\n                          >總括而言，市民應配合環保，但政府與企業更須帶頭改革。</mark\n                        >只有各方合力，才能根本解決問題。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li class=\"border-b border-gray-100 pb-4 mb-2\">\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong class=\"text-base\">《談誠信》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：就同一題目，寫<strong>相反立場</strong>的五段式議論文；首段表態，末段重申。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□立場明確 □兩個論據 □有反駁</span\n                    >\n                  </p>\n                  <p class=\"text-xs font-semibold text-teal-700 mt-2 mb-1\">\n                    正方｜必須恪守誠信\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        ><mark class=\"hl-ld\">誠信是做人的根本。</mark\n                        >我認為，<mark class=\"hl-ld\"\n                          >無論在學習還是生活中，都應恪守誠信，絕不可欺騙他人。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >在學校，<mark class=\"hl-lj\"\n                          >考試作弊雖或取得高分，但虛榮成績無法代表真實能力</mark\n                        >，<mark class=\"hl-lj\">一旦失去信任，得不償失</mark>。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >在社會上，<mark class=\"hl-lj\"\n                          >商家若賣假貨，長遠會信譽掃地</mark\n                        >。<mark class=\"hl-lj\">誠信是立業的基石</mark>。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        ><mark class=\"hl-lz\"\n                          >有人認為「善意的謊言」無妨，但</mark\n                        >謊言終究是謊言，<mark class=\"hl-lz\"\n                          >應以真誠待人，選擇坦誠溝通</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\">總括而言，誠信比金錢更寶貴。</mark\n                        >讓我們說真話、守承諾。\n                      </p>\n                    </div>\n                  </details>\n                  <p class=\"text-xs font-semibold text-orange-700 mt-2 mb-1\">\n                    反方｜善意的謊言有時必要\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >誠信固然重要，但<mark class=\"hl-ld\"\n                          >我認為，在特殊情況下，善意的謊言可以保護他人，並非完全不講誠信。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >例如，<mark class=\"hl-lj\"\n                          >對重病長者，醫生或家人可能暫時隱瞞病情</mark\n                        >，<mark class=\"hl-lj\"\n                          >是為減少對方恐懼，出於關愛而非惡意</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >又如，<mark class=\"hl-lj\"\n                          >為了不傷害朋友自尊，我們或會委婉表達</mark\n                        >，<mark class=\"hl-lj\">這是顧及他人感受的說話藝術</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        ><mark class=\"hl-lz\">有人說凡謊言皆錯，但</mark\n                        >若出發點是善意，<mark class=\"hl-lz\"\n                          >且無害人之心，與蓄意欺詐截然不同</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\"\n                          >總括而言，我們應以誠信為本，但也要懂得分寸。</mark\n                        >在關鍵原則上堅守真實，在人情上保留溫度。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li class=\"border-b border-gray-100 pb-4 mb-2\">\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong class=\"text-base\">《讀書樂》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：就同一題目，寫<strong>相反立場</strong>的五段式議論文；首段表態，末段重申。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□立場明確 □兩個論據 □有反駁</span\n                    >\n                  </p>\n                  <p class=\"text-xs font-semibold text-teal-700 mt-2 mb-1\">\n                    正方｜讀書帶來樂趣\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >俗語說：「讀書為上。」<mark class=\"hl-ld\"\n                          >我深以為然：讀書不僅為了考試，更可以帶來無窮的樂趣和收穫。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >當沉浸於一本好書，<mark class=\"hl-lj\"\n                          >我們可隨主人公經歷冒險，感受悲歡離合</mark\n                        >，<mark class=\"hl-lj\"\n                          >這種心靈滿足，是其他娛樂難以比擬的</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        ><mark class=\"hl-lj\">讀書也可認識志同道合的朋友</mark\n                        >，在討論中交流心得，<mark class=\"hl-lj\"\n                          >友誼在書香中滋長</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        ><mark class=\"hl-lz\">有人說電子遊戲更過癮，但</mark\n                        >讀書的收穫可終身受用，<mark class=\"hl-lz\"\n                          >關鍵在於分配時間，以閱讀為主</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        >因此，<mark class=\"hl-ld\"\n                          >我鼓勵同學多讀書、讀好書。</mark\n                        >在書海中既可獲知識，也可找到快樂。\n                      </p>\n                    </div>\n                  </details>\n                  <p class=\"text-xs font-semibold text-orange-700 mt-2 mb-1\">\n                    反方｜讀書未必帶來樂趣\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >常說「讀書樂」，但<mark class=\"hl-ld\"\n                          >我認為，若方法不當或書籍不合適，讀書反而可能帶來壓力和厭倦。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >首先，<mark class=\"hl-lj\"\n                          >若只為考試而讀，死記硬背，過程枯燥</mark\n                        >，<mark class=\"hl-lj\"\n                          >難以體會樂趣，甚至對閱讀產生抗拒</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >其次，<mark class=\"hl-lj\"\n                          >強迫閱讀深奧或無趣的書，會令孩子卻步</mark\n                        >。<mark class=\"hl-lj\">興趣被扼殺，反而遠離書本</mark>。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        ><mark class=\"hl-lz\">有人說開卷有益，但</mark\n                        >若不按年齡和興趣選書，<mark class=\"hl-lz\"\n                          >「讀書樂」只是口號，需配合適當引導</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\"\n                          >總括而言，讀書可以樂，也可以苦。</mark\n                        >家長和老師應尊重興趣，讓同學在愉快中愛上閱讀。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li class=\"border-b border-gray-100 pb-4 mb-2\">\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong class=\"text-base\">《小學生應否參加補習班？》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：就同一題目，寫<strong>相反立場</strong>的五段式議論文；首段表態，末段重申。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□立場明確 □兩個論據 □有反駁</span\n                    >\n                  </p>\n                  <p class=\"text-xs font-semibold text-teal-700 mt-2 mb-1\">\n                    反方｜不宜過度補習\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >補習風氣盛行。<mark class=\"hl-ld\"\n                          >我認為，小學生不宜過度補習，應平衡學習與休息。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >首先，<mark class=\"hl-lj\">小學階段應培養學習興趣</mark\n                        >。若補習至深夜，<mark class=\"hl-lj\"\n                          >容易疲勞，反而影響上課專注力</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >其次，<mark class=\"hl-lj\"\n                          >童年應有玩耍和發展興趣的空間</mark\n                        >。<mark class=\"hl-lj\">過度補習會剝奪寶貴經歷</mark>。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        >當然，<mark class=\"hl-lz\"\n                          >若個別科目需加強，適量補習可接受</mark\n                        >，但<mark class=\"hl-lz\">應避免盲目跟風</mark>。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\">總括而言，補習不是越多越好。</mark\n                        >善用課堂、養成自學習慣，才能健康成長。\n                      </p>\n                    </div>\n                  </details>\n                  <p class=\"text-xs font-semibold text-orange-700 mt-2 mb-1\">\n                    正方｜適量補習有必要\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >競爭日趨激烈。<mark class=\"hl-ld\"\n                          >我認為，小學生在需要時參加補習班，有助鞏固知識，值得考慮。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        >首先，<mark class=\"hl-lj\"\n                          >部分科目如數學、英文，進度較快</mark\n                        >，<mark class=\"hl-lj\">補習可針對弱項，加深理解</mark>。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        >其次，<mark class=\"hl-lj\"\n                          >補習老師會提供額外練習和講解</mark\n                        >，<mark class=\"hl-lj\">對升讀中學打好基礎有幫助</mark>。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        ><mark class=\"hl-lz\">有人擔心沒有童年，但</mark\n                        >只要合理安排時間，<mark class=\"hl-lz\"\n                          >週末上一兩堂，不會嚴重影響休息</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        ><mark class=\"hl-ld\"\n                          >因此，適量補習可作課堂的補充。</mark\n                        >家長應按子女需要，理性選擇。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li class=\"border-b border-gray-100 pb-4 mb-2\">\n                  <span class=\"grade-badge grade-p6\">小六</span\n                  ><strong class=\"text-base\">《運動的重要性》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：就同一題目，寫<strong>相反立場</strong>的五段式議論文；首段表態，末段重申。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□立場明確 □兩個論據 □有反駁</span\n                    >\n                  </p>\n                  <p class=\"text-xs font-semibold text-teal-700 mt-2 mb-1\">\n                    正方｜運動很重要\n                  </p>\n                  <details class=\"mt-0\">\n                    <summary class=\"text-teal-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body essay-body-arg mt-2 p-3 bg-white rounded border border-teal-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第一段·論點</span\n                        >生命在於運動。<mark class=\"hl-ld\"\n                          >我認為，小學生每天應抽出時間做適量運動，對身心發展至為重要。</mark\n                        >\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第二段·論據一</span\n                        ><mark class=\"hl-lj\">運動可以增強體魄，提高抵抗力</mark\n                        >，<mark class=\"hl-lj\"\n                          >使我們精力充沛，學習也更專心</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第三段·論據二</span\n                        ><mark class=\"hl-lj\">運動可以紓緩壓力</mark>。<mark\n                          class=\"hl-lj\"\n                          >戶外活動後，心情往往豁然開朗</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第四段·論證</span\n                        >有人擔心佔用溫習時間，<mark class=\"hl-lz\"\n                          >但適度運動反而提升記憶力和專注力</mark\n                        >，<mark class=\"hl-lz\">兩者相輔相成</mark>。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-teal-100 text-teal-700\"\n                          >第五段·結論</span\n                        >因此，<mark class=\"hl-ld\"\n                          >我們應積極參與體育活動，養成恆常運動的習慣。</mark\n                        >\n                      </p>\n                    </div>\n                  </details>\n
