ols-1 md:grid-cols-3 gap-4 text-sm\">\n            <div class=\"border border-pink-100 rounded-xl p-4\">\n              <h3 class=\"font-bold text-pink-700 mb-2\">看圖作文提示</h3>\n              <p class=\"text-gray-700 mb-2\">\n                <strong>圖意想像</strong\n                >：假設圖中為「同學在雨中共撐一把傘，扶起跌倒的老人」\n              </p>\n              <ul class=\"list-disc ml-4 text-gray-700 space-y-1\">\n                <li>第一段：描寫圖中場景（時、地、人物）</li>\n                <li>第二段：推想發生甚麼事（起因）</li>\n                <li>第三段：詳寫經過（對話、動作）</li>\n                <li>第四段：結果</li>\n                <li>第五段：讚揚互助精神，聯繫自身</li>\n              </ul>\n            </div>\n            <div class=\"border border-pink-100 rounded-xl p-4\">\n              <h3 class=\"font-bold text-pink-700 mb-2\">擴寫／續寫練習</h3>\n              <p class=\"text-gray-700 mb-2\">\n                <strong>原文</strong\n                >：「明華考試不合格，十分難過。老師找他談話。」\n              </p>\n              <p class=\"text-gray-700\">\n                <strong>續寫提示</strong\n                >：續寫約200字，詳寫老師的勸勉和明華的反省，結尾帶出「失敗乃成功之母」。\n              </p>\n              <p class=\"text-xs text-gray-500 mt-2\">\n                注意：保留原文人物，勿改變結局方向；加入心理描寫和對話。\n              </p>\n            </div>\n            <div class=\"border border-pink-100 rounded-xl p-4\">\n              <h3 class=\"font-bold text-pink-700 mb-2\">閱讀報告格式</h3>\n              <ol class=\"list-decimal ml-4 text-gray-700 space-y-1\">\n                <li><strong>書名、作者</strong></li>\n                <li><strong>內容概要</strong>（約80字，勿劇透結局）</li>\n                <li><strong>人物／情節</strong>（最印象深刻的部分）</li>\n                <li><strong>讀後感想</strong>（學到甚麼、有何啟發）</li>\n                <li><strong>推薦對象</strong>（一句收結）</li>\n              </ol>\n              <p class=\"text-xs text-gray-500 mt-2\">\n                可參考實用文區《讀書報告——《西遊記》》範文。\n              </p>\n            </div>\n          </div>\n        </div>\n      </section>\n\n      <!-- 分類網格區 -->\n      <div class=\"grid grid-cols-1 md:grid-cols-2 gap-8 mb-12\">\n        <!-- 1. 記敘文 -->\n        <div\n          id=\"cat-narrative\"\n          class=\"bg-white rounded-xl shadow-md overflow-hidden border-t-4 border-blue-500 hover:shadow-lg transition-shadow duration-300\"\n        >\n          <div class=\"p-6 h-full flex flex-col\">\n            <h2 class=\"text-2xl font-bold text-blue-700 mb-3 flex items-center\">\n              <span class=\"mr-2\">📝</span> 記敘文 (記事、記人)\n            </h2>\n            <div class=\"mb-4\">\n              <h3\n                class=\"font-semibold text-gray-700 bg-blue-50 inline-block px-2 py-1 rounded mb-2\"\n              >\n                📌 教育局要求重點\n              </h3>\n              <p class=\"text-gray-600 text-sm leading-relaxed\">\n                【小五至小六】掌握記敘六要素（時、地、人、事、因、果）及順敘法；運用審題、詳略安排、敘事框及時空過渡語；記人記事記遊，結尾宜作感悟（TSA小六短文常考記敘文）。\n                <br /><span\n                  class=\"grade-cat-note grade-legend block text-xs text-gray-600 mt-2\"\n                  >【小五】記敘六要素、順敘詳略｜【小六】TSA短文記敘、感悟深化（本類題目均標<strong>小五</strong>，小六必温習）</span\n                >\n              </p>\n            </div>\n\n            <p class=\"structure-tag\">結構：起因 ➔ 經過（詳寫） ➔ 結果 ➔ 感悟</p>\n            <!-- fill-template:narrative -->\n            <details class=\"fill-template fill-blue mb-4\">\n              <summary class=\"fill-summary\" style=\"color: #1e40af\">\n                <span>📝 萬能填充思考區（記敘文）</span>\n                <span class=\"fill-hint text-xs font-normal text-gray-500\"\n                  >動筆前先填好各段重點</span\n                >\n              </summary>\n              <div\n                class=\"fill-body\"\n                style=\"background: #eff6ff; border-color: #93c5fd\"\n              >\n                <p class=\"fill-line\">\n                  <strong>第一段（起）：</strong\n                  ><span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（時間）__</span\n                  >，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（人物）__</span\n                  >在<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（地點）__</span\n                  ><span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（做甚麼）__</span\n                  >，因為<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（原因）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第二段（承）：</strong>起初，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（事情開始的情況）__</span\n                  >，我感到十分<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（心情）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（鋪墊細節）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第三段（轉）：</strong>突然，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（發生了甚麼意外／變化）__</span\n                  >。當時情況<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（形容情況）__</span\n                  >，我<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（當時的反應／動作）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第四段（詳寫）：</strong\n                  ><span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（如何面對／解決）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（對話或細節）__</span\n                  >。結果，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（事情的結果）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第五段（合）：</strong>經過這次<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（的經歷）__</span\n                  >，我明白<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（道理／重要性）__</span\n                  >，正所謂「<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（諺語，如：經一事，長一智）__</span\n                  >」，我日後會<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #2563eb;\n                      border-bottom: 1px dashed #2563eb;\n                      padding: 0 2px;\n                    \"\n                    >__（未來的行動）__</span\n                  >。\n                </p>\n                <p class=\"fill-tip text-xs mt-2\" style=\"color: #1e40af\">\n                  💡\n                  填好藍色空格後，再按各段字數（約50／80–90字）擴寫成完整段落。\n                </p>\n              </div>\n            </details>\n            <!-- fill-template:narrative /-->\n            <div class=\"mb-4 flex-grow\">\n              <h3\n                class=\"font-semibold text-gray-700 bg-gray-100 inline-block px-2 py-1 rounded mb-2\"\n              >\n                🎯 常見題目雜錦\n              </h3>\n              <ul class=\"list-none text-gray-700 text-sm space-y-3 ml-1\">\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《一件令我後悔的事》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：以五段式寫「一次令我學會誠實的事」，第三段詳寫內心掙扎。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□六要素 □經過詳寫\n                      □結尾有感悟</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-blue-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-blue-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第一段·開頭</span\n                        >人人都有<mark class=\"kw-highlight\">後悔</mark\n                        >的時刻。上學期的一次數學小測，至今仍讓我<mark\n                          class=\"kw-highlight\"\n                          >臉紅耳熱</mark\n                        >，難以忘懷。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第二段·起因</span\n                        >數學一直是我較弱的科目。考試前，同桌借我筆記溫習，我卻草草翻看，心想應該沒問題。考試當日，題目比想像中難，我越做越慌，手心不停冒汗，腦袋一片空白。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第三段·經過</span\n                        >眼看時間將盡，我四周張望，發現監考老師轉身整理試卷。<mark\n                          class=\"kw-highlight\"\n                          >那一刻</mark\n                        >，邪念湧上心頭，我悄悄翻閱課本想要找答案。才剛打開書頁，老師便猛然回頭，<mark\n                          class=\"kw-highlight\"\n                          >目光如炬</mark\n                        >地盯着我。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第四段·結果</span\n                        >老師走過來輕聲問我原因，隨後收走了試卷。下課後，我被叫去訓導處，成績表上記了零分。我<mark\n                          class=\"kw-highlight\"\n                          >低着頭</mark\n                        >，不敢看同學失望的眼神，<mark class=\"kw-highlight\"\n                          >心裏</mark\n                        >既<mark class=\"kw-highlight\">羞愧</mark>又<mark\n                          class=\"kw-highlight\"\n                          >後悔</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第五段·感悟</span\n                        >這件事給我深刻教訓：<mark class=\"kw-highlight\"\n                          >誠信</mark\n                        >比分數更重要。<mark class=\"kw-highlight\">從此</mark\n                        >我認真溫習，再不走捷徑。<mark class=\"kw-highlight\"\n                          >雖然</mark\n                        >那次得了零分，我卻學會對自己負責，這是課本也教不到的寶貴一課。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《記一次難忘的校外參觀》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：改寫為「記一次STEM工作坊」，加入所見所聞和學習收穫。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□有場景描寫 □有具體細節\n                      □結尾有啟發</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-blue-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-blue-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第一段·開頭</span\n                        >上個月，學校組織我們到科學館參觀。那次經歷豐富了我的見聞，至今仍在腦海中<mark\n                          class=\"kw-highlight\"\n                          >歷歷在目</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第二段·準備</span\n                        >出發當天，同學們都<mark class=\"kw-highlight\">興奮</mark\n                        >不已。在旅遊巴上，大家有說有笑，老師也叮囑我們要守秩序、留心安全。到了科學館，宏偉的建築和各式展覽品立刻吸引了我們的目光。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第三段·經過</span\n                        >我們<mark class=\"kw-highlight\">首先</mark\n                        >參觀了太空館展區。透過模擬火箭升空的裝置，我彷彿置身宇宙之中。接着，導賞員帶我們做電路實驗，我親手連接電線，小燈泡便亮了起來，同學們都發出驚喜的歡呼聲。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第四段·高潮</span\n                        >最令我難忘的是機械人示範。機械人靈活地行走、揮手，甚至能與觀眾對話。我專心聆聽講解，還大膽舉手提問，獲得導賞員稱讚。<mark\n                          class=\"kw-highlight\"\n                          >那一刻</mark\n                        >，我對科學產生了濃厚的興趣。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第五段·感悟</span\n                        >回程時，夕陽灑在窗邊，我仍回味着今天的所見所聞。這次參觀讓我明白：科學並不遙遠，只要用心探索，處處都有學問。我期待下次再走出課室，開拓眼界。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《我最敬佩的一個人》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：寫「我最敬佩的一位長輩」，運用外貌、動作和語言描寫。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□人物特點突出 □有事例\n                      □結尾點題</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-blue-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-blue-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第一段·開頭</span\n                        >在我心目中，最敬佩的人是奶奶。她年過七十，仍每天操勞家務，<mark\n                          class=\"kw-highlight\"\n                          >無怨無悔</mark\n                        >地照顧我們一家。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第二段·外貌</span\n                        >奶奶個子不高，頭髮已夾雜不少銀絲，臉上布滿歲月留下的皺紋。<mark\n                          class=\"kw-highlight\"\n                          >然而</mark\n                        >，她的眼睛總是慈祥有神，笑起來像彎彎的月牙，讓人感到溫暖。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第三段·事例</span\n                        >每天清晨，奶奶總是第一個起床，為家人準備熱騰騰的早餐。我生病時，她徹夜守在床邊，一邊輕撫我的額頭，一邊柔聲安慰。無論多麼疲累，她從不訴苦，只默默付出。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第四段·深入</span\n                        >有一次，我見奶奶腰骨疼痛，仍堅持到街市買菜。我勸她休息，她卻說：「你們讀書辛苦，奶奶做這點事不算甚麼。」聽罷，我眼眶濕潤，深深被她的愛所<mark\n                          class=\"kw-highlight\"\n                          >感動</mark\n                        >。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第五段·感悟</span\n                        >奶奶用行動教會我什麼是無私的愛。我願意學習她的<mark\n                          class=\"kw-highlight\"\n                          >堅毅</mark\n                        >和體貼，長大後好好報答她。她是我一生最敬佩的人。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《那天，我終於克服了恐懼》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：寫「那天，我終於學會游泳／演講」，詳寫克服過程。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□有心理描寫 □高潮段夠詳\n                      □首尾呼應</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-blue-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-blue-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第一段·開頭</span\n                        >從小，我十分害怕游泳。每當看見深水區，<mark\n                          class=\"kw-highlight\"\n                          >心裏</mark\n                        >便怦怦直跳，總想轉身逃走。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第二段·背景</span\n                        >升上五年級，學校要求每位同學學會游泳。同學們一個個跳入水中，暢快地游來游去，只有我站在池邊，雙腿發軟，遲遲不敢下水。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第三段·經過</span\n                        >教練走過來，耐心教我握浮板、練習呼吸。第一次頭浸入水中，嗆了幾口水，我驚慌地抬頭。教練鼓勵道：「不要怕，多練習就會適應。」我咬緊牙關，一次又一次地嘗試。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第四段·高潮</span\n                        >經過數週努力，那天我<mark class=\"kw-highlight\"\n                          >終於</mark\n                        >放開浮板，獨自在水中游了十米。<mark\n                          class=\"kw-highlight\"\n                          >雖然</mark\n                        >動作還不太標準，但同學們都為我鼓掌。<mark\n                          class=\"kw-highlight\"\n                          >那一刻</mark\n                        >，我感受到前所未有的喜悅和自豪。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第五段·感悟</span\n                        >這次經歷讓我明白：<mark class=\"kw-highlight\">恐懼</mark\n                        >往往來自未知，只要勇敢面對、堅持練習，就能克服。<mark\n                          class=\"kw-highlight\"\n                          >從此</mark\n                        >，我不再輕言放棄，對任何挑戰都多了一分信心。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《一次深刻的教訓》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：寫「一次因大意而失敗的經歷」，結尾寫出改進方法。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□起因清楚 □有轉折 □有反思</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-blue-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-blue-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第一段·開頭</span\n                        >人難免會犯錯，但有些錯誤會成為畢生難忘的教訓。去年暑假，我就經歷了這樣一件事。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第二段·起因</span\n                        >那天，媽媽出門買菜，囑咐我看好爐上的湯。我顧着看電視，把這件事拋諸腦後。廣告時間，我聞到一陣焦味，才猛然想起廚房還在煲湯。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第三段·經過</span\n                        >我衝進廚房，只見鍋裏的湯已經燒乾，底部冒起黑煙。我手忙腳亂地關火，鍋子燙得通紅，差點燙傷我的手。鄰居聞到異味，也敲門前來關切詢問。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第四段·結果</span\n                        >媽媽回來後，看見一片狼藉的廚房，沒有大聲責罵，只嚴肅地說：「若再遲一步，後果不堪設想。」我低頭聽教訓，<mark\n                          class=\"kw-highlight\"\n                          >心裏</mark\n                        >既害怕又內疚，深知是自己的疏忽差點釀成大禍。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第五段·感悟</span\n                        ><mark class=\"kw-highlight\">從此</mark\n                        >，我做事再也不三心二意。無論多麼瑣碎的事，我都會記在心上，認真完成。這次教訓時刻提醒我要負起<mark\n                          class=\"kw-highlight\"\n                          >責任</mark\n                        >，不可掉以輕心。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《我的好朋友》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：寫「一位令我感動的同學」，加入一件難忘的互助事例。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□記人記事結合 □有對話\n                      □感情真摯</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-blue-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-blue-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第一段·開頭</span\n                        >在班裏，我有一位知心的好朋友，他叫家明。我們相識已有三年，感情十分深厚。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第二段·外貌</span\n                        >家明身材修長，皮膚黝黑，那是他經常運動的緣故。他總是面帶笑容，一對明亮的眼睛充滿活力，說話時語氣爽朗，給人親切的感覺。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第三段·事例</span\n                        >他<mark class=\"kw-highlight\">不但</mark\n                        ><mark class=\"kw-highlight\">品學兼優</mark>，<mark\n                          class=\"kw-highlight\"\n                          >而且</mark\n                        >樂於助人。記得有一次，我因為忘記帶功課被罰留堂，家明放學後主動留下來陪我，還幫我講解難題，直到我全部明白為止。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第四段·深入</span\n                        >我們興趣相近，放學後常一起到球場練習籃球。他總是耐心地教我投籃技巧，即使我屢次失敗，也從不嫌棄。在他的鼓勵下，我的球技漸漸進步。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第五段·感悟</span\n                        >能遇上家明這樣的朋友，是我最大的幸運。他讓我體會到真誠和互助的可貴。我會珍惜這份友誼，也希望我們的友情地久天長。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《一次令我驕傲的事》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：寫「一次比賽獲獎的經歷」，詳寫備戰過程。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□詳略得當 □有對話或動作\n                      □結尾謙遜</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-blue-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-blue-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第一段·開頭</span\n                        >成功需要汗水換取。上個月，我在校際朗誦比賽中獲得冠軍，那是我最<mark\n                          class=\"kw-highlight\"\n                          >驕傲</mark\n                        >的一刻。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第二段·起因</span\n                        >比賽前兩個月，老師選我代表學校參賽。我既<mark\n                          class=\"kw-highlight\"\n                          >興奮</mark\n                        >又<mark class=\"kw-highlight\">緊張</mark\n                        >，每天放學後都留在課室練習，反覆調整語調和停頓，力求把每一個字都讀準。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第三段·經過</span\n                        >比賽當日，禮堂座無虛席。輪到我上台時，心跳加速，雙手微微顫抖。我深呼吸，回想老師的教導，然後開口朗誦。聲音從怯懦漸變洪亮，感情也自然流露。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第四段·結果</span\n                        >評判宣布結果，我聽見自己的名字，全場響起熱烈的掌聲。我接過獎盃，向評判和老師鞠躬致謝，眼眶不禁濕潤。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第五段·感悟</span\n                        >這次經歷讓我明白：<mark class=\"kw-highlight\">驕傲</mark\n                        >並非來自運氣，而是來自日復一日的努力。只要堅持練習，就能戰勝<mark\n                          class=\"kw-highlight\"\n                          >恐懼</mark\n                        >，迎來屬於自己的高光時刻。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《記一次校運會》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：寫「記一次班際接力賽」，詳寫最緊張的一棒。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□場面描寫 □氣氛渲染\n                      □團隊精神</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-blue-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-blue-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第一段·開頭</span\n                        >每年一度的校運會，都是校園最熱鬧的日子。今年我參加四百米接力賽，更體會到團隊<mark\n                          class=\"kw-highlight\"\n                          >合作</mark\n                        >的可貴。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第二段·鋪墊</span\n                        >開幕禮上，各班隊伍精神飽滿地入場，彩旗在風中飛揚。我們班為此操練多時，彼此約定要<mark\n                          class=\"kw-highlight\"\n                          >全力以赴</mark\n                        >，爭取好成績。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第三段·經過</span\n                        >接力賽開始，首兩棒我們穩居前列。輪到我接棒時，棒跌在地上，我頓時慌了手腳，但仍咬緊牙關追趕，把棒交給最後一棒。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第四段·高潮</span\n                        >最後一棒的同學奮力衝刺，在終點前超越對手，我們逆轉奪得亞軍。全班歡呼，互相擁抱，喜悅溢於言表。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第五段·感悟</span\n                        >這次比賽教會我：個人的失誤可以靠團隊彌補。只要<mark\n                          class=\"kw-highlight\"\n                          >齊心協力</mark\n                        >，永不放棄，便能在挫折中看見希望。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《我學會了騎單車》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：寫「我學會了游泳／溜冰」，用「嘗試—失敗—堅持—成功」結構。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□過程完整 □有家人或朋友\n                      □有感悟</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-blue-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-blue-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第一段·開頭</span\n                        >學習新技能往往充滿挑戰。去年暑假，我<mark\n                          class=\"kw-highlight\"\n                          >終於</mark\n                        >學會了騎單車，過程<mark class=\"kw-highlight\">雖然</mark\n                        >艱辛，卻令我獲益良多。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第二段·起因</span\n                        >同學們大多已能自如地踏單車，只有我仍然需要輔助輪。每當看見他們結伴在公園馳騁，我便暗暗下決心要學會。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第三段·經過</span\n                        >爸爸在後巷教我，先推穩車身，再慢慢放手。我多次跌倒，膝蓋擦傷，但每次都爬起來繼續練習，從不抱怨。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第四段·結果</span\n                        ><mark class=\"kw-highlight\">終於</mark\n                        >有一天，爸爸完全放手，我竟能獨自踏行了十米、二十米，直至繞過整個球場。我<mark\n                          class=\"kw-highlight\"\n                          >興奮</mark\n                        >地大喊，爸爸也露出欣慰的笑容。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第五段·感悟</span\n                        >這段經歷讓我體會到：失敗乃成功之母。只要懷着<mark\n                          class=\"kw-highlight\"\n                          >堅毅</mark\n                        >的意志，屢敗屢戰，終能跨越困難，品嚐成功的喜悅。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《一次愉快的生日會》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：寫「一次難忘的畢業營／旅行」，加入人物互動。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□場景清楚 □有高潮 □結尾餘韻</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-blue-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-blue-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第一段·開頭</span\n                        >生日是童年最期待的時刻之一。今年，媽媽為我舉辦了一個小型生日會，成為我記憶中溫暖的一天。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >準備</span\n                        >媽媽提前訂製了蛋糕，還邀請幾位好友到家中。我幫忙佈置氣球和彩帶，把客廳裝飾得像節日般熱鬧。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第三段·經過</span\n                        >同學們到來後，我們一起玩遊戲、分享零食，客廳裏笑聲不斷。切蛋糕時，大家齊聲唱生日歌，燭光映照着每一張笑臉。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第四段·高潮</span\n                        >最驚喜的是，爸爸送我一套心儀已久的書，還附上一張手寫卡片，字句樸實卻充滿關愛，讓我<mark\n                          class=\"kw-highlight\"\n                          >感動</mark\n                        >不已。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-blue-100 text-blue-700\"\n                          >第五段·感悟</span\n                        >這個生日會讓我明白：快樂不在於禮物多貴，而在於親友相聚的真情。我會珍惜這份溫暖，並學會把關愛傳遞給他人。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n              </ul>\n            </div>\n            <div\n              class=\"bg-blue-50 border-l-4 border-blue-400 p-3 rounded mt-auto\"\n            >\n              <p class=\"text-xs text-blue-800\">\n                <strong>💡 寫作小貼士：</strong>\n                提醒孩子在寫「經過」時要放慢筆觸，詳細描寫人物的對話和內心感受。結尾必須帶出這件事帶給自己的啟發或反思（即「藉事抒情」或「藉事說理」）。\n              </p>\n            </div>\n          </div>\n        </div>\n\n        <!-- 2. 描寫文 -->\n        <div\n          id=\"cat-descriptive\"\n          class=\"bg-white rounded-xl shadow-md overflow-hidden border-t-4 border-green-500 hover:shadow-lg transition-shadow duration-300\"\n        >\n          <div class=\"p-6 h-full flex flex-col\">\n            <h2\n              class=\"text-2xl font-bold text-green-700 mb-3 flex items-center\"\n            >\n              <span class=\"mr-2\">🎨</span> 描寫文 (寫景、寫物)\n            </h2>\n            <div class=\"mb-4\">\n              <h3\n                class=\"font-semibold text-gray-700 bg-green-50 inline-block px-2 py-1 rounded mb-2\"\n              >\n                📌 教育局要求重點\n              </h3>\n              <p class=\"text-gray-600 text-sm leading-relaxed\">\n                【小五至小六】運用步移法、定點觀察及「大特寫」概念；結合五感、動靜態描寫及比喻、擬人等修辭；按次序描寫景物或人物（課程第二學習階段重點文體）。\n                <br /><span\n                  class=\"grade-cat-note grade-legend block text-xs text-gray-600 mt-2\"\n                  >【小五】寫景寫物、感官描寫｜【小六】多角度與修辭運用（本類題目均標<strong>小五</strong>）</span\n                >\n              </p>\n            </div>\n\n            <p class=\"structure-tag\">\n              結構：總寫 ➔ 分角度描寫（視覺／聽覺等） ➔ 總結感受\n            </p>\n            <!-- fill-template:descriptive -->\n            <details class=\"fill-template fill-green mb-4\">\n              <summary class=\"fill-summary\" style=\"color: #065f46\">\n                <span>📝 萬能填充思考區（描寫文）</span>\n                <span class=\"fill-hint text-xs font-normal text-gray-500\"\n                  >動筆前先填好各段重點</span\n                >\n              </summary>\n              <div\n                class=\"fill-body\"\n                style=\"background: #ecfdf5; border-color: #6ee7b7\"\n              >\n                <p class=\"fill-line\">\n                  <strong>第一段（總寫）：</strong\n                  ><span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（描寫對象）__</span\n                  >給我留下深刻印象。每逢<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（時間／場合）__</span\n                  >，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（人物）__</span\n                  >總會到<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（地點）__</span\n                  >，感受<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（整體印象）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第二段（視覺）：</strong>放眼望去，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（所見景象）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（顏色／形狀／大小）__</span\n                  >，像<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（比喻）__</span\n                  >，令人<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（感受）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第三段（聽覺／嗅覺）：</strong>耳朵裏傳來<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（聲音）__</span\n                  >，空氣中彌漫<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（氣味）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（另一感官細節）__</span\n                  >，構成了一幅<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（形容）__</span\n                  >的畫面。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第四段（特寫）：</strong>定睛一看，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（局部細節）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（景物或人物動態）__</span\n                  >，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（修辭或形容）__</span\n                  >，格外<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（突出之處）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第五段（總結）：</strong>這就是<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（描寫對象）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（總結感受）__</span\n                  >，我<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（抒情／呼籲／聯想）__</span\n                  >，但願<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #059669;\n                      border-bottom: 1px dashed #059669;\n                      padding: 0 2px;\n                    \"\n                    >__（意願）__</span\n                  >。\n                </p>\n                <p class=\"fill-tip text-xs mt-2\" style=\"color: #065f46\">\n                  💡\n                  填好藍色空格後，再按各段字數（約50／80–90字）擴寫成完整段落。\n                </p>\n              </div>\n            </details>\n            <!-- fill-template:descriptive /-->\n            <div class=\"mb-4 flex-grow\">\n              <h3\n                class=\"font-semibold text-gray-700 bg-gray-100 inline-block px-2 py-1 rounded mb-2\"\n              >\n                🎯 常見題目雜錦\n              </h3>\n              <ul class=\"list-none text-gray-700 text-sm space-y-3 ml-1\">\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《熱鬧的年宵市場》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：寫「熱鬧的元宵維園晚會／花市」，運用視覺和聽覺。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□多角度描寫 □有修辭 □有層次</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-green-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-green-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第一段·開頭</span\n                        >每逢農曆新年，年宵市場總是<mark class=\"kw-highlight\"\n                          >人聲鼎沸</mark\n                        >。今年除夕，我隨家人到維園逛年宵，感受濃厚的節日氣氛。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第二段·視覺</span\n                        >一進入會場，<mark class=\"kw-highlight\">五光十色</mark\n                        >的燈飾映在眼前。各個攤檔擺滿了桃花、水仙和各式盆栽，粉紅、金黃的花朵爭妍鬥麗，把夜空點綴得繽紛奪目。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第三段·聽覺</span\n                        >耳邊傳來商販的叫賣聲、顧客的討價聲，還有孩子們的歡笑聲，匯成一片熱鬧的樂章。攤檔前，人們絡繹不絕，<mark\n                          class=\"kw-highlight\"\n                          >摩肩接踵</mark\n                        >，每個臉上都洋溢着喜悅。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第四段·嗅覺</span\n                        >空氣中瀰漫着各種氣味：鮮花的清香、小食的誘人香氣，還有少許煙火的味道。我們買了風車和糖葫蘆，邊走邊吃，<mark\n                          class=\"kw-highlight\"\n                          >心裏</mark\n                        >甜滋滋的。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第五段·總結</span\n                        >離開年宵市場時，我仍然回頭張望。這裏不僅是購物的地方，更承載了團圓和歡樂。年宵的熱鬧，正是新年最動人的寫照。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《雨後的校園》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：寫「雪後的街景／清晨的校園」，注意感官描寫。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□有比喻 □有動靜結合\n                      □結尾收束</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-green-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-green-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第一段·開頭</span\n                        >一場大雨剛剛停歇，校園像被洗滌過一般，<mark\n                          class=\"kw-highlight\"\n                          >煥然一新</mark\n                        >。我獨自走在操場上，靜靜欣賞雨後的景色。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第二段·靜態</span\n                        >操場上的跑道濕潤發亮，倒映着灰藍的天空。教學樓的外牆掛着串串水珠，在陽光下閃閃發光，像一顆顆晶瑩的珍珠。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第三段·動態</span\n                        >操場邊的榕樹上，幾隻小鳥抖落羽毛上的雨水，歡快地鳴叫。微風吹過，樹葉上的水滴簌簌落下，濺起細小的水花，發出輕柔的聲響。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第四段·感官</span\n                        >空氣格外清新，夾雜着泥土和青草的氣息，讓人<mark\n                          class=\"kw-highlight\"\n                          >心曠神怡</mark\n                        >。花圃裏的杜鵑花經過雨水滋潤，顏色更加鮮艷，彷彿向人展示生命的活力。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第五段·總結</span\n                        >雨後的校園寧靜而美麗，與平日的喧鬧截然不同。這份寧靜讓我學會用心觀察身邊的事物，發現日常中被忽略的美好。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《我的心愛之物》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：寫「我的書桌／藏書」，加入與物品的往事。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□有外形描寫 □有故事 □有感情</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-green-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-green-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第一段·開頭</span\n                        >在我的書桌上，擺着一隻舊舊的熊仔公仔。它<mark\n                          class=\"kw-highlight\"\n                          >雖然</mark\n                        >不再嶄新，卻是我從小至現在最珍視的心愛之物。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第二段·外觀</span\n                        >這隻熊仔渾身米黃色，毛絨已有些脫落，一邊耳朵還曾經縫補過。它的眼睛是兩顆黑色的鈕扣，鼻子微微翹起，永遠帶着憨厚的笑容。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第三段·來歷</span\n                        >它是我五歲生日時，媽媽送給我的禮物。那年我因為搬屋適應不了新環境，常常哭鬧。媽媽把熊仔放在我懷裏，說它會一直陪伴我。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第四段·情感</span\n                        ><mark class=\"kw-highlight\">從此</mark\n                        >，無論開心或傷心，我都會向熊仔傾訴。考試失敗時，它彷彿用無言的目光安慰我；取得好成績時，我也會第一時間與它分享喜悅。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第五段·總結</span\n                        >熊仔見證了我的成長，承載了無數回憶。它教會我珍惜身邊的人事物，因為最平凡的物品，也可以擁有最深厚的感情。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《千變萬化的天空》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：寫「四季的變化／一场暴風雨」，分時段或分角度描寫。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□有層次 □用詞豐富 □結尾升华</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-green-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-green-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第一段·開頭</span\n                        >天空是大自然最奇妙的畫布，時刻呈現不同的面貌。只要抬頭仰望，便會發現它千變萬化，令人驚嘆。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第二段·晴天</span\n                        >晴朗的日子，天空蔚藍如洗，像一塊巨大的藍寶石。潔白的雲朵悠悠飄過，形狀各異，有時像綿羊，有時像山峰，引發我無限的想像。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第三段·黃昏</span\n                        >黃昏時分，天空換上了另一套衣裳。夕陽把雲霞染成橙紅、金黃和淡紫，層層疊疊，絢麗奪目。整個天際彷彿燃起了溫柔的火焰。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第四段·雨天</span\n                        >暴風雨來臨前，天空驟然變暗，烏雲翻滾，電閃雷鳴。雨後，又常出現彩虹，七色光芒橫跨天際，像一座通往雲端的橋樑，美不勝收。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第五段·總結</span\n                        >天空的變化啟示我們：世界充滿了驚喜。只要留心觀察，平凡的生活中處處都有動人的風景，值得我們<mark\n                          class=\"kw-highlight\"\n                          >細細品味</mark\n                        >。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《美麗的秋天》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換一個地點或人物，保持五段描寫結構，每段一個角度。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□扣題 □有細節 □修辭1–2處</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-green-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-green-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第一段·開頭</span\n                        >秋天是四季中最詩意的季節。金風送爽，碩果累累，大地披上了一層金黃色的外衣，處處瀰漫着豐收的氣息。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第二段·景色</span\n                        >走進公園，楓葉漸漸轉紅，像一團團燃燒的火焰。銀杏樹的葉子變成金黃色，在陽光下閃閃發亮，微風吹過，落葉翩翩飛舞，如蝴蝶般優雅。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第三段·動態</span\n                        >田野裏，稻穗低垂，隨風起伏，像一片金色的海洋。農民忙着收割，臉上洋溢着滿足的笑容。果園裏，橙子和柿子掛滿枝頭，散發着誘人的甜香。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第四段·感受</span\n                        >秋高氣爽，天空格外高遠。放學後，我喜歡踏着落葉散步，腳下發出沙沙的聲響，清涼的空氣讓人<mark\n                          class=\"kw-highlight\"\n                          >心曠神怡</mark\n                        >，疲勞也隨之消散。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第五段·總結</span\n                        >秋天不僅景色迷人，更提醒人們珍惜耕耘後的收穫。它教會我：付出努力，終會得到回報，這是大自然給我們最實在的啟示。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《黃昏的街道》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換一個地點或人物，保持五段描寫結構，每段一個角度。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□扣題 □有細節 □修辭1–2處</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-green-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-green-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第一段·開頭</span\n                        >黃昏時分，街道褪去了白日的喧囂，換上了一種寧靜而溫柔的氛圍。放學後，我獨自行走在這條熟悉的街道上。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第二段·光線</span\n                        >夕陽把餘暉灑在路面上，鍍上一層淡淡的金色。店舖的霓虹燈陸續亮起，與天邊的晚霞互相輝映，構成了一幅動人的圖畫。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第三段·人物</span\n                        >街角的老伯伯擺賣著番薯，香氣隨風飄散。放學的學生三三兩兩結伴而歸，說笑聲漸漸遠去。一位母親牽着幼兒的手，緩緩走過斑馬線，畫面溫馨。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第四段·聲音</span\n                        >遠處傳來電車叮叮的聲響，與車流的低鳴交織在一起。路邊的樹影被拉得很長，微風輕拂，帶來一絲涼意，也吹散了整日的疲憊。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第五段·總結</span\n                        >黃昏的街道，承載着一天的結束，也預告着團聚的開始。這份寧靜與溫暖，讓我學會放慢腳步，感受生活中細微而真實的美好。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《春天的公園》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換一個地點或人物，保持五段描寫結構，每段一個角度。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□扣題 □有細節 □修辭1–2處</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-green-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-green-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >開頭</span\n                        >春天來臨，公園裏萬物復甦，生機勃勃。週末，我隨家人到公園散步，感受春日的氣息。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第二段·視覺</span\n                        >眼前，櫻花綻放，粉白相間，像一片輕柔的雲霞。草地上，野餐的家庭鋪起彩格布，孩子們追逐嬉戲，色彩繽紛。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >聽覺</span\n                        >耳邊傳來鳥鳴啁啾，與遠處的流水聲交織成曲。微風拂過樹梢，樹葉沙沙作響，彷彿大自然在低聲細語。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第四段·嗅覺</span\n                        >空氣中彌漫着泥土和花草的清香，深吸一口，令人<mark\n                          class=\"kw-highlight\"\n                          >心曠神怡</mark\n                        >。花圃裏的蜜蜂忙碌地採蜜，展現春天旺盛的生命力。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >總結</span\n                        >春天的公園，是大自然贈予我們的禮物。它提醒我要留心季節的變化，在繁忙中也要停步欣賞身邊的美好。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《迷人的海洋公園》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換一個地點或人物，保持五段描寫結構，每段一個角度。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□扣題 □有細節 □修辭1–2處</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-green-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-green-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >開頭</span\n                        >海洋公園是香港著名的旅遊景點，集娛樂與教育於一身。上次家庭旅行，我們在此度過了難忘的一天。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第二段·靜態</span\n                        >園內建築依山而建，與蔚藍的海景相映成趣。纜車緩緩上升，把整個南區的海岸線盡收眼底，壯麗無比。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第三段·動態</span\n                        >在海洋劇場，海豚和海獅靈活地躍出水面，濺起晶瑩的水花，觀眾報以陣陣歡呼。<mark\n                          class=\"kw-highlight\"\n                          >動態</mark\n                        >的表演生動展現了海洋生物的活力。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第四段·感官</span\n                        >水族館內，五彩繽紛的魚群穿梭於珊瑚之間，像一幅流動的畫卷。透過玻璃，我們近距離觀察這些奇妙的生命，增長見聞。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >總結</span\n                        >這次遊歷讓我體會到保護海洋的重要。我們應該珍惜自然資源，讓後代也能欣賞這片美麗的藍色世界。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《描寫我的班主任》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換一個地點或人物，保持五段描寫結構，每段一個角度。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□扣題 □有細節 □修辭1–2處</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-green-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-green-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >開頭</span\n                        >在眾多老師中，我最難忘的是班主任李老師。她關懷備至，像一位慈愛的母親，陪伴我們成長。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第二段·外貌</span\n                        >李老師個子中等，總是穿着樸素的套裝，頭髮整齊地紮起。她的眼睛明亮有神，笑起來眼角現出細紋，親切而溫暖。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第三段·動作</span\n                        >上課時，她手勢明快，聲音抑揚頓挫，把課文講解得生動有趣。批改功課時，她逐字逐句，紅筆寫下詳盡的評語。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第四段·事例</span\n                        >記得一次我因家庭問題情緒低落，李老師課後找我談心，耐心聆聽，輕聲安慰。她的關懷，讓我重新振作。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >總結</span\n                        >李老師用言行教會我什麼是<mark class=\"kw-highlight\"\n                          >責任</mark\n                        >和愛。我願意以她為榜樣，將來也成為對他人有益的人。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n                <li>\n                  <span class=\"grade-badge grade-p5\">小五</span\n                  ><strong>《繁忙的旺角街市》</strong>\n                  <p class=\"imitation-hint\">\n                    <strong>✏️ 仿寫提示：</strong\n                    >仿寫：換一個地點或人物，保持五段描寫結構，每段一個角度。<br /><span\n                      class=\"self-check\"\n                      ><strong>自評：</strong>□扣題 □有細節 □修辭1–2處</span\n                    >\n                  </p>\n                  <details class=\"mt-1\">\n                    <summary class=\"text-green-600 text-xs\">\n                      <span class=\"essay-toggle\"\n                        >閱讀五段式範文（約350字）</span\n                      >\n                    </summary>\n                    <div\n                      class=\"essay-body mt-2 p-3 bg-white rounded border border-green-100 text-gray-800\"\n                    >\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >開頭</span\n                        >旺角街市是香港最具本土特色的地方之一。清晨，我隨奶奶前來買菜，見識了這裏熱鬧的風情。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第二段·視覺</span\n                        >檔口林立，鮮魚、蔬果和乾貨堆疊如山，顏色鮮艷。賣魚的師傅手起刀落，動作俐落；菜販則大聲吆喝，招徠顧客。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >聽覺</span\n                        >人聲、刀聲和車聲混成一片，沒有片刻寧靜。顧客討價還價，聲音此起彼伏，充滿了生活氣息。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >第四段·嗅覺</span\n                        >空氣中夾雜着魚腥、果香和香料的氣味，<mark\n                          class=\"kw-highlight\"\n                          >雖然</mark\n                        >複雜，卻是這個街市獨有的味道，讓人感受到香港的活力。\n                      </p>\n                      <p>\n                        <span class=\"essay-tag bg-green-100 text-green-700\"\n                          >總結</span\n                        >離開街市，我仍回味剛才的所見所聞。這裏不僅是買賣的地方，更是本土文化縮影，值得我們細細觀察和珍惜。\n                      </p>\n                    </div>\n                  </details>\n                </li>\n              </ul>\n            </div>\n            <div\n              class=\"bg-green-50 border-l-4 border-green-400 p-3 rounded mt-auto\"\n            >\n              <p class=\"text-xs text-green-800\">\n                <strong>💡 寫作小貼士：</strong>\n                避免整篇文章只用「視覺」（看見甚麼）。鼓勵孩子加入「聽覺」（如喧鬧聲、鳥鳴）和「嗅覺」（如花香、泥土氣息），並多用比喻和擬人法。\n              </p>\n            </div>\n          </div>\n        </div>\n\n        <!-- 3. 抒情文 -->\n        <div\n          id=\"cat-lyrical\"\n          class=\"bg-white rounded-xl shadow-md overflow-hidden border-t-4 border-pink-500 hover:shadow-lg transition-shadow duration-300\"\n        >\n          <div class=\"p-6 h-full flex flex-col\">\n            <h2 class=\"text-2xl font-bold text-pink-700 mb-3 flex items-center\">\n              <span class=\"mr-2\">❤️</span> 抒情文\n            </h2>\n            <div class=\"mb-4\">\n              <h3\n                class=\"font-semibold text-gray-700 bg-pink-50 inline-block px-2 py-1 rounded mb-2\"\n              >\n                📌 教育局要求重點\n              </h3>\n              <p class=\"text-gray-600 text-sm leading-relaxed\">\n                【小五至小六】以具體事件或事物為基礎抒發真情；掌握直接抒情與間接抒情（藉事、藉物、藉景）；小六加強感物、感時、懷人等題型。\n                <br /><span\n                  class=\"grade-cat-note grade-legend block text-xs text-gray-600 mt-2\"\n                  >【小五】借事抒情、真摯感情｜【小六】畢業感言等深化題（除「畢業感言」標<strong>小六</strong>外，其餘標<strong>小五</strong>）</span\n                >\n              </p>\n            </div>\n\n            <p class=\"structure-tag\">\n              結構：引入抒情對象 ➔ 具體事例 ➔ 深化感情 ➔ 升華\n            </p>\n            <!-- fill-template:lyrical -->\n            <details class=\"fill-template fill-pink mb-4\">\n              <summary class=\"fill-summary\" style=\"color: #9d174d\">\n                <span>📝 萬能填充思考區（抒情文）</span>\n                <span class=\"fill-hint text-xs font-normal text-gray-500\"\n                  >動筆前先填好各段重點</span\n                >\n              </summary>\n              <div\n                class=\"fill-body\"\n                style=\"background: #fdf2f8; border-color: #f9a8d4\"\n              >\n                <p class=\"fill-line\">\n                  <strong>第一段（引入）：</strong>每當看見<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（抒情對象）__</span\n                  >，我總會<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（聯想／感受）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（簡述與對象的關係）__</span\n                  >，這份感情<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（形容）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第二段（借物）：</strong\n                  ><span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（對象）__</span\n                  >已<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（變化，如：不再嶄新）__</span\n                  >，卻仍<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（仍保留的意義）__</span\n                  >。它彷彿<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（比喻）__</span\n                  >，靜靜訴說<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（情感）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第三段（事例）：</strong>記得有一次，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（具體事件）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（當時細節）__</span\n                  >，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（人物）__</span\n                  ><span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（動作／話語）__</span\n                  >，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（我的感受）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第四段（深化）：</strong\n                  ><span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（時間推移）__</span\n                  >，我漸漸明白<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（對象）__</span\n                  >代表<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（深層意義）__</span\n                  >。<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（直接抒情句）__</span\n                  >，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（間接抒情）__</span\n                  >。\n                </p>\n                <p class=\"fill-line\">\n                  <strong>第五段（升華）：</strong\n                  ><span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（抒情對象）__</span\n                  >，承載著<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（情感）__</span\n                  >。我願意<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（行動／承諾）__</span\n                  >，讓<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding: 0 2px;\n                    \"\n                    >__（對象／感情）__</span\n                  >，<span\n                    class=\"fill-ph\"\n                    style=\"\n                      color: #db2777;\n                      border-bottom: 1px dashed #db2777;\n                      padding
