g\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"周末的公園氣氛悠閒：湖面映着垂柳的倒影，微風拂過，水紋一圈圈盪開。老太太在樹蔭下打太極，小朋友在草坪追跑玩捉迷藏，也有人坐在長椅上看書或閒談，構成一幅輕鬆的城市生活圖畫。城市人需要這種放慢腳步的綠色空間。\",\n        \"answer\": \"A\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"描寫公園裏悠閒的日常畫面。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"打太極是公園最重要的活動。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"公園只準老年人進入。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"湖水可用來飲用。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          }\n        ]\n      },\n      {\n        \"passage\": \"走樓梯時應靠右緩步下行或上行，一隻手輕輕握住扶手，不要在梯間追逐、推撞或並排擋路。這樣既能避免自己跌倒受傷，也不會阻礙匆忙趕路的人，是校園和商場都應遵守的安全秩序。小地方守規則，大意外往往就能避免。\",\n        \"answer\": \"B\",\n        \"focus\": 5,\n        \"focusLabel\": \"過大／籠統\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"握住扶手就已足夠。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"走樓梯要注意安全與秩序。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"在梯間奔跑可以更快到達。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"樓梯比電梯更危險，不應使用。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"茶葉由茶樹嫩葉經採摘、萎凋、揉捻、發酵或烘焙等不同工序製成，因而有綠茶、紅茶、烏龍茶等分別。沖泡時水質、水溫和浸泡時間稍有不同，泡出來的香氣和苦甜味便會改變，值得細心嘗試。一杯茶的味道背後，藏着工夫與耐心。\",\n        \"answer\": \"C\",\n        \"focus\": 2,\n        \"focusLabel\": \"過度推論\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"只有綠茶才是真正的茶。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"水溫愈高一定愈好喝。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"茶葉製法與沖泡方式影響茶的風味。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"茶葉只能用沸水長時間煮。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          }\n        ]\n      },\n      {\n        \"passage\": \"學校義工隊定期到安老院，陪長者下棋、讀報、做手操，或只是坐下來傾聽他們說往事。義工帶去關心與歡樂，自己也學會耐心和尊重。助人的過程往往不是單向付出，而是彼此都有得着。服務他人之後，心裡常會多一份踏實的喜悅。\",\n        \"answer\": \"D\",\n        \"focus\": 6,\n        \"focusLabel\": \"直接錯誤\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"義工只需要陪長者下棋。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"只有成績好的同學才能當義工。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"長者不喜歡有人探望。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"做義工能關懷他人並讓自己成長。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      }\n    ]\n  },\n  {\n    \"id\": 9,\n    \"title\": \"句段辨析 (9)\",\n    \"source\": \"來源：自擬練習（對齊 PDF 準則）\",\n    \"grade\": \"年級：小五\",\n    \"questions\": [\n      {\n        \"passage\": \"午後的課室顯得格外寧靜，窗邊幾盆綠蘿在陽光下發亮，粉筆字在黑板上寫得端端正正。同學低頭抄寫重點，只聽見筆尖劃紙和風扇轉動的聲音，連平時最愛說話的人也暫時安靜下來，專心跟課。良好的課堂氣氛，本身就是一種無聲的教育。\",\n        \"answer\": \"A\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"描寫課室裏寧靜的學習氣氛。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"綠蘿令同學更聰明。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"黑板是課室最重要的設備。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"說明學校建築設計規範。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          }\n        ]\n      },\n      {\n        \"passage\": \"海水退潮後，岸邊的石沼會留下小魚、寄居蟹、海螺和海葵等生物。參觀時應輕步走動，不要隨意翻動石頭或把生物帶離水面太久。這樣既能保護脆弱的潮間帶生態，也讓自己有更多時間仔細觀察。把觀察和保育放在同一位置，才是負責任的態度。\",\n        \"answer\": \"B\",\n        \"focus\": 2,\n        \"focusLabel\": \"過度推論\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"石沼裏只有螃蟹。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"觀察石沼生物時要輕柔並保護生態。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"可以隨便把生物帶回家。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"退潮時一定安全無危險。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"發射倒數結束，火箭底部噴出強光與濃煙，箭體緩慢離開發射台，接着加速衝向高空。地上觀眾有的拿着望遠鏡，有的舉起手機拍攝，人人屏息凝望，直到火箭變成天邊一個小亮點，掌聲才爆發出來。人類探索太空的夢想，就在這轟鳴聲中再前進一步。\",\n        \"answer\": \"C\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"觀眾都是科學家。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"火箭一定進入月球軌道。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"描寫火箭升空的壯觀場面。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"火花是最重要的部分。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          }\n        ]\n      },\n      {\n        \"passage\": \"每天入睡前整理書包，可先對照翌日時間表，只放入需要的書簿和習作，文具放進拉鍊小袋，水壺放側袋，再檢查功課記錄冊。早上便不用翻箱倒籠，既節省時間，也不易漏帶重要物品。預備工夫做足，一整天都會輕鬆許多。\",\n        \"answer\": \"D\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"文具放進小袋就已足夠。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"不必看時間表也能整理妥當。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"書包愈重代表愈勤力。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"提前整理書包令上學更順利。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"新春期間的舞龍表演特別吸引：鑼鼓敲得震天價響，龍頭高高抬起，龍身在街頭翻騰穿梭，龍尾也靈活擺動。兩旁市民舉起手機拍攝，小孩興奮叫喊，整條街道浸在熱鬧歡騰的節日氣氛之中。傳統表演把節日氣氛推向最高潮。\",\n        \"answer\": \"A\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"描寫舞龍表演熱鬧非凡的景象。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"鑼鼓聲是表演的唯一重點。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"舞龍只在農曆新年出現。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"介紹全球所有民間藝術。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          }\n        ]\n      },\n      {\n        \"passage\": \"電子書輕便，一部裝置可收藏許多書籍，還能調校字體大小，適合出行閱讀；紙本書則較不刺眼，方便隨手畫線和寫旁註，也有翻頁的實在感。兩者各有優點，按場合選擇，其實可以互相補足。媒介可以改變，閱讀的好處卻始終如一。\",\n        \"answer\": \"B\",\n        \"focus\": 5,\n        \"focusLabel\": \"過大／籠統\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"電子書完全取代紙本書。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"電子書與紙本書各有優點，可互補。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"紙本書一定比電子書更好。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"電子書方便攜帶、可調字體。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          }\n        ]\n      },\n      {\n        \"passage\": \"學校飼養的導覽犬經過訓練，見到同學大多溫馴友善，會搖尾巴示好。但接近或餵食前，仍必須先徵求負責老師同意，不可突然大聲尖叫或從後方撲過去。親近動物也要守規則，人和動物才都安全。愛護動物的正確方式，是尊重而不是打擾。\",\n        \"answer\": \"C\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"校犬一定不會咬人。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"可以隨時餵食校犬。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"與校犬互動時要遵守規則以保安全。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"只有老師才能親近校犬。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          }\n        ]\n      },\n      {\n        \"passage\": \"閱讀地圖時，先看圖例，便知道不同顏色和符號代表道路、公園、車站還是河流；再看比例尺，便能估算圖上一段距離實際有多遠。掌握這兩項工具，自行出外探路時便不容易迷路，也更有自信。空間概念建立好，獨立出行便多一分把握。\",\n        \"answer\": \"D\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"圖例是地圖唯一有用的部分。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"有地圖就永遠不會迷路。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"比例尺在所有地圖都相同。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"懂讀地圖圖例與比例尺有助出行。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"黃昏的廚房飄出煎魚和炒菜的香氣，媽媽一邊提醒小心熱油濺起，一邊把菜肴盛起。弟弟幫忙擺好碗筷和杯子，窗外的夕陽把飯桌和牆壁染成金黃色，一家人準備圍坐開飯，氣氛溫暖而踏實。平凡晚餐裏的光與香，最能代表家的味道。\",\n        \"answer\": \"A\",\n        \"focus\": 6,\n        \"focusLabel\": \"直接錯誤\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"描寫家中準備晚餐的溫馨情景。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"煎魚是晚餐唯一的菜式。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"弟弟最喜歡擺碗筷。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"油花濺起一定會受傷。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"應付測驗的複習宜有步驟：先重溫筆記和課本標題，找出重點；再做練習題，對照答案改正錯處；最後才稍作休息，讓大腦吸收。這樣有計劃的複習，通常比考前一晚通宵「臨時抱佛腳」更踏實有效。把複習拆開來做，壓力也會跟着減輕。\",\n        \"answer\": \"B\",\n        \"focus\": 1,\n        \"focusLabel\": \"無關內容\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"做練習題是唯一需要的步驟。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"有計劃的複習比臨時抱佛腳更有效。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"複習時不應休息。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"臨時抱佛腳一定不及格。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      }\n    ]\n  },\n  {\n    \"id\": 10,\n    \"title\": \"句段辨析 (10)\",\n    \"source\": \"來源：自擬練習（對齊 PDF 準則）\",\n    \"grade\": \"年級：小五\",\n    \"questions\": [\n      {\n        \"passage\": \"黃昏的漁港碼頭特別有味道：一排排漁船並排停泊，甲板上晾着還帶海水味的漁網，海鷗低飛掠過微微泛光的水面。遠處傳來引擎啟動聲，近處小販高聲叫賣海鮮，空氣中混着鹹味與人間煙火。漁港的聲音與氣味，組成獨特的地方記憶。\",\n        \"answer\": \"C\",\n        \"focus\": 6,\n        \"focusLabel\": \"直接錯誤\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"漁網晾在甲板上。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"海鷗是最常見的鳥。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"描寫漁港碼頭充滿特色的景象。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"介紹全球漁業政策。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          }\n        ]\n      },\n      {\n        \"passage\": \"打籃球並不是只靠一人投籃得分。隊友之間要互相傳球、走位拉開空檔，防守時也要補位協助。懂得欣賞別人的助攻和掩護，整隊才更有團隊精神；若人人只顧單打獨鬥，反而容易失誤連連。勝利屬於整支隊伍，而不只屬於投進致勝一球的人。\",\n        \"answer\": \"D\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"投籃是比賽唯一重要技術。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"得分最多的人一定最優秀。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"籃球不能傳球。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"籃球講求團隊配合而非個人出風頭。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"彩虹的出現，需要陽光和水中小水珠同時配合：光線進入水珠後經過折射、反射，再分散成多種顏色，才會在天空畫出拱形彩帶。因此在一場雨剛停、太陽又重新露出來的時候，最容易看見彩虹。明白成因之後，再看彩虹便多添一份科學趣味。\",\n        \"answer\": \"A\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"彩虹因陽光與水珠作用而形成。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"彩虹有固定八種顏色。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"只有夏天會出現彩虹。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"水珠是形成彩虹的唯一條件。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          }\n        ]\n      },\n      {\n        \"passage\": \"班長的職務包括協助老師派發簿冊、收集家課、提醒同學保持課室秩序，有時也要在早會上傳達訊息。擔當這份工作，既能訓練責任感和時間管理，也讓同學學會在需要時互相幫忙、彼此體諒。服務同學的過程，也是在學習領導與溝通。\",\n        \"answer\": \"B\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"班長只需負責派簿。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"當班長能培養責任感與互助精神。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"只有成績第一才能當班長。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"班長可以不必守規則。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          }\n        ]\n      },\n      {\n        \"passage\": \"夜市開檔後燈火通明，攤檔冒着熱氣售賣車仔麵、雞蛋仔和魚蛋；遊戲攤的鈴聲、抽獎聲此起彼落。人潮在狹窄通道中肩摩踵接，空氣裏混着甜味、醬香和夜風，整條街都充滿活力。夜市的魅力，正在於這種熱鬧而不拘謹的氛圍。\",\n        \"answer\": \"C\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"雞蛋仔是最好吃的小吃。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"夜市只在週末才開放。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"描寫夜市熱鬧、感官豐富的氣氛。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"說明零售業的經營成本。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          }\n        ]\n      },\n      {\n        \"passage\": \"在圖書館或機場等地方使用公共電腦後，記得登出電郵和社交帳戶，也不要勾選「記住密碼」。因為下一位使用者可能會誤打誤撞進入你的帳戶。保護個人資料，其實就如出門鎖好家門一樣基本而重要。數碼時代更要小心，私隱一旦洩露便難以收回。\",\n        \"answer\": \"D\",\n        \"focus\": 1,\n        \"focusLabel\": \"無關內容\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"公共電腦一定安全無毒。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"只要不保存密碼就足夠。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"密碼可以告訴好朋友。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"使用公用電腦後要注意登出與私隱。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"燕子常在屋簷下銜泥築巢，春天飛來繁殖，秋風起又結羣南飛。古人看見燕子來去，往往聯想到季節轉換，也會想起遠方的遊子會否歸家。小小候鳥，承載着自然規律，也觸動着人的情懷。自然景物常被寫進詩詞，正因它能觸動人心。\",\n        \"answer\": \"A\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"燕子與季節、家鄉情懷常相連。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"燕子只在屋簷築巢。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"燕子永遠不會離開巢穴。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"所有候鳥都被稱為燕子。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          }\n        ]\n      },\n      {\n        \"passage\": \"做伸展運動前應先慢跑或活動關節熱身，令肌肉稍稍暖和；伸展時動作要緩慢穩定，配合呼吸，切忌突然用力彈震。正確的伸展能提高身體柔軟度，比賽或上體育課時也能減少拉傷的機會。身體柔韌了，做其他運動時也更得心應手。\",\n        \"answer\": \"B\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"熱身是唯一需要做的事。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"正確伸展有助柔軟度並減少受傷。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"伸展時應用力彈震拉筋。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"只有運動員才需要伸展。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"社區舉辦舊物回收日，鄰居把仍然能用的書本、玩具、衣服和小家電送到會堂指定區。工作人員分類後轉贈有需要的家庭或回收再造。別人眼中的「舊東西」，對另一家人來說可能正是及時的「寶貝」。循環再用令資源壽命延長，浪費自然減少。\",\n        \"answer\": \"C\",\n        \"focus\": 5,\n        \"focusLabel\": \"過大／籠統\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"所有舊物都應該扔掉。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"只有書本值得回收。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"舊物回收能善用資源、互相幫助。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"社區會堂專門售賣新貨。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          }\n        ]\n      },\n      {\n        \"passage\": \"天文館的圓頂劇場燈光一暗，座位便慢慢向後傾斜，頭頂穹幕播放出浩瀚星空和行星運行的影片。旁白一邊解說公轉、自轉等概念，一邊配上逼真影像，令同學彷彿置身宇宙，對天文知識大感興趣。沉浸式的學習體驗，往往比單向講授更令人難忘。\",\n        \"answer\": \"D\",\n        \"focus\": 2,\n        \"focusLabel\": \"過度推論\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"圓頂劇場只播放電影娛樂。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"座位向後傾是最重要的設計。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"看一次就等於學會全部天文知識。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"天文館體驗能生動認識星空知識。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      }\n    ]\n  }\n];\n      const tabsEl = document.getElementById(\"tabs\");\n      const panelsEl = document.getElementById(\"panels\");\n      const scorebar = document.getElementById(\"scorebar\");\n      const resetBtn = document.getElementById(\"resetBtn\");\n      const PROGRESS_KEY = \"alpha-juanduan-progress-v1\";\n      let activeSet = 1;\n      let progress = loadProgress();\n\n      function loadProgress() {\n        try {\n          const raw = localStorage.getItem(PROGRESS_KEY);\n          if (!raw) return { activeSet: 1, answers: {}, updatedAt: null };\n          const data = JSON.parse(raw);\n          return {\n            activeSet: Number(data.activeSet) || 1,\n            answers: data.answers && typeof data.answers === \"object\" ? data.answers : {},\n            updatedAt: data.updatedAt || null,\n          };\n        } catch (e) {\n          return { activeSet: 1, answers: {}, updatedAt: null };\n        }\n      }\n      function saveProgress() {\n        progress.activeSet = activeSet;\n        progress.updatedAt = new Date().toISOString();\n        try {\n          localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));\n        } catch (e) {}\n      }\n      function qKey(setId, qi) {\n        return setId + \"-\" + qi;\n      }\n      function feedbackText(opt, isCorrect) {\n        const mark = isCorrect ? \"✅\" : \"❌\";\n        const sep = isCorrect ? \"，\" : \"。\";\n        return `${mark} ${opt.tag}${sep}${opt.explain}`;\n      }\n      function escapeHtml(str) {\n        return String(str)\n          .replaceAll(\"&\", \"&amp;\")\n          .replaceAll(\"<\", \"&lt;\")\n          .replaceAll(\">\", \"&gt;\")\n          .replaceAll('\"', \"&quot;\");\n      }\n      function applyAnswerUI(q, pickedKey) {\n        q.classList.add(\"answered\");\n        q.querySelectorAll(\".opt\").forEach((opt) => {\n          const key = opt.dataset.key;\n          const correct = opt.dataset.correct === \"1\";\n          opt.classList.remove(\"picked\", \"revealed-correct\", \"revealed-wrong\");\n          if (key === pickedKey) opt.classList.add(\"picked\");\n          if (correct) opt.classList.add(\"revealed-correct\");\n          else if (key === pickedKey) opt.classList.add(\"revealed-wrong\");\n        });\n        const input = q.querySelector(`input[value=\"${pickedKey}\"]`);\n        if (input) input.checked = true;\n      }\n      function restoreAnswers() {\n        DATA.forEach((set) => {\n          set.questions.forEach((q, qi) => {\n            const saved = progress.answers[qKey(set.id, qi)];\n            if (!saved || !saved.picked) return;\n            const el = document.getElementById(`s${set.id}q${qi}`);\n            if (!el) return;\n            applyAnswerUI(el, saved.picked);\n          });\n        });\n      }\n      function render() {\n        tabsEl.innerHTML = \"\";\n        panelsEl.innerHTML = \"\";\n        if (progress.activeSet >= 1 && progress.activeSet <= DATA.length) {\n          activeSet = progress.activeSet;\n        }\n        DATA.forEach((set) => {\n          const tab = document.createElement(\"button\");\n          tab.type = \"button\";\n          tab.className = \"tab\" + (set.id === activeSet ? \" active\" : \"\");\n          tab.textContent = `(${set.id})`;\n          tab.title = set.title;\n          tab.addEventListener(\"click\", () => {\n            activeSet = set.id;\n            document\n              .querySelectorAll(\".tab\")\n              .forEach((t) => t.classList.remove(\"active\"));\n            tab.classList.add(\"active\");\n            document\n              .querySelectorAll(\".panel\")\n              .forEach((p) => p.classList.remove(\"active\"));\n            document.getElementById(`panel-${set.id}`).classList.add(\"active\");\n            saveProgress();\n            updateScore();\n          });\n          tabsEl.appendChild(tab);\n\n          const panel = document.createElement(\"section\");\n          panel.className = \"panel\" + (set.id === activeSet ? \" active\" : \"\");\n          panel.id = `panel-${set.id}`;\n          let html = `\n          <h2 style=\"margin:0 0 6px;\">${set.title}</h2>\n          <div class=\"meta\"><span>${set.source}</span><span>${set.grade}</span><span>每套 10 題</span><span>進度會即時儲存</span></div>\n          <div class=\"instruction\">讀完藍色題幹，揀最能概括主旨的一項。本題練習焦點陷阱會標示於題號旁。</div>\n          <div class=\"legend\">\n            <span class=\"chip\">1 無關內容</span><span class=\"chip\">2 過度推論</span>\n            <span class=\"chip\">3 偏離重點×3</span><span class=\"chip\">4 片面／過窄×3</span>\n            <span class=\"chip\">5 過大／籠統</span><span class=\"chip\">6 直接錯誤</span>\n          </div>\n        `;\n          set.questions.forEach((q, qi) => {\n            const qid = `s${set.id}q${qi}`;\n            html += `<article class=\"q\" id=\"${qid}\" data-answer=\"${q.answer}\" data-set=\"${set.id}\" data-qi=\"${qi}\">`;\n            html += `<div class=\"q-head\"><span class=\"q-num\">${qi + 1}</span><span class=\"focus-tag\">焦點陷阱：${q.focus} ${escapeHtml(q.focusLabel)}</span></div>`;\n            html += `<div class=\"passage\">${escapeHtml(q.passage)}</div><div class=\"opts\">`;\n            q.options.forEach((opt) => {\n              const isCorrect = opt.key === q.answer;\n              const inputId = `${qid}_${opt.key}`;\n              html += `\n              <label class=\"opt\" data-key=\"${opt.key}\" data-correct=\"${isCorrect ? \"1\" : \"0\"}\" for=\"${inputId}\">\n                <input type=\"radio\" name=\"${qid}\" id=\"${inputId}\" value=\"${opt.key}\" />\n                <div class=\"opt-main\">\n                  <div class=\"opt-text\">〇 ${opt.key}. ${escapeHtml(opt.text)}</div>\n                  <div class=\"feedback ${isCorrect ? \"ok\" : \"bad\"}\">${escapeHtml(feedbackText(opt, isCorrect))}</div>\n                </div>\n              </label>`;\n            });\n            html += `</div></article>`;\n          });\n          panel.innerHTML = html;\n          panelsEl.appendChild(panel);\n        });\n        document\n          .querySelectorAll(\".opt input\")\n          .forEach((input) => input.addEventListener(\"change\", onPick));\n        restoreAnswers();\n        updateScore();\n      }\n      function onPick(e) {\n        const input = e.target;\n        const q = input.closest(\".q\");\n        const pickedKey = input.value;\n        applyAnswerUI(q, pickedKey);\n        const setId = Number(q.dataset.set);\n        const qi = Number(q.dataset.qi);\n        progress.answers[qKey(setId, qi)] = {\n          picked: pickedKey,\n          correct: pickedKey === q.dataset.answer,\n          at: new Date().toISOString(),\n        };\n        activeSet = setId;\n        saveProgress();\n        updateScore();\n      }\n      function updateScore() {\n        const panel = document.getElementById(`panel-${activeSet}`);\n        if (!panel) return;\n        const qs = [...panel.querySelectorAll(\".q\")];\n        const answered = qs.filter((q) =>\n          q.classList.contains(\"answered\"),\n        ).length;\n        let correct = 0;\n        qs.forEach((q) => {\n          if (!q.classList.contains(\"answered\")) return;\n          const picked = q.querySelector(\"input:checked\");\n          if (picked && picked.value === q.dataset.answer) correct += 1;\n        });\n        scorebar.textContent = `本套進度：已作答 ${answered}／${qs.length}｜答對 ${correct}／${answered || 0}｜已自動儲存`;\n      }\n      function resetCurrent() {\n        if (!confirm(\"確定重設本套？只會清除呢一套嘅答題記錄，唔會影響其他練習。\")) return;\n        const panel = document.getElementById(`panel-${activeSet}`);\n        if (!panel) return;\n        panel.querySelectorAll(\".q\").forEach((q) => {\n          q.classList.remove(\"answered\");\n          q.querySelectorAll(\"input\").forEach((i) => {\n            i.checked = false;\n          });\n          q.querySelectorAll(\".opt\").forEach((opt) =>\n            opt.classList.remove(\n              \"picked\",\n              \"revealed-correct\",\n              \"revealed-wrong\",\n            ),\n          );\n          const qi = Number(q.dataset.qi);\n          delete progress.answers[qKey(activeSet, qi)];\n        });\n        saveProgress();\n        updateScore();\n      }\n      resetBtn.addEventListener(\"click\", resetCurrent);\n      render();\n    <\/script>\n  </body>\n</html>\n",

 0, 0.2);\n        z-index: 9999;\n        width: min(90vw, 320px);\n        text-align: center;\n        display: none;\n      }\n      #userConfirmModal.active {\n        display: block;\n      }\n      body.dark-mode #userConfirmModal {\n        background: #1e293b;\n        color: #e2e8f0;\n      }\n      .user-confirm-btns {\n        display: flex;\n        justify-content: center;\n        gap: 0.75rem;\n        margin-top: 1rem;\n      }\n      #userConfirmYes {\n        background: #ef4444;\n        color: white;\n        border: none;\n        padding: 0.4rem 1rem;\n        border-radius: 0.35rem;\n        cursor: pointer;\n      }\n      #userConfirmNo {\n        background: #e5e7eb;\n        color: #374151;\n        border: none;\n        padding: 0.4rem 1rem;\n        border-radius: 0.35rem;\n        cursor: pointer;\n      }\n\n      .grade-badge {\n        display: inline-block;\n        font-size: 0.65rem;\n        font-weight: 700;\n        padding: 0.12rem 0.45rem;\n        border-radius: 0.25rem;\n        margin-right: 0.35rem;\n        vertical-align: middle;\n        letter-spacing: 0.02em;\n      }\n      .grade-p5 {\n        background: #dbeafe;\n        color: #1e40af;\n        border: 1px solid #93c5fd;\n      }\n      .grade-p6 {\n        background: #fce7f3;\n        color: #9d174d;\n        border: 1px solid #f9a8d4;\n      }\n      body.dark-mode .grade-p5 {\n        background: #1e3a8a;\n        color: #bfdbfe;\n        border-color: #3b82f6;\n      }\n      body.dark-mode .grade-p6 {\n        background: #831843;\n        color: #fbcfe8;\n        border-color: #db2777;\n      }\n      .grade-legend {\n        font-size: 0.75rem;\n        color: #4b5563;\n        margin-top: 0.5rem;\n      }\n      /* 深色模式 */\n      body.dark-mode {\n        background-color: #0f172a;\n        color: #e2e8f0;\n      }\n      body.dark-mode .bg-white {\n        background-color: #1e293b !important;\n        color: #e2e8f0;\n      }\n      body.dark-mode .text-gray-600,\n      body.dark-mode .text-gray-700,\n      body.dark-mode .text-gray-800 {\n        color: #cbd5e1 !important;\n      }\n      body.dark-mode .text-gray-500 {\n        color: #94a3b8 !important;\n      }\n      body.dark-mode .border-gray-100 {\n        border-color: #334155 !important;\n      }\n      body.dark-mode .bg-blue-50,\n      body.dark-mode .bg-green-50,\n      body.dark-mode .bg-pink-50,\n      body.dark-mode .bg-purple-50,\n      body.dark-mode .bg-orange-50,\n      body.dark-mode .bg-teal-50,\n      body.dark-mode .bg-amber-50,\n      body.dark-mode .bg-indigo-50,\n      body.dark-mode .bg-gray-100,\n      body.dark-mode .bg-gray-50 {\n        background-color: #1e293b !important;\n      }\n      body.dark-mode .essay-body {\n        background-color: #0f172a !important;\n        border-color: #475569 !important;\n      }\n      body.dark-mode .imitation-hint {\n        background: #1e293b;\n        color: #cbd5e1;\n        border-color: #3b82f6;\n      }\n      body.dark-mode .format-box {\n        background: #1e293b;\n        border-color: #f97316;\n      }\n      body.dark-mode header,\n      body.dark-mode .tool-bar {\n        background-color: #1e293b !important;\n        border-color: #334155 !important;\n      }\n      body.font-lg {\n        font-size: 1.125rem;\n      }\n      body.font-xl {\n        font-size: 1.25rem;\n      }\n      @media print {\n        .tool-bar,\n        .no-print {\n          display: none !important;\n        }\n        details {\n          display: block !important;\n        }\n        details summary {\n          display: none;\n        }\n      }\n    </style>\n  </head>\n  <body class=\"p-4 md:p-8\">\n    <div class=\"max-w-6xl mx-auto\">\n      <!-- 頁面標題區 -->\n      <header\n        class=\"text-center mb-12 bg-white p-8 rounded-2xl shadow-sm border border-gray-100\"\n      >\n        <h1\n          class=\"text-3xl md:text-4xl font-extrabold text-blue-800 mb-4 tracking-wide\"\n        >\n          📚 小學五、六年級中文作文常見題型與題目雜錦\n        </h1>\n        <p\n          class=\"text-lg text-gray-600 max-w-4xl mx-auto leading-relaxed text-left md:text-center mb-6\"\n        >\n          家長您好！為升讀小學五、六年級的孩子準備作文，最重要是讓他們熟悉不同文體的特點與結構。以下依據教育局課程整理六大類型，<strong>每類附10題五段式範文</strong>，並附<strong>寫作流程、連接詞庫、TSA自評表</strong>等學習資源，供孩子練習與參考。\n        </p>\n        <div\n          class=\"max-w-4xl mx-auto bg-blue-50 border border-blue-200 rounded-xl p-5 text-left\"\n        >\n          <h2 class=\"font-bold text-blue-800 mb-2\">📐 五段式範文格式說明</h2>\n          <p class=\"text-sm text-gray-700 leading-relaxed mb-2\">\n            每個題目均附小六程度書面語範文（約350字），統一採用<strong>五段式</strong>結構，方便同學熟習每段功能：\n          </p>\n          <ul class=\"text-sm text-gray-700 space-y-1 ml-4 list-disc\">\n            <li>\n              <strong>第一段（開頭）</strong>：約50字 —\n              引入題旨，常用「時人常說」「每逢……」等開頭\n            </li>\n            <li>\n              <strong>第二至四段（內文）</strong>：各約80–90字 —\n              記敘文寫起因／經過／結果；描寫文寫不同角度；說明文／議論文寫分點論述\n            </li>\n            <li>\n              <strong>第五段（總結）</strong>：約50字 —\n              歸納全文，帶出感悟、啟發或呼籲\n            </li>\n          </ul>\n          <p class=\"text-xs text-blue-700 mt-2\">\n            點擊題目下方的「＋ 閱讀五段式範文」即可展開閱讀。範文中\n            <mark\n              class=\"kw-highlight\"\n              style=\"background: linear-gradient(transparent 55%, #fef08a 55%)\"\n              >黃底字</mark\n            >\n            為該段重點詞語，供同學學習運用。<strong>議論文</strong>範文另以<span\n              class=\"hl-ld px-1\"\n              >藍</span\n            ><span class=\"hl-lj px-1\">綠</span\n            ><span class=\"hl-lz px-1\">紫</span\n            >三色標示論點、論據、論證，不與黃底重疊。睇完一篇可按文末<strong\n              >「✓ 睇完 +1」</strong\n            >記錄閱讀次數，題目旁會顯示<strong>「已讀 N 次」</strong\n            >（資料儲存喺本機瀏覽器）。\n          </p>\n        </div>\n        <div\n          class=\"max-w-4xl mx-auto bg-amber-50 border border-amber-200 rounded-xl p-5 text-left mt-4\"\n        >\n          <h2 class=\"font-bold text-amber-800 mb-2\">\n            🏛️ 對照教育局課程（2023修訂）\n          </h2>\n          <p class=\"text-sm text-gray-700 leading-relaxed mb-2\">\n            依據《小學中國語文建議學習重點》（2023年修訂）、《中國語文課程指引（小一至小六）》（2023）及小六TSA評估範疇整理：\n          </p>\n          <ul class=\"text-sm text-gray-700 space-y-1 ml-4 list-disc\">\n            <li>\n              <strong>高小核心文體</strong\n              >：記敘文、描寫文、抒情文、說明文、議論文 —\n              與課程「敘述、描寫、抒情、說明、議論」五類表達一致 ✓\n            </li>\n            <li>\n              <strong>實用文（TSA小六必考）</strong\n              >：便條、日記、周記、書信、通告、報告、演講辭 —\n              已增補<strong>便條</strong>、<strong>通告</strong>、<strong>啟事</strong>等課程要求格式\n            </li>\n            <li>\n              <strong>小五側重</strong>：記敘（記人記事）、說明文、日記/便條 —\n              記敘文及說明文練習宜加強\n            </li>\n            <li>\n              <strong>小六側重</strong\n              >：議論文入門、公函/建議書、演講辭、抒情深化 —\n              議論文及實用文格式須熟練\n            </li>\n            <li>\n              <strong>其他課程要求</strong>：閱讀報告、看圖作文、擴寫/續寫 —\n              可配合「閱讀報告」範文及日常練習\n            </li>\n          </ul>\n          <p class=\"text-xs text-amber-700 mt-2\">\n            參考：<a\n              href=\"https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/curriculum-documents/Pri_Chin_Lang_LO_2023.pdf\"\n              class=\"underline\"\n              target=\"_blank\"\n              >小學中國語文建議學習重點（2023）</a\n            >、<a\n              href=\"https://www.bca.hkeaa.edu.hk/web/TSA/zh/2025tsaReport/chi/Ch6b_P6_Chinese_TSA2025C.pdf\"\n              class=\"underline\"\n              target=\"_blank\"\n              >2025小六TSA中文科報告</a\n            >\n          </p>\n          <p class=\"grade-legend mt-2 text-xs text-amber-800\">\n            <span class=\"grade-badge grade-p5\">小五</span>\n            小五課程已涵蓋或必須先掌握（小六仍須温習）　\n            <span class=\"grade-badge grade-p6\">小六</span>\n            小六才正式學習或TSA/評估重點\n          </p>\n        </div>\n      </header>\n\n      <!-- 確認對話框（筆記本用） -->\n      <div id=\"userOverlay\"></div>\n      <div id=\"userConfirmModal\">\n        <p id=\"userConfirmMessage\">確定要執行此操作嗎？</p>\n        <div class=\"user-confirm-btns\">\n          <button type=\"button\" id=\"userConfirmYes\">確定</button>\n          <button type=\"button\" id=\"userConfirmNo\">取消</button>\n        </div>\n      </div>\n\n      <!-- 工具列 -->\n      <nav\n        class=\"tool-bar no-print bg-white/90 border border-gray-200 rounded-xl p-3 mb-6 shadow-sm flex flex-wrap gap-2 items-center justify-between\"\n      >\n        <p id=\"navCurrentLocation\" class=\"nav-current-bar\">\n          <span class=\"text-gray-500\">目前位置：</span>\n          <strong id=\"navCurrentLabel\">—</strong>\n        </p>\n        <div class=\"flex flex-wrap gap-1 text-xs\">\n          <a\n            href=\"#cat-narrative\"\n            class=\"nav-link px-2 py-1 rounded bg-blue-50 text-blue-700 hover:bg-blue-100\"\n            data-nav-label=\"記敘文（記事、記人）\"\n            >記敘</a\n          >\n          <a\n            href=\"#cat-descriptive\"\n            class=\"nav-link px-2 py-1 rounded bg-green-50 text-green-700 hover:bg-green-100\"\n            data-nav-label=\"描寫文（寫景、寫物）\"\n            >描寫</a\n          >\n          <a\n            href=\"#cat-lyrical\"\n            class=\"nav-link px-2 py-1 rounded bg-pink-50 text-pink-700 hover:bg-pink-100\"\n            data-nav-label=\"抒情文\"\n            >抒情</a\n          >\n          <a\n            href=\"#cat-expository\"\n            class=\"nav-link px-2 py-1 rounded bg-purple-50 text-purple-700 hover:bg-purple-100\"\n            data-nav-label=\"說明文\"\n            >說明</a\n          >\n          <a\n            href=\"#cat-practical\"\n            class=\"nav-link px-2 py-1 rounded bg-orange-50 text-orange-700 hover:bg-orange-100\"\n            data-nav-label=\"實用文\"\n            >實用</a\n          >\n          <a\n            href=\"#cat-argument\"\n            class=\"nav-link px-2 py-1 rounded bg-teal-50 text-teal-700 hover:bg-teal-100\"\n            data-nav-label=\"議論文\"\n            >議論</a\n          >\n          <a\n            href=\"#hub-notebook\"\n            class=\"nav-link px-2 py-1 rounded bg-amber-100 text-amber-900 hover:bg-amber-200 inline-flex items-center\"\n            data-nav-label=\"重點筆記本\"\n            >📝 筆記本<span id=\"notebookCountBadge\"></span\n          ></a>\n\n          <a\n            href=\"#hub-student\"\n            class=\"nav-link px-2 py-1 rounded bg-indigo-100 text-indigo-800 hover:bg-indigo-200\"\n            data-nav-label=\"同學專區\"\n            >同學專區</a\n          >\n          <a\n            href=\"#hub-process\"\n            class=\"nav-link px-2 py-1 rounded bg-blue-100 text-blue-800 hover:bg-blue-200\"\n            data-nav-label=\"寫作流程\"\n            >寫作流程</a\n          >\n          <a\n            href=\"#hub-connectors\"\n            class=\"nav-link px-2 py-1 rounded bg-green-100 text-green-800 hover:bg-green-200\"\n            data-nav-label=\"連接詞／過渡語詞庫\"\n            >連接詞</a\n          >\n          <a\n            href=\"#hub-vocab\"\n            class=\"nav-link px-2 py-1 rounded bg-rose-100 text-rose-800 hover:bg-rose-200\"\n            data-nav-label=\"專屬詞語庫\"\n            >📒 詞語庫</a\n          >\n          <a\n            href=\"#hub-openings\"\n            class=\"nav-link px-2 py-1 rounded bg-yellow-100 text-yellow-800 hover:bg-yellow-200\"\n            data-nav-label=\"開頭與結尾句式庫\"\n            >開頭結尾</a\n          >\n          <a\n            href=\"#hub-mistakes\"\n            class=\"nav-link px-2 py-1 rounded bg-red-100 text-red-800 hover:bg-red-200\"\n            data-nav-label=\"常見失分\"\n            >常見失分</a\n          >\n          <a\n            href=\"#hub-rhetoric\"\n            class=\"nav-link px-2 py-1 rounded bg-purple-100 text-purple-800 hover:bg-purple-200\"\n            data-nav-label=\"修辭手法速查\"\n            >修辭手法</a\n          >\n          <a\n            href=\"#hub-tsa\"\n            class=\"nav-link px-2 py-1 rounded bg-amber-100 text-amber-800 hover:bg-amber-200\"\n            data-nav-label=\"TSA自評表\"\n            >TSA評分</a\n          >\n          <a\n            href=\"#hub-formal\"\n            class=\"nav-link px-2 py-1 rounded bg-gray-200 text-gray-800 hover:bg-gray-300\"\n            data-nav-label=\"書面語對照\"\n            >書面語</a\n          >\n          <a\n            href=\"#hub-extra\"\n            class=\"nav-link px-2 py-1 rounded bg-pink-100 text-pink-800 hover:bg-pink-200\"\n            data-nav-label=\"看圖／擴寫／閱讀報告\"\n            >看圖/擴寫</a\n          >\n        </div>\n        <div class=\"flex flex-wrap gap-2 text-xs items-center\">\n          <button\n            type=\"button\"\n            onclick=\"expandAll(true)\"\n            class=\"px-2 py-1 rounded border border-gray-300 hover:bg-gray-100\"\n          >\n            展開全部範文\n          </button>\n          <button\n            type=\"button\"\n            onclick=\"expandAll(false)\"\n            class=\"px-2 py-1 rounded border border-gray-300 hover:bg-gray-100\"\n          >\n            收合全部範文\n          </button>\n          <button\n            type=\"button\"\n            onclick=\"setFontSize('normal')\"\n            class=\"px-2 py-1 rounded border border-gray-300 hover:bg-gray-100\"\n          >\n            A\n          </button>\n          <button\n            type=\"button\"\n            onclick=\"setFontSize('lg')\"\n            class=\"px-2 py-1 rounded border border-gray-300 hover:bg-gray-100\"\n          >\n            A+\n          </button>\n          <button\n            type=\"button\"\n            onclick=\"setFontSize('xl')\"\n            class=\"px-2 py-1 rounded border border-gray-300 hover:bg-gray-100\"\n          >\n            A++\n          </button>\n          <button\n            type=\"button\"\n            onclick=\"toggleDark()\"\n            class=\"px-2 py-1 rounded border border-gray-300 hover:bg-gray-100\"\n          >\n            🌙 深色\n          </button>\n        </div>\n      </nav>\n\n      <!-- 學習資源總覽 -->\n      <section class=\"resource-card mb-10 space-y-6\">\n        <!-- 給同學 -->\n        <div\n          id=\"hub-student\"\n          class=\"bg-indigo-50 border border-indigo-200 rounded-2xl p-6 shadow-sm\"\n        >\n          <h2 class=\"text-xl font-bold text-indigo-800 mb-3\">\n            🎒 給同學：今日練習三步驟\n          </h2>\n          <ol\n            class=\"text-sm text-gray-700 space-y-2 ml-5 list-decimal leading-relaxed\"\n          >\n            <li>\n              <strong>選題</strong\n              >：從下方目錄選一個題目，先讀範文，留意每段功能和標示詞語；可<strong>點擊文句</strong>加入<a\n                href=\"#hub-notebook\"\n                class=\"text-indigo-600 underline\"\n                >重點筆記本</a\n              >。\n            </li>\n            <li>\n              <strong>構思</strong\n              >：列寫五段式大綱，每段寫一句重點；議論文先定立場。\n            </li>\n            <li>\n              <strong>執筆＋自評</strong>：動筆寫約350字，完成後用<a\n                href=\"#hub-tsa\"\n                class=\"text-indigo-600 underline\"\n                >TSA自評表</a\n              >及題目下的仿寫提示檢查。\n            </li>\n          </ol>\n          <p class=\"text-xs text-indigo-700 mt-3\">\n            💡\n            不要一次抄範文；先模仿結構和用詞，再寫自己的經歷和想法；描寫時可翻查<a\n              href=\"#hub-vocab\"\n              class=\"underline font-semibold\"\n              >專屬詞語庫</a\n            >。\n          </p>\n        </div>\n\n        <!-- 重點筆記本 -->\n        <div\n          id=\"hub-notebook\"\n          class=\"bg-white border border-amber-200 rounded-2xl p-6 shadow-sm\"\n        >\n          <h2 class=\"text-xl font-bold text-amber-800 mb-2\">\n            🌟 我的重點筆記本\n          </h2>\n          <p class=\"text-sm text-gray-600 mb-4\">\n            在範文中<strong>點擊文句</strong>即可標記並自動存入此處；亦可自行加入好句或寫作提示。資料保存在本機瀏覽器，換電腦需重新標記。\n          </p>\n          <div class=\"notebook-toolbar\">\n            <button type=\"button\" id=\"exportNotebookBtn\" class=\"notebook-btn\">\n              📋 複製全部筆記\n            </button>\n            <button type=\"button\" id=\"clearAllMarksBtn\" class=\"notebook-btn\">\n              🗑️ 清除全部標記\n            </button>\n          </div>\n          <div class=\"notebook-input-area\">\n            <h3 class=\"text-sm font-bold text-blue-800 mb-2\">\n              ✍️ 自行加入好句／筆記\n            </h3>\n            <div class=\"notebook-input-row\">\n              <input\n                type=\"text\"\n                id=\"customNoteInput\"\n                placeholder=\"輸入你想記錄的句子、詞語或寫作提示…\"\n              />\n              <button type=\"button\" id=\"addNoteBtn\">加入筆記</button>\n            </div>\n          </div>\n          <div class=\"notebook-section-title\">我的自訂筆記</div>\n          <ul id=\"customNoteList\" class=\"notebook-list\"></ul>\n          <div class=\"notebook-section-title\">\n            來自範文的標記（點 ↗ 可跳至原文）\n          </div>\n          <ul id=\"articleHighlightsList\" class=\"notebook-list\"></ul>\n        </div>\n\n        <!-- 寫作流程 -->\n        <div\n          id=\"hub-process\"\n          class=\"bg-white border border-gray-200 rounded-2xl p-6 shadow-sm\"\n        >\n          <h2 class=\"text-xl font-bold text-blue-800 mb-4\">\n            ✍️ 寫作流程指引（審題→構思→執筆→修改）\n          </h2>\n          <div class=\"grid grid-cols-1 md:grid-cols-4 gap-4 text-sm\">\n            <div class=\"bg-blue-50 p-4 rounded-xl border border-blue-100\">\n              <h3 class=\"font-bold text-blue-700 mb-2\">① 審題（約3分鐘）</h3>\n              <ul class=\"text-gray-700 space-y-1 list-disc ml-4\">\n                <li>圈出關鍵字（誰、何時、何事、何感受）</li>\n                <li>判斷文體：記敘／描寫／抒情／說明／議論／實用</li>\n                <li>定中心思想或立場（議論文必須表態）</li>\n              </ul>\n            </div>\n            <div class=\"bg-green-50 p-4 rounded-xl border border-green-100\">\n              <h3 class=\"font-bold text-green-700 mb-2\">② 構思（約5分鐘）</h3>\n              <ul class=\"text-gray-700 space-y-1 list-disc ml-4\">\n                <li>畫腦圖或列寫五段大綱</li>\n                <li>記敘：時地人事因；議論：論點＋兩個論據</li>\n                <li>\n                  想好每段用哪個<a href=\"#hub-connectors\" class=\"underline\"\n                    >連接詞</a\n                  >開頭\n                </li>\n              </ul>\n            </div>\n            <div class=\"bg-amber-50 p-4 rounded-xl border border-amber-100\">\n              <h3 class=\"font-bold text-amber-700 mb-2\">③ 執筆（約25分鐘）</h3>\n              <ul class=\"text-gray-700 space-y-1 list-disc ml-4\">\n                <li>建議先寫第二至四段（內文），再寫開頭和結尾</li>\n                <li>詳寫高潮，略寫過渡；每段開頭扣題</li>\n                <li>目標約350字</li>\n              </ul>\n            </div>\n            <div class=\"bg-purple-50 p-4 rounded-xl border border-purple-100\">\n              <h3 class=\"font-bold text-purple-700 mb-2\">④ 修改（約7分鐘）</h3>\n              <ul class=\"text-gray-700 space-y-1 list-disc ml-4\">\n                <li>有否跑題？首尾是否呼應？</li>\n                <li>\n                  口語改<a href=\"#hub-formal\" class=\"underline\">書面語</a\n                  >；加描寫和修辭\n                </li>\n                <li>檢查錯字、標點、段落分行</li>\n              </ul>\n            </div>\n          </div>\n          <p class=\"text-xs text-gray-500 mt-3\">\n            建議字數分配：第一段約50字｜第二至四段各約80–90字｜第五段約50字\n          </p>\n        </div>\n\n        <!-- 連接詞 -->\n        <div\n          id=\"hub-connectors\"\n          class=\"bg-white border border-gray-200 rounded-2xl p-6 shadow-sm\"\n        >\n          <h2 class=\"text-xl font-bold text-green-800 mb-4\">\n            🔗 連接詞／過渡語詞庫\n          </h2>\n          <div\n            class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 text-sm\"\n          >\n            <div class=\"border border-green-100 rounded-lg p-3\">\n              <h3 class=\"font-semibold text-green-700 mb-1\">順序／遞進</h3>\n              <p class=\"text-gray-700\">\n                首先、其次、再者、此外、繼而、最後、總括而言\n              </p>\n              <p class=\"text-xs text-gray-500 mt-1\">\n                例：首先，我們應從小事做起……\n              </p>\n            </div>\n            <div class=\"border border-green-100 rounded-lg p-3\">\n              <h3 class=\"font-semibold text-green-700 mb-1\">轉折／讓步</h3>\n              <p class=\"text-gray-700\">\n                然而、雖然……但是……、儘管如此、相反、不過\n              </p>\n              <p class=\"text-xs text-gray-500 mt-1\">\n                例：雖然天氣惡劣，但是我們仍堅持完成比賽。\n              </p>\n            </div>\n            <div class=\"border border-green-100 rounded-lg p-3\">\n              <h3 class=\"font-semibold text-green-700 mb-1\">因果／總結</h3>\n              <p class=\"text-gray-700\">\n                因此、所以、由此可見、綜上所述、故此、於是\n              </p>\n              <p class=\"text-xs text-gray-500 mt-1\">\n                例：由此可見，誠信比金錢更為寶貴。\n              </p>\n            </div>\n            <div class=\"border border-green-100 rounded-lg p-3\">\n              <h3 class=\"font-semibold text-green-700 mb-1\">記敘過渡</h3>\n              <p class=\"text-gray-700\">\n                話說回來、正當……之際、回想起來、那一刻、不久之後\n              </p>\n              <p class=\"text-xs text-gray-500 mt-1\">\n                例：正當我不知所措之際，老師走了過來……\n              </p>\n            </div>\n            <div class=\"border border-green-100 rounded-lg p-3\">\n              <h3 class=\"font-semibold text-green-700 mb-1\">描寫／鋪墊</h3>\n              <p class=\"text-gray-700\">\n                放眼望去、定睛一看、細心留意、只見、彷彿、儼如\n              </p>\n              <p class=\"text-xs text-gray-500 mt-1\">\n                例：放眼望去，整個年宵市場人頭湧湧……\n              </p>\n            </div>\n            <div class=\"border border-green-100 rounded-lg p-3\">\n              <h3 class=\"font-semibold text-green-700 mb-1\">議論／反駁</h3>\n              <p class=\"text-gray-700\">\n                有人認為、有人說、然而、反過來說、不可否認\n              </p>\n              <p class=\"text-xs text-gray-500 mt-1\">\n                例：有人認為方便聯絡，然而學校可以代為通知……\n              </p>\n            </div>\n          </div>\n        </div>\n\n        <!-- 專屬詞語庫 -->\n        <div\n          id=\"hub-voc pan>\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-note-btn\"\n                      onclick=\"addVocabToNotebook('眉清目秀', '描寫人物')\"\n                      title=\"加入筆記本\"\n                    >\n                      📝\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-remove-btn\"\n                      onclick=\"removeVocabItem('people_0')\"\n                      title=\"移除此例\"\n                      aria-label=\"移除此例\"\n                    >\n                      ×\n                    </button>\n                  </li>\n                  <li class=\"vocab-item\" data-vocab-id=\"people_1\">\n                    <button\n                      type=\"button\"\n                      class=\"vocab-copy\"\n                      onclick=\"copyVocab('和藹可親', this)\"\n                      title=\"複製\"\n                    >\n                      <span class=\"vocab-term\">和藹可親</span\n                      ><span class=\"vocab-hint\">——形容態度溫和、容易接近</span>\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-note-btn\"\n                      onclick=\"addVocabToNotebook('和藹可親', '描寫人物')\"\n                      title=\"加入筆記本\"\n                    >\n                      📝\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-remove-btn\"\n                      onclick=\"removeVocabItem('people_1')\"\n                      title=\"移除此例\"\n                      aria-label=\"移除此例\"\n                    >\n                      ×\n                    </button>\n                  </li>\n                  <li class=\"vocab-item\" data-vocab-id=\"people_2\">\n                    <button\n                      type=\"button\"\n                      class=\"vocab-copy\"\n                      onclick=\"copyVocab('精神奕奕', this)\"\n                      title=\"複製\"\n                    >\n                      <span class=\"vocab-term\">精神奕奕</span\n                      ><span class=\"vocab-hint\">——形容精神飽滿、有活力</span>\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-note-btn\"\n                      onclick=\"addVocabToNotebook('精神奕奕', '描寫人物')\"\n                      title=\"加入筆記本\"\n                    >\n                      📝\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-remove-btn\"\n                      onclick=\"removeVocabItem('people_2')\"\n                      title=\"移除此例\"\n                      aria-label=\"移除此例\"\n                    >\n                      ×\n                    </button>\n                  </li>\n                  <li class=\"vocab-item\" data-vocab-id=\"people_3\">\n                    <button\n                      type=\"button\"\n                      class=\"vocab-copy\"\n                      onclick=\"copyVocab('身材修長', this)\"\n                      title=\"複製\"\n                    >\n                      <span class=\"vocab-term\">身材修長</span\n                      ><span class=\"vocab-hint\">——形容個子高、體形苗條</span>\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-note-btn\"\n                      onclick=\"addVocabToNotebook('身材修長', '描寫人物')\"\n                      title=\"加入筆記本\"\n                    >\n                      📝\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-remove-btn\"\n                      onclick=\"removeVocabItem('people_3')\"\n                      title=\"移除此例\"\n                      aria-label=\"移除此例\"\n                    >\n                      ×\n                    </button>\n                  </li>\n                  <li class=\"vocab-item\" data-vocab-id=\"people_4\">\n                    <button\n                      type=\"button\"\n                      class=\"vocab-copy\"\n                      onclick=\"copyVocab('笑容燦爛', this)\"\n                      title=\"複製\"\n                    >\n                      <span class=\"vocab-term\">笑容燦爛</span\n                      ><span class=\"vocab-hint\">——形容笑得很開心、很明亮</span>\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-note-btn\"\n                      onclick=\"addVocabToNotebook('笑容燦爛', '描寫人物')\"\n                      title=\"加入筆記本\"\n                    >\n                      📝\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-remove-btn\"\n                      onclick=\"removeVocabItem('people_4')\"\n                      title=\"移除此例\"\n                      aria-label=\"移除此例\"\n                    >\n                      ×\n                    </button>\n                  </li>\n                  <li class=\"vocab-item\" data-vocab-id=\"people_5\">\n                    <button\n                      type=\"button\"\n                      class=\"vocab-copy\"\n                      onclick=\"copyVocab('勤學好問', this)\"\n                      title=\"複製\"\n                    >\n                      <span class=\"vocab-term\">勤學好問</span\n                      ><span class=\"vocab-hint\">——形容愛讀書、愛請教</span>\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-note-btn\"\n                      onclick=\"addVocabToNotebook('勤學好問', '描寫人物')\"\n                      title=\"加入筆記本\"\n                    >\n                      📝\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-remove-btn\"\n                      onclick=\"removeVocabItem('people_5')\"\n                      title=\"移除此例\"\n                      aria-label=\"移除此例\"\n                    >\n                      ×\n                    </button>\n                  </li>\n                  <li class=\"vocab-item\" data-vocab-id=\"people_6\">\n                    <button\n                      type=\"button\"\n                      class=\"vocab-copy\"\n                      onclick=\"copyVocab('助人為樂', this)\"\n                      title=\"複製\"\n                    >\n                      <span class=\"vocab-term\">助人為樂</span\n                      ><span class=\"vocab-hint\">——形容樂意幫助別人</span>\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-note-btn\"\n                      onclick=\"addVocabToNotebook('助人為樂', '描寫人物')\"\n                      title=\"加入筆記本\"\n                    >\n                      📝\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-remove-btn\"\n                      onclick=\"removeVocabItem('people_6')\"\n                      title=\"移除此例\"\n                      aria-label=\"移除此例\"\n                    >\n                      ×\n                    </button>\n                  </li>\n                  <li class=\"vocab-item\" data-vocab-id=\"people_7\">\n                    <button\n                      type=\"button\"\n                      class=\"vocab-copy\"\n                      onclick=\"copyVocab('言行一致', this)\"\n                      title=\"複製\"\n                    >\n                      <span class=\"vocab-term\">言行一致</span\n                      ><span class=\"vocab-hint\">——說的話和做的事相符</span>\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-note-btn\"\n                      onclick=\"addVocabToNotebook('言行一致', '描寫人物')\"\n                      title=\"加入筆記本\"\n                    >\n                      📝\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-remove-btn\"\n                      onclick=\"removeVocabItem('people_7')\"\n                      title=\"移除此例\"\n                      aria-label=\"移除此例\"\n                    >\n                      ×\n                    </button>\n                  </li>\n                  <li class=\"vocab-item\" data-vocab-id=\"people_8\">\n                    <button\n                      type=\"button\"\n                      class=\"vocab-copy\"\n                      onclick=\"copyVocab('專心致志', this)\"\n                      title=\"複製\"\n                    >\n                      <span class=\"vocab-term\">專心致志</span\n                      ><span class=\"vocab-hint\">——形容十分專注</span>\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-note-btn\"\n                      onclick=\"addVocabToNotebook('專心致志', '描寫人物')\"\n                      title=\"加入筆記本\"\n                    >\n                      📝\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-remove-btn\"\n                      onclick=\"removeVocabItem('people_8')\"\n                      title=\"移除此例\"\n                      aria-label=\"移除此例\"\n                    >\n                      ×\n                    </button>\n                  </li>\n                  <li class=\"vocab-item\" data-vocab-id=\"people_9\">\n                    <button\n                      type=\"button\"\n                      class=\"vocab-copy\"\n                      onclick=\"cop               <span class=\"vocab-sentence\"\n                        >夕陽把雲朵染成金色，像燃燒的火焰。</span\n                      >\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-note-btn\"\n                      onclick=\"\n                        addVocabToNotebook(\n                          '夕陽把雲朵染成金色，像燃燒的火焰。',\n                          '比喻句（寫景／寫物）',\n                        )\n                      \"\n                      title=\"加入筆記本\"\n                    >\n                      📝\n                    </button>\n                    <button\n                      type=\"button\"\n                      class=\"vocab-remove-btn\"\n                      onclick=\"removeVocabItem('metaphor-scene_9')\"\n                      title=\"移除此例\"\n                      aria-label=\"移除此例\"\n                    >\n                      ×\n                    </button>\n                  </li>\n                </ol>\n              </div>\n            </details>\n          </div>\n          <p class=\"text-xs text-gray-500 mt-4\">\n            💡 閱讀課外書時，遇見喜歡的詞語也可按 📝 摘錄；仿寫範文時，可配合<a\n              href=\"#hub-connectors\"\n              class=\"underline\"\n              >連接詞庫</a\n            >和<a href=\"#hub-openings\" class=\"underline\">開頭結尾句式</a\n            >一起運用。\n          </p>\n        </div>\n        <!-- /專屬詞語庫 -->\n\n        <!-- 開頭結尾 -->\n        <div\n          id=\"hub-openings\"\n          class=\"bg-white border border-gray-200 rounded-2xl p-6 shadow-sm\"\n        >\n          <h2 class=\"text-xl font-bold text-yellow-800 mb-4\">\n            📖 開頭與結尾句式庫\n          </h2>\n          <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4 text-sm\">\n            <div>\n              <h3 class=\"font-semibold text-gray-800 mb-2\">記敘文開頭</h3>\n              <ul class=\"text-gray-700 space-y-1 list-disc ml-4\">\n                <li><strong>回憶式</strong>：「回想起那次……，至今仍讓我……」</li>\n                <li>\n                  <strong>場景式</strong>：「那是一個……的下午，陽光/細雨……」\n                </li>\n                <li><strong>懸念式</strong>：「我從未想過，一件小事竟會……」</li>\n              </ul>\n              <h3 class=\"font-semibold text-gray-800 mb-2 mt-3\">描寫文開頭</h3>\n              <ul class=\"text-gray-700 space-y-1 list-disc ml-4\">\n                <li>「走進……，撲面而來的是……」</li>\n                <li>「每逢……，我便會想起……」</li>\n              </ul>\n            </div>\n            <div>\n              <h3 class=\"font-semibold text-gray-800 mb-2\">議論文開頭</h3>\n              <ul class=\"text-gray-700 space-y-1 list-disc ml-4\">\n                <li><strong>名言式</strong>：「俗語說：『……』。我認為……」</li>\n                <li>\n                  <strong>設問式</strong>：「……是否……？這是值得深思的問題。」\n                </li>\n                <li><strong>現象式</strong>：「近年，……日益普遍。我認為……」</li>\n              </ul>\n              <h3 class=\"font-semibold text-gray-800 mb-2 mt-3\">\n                結尾（各文體通用）\n              </h3>\n              <ul class=\"text-gray-700 space-y-1 list-disc ml-4\">\n                <li><strong>感悟式</strong>：「這次經歷讓我明白……」</li>\n                <li><strong>呼籲式</strong>：「讓我們從今天起……」</li>\n                <li><strong>展望式</strong>：「但願今後……，我會更加……」</li>\n              </ul>\n            </div>\n          </div>\n        </div>\n\n        <!-- 常見失分 -->\n        <div\n          id=\"hub-mistakes\"\n          class=\"bg-white border border-red-200 rounded-2xl p-6 shadow-sm\"\n        >\n          <h2 class=\"text-xl font-bold text-red-800 mb-4\">\n            ⚠️ 常見失分點與改進方法\n          </h2>\n          <div class=\"overflow-x-auto\">\n            <table class=\"w-full text-sm text-left border-collapse\">\n              <thead>\n                <tr class=\"bg-red-50\">\n                  <th class=\"border border-red-100 p-2\">常見問題</th>\n                  <th class=\"border border-red-100 p-2\">改進方法</th>\n                  <th class=\"border border-red-100 p-2\">適用文體</th>\n                </tr>\n              </thead>\n              <tbody class=\"text-gray-700\">\n                <tr>\n                  <td class=\"border border-gray-100 p-2\">流水帳，平鋪直敘</td>\n                  <td class=\"border border-gray-100 p-2\">\n                    詳寫高潮（第三段），略寫起因和過渡\n                  </td>\n                  <td class=\"border border-gray-100 p-2\">記敘</td>\n                </tr>\n                <tr>\n                  <td class=\"border border-gray-100 p-2\">跑題，離題萬里</td>\n                  <td class=\"border border-gray-100 p-2\">\n                    每段首句扣題；寫完用題目關鍵字自檢\n                  </td>\n                  <td class=\"border border-gray-100 p-2\">全部</td>\n                </tr>\n                <tr>\n                  <td class=\"border border-gray-100 p-2\">議論文立場模糊</td>\n                  <td class=\"border border-gray-100 p-2\">\n                    首段末句明確表態；結尾重申立場\n                  </td>\n                  <td class=\"border border-gray-100 p-2\">議論</td>\n                </tr>\n                <tr>\n                  <td class=\"border border-gray-100 p-2\">只有觀點，無例子</td>\n                  <td class=\"border border-gray-100 p-2\">\n                    每個論據配一個生活例子或事實\n                  </td>\n                  <td class=\"border border-gray-100 p-2\">議論、說明</td>\n                </tr>\n                <tr>\n                  <td class=\"border border-gray-100 p-2\">\n                    口語化（好開心、俾、唔）\n                  </td>\n                  <td class=\"border border-gray-100 p-2\">\n                    參考<a href=\"#hub-formal\" class=\"underline\">書面語對照表</a\n                    >逐句修改\n                  </td>\n                  <td class=\"border border-gray-100 p-2\">全部</td>\n                </tr>\n                <tr>\n                  <td class=\"border border-gray-100 p-2\">實用文格式錯誤</td>\n                  <td class=\"border border-gray-100 p-2\">\n                    對照<a href=\"#cat-practical\" class=\"underline\">格式範本</a\n                    >：上款、正文、祝頌、下款、日期\n                  </td>\n                  <td class=\"border border-gray-100 p-2\">實用</td>\n                </tr>\n                <tr>\n                  <td class=\"border border-gray-100 p-2\">\n                    描寫單調，只有「看」\n                  </td>\n                  <td class=\"border border-gray-100 p-2\">\n                    加入聽覺、嗅覺、觸覺；用比喻和擬人\n                  </td>\n                  <td class=\"border border-gray-100 p-2\">描寫</td>\n                </tr>\n                <tr>\n                  <td class=\"border border-gray-100 p-2\">結尾空泛，缺乏感悟</td>\n                  <td class=\"border border-gray-100 p-2\">\n                    寫出具體啟發：「我明白了……，今後會……」\n                  </td>\n                  <td class=\"border border-gray-100 p-2\">記敘、抒情</td>\n                </tr>\n              </tbody>\n            </table>\n          </div>\n        </div>\n\n        <!-- 修辭手法 -->\n        <div\n          id=\"hub-rhetoric\"\n          class=\"bg-white border border-purple-200 rounded-2xl p-6 shadow-sm\"\n        >\n          <h2 class=\"text-xl font-bold text-purple-800 mb-4\">\n            🎭 修辭手法速查（摘自本頁範文）\n          </h2>\n          <ul class=\"text-sm text-gray-700 space-y-2\">\n            <li>\n              <strong>比喻</strong>：「這句話像一盞明燈，照亮我前行的方向」—\n              把抽象的鼓勵比作明燈，突出其指引作用。\n            </li>\n            <li>\n              <strong>擬人</strong>：「夕陽把雲霞染成橙紅、金黃和淡紫」—\n              以「染」賦予夕陽人的動作，景象更生動。\n            </li>\n            <li>\n              <strong>誇張</strong>：「整個天際彷彿燃起了溫柔的火焰」—\n              突出黃昏的絢麗，加強視覺衝擊。\n            </li>\n            <li>\n              <strong>排比</strong>：「我們跳繩、踢毽子、捉迷藏」—\n              並列動作，節奏明快，呈現童年活潑。\n            </li>\n            <li>\n              <strong>對偶</strong>：「讀萬卷書，行萬里路」—\n              結構工整，意義相對，易記易用。\n            </li>\n            <li>\n              <strong>設問</strong\n              >：「開卷是否有益，取決於書的質素和讀者的態度？」—\n              引導讀者思考，為下文的論述鋪墊。\n            </li>\n            <li>\n              <strong>反問</strong>：「若只顧個人表現，往往事倍功半」—\n              以反問加強論點，提醒合作的重要。\n            </li>\n          </ul>\n          <p class=\"text-xs text-purple-700 mt-3\">\n            寫作時每篇嘗試用1–2種修辭，切忌堆砌；配合內容自然運用。\n          </p>\n        </div>\n\n        <!-- TSA評分 -->\n        <div\n          id=\"hub-tsa\"\n          class=\"bg-amber-50 border border-amber-200 rounded-2xl p-6 shadow-sm\"\n        >\n          <h2 class=\"text-xl font-bold text-amber-800 mb-4\">\n            📋 TSA 評分要點自評表（小六參考）\n          </h2>\n          <p class=\"text-sm text-gray-700 mb-3\">\n            完成作文後，逐項自評（□ 做到　□ 未做到）：\n          </p>\n          <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4 text-sm\">\n            <div class=\"bg-white p-4 rounded-lg border border-amber-100\">\n              <h3 class=\"font-bold text-amber-800 mb-2\">內容</h3>\n              <ul class=\"space-y-1 text-gray-700\">\n                <li>□ 切合題目，中心思想清楚</li>\n                <li>□ 內容充實，有具體例子或細節</li>\n                <li>□ 記敘有真實感／議論立場明確</li>\n              </ul>\n            </div>\n            <div class=\"bg-white p-4 rounded-lg border border-amber-100\">\n              <h3 class=\"font-bold text-amber-800 mb-2\">結構</h3>\n              <ul class=\"space-y-1 text-gray-700\">\n                <li>□ 分段清楚（五段式或格式正確）</li>\n                <li>□ 詳略得當，首尾呼應</li>\n                <li>□ 連接詞運用恰當</li>\n              </ul>\n            </div>\n            <div class=\"bg-white p-4 rounded-lg border border-amber-100\">\n              <h3 class=\"font-bold text-amber-800 mb-2\">語句</h3>\n              <ul class=\"space-y-1 text-gray-700\">\n                <li>□ 語句通順，少有病句</li>\n                <li>□ 用詞準確，具書面語色彩</li>\n                <li>□ 適當運用修辭或四字詞語</li>\n              </ul>\n            </div>\n            <div class=\"bg-white p-4 rounded-lg border border-amber-100\">\n              <h3 class=\"font-bold text-amber-800 mb-2\">錯字及標點</h3>\n              <ul class=\"space-y-1 text-gray-700\">\n                <li>□ 錯別字少，字體工整</li>\n                <li>□ 標點符號運用正確</li>\n                <li>□ 實用文格式元素齊全</li>\n              </ul>\n            </div>\n          </div>\n        </div>\n\n        <!-- 書面語對照 -->\n        <div\n          id=\"hub-formal\"\n          class=\"bg-white border border-gray-200 rounded-2xl p-6 shadow-sm\"\n        >\n          <h2 class=\"text-xl font-bold text-gray-800 mb-4\">\n            📝 書面語／口語對照表\n          </h2>\n          <div class=\"grid grid-cols-2 md:grid-cols-4 gap-2 text-sm\">\n            <div class=\"p-2 bg-gray-50 rounded\">\n              <span class=\"text-red-600\">口語</span> →\n              <span class=\"text-green-700\">書面語</span>\n            </div>\n            <div class=\"p-2 bg-gray-50 rounded\">好開心 → 欣喜、雀躍</div>\n            <div class=\"p-2 bg-gray-50 rounded\">好慘 → 難過、悽然</div>\n            <div class=\"p-2 bg-gray-50 rounded\">同位 → 同桌</div>\n            <div class=\"p-2 bg-gray-50 rounded\">俾 → 給、給予</div>\n            <div class=\"p-2 bg-gray-50 rounded\">唔 → 不、沒有</div>\n            <div class=\"p-2 bg-gray-50 rounded\">喺 → 在</div>\n            <div class=\"p-2 bg-gray-50 rounded\">佢 → 他／她</div>\n            <div class=\"p-2 bg-gray-50 rounded\">玩 → 嬉戲、進行活動</div>\n            <div class=\"p-2 bg-gray-50 rounded\">滑手機 → 瀏覽電子屏幕</div>\n            <div class=\"p-2 bg-gray-50 rounded\">有人話 → 有人認為</div>\n            <div class=\"p-2 bg-gray-50 rounded\">說說笑笑 → 談笑風生</div>\n            <div class=\"p-2 bg-gray-50 rounded\">搞 → 進行、處理</div>\n            <div class=\"p-2 bg-gray-50 rounded\">好叻 → 出色、優秀</div>\n            <div class=\"p-2 bg-gray-50 rounded\">小朋友 → 同齡的同學</div>\n            <div class=\"p-2 bg-gray-50 rounded\">靚 → 美麗、悅目</div>\n          </div>\n        </div>\n\n        <!-- 看圖擴寫 -->\n        <div\n          id=\"hub-extra\"\n          class=\"bg-white border border-pink-200 rounded-2xl p-6 shadow-sm\"\n        >\n          <h2 class=\"text-xl font-bold text-pink-800 mb-4\">\n            🖼️ 看圖作文、擴寫／續寫、閱讀報告\n          </h2>\n          <div class=\"grid grid-c
