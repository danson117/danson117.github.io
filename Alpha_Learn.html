plain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"只有落後國家才會發生中毒事件。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          }\n        ]\n      },\n      {\n        \"passage\": \"塑膠袋用完即棄，看似方便，卻極難自然分解，長期留在泥土和海洋中，會危害雀鳥、魚類甚至人類健康。自備購物袋、重用舊袋，雖然只是生活中的小小一步，卻能有效減少垃圾，為環境出一分力。環保不一定要轟轟烈烈，從改變用袋習慣開始便已足夠。\",\n        \"answer\": \"D\",\n        \"focus\": 1,\n        \"focusLabel\": \"無關內容\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"塑膠袋方便又環保。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"所有垃圾都來自塑膠袋。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"人類應完全停止購物。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"減少使用即棄塑膠袋有助保護環境。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"變色龍最特別的本領，是能隨着周圍環境改變皮膚顏色。牠們靠這方法隱藏身形、躲避天敵，有時也用來傳遞情緒或求偶訊息。因此，改變體色對變色龍的生存來說十分重要，絕不只是好看那麼簡單。若失去變色能力，牠在野外的存活機會便會大減。\",\n        \"answer\": \"A\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"變色龍改變體色有助生存。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"變色龍從不主動覓食。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"變色龍是最美麗的爬蟲。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"變色龍喜歡在樹上生活。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          }\n        ]\n      },\n      {\n        \"passage\": \"完成功課後先休息片刻，再仔細檢查有沒有錯漏，往往比做完立刻玩遊戲更有效。把較困難的科目安排在精神最好的時段，並把複習分成小段進行，可避免一次學得太多而疲倦。良好的時間安排，能讓學習事半功倍。懂得管理時間的人，往往也能同時兼顧休息與娛樂。\",\n        \"answer\": \"B\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"把困難科目安排在精神好的時段。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"合理安排時間有助提升學習效率。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"同學應整天溫習，不要玩遊戲。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"做完功課後不應休息。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          }\n        ]\n      },\n      {\n        \"passage\": \"銀杏葉形狀像一把小扇，春天嫩綠，入秋後逐漸由綠轉黃。遠遠望去，滿地落葉像鋪了一層金色地毯，十分壯觀。正因這獨特外形與悠長年歲，銀杏又有「金色活化石」的美稱，吸引不少人特地欣賞。每年秋天，總有人特意到銀杏大道拍照留念。\",\n        \"answer\": \"C\",\n        \"focus\": 6,\n        \"focusLabel\": \"直接錯誤\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"談談秋天常見的樹木。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"銀杏樹地位崇高、價值連城。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"銀杏葉的外形與美稱由來。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"秋天最適合欣賞銀杏葉。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          }\n        ]\n      },\n      {\n        \"passage\": \"科學家發現，蜜蜂替花朵傳粉時，不但幫助植物結果實，更間接維持生態平衡。一旦蜜蜂數量大減，許多蔬果的產量都會受影響，人類的糧食供應也可能出現壓力。因此，保護蜜蜂，其實就是保護我們的日常生活。農業和自然保育界因此呼籲大眾關注授粉關係。\",\n        \"answer\": \"D\",\n        \"focus\": 2,\n        \"focusLabel\": \"過度推論\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"蔬果減產一定是蜜蜂減少造成。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"蜜蜂是最勤勞的昆蟲。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"科學家專門研究蜜蜂的生活習性。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"保護蜜蜂對人類十分重要。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      }\n    ]\n  },\n  {\n    \"id\": 3,\n    \"title\": \"句段辨析 (3)\",\n    \"source\": \"來源：網上練習／自擬（對齊 PDF 準則）\",\n    \"grade\": \"年級：小五\",\n    \"questions\": [\n      {\n        \"passage\": \"由於獅子的視覺主要分辨黑白影像，當斑馬成羣奔跑時，身上黑白相間的條紋會互相交錯，擾亂獅子的目光，使牠一時難以鎖定目標。斑馬就藉着這天然保護色，增加逃過捕獵的機會。條紋的作用，原來遠比裝飾外表更實際。\",\n        \"answer\": \"A\",\n        \"focus\": 1,\n        \"focusLabel\": \"無關內容\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"斑馬身上的條紋有保護作用。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"斑馬是獅子的主要食物。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"斑馬是羣體動物。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"斑馬擅於躲避獅子的追捕。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          }\n        ]\n      },\n      {\n        \"passage\": \"思考是大腦的一種重要活動方式，能鍛煉思維能力，使大腦保持活力，並增強記憶。思考還能幫助我們發現問題、理解所學知識。它的作用不容小看：科學家發明新事物、作家寫出好作品、醫生找出病因，都離不開深入思考。可見「多想一步」對個人和社會都同樣重要。\",\n        \"answer\": \"B\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"思考是使大腦保持活力的途徑。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"思考的作用重大。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"學習時要善於思考。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"不少專業人士都喜歡思考。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          }\n        ]\n      },\n      {\n        \"passage\": \"使用網絡搜尋資料雖然方便快捷，但網上資訊真假難辨，來源亦未必可靠。我們應多方核對不同網頁和書籍，並特別留意個人私隱，不要隨便填寫真實姓名、學校或電話。懂得篩選內容與保護自己，才能真正受惠於科技。科技本身是工具，關鍵在於我們怎樣使用。\",\n        \"answer\": \"C\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"網上所有資料都不可信。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"上網搜尋資料百害而無一利。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"使用網絡時應小心核實資料並保護私隱。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"介紹互聯網的發展歷史。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          }\n        ]\n      },\n      {\n        \"passage\": \"課後活動能讓同學按興趣選擇球類、音樂、科學或美術等小組，既可學到課堂以外的技能，也能在練習和比賽中結交朋友、學習分工合作。對不少學生來說，課後活動是成長路上重要的一環，好處並不只得一樣。學校推動課後活動，正是希望同學得到更均衡發展。\",\n        \"answer\": \"D\",\n        \"focus\": 6,\n        \"focusLabel\": \"直接錯誤\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"課後活動對學業完全沒有幫助。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反：原文指出課後活動有多方面好處，並非毫無幫助。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"所有同學都必須參加球類活動。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"課後活動能讓同學結交朋友。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"課後活動對同學有多方面好處。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"清晨的街市剛開門，人聲已經鼎沸。檔主大聲招呼客人，水箱裏的海鮮來回游動，新鮮水果的香氣混着魚腥味撲鼻而來。婆婆們提着籃子穿梭於攤檔之間，比手畫腳地講價，構成一幅熱鬧又富人情味的畫面。對街坊來說，街市不但是買菜處，也是交流近況的地方。\",\n        \"answer\": \"A\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"描寫清晨市場熱鬧的情景。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"市場裏有很多海鮮出售。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"婆婆最喜歡去市場。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"市場是城市最重要的地方。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"把廢紙、膠樽和金屬罐分開回收，可以減少堆填區的負擔，也能讓資源重新造成新產品，減少浪費原材料。只要從小養成分類習慣，在家中和學校認真做好回收，就是為環保出一分實實在在的力。一人一小步，累積起來就能減輕堆填壓力。\",\n        \"answer\": \"B\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"廢紙是唯一值得回收的東西。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"做好廢物分類有助環保。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"香港已經沒有垃圾問題。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"只有大人需要做回收。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          }\n        ]\n      },\n      {\n        \"passage\": \"螞蟻的身體雖然細小，卻十分懂得分工合作：有的負責外出覓食，有的留守保護巢穴，有的照料幼蟻。靠着這種團隊力量，牠們能齊心搬運比自己體重重許多倍的食物，令其他動物也刮目相看。這種團結精神，正是螞蟻族群強大的原因。\",\n        \"answer\": \"C\",\n        \"focus\": 2,\n        \"focusLabel\": \"過度推論\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"螞蟻是最團結的昆蟲。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"螞蟻喜歡吃甜食。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"螞蟻靠分工合作發揮力量。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"螞蟻的巢穴構造複雜。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          }\n        ]\n      },\n      {\n        \"passage\": \"參觀博物館時，解說員會細說展品的年代與由來；互動區則有模型、按鈕或螢幕，讓同學動手操作；禮品店還售賣與主題相關的書冊和紀念品。一次用心的參觀，往往能在知識和興趣兩方面都有豐富收穫。走出課室親身看展，記憶往往比單靠課本更深。\",\n        \"answer\": \"D\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"博物館禮品店售賣書冊。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"解說員的工作十分辛苦。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"所有知識都來自博物館。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"參觀博物館能帶來豐富學習體驗。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"太陽能板可以把太陽光轉化成電力，減少燃燒煤炭或石油，有助降低空氣污染和溫室氣體。近年越來越多學校在天台安裝太陽能裝置，既作示範教材，也能為校園提供部分清潔電力，一舉兩得。清潔能源走進校園，也能讓學生明白環保並不遙遠。\",\n        \"answer\": \"A\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"太陽能有助減少污染、提供清潔電力。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"討論各種新能源的優缺點。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"學校天台一定要裝太陽能板。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"太陽能板外表十分美觀。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          }\n        ]\n      },\n      {\n        \"passage\": \"媽媽常常提醒：「飯前一定要洗手。」因為雙手整天接觸門柄、課桌、金錢和扶手，表面可能沾有肉眼看不見的病菌。把雙手洗乾淨再進食，就能大大減少「病從口入」的機會，是簡單而有效的衞生習慣。養成洗手習慣，保護的不只是自己，還有身邊的人。\",\n        \"answer\": \"B\",\n        \"focus\": 5,\n        \"focusLabel\": \"過大／籠統\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"媽媽不喜歡孩子弄髒桌子。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"飯前洗手有助減少病菌入口。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"金錢是最骯髒的東西。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"洗手只在冬天才需要。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          }\n        ]\n      }\n    ]\n  },\n  {\n    \"id\": 4,\n    \"title\": \"句段辨析 (4)\",\n    \"source\": \"來源：自擬練習（對齊 PDF 準則）\",\n    \"grade\": \"年級：小五\",\n    \"questions\": [\n      {\n        \"passage\": \"每當天文台發出颱風警告，市民便應提前收好簷篷、冷氣機擋板和窗邊花盆，避免高空墮物傷人；同時預先準備足夠食水、罐頭糧食和手電筒，並留意電台電視的最新消息，留在安全地方等待，才能減低風險。有備無患，才能在惡劣天氣中安然度過。\",\n        \"answer\": \"C\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"市民應收好簷篷和花盆。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"颱風天最適合外出購物。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"颱風前應做好安全準備。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"香港每年一定有強颱風。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"壁虎能在天花板和直立玻璃上行走自如，秘密在於腳趾下方布滿極細密的剛毛，可緊緊貼着表面而不易滑下。靠着這種特別構造，壁虎能在夜間靈巧爬行，捕捉蚊蟲等小獵物，成為家居常見的「捕蟲幫手」。細看之下，原來小動物的身體構造充滿智慧。\",\n        \"answer\": \"D\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"壁虎專門在天花板休息。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"壁虎是最可怕的爬蟲。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"所有昆蟲都害怕壁虎。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"壁虎靠特別腳趾構造靈活行走與捕食。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"書包長期過重，會令肩膀、頸部和脊椎承受過大壓力，影響小朋友的骨骼發展。選擇有寬闊肩帶、可緊貼背部的書包，並每星期清理不需要的書本和習作，都能有效減輕負擔，保護身体健康。父母和老師也應多加留意孩子的負重情況。\",\n        \"answer\": \"A\",\n        \"focus\": 2,\n        \"focusLabel\": \"過度推論\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"減輕書包負擔有助保護身體。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"寬肩帶書包是唯一有效方法。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"同學不應帶任何書回校。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"書包顏色會影響學習成績。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          }\n        ]\n      },\n      {\n        \"passage\": \"中秋節晚上，公園裏掛滿顏色鮮豔的紙燈籠，孩子提着兔子燈、星星燈走來走去，不時發出驚歎聲。家人則圍坐在草地或長椅上，分享月餅和水果，柔和的月光把四周照得亮晶晶，氣氛溫馨而熱鬧。明月、燈籠與團圓，構成了中秋最難忘的記憶。\",\n        \"answer\": \"B\",\n        \"focus\": 5,\n        \"focusLabel\": \"過大／籠統\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"中秋節一定要吃月餅。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"描寫中秋節公園裏的溫馨氣氛。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"公園裏掛滿了紙燈籠。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"孩子最喜歡中秋節。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          }\n        ]\n      },\n      {\n        \"passage\": \"寫日記可以把當天發生的事、看到的景物和內心感受一一記下來。這樣不但能練習文句組織和用詞，也能幫助整理情緒、回顧得失。只要堅持下去，你會發現自己觀察事物愈來愈仔細，表達也愈來愈流暢。日記不必天天寫得很長，貴在真實和持續。\",\n        \"answer\": \"C\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"寫日記只為了練習文筆。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"每人每天必須寫一千字。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"寫日記有助練習表達與整理思緒。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"日記只能寫快樂的事。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          }\n        ]\n      },\n      {\n        \"passage\": \"大熊貓主要以竹子為食，每天往往要花十多小時進食，才能攝取足夠能量。加上牠們繁殖不易，棲息的竹林又因人類活動而縮減，野外數量有限。因此，設立保護區、減少干擾，對熊貓存續顯得格外重要。國際間的保育合作，對挽救瀕危物種尤其關鍵。\",\n        \"answer\": \"D\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"介紹世界各地的珍稀動物。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"熊貓只喜歡吃竹子的葉子。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"熊貓是最可愛的動物。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"熊貓的生存面對挑戰，需要保護。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"過馬路前要先在路邊停一停，看清楚左右來車，再依從交通燈或過路設施指示才起步。即使趕時間、怕遲到，也不應衝紅燈或在車縫中穿插。養成安全過路習慣，才能保護自己，也減少交通意外。把「安全第一」放在心裏，比趕幾分鐘更重要。\",\n        \"answer\": \"A\",\n        \"focus\": 1,\n        \"focusLabel\": \"無關內容\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"過馬路必須遵守安全規則。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"趕時間時可以快速衝過馬路。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"交通燈是城市最重要的設備。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"行人天橋比斑馬線更安全。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          }\n        ]\n      },\n      {\n        \"passage\": \"音樂課上，同學先跟着節拍拍手練習節奏，接着合唱時聲音齊整，高低聲部互相配合；負責敲擊樂的同學則按譜敲打，把歌曲襯托得更有層次。整堂課既訓練聽覺，也展現班中合作無間的氣氛。藝術課培養的，不只是技巧，還有彼此聆聽的態度。\",\n        \"answer\": \"B\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"敲擊樂比合唱更重要。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"描寫音樂課上同學合作表演的情景。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"同學都精通所有樂器。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"音樂課只學習古典音樂。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          }\n        ]\n      },\n      {\n        \"passage\": \"節約用水其實不難：淋浴時間短一點、用完水立刻關緊水喉、把洗米水或洗菜水用來澆花，都是日常可行的方法。這些習慣看似微不足道，但家家戶戶積少成多，就能減輕水塘和海水化淡的壓力。水是公共資源，珍惜用水其實是每個市民的責任。\",\n        \"answer\": \"C\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"重用洗米水澆花是唯一方法。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"香港永遠不會缺水。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"日常生活中節約用水很重要。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"只有夏天需要節約用水。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"貓頭鷹大多白天在樹洞休息，夜間才出動捕獵。牠們的視力能適應昏暗光線，聽覺也異常敏銳，連細小動靜也能察覺，因此能在黑夜中準確發現老鼠等獵物，被稱為出色的夜間獵人。在生態食物鏈中，貓頭鷹也扮演着控制鼠患的角色。\",\n        \"answer\": \"D\",\n        \"focus\": 6,\n        \"focusLabel\": \"直接錯誤\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"貓頭鷹從不在白天活動。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"貓頭鷹是森林之王。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"所有鳥類都在夜間捕獵。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"貓頭鷹擅於夜間捕獵。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      }\n    ]\n  },\n  {\n    \"id\": 5,\n    \"title\": \"句段辨析 (5)\",\n    \"source\": \"來源：自擬練習（對齊 PDF 準則）\",\n    \"grade\": \"年級：小五\",\n    \"questions\": [\n      {\n        \"passage\": \"火鍋店裏熱氣騰騰，濃郁的湯底在鍋中翻滾，食客不斷夾起蔬菜、肉片和丸子放進鍋裏。談笑聲、乾杯聲與咕嘟作響的鍋聲混在一起；窗外正飄着細雨，店內反而更覺暖和熱鬧，令人食慾大增。寒冷天氣裏進一間熱氣鍋店，感覺特別舒服。\",\n        \"answer\": \"A\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"描寫火鍋店裏熱鬧溫暖的用餐氣氛。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"火鍋店的湯底最好喝。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"下雨天最適合吃火鍋。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"介紹香港各種餐飲文化。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          }\n        ]\n      },\n      {\n        \"passage\": \"在家種豆芽所需材料很簡單：只要黃豆或綠豆、清水和一個透氣容器。每天更換一兩次水，保持濕潤，幾天後便能看見白色芽身鑽出豆殼。過程既能觀察生命成長，也能親手種出可食用的新鮮芽菜。小小實驗做得好，同樣能帶來滿滿的成功感。\",\n        \"answer\": \"B\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"種豆芽一定要每天換水才會成功。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"種豆芽既有趣又能認識生命成長。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"豆子放進容器就會立刻發芽。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"只有農夫才能種植食物。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          }\n        ]\n      },\n      {\n        \"passage\": \"一本好用的字典，不但可以查字音、字形和筆順，還能透過詞義和例句明白用法。遇到閱讀或寫作時不懂的字，先查字典確認，總比憑感覺胡亂猜測更可靠，也能減少寫錯別字的機會。工具用得其所，學習路上便少走許多冤枉路。\",\n        \"answer\": \"C\",\n        \"focus\": 6,\n        \"focusLabel\": \"直接錯誤\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"字典可以查字音字形。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"電子辭典完全取代紙本字典。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"善用字典有助正確理解字詞。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"寫作時不需要使用字典。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          }\n        ]\n      },\n      {\n        \"passage\": \"到郊外遠足前，應穿着防滑舒適的運動鞋，帶備足夠食水和小食，並沿着有標示的山徑行走，切勿擅自走入雜草叢生的小路。這樣不但較安全，也能安心欣賞沿途的樹木、溪流和雀鳥，享受大自然。尊重山野規則，也是愛護郊野公園的表現。\",\n        \"answer\": \"D\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"沿着山徑行走就已足夠。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"遠足時不必帶食水。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"所有山徑都沒有危險。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"遠足要注意安全並欣賞自然。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"班際辯論比賽中，正方與反方輪流發言，既要提出論點，也要舉出例子反駁對方。評判專注聆聽雙方邏輯是否清晰、證據是否充足，最後才宣布勝方。整場比賽訓練的是思考與表達，而非誰的聲音更大。輸贏以外，能條理分明地說服別人更可貴。\",\n        \"answer\": \"A\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"辯論比賽着重邏輯與臨場表達。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"評判一定偏幫正方。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"辯論只需要聲音響亮。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"反方發言比正方更重要。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          }\n        ]\n      },\n      {\n        \"passage\": \"牙醫建議牙刷大約每三個月更換一次；刷毛一旦分叉外翻，清潔力便會大減。刷牙時要覆蓋每一面牙齒和牙齦邊緣，早晚堅持，才能有效減少牙菌膜和蛀牙，保護口腔健康。口腔護理做好了，微笑起來也更有自信。\",\n        \"answer\": \"B\",\n        \"focus\": 5,\n        \"focusLabel\": \"過大／籠統\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"牙刷分叉後仍可繼續使用。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"正確刷牙與定期換牙刷有助口腔健康。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"只要刷牙面就足夠。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"口腔健康只靠漱口水。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"早上繁忙時間，車站月台上的乘客會自動排成兩列，列車到站後先讓車上乘客下車，再依序上車。車門開關之間，人潮雖多卻流動有序；列車開走後，月台又迅速恢復平靜，可見大眾運輸中的公德與秩序。大城市的效率，往往建立在人人守秩序之上。\",\n        \"answer\": \"C\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"乘客都趕着上班。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"列車永遠準時到達。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"描寫乘客在月台有秩序乘車的情景。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"說明城市鐵路系統的歷史。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          }\n        ]\n      },\n      {\n        \"passage\": \"進行專題研習時，組員若能清楚分工：有人負責上網和圖書館搜集資料，有人整理海報版面，有人練習口頭報告，整項工作便會進度更順利，也能避免一人忙亂、其他人無事可做的情況，真正發揮合作精神。清楚角色分工，衝突和延誤都會明顯減少。\",\n        \"answer\": \"D\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"搜集資料是最重要的一步。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"專題研習只能一人完成。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"海報比報告更重要。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"專題研習需要分工合作。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"螢火蟲的尾部能發出一種不會燙手的冷光，在夏天夜晚的草叢中一閃一閃，主要用來求偶和聯絡同類。不過，如果城市燈光太強、光污染嚴重，牠們的訊號便容易被掩蓋，人們也較難再看見這動人景象。保護黑暗的夜空，其實也是在保護這些小生命。\",\n        \"answer\": \"A\",\n        \"focus\": 1,\n        \"focusLabel\": \"無關內容\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"螢火蟲發光有助求偶與聯絡，並受環境影響。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"螢火蟲的光會燙傷人手。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"城市一定看不見螢火蟲。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"螢火蟲是最稀有的昆蟲。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          }\n        ]\n      },\n      {\n        \"passage\": \"科學課做實驗前，必須先仔細閱讀步驟，戴上護目鏡，並按老師指示使用儀器和藥品；實驗後也要收拾桌面。安全意識絕不是多餘，而是進行科學探究時最基本、也最重要的要求。小心謹慎，從來都是科學精神的一部分。\",\n        \"answer\": \"B\",\n        \"focus\": 2,\n        \"focusLabel\": \"過度推論\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"護目鏡是唯一需要的安全裝備。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"做實驗必須先注意安全。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"實驗一定會成功。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"科學課只學習背誦理論。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          }\n        ]\n      }\n    ]\n  },\n  {\n    \"id\": 6,\n    \"title\": \"句段辨析 (6)\",\n    \"source\": \"來源：自擬練習（對齊 PDF 準則）\",\n    \"grade\": \"年級：小五\",\n    \"questions\": [\n      {\n        \"passage\": \"爺爺用細竹骨和薄綿紙紮成風箏，紙面親手畫上一隻展翅的老鷹，色彩鮮明。週末他把風箏帶到空曠草地，等風勢穩定後鬆開線軸，風箏便穩穩飛上半空，在藍天下打轉，引來途人駐足觀看。一線牽着天空，童心與手藝在此刻相遇。\",\n        \"answer\": \"C\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"風箏面上畫着老鹰。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"放風箏是最容易的活動。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n ": \"B\",\n            \"text\": \"駱駝駝峰用來儲存大量清水。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"駱駝只生活在沙漠。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"駱駝是沙漠唯一的動物。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"整頓書桌時，可把常用筆、尺和間尺放在伸手可及的筆筒，書本按科目分類直立安放，並清走零食包裝和廢紙。桌面整齊之後，找東西的時間會減少，做功課時也較容易專心，學習效率自然提高。外在環境整齊了，內在思緒也更容易清明。\",\n        \"answer\": \"B\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"文具一定要放在最上層。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"整頓書桌有助提升學習效率。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"只要把書本按科目排好就已經足夠。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"書桌愈空愈好，不放任何東西。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"社區中心每星期舉辦長者舞蹈班、兒童故事會、興趣班和義工探訪等活動，讓不同年齡的鄰居有機會碰面、傾談。大家彼此認識之後，守望相助的機會增加，社區關係也會變得更緊密、更有人情味。一個有溫度的社區，往往由一場場小活動慢慢建成。\",\n        \"answer\": \"C\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"社區中心只服務長者。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"舞蹈班是最受歡迎的活動。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"社區活動能促進鄰里關係。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"義工服務比故事會更重要。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          }\n        ]\n      },\n      {\n        \"passage\": \"出門前花一兩分鐘查看天氣報告，便能知道當天溫度、會否下雨，以及有沒有颱風或暴雨警告。根據資訊決定穿衣厚薄、是否帶傘或改期外出，行程會更順利，也能減少因天氣突變而手忙腳亂。資訊正確，決策自然更加穩妥。\",\n        \"answer\": \"D\",\n        \"focus\": 6,\n        \"focusLabel\": \"直接錯誤\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"天氣報告永遠百分之百準確。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"只需要看溫度一項資料。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"下雨天不應查看天氣。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"查看天氣報告有助安排出行。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"蚯蚓終日在泥土中鑽動，把地面的落葉碎片拖進土裏分解，同時開鑿孔道，令土壤更鬆軟、更易透氣和排水。對種植蔬果和花草來說，蚯蚓的工作十分有益，因此常被稱為「泥土工程師」。看似不起眼的小蟲，卻默默改善着大地。\",\n        \"answer\": \"A\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"蚯蚓能改善土壤，有益種植。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"蚯蚓專門吃掉所有害蟲。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"沒有蚯蚓就完全不能種植。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"蚯蚓外號的由來與外貌有關。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          }\n        ]\n      },\n      {\n        \"passage\": \"班級旅行當天行程充實：上午沿着山徑觀察植物和昆蟲，下午進行分組團隊遊戲，晚上則圍着營火分享趣事、齊唱校歌。同學既有戶外學習，也有聯誼交流，一天過後往往既疲累又難忘。美好的集體回憶，常常就在這種行程裏累積起來。\",\n        \"answer\": \"B\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"晚上的營火是唯一精彩環節。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"班級旅行充實，兼具學習與聯誼。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"行山比團隊遊戲更重要。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"說明營地設施的管理規則。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          }\n        ]\n      },\n      {\n        \"passage\": \"節約用電的方法很多，例如離開房間隨手關燈、不用的充電器拔離插座、冷氣溫度調高一兩度並配合風扇使用。每人多做一步，發電廠的負擔就能減輕，也有助減少因發電造成的空氣污染。節能減排，其實可以從今晚關燈開始。\",\n        \"answer\": \"C\",\n        \"focus\": 2,\n        \"focusLabel\": \"過度推論\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"拔掉充電器是唯一有效方法。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"冷氣應全日開着才健康。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"日常生活節約用電很重要。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"電力永遠不會短缺。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"寄信時要在信封正面寫清楚收件人的姓名、地址和郵區編號，背面寫上寄件人資料，並貼上足夠郵資，最後投入郵筒。雖然電郵快捷方便，但在節日親手寫一封信，仍然別具心意和溫度。文字越過山水送到對方手裏，自有電郵難以取代的鄭重。\",\n        \"answer\": \"D\",\n        \"focus\": 5,\n        \"focusLabel\": \"過大／籠統\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"手寫信已被完全淘汰。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"郵資愈多信就愈快送到。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"電郵完全沒有用處。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"寄信需按格式辦理，手寫信仍有價值。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      }\n    ]\n  },\n  {\n    \"id\": 7,\n    \"title\": \"句段辨析 (7)\",\n    \"source\": \"來源：自擬練習（對齊 PDF 準則）\",\n    \"grade\": \"年級：小五\",\n    \"questions\": [\n      {\n        \"passage\": \"校運會開幕禮上，各班同學高舉班旗，踏着整齊步伐進入場地；軍樂隊奏起雄壯的進行曲，氣氛立刻凝重起來。校長致辭後，運動員代表上台宣誓，保證公平競賽。全場既莊嚴又熱鬧，為比賽拉開序幕。典禮過後，各項競賽才正式燃起戰火。\",\n        \"answer\": \"A\",\n        \"focus\": 5,\n        \"focusLabel\": \"過大／籠統\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"描寫校運會開幕禮莊嚴熱鬧的場面。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"校長致辭是最重要的環節。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"軍樂隊只演奏流行曲。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"介紹奧運會的起源與發展。\",\n            \"tag\": \"過大／籠統\",\n            \"explain\": \"說得太闊、太籠統，未能針對本段內容。\",\n            \"trap\": 5\n          }\n        ]\n      },\n      {\n        \"passage\": \"蜂蜜是蜜蜂採集花蜜後，在蜂巢中釀製而成的天然甜品，可直接食用，也常用來潤喉、調味或製作糕點。由於蜜蜂造訪的花卉不同，蜂蜜的顏色可深可淺，味道也可清可濃，變化相當豐富。認識食物從何而來，也會更懂得珍惜。\",\n        \"answer\": \"B\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"蜂蜜只能用來潤喉。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"蜂蜜來源與用途多樣。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"所有蜂蜜的味道完全相同。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"蜂蜜是人類最重要的食物。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"臨近農曆新年，不少家庭會進行大掃除，擦窗、清櫃、洗地，務求家居乾淨舒適。這習慣除了實際需要，也帶有「除去舊年塵埃、迎接新一年新氣象」的傳統意味。一家人手分工合作，往往事半功倍。新舊交替之際，掃去的不只是灰塵，還有一年的疲憊。\",\n        \"answer\": \"C\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"大掃除只為求好運。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"只有長輩需要打掃。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"年尾大掃除兼具實際與傳統意義。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"大掃除必須在年三十當天完成。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"企鵝的腹部大多呈白色，背部則是深黑色。牠們在海洋中游泳時，海面的敵人由上往下看，較難發現深色背影；水下的敵人由下往上看，又較易把白色腹部當成水面亮光。這種保護色有助企鵝躲避天敵。大自然的保護色設計，常常比人類想像更精妙。\",\n        \"answer\": \"D\",\n        \"focus\": 4,\n        \"focusLabel\": \"片面／過窄\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"企鵝是羣居動物。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"企鵝只會在陸地上生活。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"所有鳥類都有黑白保護色。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"企鵝的保護色有助躲避天敵。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"處理食物時，應先洗淨雙手和蔬果肉類，並用不同砧板分開處理生食與熟食，避免交叉污染；烹煮時也要確保食物完全煮熟才進食。這些簡單步驟，都能大大降低食物中毒和腸胃不適的風險。廚房衞生做好，一家大小都少添麻煩。\",\n        \"answer\": \"A\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"注意食物衞生可降低中毒風險。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"生熟分開砧板就已足夠。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"食物中毒只會發生在餐廳。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"清水不必用來清洗食材。\",\n            \"tag\": \"直接錯誤\",\n            \"explain\": \"與原文意思相反或扭曲了原文用詞／事實。\",\n            \"trap\": 6\n          }\n        ]\n      },\n      {\n        \"passage\": \"地鐵車廂到站前會廣播提醒乘客小心月台空隙，並呼籲讓座給長者、孕婦和有需要人士。車廂裏多數  \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          }\n        ]\n      },\n      {\n        \"passage\": \"閱讀故事書時，精美的插圖不但能幫助理解角色表情和情節發展，還能激發想像力，讓讀者在腦中「看見」故事世界。一邊讀文字、一邊看圖，往往比只盯着密密麻麻的字更容易投入，印象也更深刻。圖文並茂的閱讀經驗，特別適合培養閱讀興趣。\",\n        \"answer\": \"D\",\n        \"focus\": 3,\n        \"focusLabel\": \"偏離重點\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"插圖比文字更重要。\",\n            \"tag\": \"偏離重點\",\n            \"explain\": \"只抓到細節、背景或例子，並非全段主旨。\",\n            \"trap\": 3\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"沒有插圖就無法讀故事。\",\n            \"tag\": \"過度推論\",\n            \"explain\": \"把原文意思誇大或推得太盡，原文並未如此斷言。\",\n            \"trap\": 2\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"故事書只能供低年級閱讀。\",\n            \"tag\": \"無關內容\",\n            \"explain\": \"原文沒有提及這項內容。\",\n            \"trap\": 1\n          },\n          {\n            \"key\": \"D\",\n            \"text\": \"插圖有助理解與投入故事。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          }\n        ]\n      },\n      {\n        \"passage\": \"當颱風信號生效，學校通常會停課，渡輪和海上活動亦會暫停。市民應盡量留在堅固的室內，遠離玻璃窗，收好露台雜物，並耐心等待當局宣布除下信號，切勿為了好奇而到海邊觀看大浪。惡劣天氣中，耐心與謹慎比任何好奇心都重要。\",\n        \"answer\": \"A\",\n        \"focus\": 6,\n        \"focusLabel\": \"直接錯誤\",\n        \"options\": [\n          {\n            \"key\": \"A\",\n            \"text\": \"颱風信號生效時應留家並注意安全。\",\n            \"tag\": \"正確\",\n            \"explain\": \"此項最能概括原文主旨／重點，沒有誇大、遺漏或偏離。\",\n            \"trap\": 0\n          },\n          {\n            \"key\": \"B\",\n            \"text\": \"停課是唯一需要注意的事。\",\n            \"tag\": \"片面／過窄\",\n            \"explain\": \"只說對其中一部分，未能完整概括重點。\",\n            \"trap\": 4\n          },\n          {\n            \"key\": \"C\",\n            \"text\": \"颱風天適合到海邊觀看大浪。\",\n            \"tag\": \
