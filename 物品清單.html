<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>物品清單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #e8f1f4;
      --bg-2: #f7f3ea;
      --ink: #1c2a32;
      --muted: #5a6b75;
      --card: rgba(255, 255, 255, 0.86);
      --line: #d5e0e6;
      --accent: #0f766e;
      --accent-soft: #d7f0ec;
      --shadow: 0 10px 30px rgba(28, 42, 50, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, #cfe8ef 0%, transparent 42%),
        radial-gradient(circle at 88% 0%, #f3e7c8 0%, transparent 38%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 16px 64px;
    }

    h1 {
      font-family: Outfit, "Noto Sans TC", sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .stats {
      margin: 18px 0 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .place {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .place-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background: var(--accent-soft);
      border-bottom: 1px solid var(--line);
    }

    .place-name { font-weight: 700; }
    .place-count { color: var(--muted); font-size: 0.88rem; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 0.95rem;
    }

    th {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.8rem;
    }

    tr:last-child td { border-bottom: none; }

    .qty {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .empty {
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>物品清單</h1>
      <p class="subtitle">一路跟進記錄。冇講數量就當 1；單位跟返該物件常用量詞。</p>
    </header>
    <p class="stats" id="stats"></p>
    <div id="board"></div>
  </div>

  <script>
    const ITEMS = [
      { name: "公司印", place: "書包", qty: 1, unit: "個" }
    ];

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function groupByPlace(items) {
      const map = new Map();
      for (const item of items) {
        const key = item.place || "未分類";
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(item);
      }
      return map;
    }

    function render() {
      const board = document.getElementById("board");
      const stats = document.getElementById("stats");
      const places = groupByPlace(ITEMS);
      const totalQty = ITEMS.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);

      stats.textContent = `共 ${ITEMS.length} 項 · ${totalQty} 件 · ${places.size} 個位置`;

      if (!ITEMS.length) {
        board.innerHTML = '<div class="empty">未有記錄</div>';
        return;
      }

      board.innerHTML = "";
      for (const [place, items] of places) {
        const section = document.createElement("section");
        section.className = "place";
        section.innerHTML = `
          <div class="place-head">
            <span class="place-name">${escapeHtml(place)}</span>
            <span class="place-count">${items.length} 項</span>
          </div>
          <table>
            <thead>
              <tr>
                <th>物品</th>
                <th>數量</th>
              </tr>
            </thead>
            <tbody>
              ${items.map((item) => `
                <tr>
                  <td>${escapeHtml(item.name)}</td>
                  <td class="qty">${escapeHtml(item.qty)} ${escapeHtml(item.unit)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
        board.appendChild(section);
      }
    }

    render();
  </script>
</body>
</html>
