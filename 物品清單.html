<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>物品清單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #e8f1f4;
      --bg-2: #f7f3ea;
      --ink: #1c2a32;
      --muted: #5a6b75;
      --card: rgba(255, 255, 255, 0.86);
      --line: #d5e0e6;
      --accent: #0f766e;
      --accent-soft: #d7f0ec;
      --shadow: 0 10px 30px rgba(28, 42, 50, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, #cfe8ef 0%, transparent 42%),
        radial-gradient(circle at 88% 0%, #f3e7c8 0%, transparent 38%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 16px 64px;
    }

    h1 {
      font-family: Outfit, "Noto Sans TC", sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .stats {
      margin: 18px 0 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .place {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .place-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background: var(--accent-soft);
      border-bottom: 1px solid var(--line);
    }

    .place-name { font-weight: 700; }
    .place-count { color: var(--muted); font-size: 0.88rem; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 0.95rem;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.8rem;
    }

    tr:last-child td { border-bottom: none; }

    td.num {
      width: 2.4em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    td.name { font-weight: 500; }
    td.note { color: var(--ink); }
    td.place { white-space: nowrap; color: var(--muted); }

    th.num { text-align: right; }

    .list-card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: auto;
    }

    .empty {
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      td.name { width: 42%; }
      th, td { padding: 10px 10px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>物品清單</h1>
      <p class="subtitle">冇講數量就當 1；單位跟返該物件原本用量詞。</p>
    </header>
    <p class="stats" id="stats"></p>
    <div id="board"></div>
  </div>

  <script>
    const ITEMS = [
      { no: 1, place: "公司 Locker", name: "HAECO 頸繩", note: "2 條（其中1條有中警醒）" },
      { no: 2, place: "公司 Locker", name: "安全眼鏡", note: "1 副" },
      { no: 3, place: "公司 Locker", name: "反光衣", note: "1 件" },
      { no: 4, place: "衣櫃", name: "安全帽", note: "1 頂" },
      { no: 5, place: "公司 Locker", name: "膠紙座（連膠紙）", note: "1 個" },
      { no: 6, place: "公司 Locker", name: "支票簿", note: "20 張（剩低）" },
      { no: 7, place: "公司 Locker", name: "CAD License", note: "1 張" },
      { no: 8, place: "公司 Locker", name: "100-650mAh 充電電池", note: "4 粒" },
      { no: 9, place: "公司 Locker", name: "電池充電器", note: "1 個" },
      { no: 10, place: "公司 Locker", name: "OLIGHT 專用叉電線", note: "1 條" },
      { no: 11, place: "公司 Locker", name: "USB 降噪線（華碩）", note: "1 條" },
      { no: 12, place: "公司 Locker", name: "HDMI to HDMI 線", note: "1 條" },
      { no: 13, place: "公司 Locker", name: "LAN 線", note: "1 條" },
      { no: 14, place: "公司 Locker", name: "iPad 螢幕保護貼", note: "1 塊（未貼）" },
      { no: 15, place: "公司 Locker", name: "工鞋", note: "1 對" },
      { no: 16, place: "公司 Locker", name: "外套內膽", note: "1 件" },
      { no: 17, place: "公司 Locker", name: "維修工具", note: "少量" },
      { no: 18, place: "書包", name: "工程師印章", note: "1 個" }
    ];

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function groupByPlace(items) {
      const map = new Map();
      for (const item of items) {
        const key = item.place || "未分類";
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(item);
      }
      return map;
    }

    function render() {
      const board = document.getElementById("board");
      const stats = document.getElementById("stats");
      const places = groupByPlace(ITEMS);

      stats.textContent = `共 ${ITEMS.length} 項 · ${places.size} 個位置`;

      if (!ITEMS.length) {
        board.innerHTML = '<div class="empty">未有記錄</div>';
        return;
      }

      board.innerHTML = `
        <div class="list-card">
          <table>
            <thead>
              <tr>
                <th class="num">#</th>
                <th>地點</th>
                <th>物品名稱</th>
                <th>數量/備註</th>
              </tr>
            </thead>
            <tbody>
              ${ITEMS.map((item) => `
                <tr>
                  <td class="num">${escapeHtml(item.no)}</td>
                  <td class="place">${escapeHtml(item.place)}</td>
                  <td class="name">${escapeHtml(item.name)}</td>
                  <td class="note">${escapeHtml(item.note)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
