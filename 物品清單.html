<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>物品清單</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #e8f1f4;
        --bg-2: #f7f3ea;
        --ink: #1c2a32;
        --muted: #5a6b75;
        --card: rgba(255, 255, 255, 0.86);
        --line: #d5e0e6;
        --accent: #0f766e;
        --accent-soft: #d7f0ec;
        --shadow: 0 10px 30px rgba(28, 42, 50, 0.08);
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Noto Sans TC", sans-serif;
        background:
          radial-gradient(circle at 12% 10%, #cfe8ef 0%, transparent 42%),
          radial-gradient(circle at 88% 0%, #f3e7c8 0%, transparent 38%),
          linear-gradient(160deg, var(--bg-1), var(--bg-2));
      }

      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 20px 16px 64px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
      }

      .search {
        flex: 1 1 220px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        font-size: 0.95rem;
        padding: 10px 14px;
        outline: none;
      }

      .search:focus {
        border-color: #9ec9c2;
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.08);
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .filter-btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        border-radius: 999px;
        padding: 6px 12px;
        font: inherit;
        font-size: 0.86rem;
        font-weight: 600;
        cursor: pointer;
      }

      .filter-btn.is-on {
        border-color: transparent;
        background: var(--place-tag, var(--accent-soft));
        color: var(--place-ink, var(--accent));
      }

      .stats {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 0.95rem;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 0.8rem;
      }

      th.sort {
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }

      th.sort:hover {
        color: var(--ink);
      }

      th.sort .arrow {
        display: inline-block;
        min-width: 0.9em;
        margin-left: 2px;
        color: #9aa8b0;
        font-size: 0.75em;
      }

      th.sort.is-on .arrow {
        color: var(--accent);
      }

      tr:last-child td {
        border-bottom: none;
      }

      td.num {
        width: 2.4em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      td.name {
        font-weight: 500;
      }
      td.note {
        color: var(--ink);
      }
      td.place-cell {
        white-space: nowrap;
        color: var(--muted);
        background: transparent;
      }

      th.num {
        text-align: right;
      }

      .list-card {
        background: var(--card);
        backdrop-filter: blur(8px);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: auto;
      }

      .empty {
        background: var(--card);
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        padding: 28px 16px;
        text-align: center;
        color: var(--muted);
      }

      .place-tag {
        display: inline-block;
        padding: 0.18em 0.72em;
        border-radius: 999px;
        background: var(--place-tag);
        color: var(--place-ink);
        font-weight: 600;
        font-size: 0.86rem;
        line-height: 1.45;
        letter-spacing: 0.01em;
      }

      @media (max-width: 560px) {
        td.name {
          width: 42%;
        }
        th,
        td {
          padding: 10px 10px;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="toolbar">
        <input
          class="search"
          id="search"
          type="search"
          placeholder="搜尋物品、備註、地點"
          autocomplete="off"
        />
        <div class="filters" id="filters"></div>
      </div>
      <p class="stats" id="stats"></p>
      <div id="board"></div>
    </div>

    <script>
      const ITEMS = [
        {
          no: 1,
          place: "公司 Locker",
          name: "HAECO 頸繩",
          note: "2 條（其中1條有中警醒）",
        },
        { no: 2, place: "公司 Locker", name: "安全眼鏡", note: "1 副" },
        { no: 3, place: "公司 Locker", name: "反光衣", note: "1 件" },
        { no: 4, place: "衣櫃", name: "安全帽", note: "1 頂" },
        { no: 5, place: "公司 Locker", name: "膠紙座（連膠紙）", note: "1 個" },
        { no: 6, place: "公司 Locker", name: "支票簿", note: "20 張（剩低）" },
        { no: 7, place: "公司 Locker", name: "CAD License", note: "1 張" },
        {
          no: 8,
          place: "公司 Locker",
          name: "100-650mAh 充電電池",
          note: "4 粒",
        },
        { no: 9, place: "公司 Locker", name: "電池充電器", note: "1 個" },
        {
          no: 10,
          place: "公司 Locker",
          name: "OLIGHT 專用叉電線",
          note: "1 條",
        },
        {
          no: 11,
          place: "公司 Locker",
          name: "USB 降噪線（華碩）",
          note: "1 條",
        },
        { no: 12, place: "公司 Locker", name: "HDMI to HDMI 線", note: "1 條" },
        { no: 13, place: "公司 Locker", name: "LAN 線", note: "1 條" },
        {
          no: 14,
          place: "公司 Locker",
          name: "iPad 螢幕保護貼",
          note: "1 塊（未貼）",
        },
        { no: 15, place: "公司 Locker", name: "工鞋", note: "1 對" },
        { no: 16, place: "公司 Locker", name: "外套內膽", note: "1 件" },
        { no: 17, place: "公司 Locker", name: "維修工具", note: "少量" },
        { no: 18, place: "書包", name: "工程師印章", note: "1 個" },
        { no: 19, place: "書包", name: "北京交通大學證書", note: "1 張" },
      ];

      const PLACE_THEME = {
        "公司 Locker": { tag: "#d7f3ee", ink: "#3f7d74" },
        衣櫃: { tag: "#ebe4f8", ink: "#6b5a8a" },
        書包: { tag: "#fde8d6", ink: "#8b5e3a" },
      };

      const PLACE_FALLBACK = [
        { tag: "#e4f0fb", ink: "#4a6d8c" },
        { tag: "#e8f5e3", ink: "#4f7a45" },
        { tag: "#fceef3", ink: "#8a5a6e" },
        { tag: "#fff3d6", ink: "#8a7040" },
        { tag: "#e8eef8", ink: "#5a6588" },
        { tag: "#f3efe4", ink: "#7a6a4a" },
      ];

      const COLS = [
        { key: "no", label: "#", cls: "num sort" },
        { key: "place", label: "地點", cls: "sort" },
        { key: "name", label: "物品名稱", cls: "sort" },
        { key: "note", label: "數量/備註", cls: "sort" },
      ];

      const state = {
        query: "",
        place: "",
        sortKey: "no",
        sortDir: "asc",
      };

      function themeForPlace(place) {
        if (PLACE_THEME[place]) return PLACE_THEME[place];
        let hash = 0;
        for (const ch of String(place))
          hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
        return PLACE_FALLBACK[hash % PLACE_FALLBACK.length];
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function uniquePlaces() {
        return [...new Set(ITEMS.map((item) => item.place || "未分類"))];
      }

      function visibleItems() {
        const q = state.query.trim().toLowerCase();
        const rows = ITEMS.filter((item) => {
          if (state.place && item.place !== state.place) return false;
          if (!q) return true;
          return [item.no, item.place, item.name, item.note]
            .join(" ")
            .toLowerCase()
            .includes(q);
        });

        const dir = state.sortDir === "desc" ? -1 : 1;
        const key = state.sortKey;
        rows.sort((a, b) => {
          const av = a[key];
          const bv = b[key];
          if (typeof av === "number" && typeof bv === "number") {
            return (av - bv) * dir;
          }
          return String(av).localeCompare(String(bv), "zh-Hant") * dir;
        });
        return rows;
      }

      function sortArrow(key) {
        if (state.sortKey !== key) return "↕";
        return state.sortDir === "asc" ? "↑" : "↓";
      }

      function renderFilters() {
        const box = document.getElementById("filters");
        const places = uniquePlaces();
        const buttons = [
          { value: "", label: "全部", theme: { tag: "#eef3f5", ink: "#4a5b64" } },
          ...places.map((place) => ({
            value: place,
            label: place,
            theme: themeForPlace(place),
          })),
        ];
        box.innerHTML = buttons
          .map((btn) => {
            const on = state.place === btn.value ? " is-on" : "";
            return `<button type="button" class="filter-btn${on}" data-place="${escapeHtml(btn.value)}" style="--place-tag:${btn.theme.tag}; --place-ink:${btn.theme.ink}">${escapeHtml(btn.label)}</button>`;
          })
          .join("");
      }

      function render() {
        const board = document.getElementById("board");
        const stats = document.getElementById("stats");
        const rows = visibleItems();
        const placeCount = uniquePlaces().length;

        stats.textContent =
          rows.length === ITEMS.length
            ? `共 ${ITEMS.length} 項 · ${placeCount} 個位置`
            : `顯示 ${rows.length} / ${ITEMS.length} 項`;

        if (!rows.length) {
          board.innerHTML = '<div class="empty">未有符合嘅記錄</div>';
          return;
        }

        board.innerHTML = `
        <div class="list-card">
          <table>
            <thead>
              <tr>
                ${COLS.map((col) => {
                  const on = state.sortKey === col.key ? " is-on" : "";
                  return `<th class="${col.cls}${on}" data-sort="${col.key}">${escapeHtml(col.label)}<span class="arrow">${sortArrow(col.key)}</span></th>`;
                }).join("")}
              </tr>
            </thead>
            <tbody>
              ${rows
                .map((item) => {
                  const theme = themeForPlace(item.place);
                  return `
                <tr style="--place-tag:${theme.tag}; --place-ink:${theme.ink}">
                  <td class="num">${escapeHtml(item.no)}</td>
                  <td class="place-cell"><span class="place-tag">${escapeHtml(item.place)}</span></td>
                  <td class="name">${escapeHtml(item.name)}</td>
                  <td class="note">${escapeHtml(item.note)}</td>
                </tr>
              `;
                })
                .join("")}
            </tbody>
          </table>
        </div>
      `;
      }

      document.getElementById("search").addEventListener("input", (event) => {
        state.query = event.target.value;
        render();
      });

      document.getElementById("filters").addEventListener("click", (event) => {
        const btn = event.target.closest("[data-place]");
        if (!btn) return;
        state.place = btn.getAttribute("data-place") || "";
        renderFilters();
        render();
      });

      document.getElementById("board").addEventListener("click", (event) => {
        const th = event.target.closest("th[data-sort]");
        if (!th) return;
        const key = th.getAttribute("data-sort");
        if (state.sortKey === key) {
          state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.sortKey = key;
          state.sortDir = key === "no" ? "asc" : "asc";
        }
        render();
      });

      renderFilters();
      render();
    </script>
  </body>
</html>
