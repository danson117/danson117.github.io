<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HX work pages</title>
    <style>
      :root {
        --ink: #1c2430;
        --muted: #5b6775;
        --line: #d7dee6;
        --bg: #eef1f4;
        --side: #1e3a5f;
        --side-ink: #e8eef5;
        --side-dim: #9eb0c4;
        --pick: #fff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: "Segoe UI", Calibri, Arial, sans-serif;
        color: var(--ink);
        background: var(--bg);
        display: flex;
        min-height: 100vh;
      }
      nav {
        width: 260px;
        flex-shrink: 0;
        background: var(--side);
        color: var(--side-ink);
        padding: 18px 14px 56px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow: hidden;
        transition:
          width 0.15s ease,
          padding 0.15s ease;
      }
      .nav-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      button.fold {
        flex-shrink: 0;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: transparent;
        color: var(--side-ink);
        padding: 4px 8px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      button.fold:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      body.nav-off nav {
        width: 48px;
        padding: 12px 8px;
      }
      body.nav-off nav h1,
      body.nav-off nav p,
      body.nav-off #topics {
        display: none;
      }
      nav h1 {
        font-size: 15px;
        margin: 0 0 4px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      nav p {
        margin: 0 0 12px;
        font-size: 12px;
        color: var(--side-dim);
        line-height: 1.4;
      }
      button.topic {
        display: block;
        width: 100%;
        text-align: left;
        border: 1px solid transparent;
        background: transparent;
        color: var(--side-ink);
        padding: 9px 10px;
        font: inherit;
        font-size: 13px;
        cursor: grab;
      }
      button.topic:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      button.topic.on {
        background: var(--pick);
        color: var(--side);
        font-weight: 650;
      }
      button.topic small {
        display: block;
        font-weight: 400;
        font-size: 11px;
        opacity: 0.75;
        margin-top: 2px;
      }
      .row {
        position: relative;
      }
      .row.drag {
        opacity: 0.45;
      }
      .row .topic {
        padding-right: 26px;
        padding-bottom: 18px;
      }
      button.pin {
        position: absolute;
        right: 4px;
        bottom: 3px;
        width: 18px;
        height: 18px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--side-dim);
        cursor: pointer;
        opacity: 0.55;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      button.pin svg {
        display: block;
        width: 12px;
        height: 12px;
      }
      button.pin svg path {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.35;
      }
      button.pin:hover {
        opacity: 1;
        color: var(--side-ink);
      }
      button.pin.on {
        opacity: 1;
        color: #fff;
      }
      button.pin.on svg path {
        fill: currentColor;
        stroke: none;
      }
      .row:has(.topic.on) .pin {
        color: var(--muted);
      }
      .row:has(.topic.on) .pin.on {
        color: var(--side);
      }
      .row.pinned .topic {
        box-shadow: inset 3px 0 0 #fff;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 14px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .bar a {
        color: var(--side);
      }
      .bar .fold {
        color: var(--side);
        border-color: var(--line);
        margin-right: 8px;
      }
      iframe {
        flex: 1;
        width: 100%;
        border: 0;
        background: #fff;
      }
      .page-version {
        position: fixed;
        left: 10px;
        bottom: 8px;
        font-size: 11px;
        color: var(--side-dim);
      }
      @media (max-width: 720px) {
        body {
          flex-direction: column;
        }
        nav {
          width: 100%;
          padding-bottom: 12px;
        }
        iframe {
          min-height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-head">
        <div>
          <h1>HX</h1>
          <p>揀主題。右下角圖釘置頂。拖動改排序。</p>
        </div>
        <button type="button" class="fold" id="fold" aria-expanded="true">
          收起
        </button>
      </div>
      <div id="topics"></div>
    </nav>
    <main>
      <div class="bar">
        <span>
          <button type="button" class="fold" id="fold-bar" hidden>
            展開主題
          </button>
          <span id="now">Authorization Training Process</span>
        </span>
        <a
          id="solo"
          href="authorization-training-process.html"
          target="_blank"
          rel="noopener"
          >單獨打開呢頁</a
        >
      </div>
      <iframe
        id="frame"
        title="HX topic"
        src="authorization-training-process.html"
      ></iframe>
    </main>
    <div class="page-version" data-version="1.9">v1.9</div>
    <script>
      const TOPICS = [
        {
          id: "training",
          file: "authorization-training-process.html",
          title: "Authorization Training Process",
          blurb: "訓練／紀錄／LMS",
        },
        {
          id: "docs",
          file: "easa-cx-hk-document-hierarchy.html",
          title: "EASA / CX / HK document hierarchy",
          blurb: "文件層級",
        },
        {
          id: "tooling",
          file: "new-customer-tooling-scope.html",
          title: "New customer tooling scope",
          blurb: "新客／新機／新引擎刀單",
        },
      ];

      const box = document.getElementById("topics");
      const frame = document.getElementById("frame");
      const now = document.getElementById("now");
      const solo = document.getElementById("solo");
      const fold = document.getElementById("fold");
      const foldBar = document.getElementById("fold-bar");

      function setNav(open) {
        document.body.classList.toggle("nav-off", !open);
        fold.setAttribute("aria-expanded", open ? "true" : "false");
        fold.textContent = open ? "收起" : "開";
        foldBar.hidden = open;
        try {
          localStorage.setItem("hx-nav", open ? "1" : "0");
        } catch (e) {}
      }
      fold.addEventListener("click", () =>
        setNav(document.body.classList.contains("nav-off")),
      );
      foldBar.addEventListener("click", () => setNav(true));
      try {
        if (localStorage.getItem("hx-nav") === "0") setNav(false);
      } catch (e) {}

      function loadOrder() {
        let ids = [];
        try {
          ids = JSON.parse(localStorage.getItem("hx-order") || "[]");
        } catch (e) {}
        const known = new Set(TOPICS.map((t) => t.id));
        ids = ids.filter((id) => known.has(id));
        TOPICS.forEach((t) => {
          if (!ids.includes(t.id)) ids.push(t.id);
        });
        return ids;
      }
      function saveOrder(ids) {
        try {
          localStorage.setItem("hx-order", JSON.stringify(ids));
        } catch (e) {}
      }
      function loadPins() {
        let ids = [];
        try {
          ids = JSON.parse(
            localStorage.getItem("hx-pins") ||
              localStorage.getItem("hx-stars") ||
              "[]",
          );
        } catch (e) {}
        const known = new Set(TOPICS.map((t) => t.id));
        return ids.filter((id) => known.has(id));
      }
      function savePins(ids) {
        try {
          localStorage.setItem("hx-pins", JSON.stringify(ids));
        } catch (e) {}
      }
      function isPinned(id) {
        return loadPins().includes(id);
      }
      function togglePin(id) {
        const ids = loadPins();
        const i = ids.indexOf(id);
        if (i >= 0) ids.splice(i, 1);
        else ids.push(id);
        savePins(ids);
        renderTopics();
        paintOn();
      }
      function orderedTopics() {
        const order = loadOrder();
        const pins = new Set(loadPins());
        const pick = (pred) =>
          order
            .filter(pred)
            .map((id) => TOPICS.find((t) => t.id === id))
            .filter(Boolean);
        return pick((id) => pins.has(id)).concat(pick((id) => !pins.has(id)));
      }
      function show(id) {
        const list = orderedTopics();
        const t = list.find((x) => x.id === id) || list[0];
        frame.src = t.file;
        now.textContent = (isPinned(t.id) ? "PIN · " : "") + t.title;
        solo.href = t.file;
        location.hash = t.id;
        paintOn();
      }
      function paintOn() {
        const id = location.hash.replace(/^#/, "");
        box.querySelectorAll("button.topic").forEach((b) => {
          b.classList.toggle("on", b.dataset.id === id);
        });
      }

      let dragId = null;
      function renderTopics() {
        box.innerHTML = "";
        orderedTopics().forEach((t) => {
          const row = document.createElement("div");
          row.className = "row" + (isPinned(t.id) ? " pinned" : "");
          row.draggable = true;
          row.dataset.id = t.id;
          const b = document.createElement("button");
          b.type = "button";
          b.className = "topic";
          b.dataset.id = t.id;
          b.innerHTML =
            t.title + (t.blurb ? "<small>" + t.blurb + "</small>" : "");
          b.addEventListener("click", () => show(t.id));
          const pin = document.createElement("button");
          pin.type = "button";
          pin.className = "pin" + (isPinned(t.id) ? " on" : "");
          pin.title = isPinned(t.id) ? "取消置頂" : "置頂";
          pin.setAttribute("aria-label", pin.title);
          pin.innerHTML =
            '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M8 1.5a3.3 3.3 0 0 0-3.3 3.3c0 2.55 3.3 7.4 3.3 7.4s3.3-4.85 3.3-7.4A3.3 3.3 0 0 0 8 1.5zm0 4.85a1.35 1.35 0 1 0 0-2.7 1.35 1.35 0 0 0 0 2.7z"/></svg>';
          pin.addEventListener("mousedown", (e) => e.stopPropagation());
          pin.addEventListener("click", (e) => {
            e.stopPropagation();
            togglePin(t.id);
          });
          row.append(b, pin);
          row.addEventListener("dragstart", () => {
            dragId = t.id;
            row.classList.add("drag");
          });
          row.addEventListener("dragend", () => {
            dragId = null;
            row.classList.remove("drag");
          });
          row.addEventListener("dragover", (e) => e.preventDefault());
          row.addEventListener("drop", (e) => {
            e.preventDefault();
            if (!dragId || dragId === t.id) return;
            const ids = loadOrder();
            ids.splice(ids.indexOf(dragId), 1);
            ids.splice(ids.indexOf(t.id), 0, dragId);
            saveOrder(ids);
            renderTopics();
            paintOn();
          });
          box.appendChild(row);
        });
      }

      renderTopics();
      const start = location.hash.replace(/^#/, "");
      show(start);
      window.addEventListener("hashchange", () =>
        show(location.hash.replace(/^#/, "")),
      );
    </script>
  </body>
</html>
