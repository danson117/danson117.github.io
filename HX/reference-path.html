<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reference Path</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #e8f1f4;
        --bg-2: #f7f3ea;
        --ink: #1c2a32;
        --muted: #5a6b75;
        --card: rgba(255, 255, 255, 0.86);
        --line: #d5e0e6;
        --accent: #0f766e;
        --accent-soft: #d7f0ec;
        --shadow: 0 10px 30px rgba(28, 42, 50, 0.08);
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Noto Sans TC", sans-serif;
        background:
          radial-gradient(circle at 12% 10%, #cfe8ef 0%, transparent 42%),
          radial-gradient(circle at 88% 0%, #f3e7c8 0%, transparent 38%),
          linear-gradient(160deg, var(--bg-1), var(--bg-2));
      }

      .wrap {
        max-width: 1240px;
        margin: 0 auto;
        padding: 20px 16px 88px;
      }

      header {
        margin-bottom: 14px;
      }

      .brand {
        font-family: Outfit, "Noto Sans TC", sans-serif;
        font-size: clamp(1.6rem, 4vw, 2.1rem);
        font-weight: 700;
        letter-spacing: 0.02em;
        margin: 0;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .nav {
        margin: 8px 0 0;
        font-size: 0.85rem;
      }

      .nav a {
        color: var(--accent);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
      }

      .search {
        flex: 1 1 220px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        font-size: 0.95rem;
        padding: 10px 14px;
        outline: none;
      }

      .search:focus {
        border-color: #9ec9c2;
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.08);
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .filter-btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        border-radius: 999px;
        padding: 6px 12px;
        font: inherit;
        font-size: 0.86rem;
        font-weight: 600;
        cursor: pointer;
      }

      .filter-btn.is-on {
        border-color: transparent;
        background: var(--place-tag, var(--accent-soft));
        color: var(--place-ink, var(--accent));
      }

      .stats {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 0.92rem;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 0.78rem;
      }

      th.sort {
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }

      th.sort:hover {
        color: var(--ink);
      }

      th.sort .arrow {
        display: inline-block;
        min-width: 0.9em;
        margin-left: 2px;
        color: #9aa8b0;
        font-size: 0.75em;
      }

      th.sort.is-on .arrow {
        color: var(--accent);
      }

      tr:last-child td {
        border-bottom: none;
      }

      td.num {
        width: 2.2em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      td.name {
        font-weight: 500;
        min-width: 10em;
      }

      td.aka {
        color: var(--muted);
        min-width: 10em;
      }

      td.kind-cell {
        white-space: nowrap;
      }

      td.path {
        color: var(--ink);
        min-width: 12em;
      }

      th.num {
        text-align: right;
      }

      .list-card {
        background: var(--card);
        backdrop-filter: blur(8px);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: auto;
      }

      .empty {
        background: var(--card);
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        padding: 28px 16px;
        text-align: center;
        color: var(--muted);
      }

      .place-tag {
        display: inline-block;
        padding: 0.18em 0.72em;
        border-radius: 999px;
        background: var(--place-tag);
        color: var(--place-ink);
        font-weight: 600;
        font-size: 0.82rem;
        line-height: 1.45;
        letter-spacing: 0.01em;
      }

      .crumb {
        display: block;
        color: var(--ink);
        font-size: 0.88rem;
        line-height: 1.45;
        word-break: break-word;
      }

      a.path-link {
        color: var(--accent);
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 2px;
        word-break: break-word;
      }

      a.path-link:hover {
        color: #0b5c56;
      }

      .missing {
        color: #9aa8b0;
      }

      .path-label {
        display: none;
      }

      .page-version {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 20;
        font-family: Outfit, "Noto Sans TC", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--muted);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 10px;
        box-shadow: var(--shadow);
        pointer-events: none;
        user-select: none;
      }

      @media (max-width: 860px) {
        thead {
          display: none;
        }

        table,
        tbody,
        tr,
        td {
          display: block;
          width: 100%;
        }

        tr {
          padding: 14px 12px 16px;
          border-bottom: 1px solid var(--line);
        }

        tr:last-child {
          border-bottom: none;
        }

        th,
        td {
          padding: 0;
          border-bottom: none;
          font-size: 0.9rem;
        }

        td.num {
          display: none;
        }

        td.kind-cell {
          margin-bottom: 6px;
        }

        td.name {
          width: auto;
          font-size: 1.02rem;
          margin-bottom: 2px;
        }

        td.aka {
          margin-bottom: 10px;
        }

        td.path {
          margin-top: 8px;
        }

        .path-label {
          display: block;
          margin-bottom: 4px;
          color: var(--muted);
          font-size: 0.74rem;
          font-weight: 700;
        }
      }
    </style>
  </head>
  <body>

          aka: "AML 經驗審查表",
          kind: "AML",

          url: "",

          aka: "AML Type 經驗審查表",
          kind: "AML",
          pathA: "Hi HAECO › Departments › Quality",
          url: "",
          pathB: "Hi HAECO / Quality › Quality → Type Application Forms",
        },
        {
          no: 21,
          name: "New HKAR-66 AML Application Procedure",
          aka: "AML 申請程序",
          kind: "AML",
          pathA: "Hi HAECO › Departments › Quality",
          url: "",
          pathB: "Hi HAECO / Quality › Quality → HKAR-66 Procedures",
        },
      ];

      const KIND_THEME = {
        Procedure: { tag: "#d7f3ee", ink: "#3f7d74" },
        Safety: { tag: "#fde8d6", ink: "#8b5e3a" },
        System: { tag: "#e4f0fb", ink: "#4a6d8c" },
        Report: { tag: "#fff3d6", ink: "#8a7040" },
        Reference: { tag: "#ebe4f8", ink: "#6b5a8a" },
        "Employee Service": { tag: "#fceef3", ink: "#8a5a6e" },
        Audit: { tag: "#f3efe4", ink: "#7a6a4a" },
        Authorization: { tag: "#dceef8", ink: "#3d6b86" },
        Training: { tag: "#e8f5e3", ink: "#4f7a45" },
        Compliance: { tag: "#e8eef8", ink: "#5a6588" },
        AML: { tag: "#f6e7dc", ink: "#8a5a3a" },
      };

      const KIND_FALLBACK = [
        { tag: "#e4f0fb", ink: "#4a6d8c" },
        { tag: "#e8f5e3", ink: "#4f7a45" },
        { tag: "#fceef3", ink: "#8a5a6e" },
        { tag: "#fff3d6", ink: "#8a7040" },
        { tag: "#e8eef8", ink: "#5a6588" },
        { tag: "#f3efe4", ink: "#7a6a4a" },
      ];

      const KIND_ORDER = [
        "Procedure",
        "Authorization",
        "AML",
        "Training",
        "Audit",
        "Compliance",
        "Safety",
        "System",
        "Report",
        "Reference",
        "Employee Service",
      ];

      const COLS = [
        { key: "no", label: "#", cls: "num sort" },
        { key: "name", label: "名稱", cls: "sort" },
        { key: "aka", label: "係乜嚟", cls: "sort" },
        { key: "kind", label: "分類", cls: "sort" },
        { key: "pathA", label: "路徑 A", cls: "sort" },
        { key: "pathB", label: "路徑 B", cls: "sort" },
      ];

      const state = {
        query: "",
        kind: "",
        sortKey: "no",
        sortDir: "asc",
      };

      function themeForKind(kind) {
        if (KIND_THEME[kind]) return KIND_THEME[kind];
        let hash = 0;
        for (const ch of String(kind)) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
        return KIND_FALLBACK[hash % KIND_FALLBACK.length];
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function hostOf(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch {
          return "";
        }
      }

      function uniqueKinds() {
        const present = new Set(ITEMS.map((item) => item.kind || "未分類"));
        return KIND_ORDER.filter((kind) => present.has(kind));
      }

      function pathAValue(item) {
        return item.pathA || item.url || "";
      }

      function visibleItems() {
        const q = state.query.trim().toLowerCase();
        const rows = ITEMS.filter((item) => {
          if (state.kind && item.kind !== state.kind) return false;
          if (!q) return true;
          const hay = [
            item.no,
            item.name,
            item.aka,
            item.kind,
            item.pathA,
            item.pathB,
            item.url,
            hostOf(item.url),
          ]
            .join(" ")
            .toLowerCase();
          return hay.includes(q);
        });

        const dir = state.sortDir === "desc" ? -1 : 1;
        const key = state.sortKey;
        rows.sort((a, b) => {
          const av = key === "pathA" ? pathAValue(a) : a[key];
          const bv = key === "pathA" ? pathAValue(b) : b[key];
          if (typeof av === "number" && typeof bv === "number") {
            return (av - bv) * dir;
          }
          return String(av).localeCompare(String(bv), "zh-Hant") * dir;
        });
        return rows;
      }

      function sortArrow(key) {
        if (state.sortKey !== key) return "↕";
        return state.sortDir === "asc" ? "↑" : "↓";
      }

      function renderPathA(item) {
        if (!item.pathA && !item.url) {
          return `
            <span class="path-label">路徑 A</span>
            <span class="missing">未有路徑</span>
          `;
        }
        const label = item.pathA || hostOf(item.url) || item.url;
        const body = item.url
          ? `<a class="path-link crumb" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`
          : `<span class="crumb">${escapeHtml(item.pathA)}</span>`;
        return `
          <span class="path-label">路徑 A</span>
          ${body}
        `;
      }

      function renderPathB(item) {
        if (!item.pathB) {
          return `
            <span class="path-label">路徑 B</span>
            <span class="missing">未有路徑</span>
          `;
        }
        return `
          <span class="path-label">路徑 B</span>
          <span class="crumb">${escapeHtml(item.pathB)}</span>
        `;
      }

      function renderFilters() {
        const box = document.getElementById("filters");
        const kinds = uniqueKinds();
        const buttons = [
          { value: "", label: "全部", theme: { tag: "#eef3f5", ink: "#4a5b64" } },
          ...kinds.map((kind) => ({
            value: kind,
            label: kind,
            theme: themeForKind(kind),
          })),
        ];
        box.innerHTML = buttons
          .map((btn) => {
            const on = state.kind === btn.value ? " is-on" : "";
            return `<button type="button" class="filter-btn${on}" data-kind="${escapeHtml(btn.value)}" style="--place-tag:${btn.theme.tag}; --place-ink:${btn.theme.ink}">${escapeHtml(btn.label)}</button>`;
          })
          .join("");
      }

      function render() {
        const board = document.getElementById("board");
        const stats = document.getElementById("stats");
        const rows = visibleItems();
        const kindCount = uniqueKinds().length;

        stats.textContent =
          rows.length === ITEMS.length
            ? `共 ${ITEMS.length} 項 · ${kindCount} 個分類 · 路徑 A / B 並列`
            : `顯示 ${rows.length} / ${ITEMS.length} 項`;

        if (!rows.length) {
          board.innerHTML = '<div class="empty">未有符合嘅記錄</div>';
          return;
        }

        board.innerHTML = `
        <div class="list-card">
          <table>
            <thead>
              <tr>
                ${COLS.map((col) => {
                  const on = state.sortKey === col.key ? " is-on" : "";
                  return `<th class="${col.cls}${on}" data-sort="${col.key}">${escapeHtml(col.label)}<span class="arrow">${sortArrow(col.key)}</span></th>`;
                }).join("")}
              </tr>
            </thead>
            <tbody>
              ${rows
                .map((item) => {
                  const theme = themeForKind(item.kind);
                  return `
                <tr style="--place-tag:${theme.tag}; --place-ink:${theme.ink}">
                  <td class="num">${escapeHtml(item.no)}</td>
                  <td class="name">${escapeHtml(item.name)}</td>
                  <td class="aka">${escapeHtml(item.aka)}</td>
                  <td class="kind-cell"><span class="place-tag">${escapeHtml(item.kind)}</span></td>
                  <td class="path">${renderPathA(item)}</td>
                  <td class="path">${renderPathB(item)}</td>
                </tr>
              `;
                })
                .join("")}
            </tbody>
          </table>
        </div>
      `;
      }

      document.getElementById("search").addEventListener("input", (event) => {
        state.query = event.target.value;
        render();
      });

      document.getElementById("filters").addEventListener("click", (event) => {
        const btn = event.target.closest("[data-kind]");
        if (!btn) return;
        state.kind = btn.getAttribute("data-kind") || "";
        renderFilters();
        render();
      });

      document.getElementById("board").addEventListener("click", (event) => {
        const th = event.target.closest("th[data-sort]");
        if (!th) return;
        const key = th.getAttribute("data-sort");
        if (state.sortKey === key) {
          state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.sortKey = key;
          state.sortDir = "asc";
        }
        render();
      });

      renderFilters();
      render();
    </script>
  </body>
</html>
